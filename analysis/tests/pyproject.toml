[project]
name = "analysis-checks"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "pytest>=8", "ruff>=0.15", "torch>=2.6"]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["."]

# the light pass (finish.py) is torch; CI has no GPU, so the CPU build (a fraction of the CUDA one's download)
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
