name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.11.21
          enable-cache: true
          cache-dependency-glob: analysis/tests/uv.lock
      - run: uv python install 3.12
      - run: bun install --frozen-lockfile
        working-directory: app
      - run: ./vid check
        env:
          UV_PYTHON: '3.12'
