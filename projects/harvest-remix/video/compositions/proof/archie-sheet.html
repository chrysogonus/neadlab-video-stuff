<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- v12 proof: Archie's expression sheet. Archie rolls in, hops, runs through the moods (one per 0.8 s, labelled),
         and waves. Not part of the film. Local time = track time (T0 = 0) so the idle life is the same as in scenes. -->
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Barlow"; src: url("assets/fonts/barlow-900.woff2") format("woff2"); font-weight: 900; }
        @font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/ibm-plex-mono-500.woff2") format("woff2"); font-weight: 500; }
        @font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/ibm-plex-mono-600.woff2") format("woff2"); font-weight: 600; }
        #root { position: absolute; inset: 0; overflow: hidden; background: #111111; color: #F0ECE5; }
        #ap-floor { position: absolute; left: 0; right: 0; top: 860px; bottom: 0;
          background: linear-gradient(180deg, #1d1c19, #121210 60%); border-top: 1px solid #2a2a27; }
        #ap-pool { position: absolute; left: 360px; top: 260px; width: 1200px; height: 900px; border-radius: 50%;
          background: radial-gradient(closest-side, rgba(240, 236, 229, 0.10), rgba(240, 236, 229, 0) 100%); }
        #ap-wall { position: absolute; left: -20px; top: 40px; font-family: "IBM Plex Mono"; font-weight: 500; font-size: 26px; line-height: 62px;
          letter-spacing: 0.14em; color: #F0ECE5; opacity: 0.04; white-space: pre; }
        #ap-svg { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
        .ap-kick { position: absolute; left: 96px; top: 80px; font-family: "IBM Plex Mono"; font-weight: 500; font-size: 16px;
          letter-spacing: 0.14em; color: #888880; }
        .ap-kick::before { content: ""; display: inline-block; width: 36px; height: 2px; background: #E85D26; vertical-align: middle; margin-right: 16px; }
        #ap-name { position: absolute; left: 96px; top: 120px; font-family: "Barlow"; font-weight: 900; font-size: 150px; line-height: 1;
          letter-spacing: -0.03em; color: #F0ECE5; }
        #ap-mood { position: absolute; right: 96px; top: 150px; font-family: "IBM Plex Mono"; font-weight: 600; font-size: 64px;
          letter-spacing: 0.12em; color: #E85D26; text-align: right; }
        #ap-idx { position: absolute; right: 96px; top: 80px; font-family: "IBM Plex Mono"; font-weight: 500; font-size: 16px;
          letter-spacing: 0.14em; color: #888880; }
      </style>
      <div data-hf-id="hf-m4ki" id="root" data-composition-id="archie-sheet" data-width="1920" data-height="1080" data-duration="9">
        <div data-hf-id="hf-wi4o" id="ap-wall" data-layout-ignore></div>
        <div data-hf-id="hf-x8ly" id="ap-pool" data-layout-ignore></div>
        <div data-hf-id="hf-us9a" id="ap-floor" data-layout-ignore></div>
        <svg data-hf-id="hf-8h1q" id="ap-svg" viewBox="0 0 1920 1080" aria-hidden="true" data-layout-ignore></svg>
        <div data-hf-id="hf-8u0m" class="ap-kick">ARCHV-01 · THE ARCHIVE · EXPRESSION SHEET</div>
        <div data-hf-id="hf-43o0" id="ap-name">archie</div>
        <div data-hf-id="hf-h2c3" id="ap-idx">MOOD 00 / 09</div>
        <div data-hf-id="hf-fvke" id="ap-mood">HELLO</div>
      </div>
      <script src="assets/kit/env.js"></script>
      <script src="assets/kit/hr-kit.js"></script>
      <script src="assets/kit/archie.js"></script>
      <script>
        (() => {
          const $ = (id) => document.getElementById(id);
          $("ap-wall").textContent = Array.from({ length: 18 }, (_, i) => HR.cipher(70, 40 + i).replace(/(.{4})/g, "$1 ")).join("\n");
          const tl = gsap.timeline({ paused: true });
          const a = HR.archie($("ap-svg"), { id: "apa", x: -320, y: 900, scale: 1.3, seed: 3 });
          // roll in, brake, hop, and look at the camera
          a.rollTo(tl, 960, 0.1, 1.2, "power2.out");
          a.mood(tl, "curious", 0.9, 0.3);
          a.look(tl, -0.6, 0.1, 0.5, 0.2);
          a.look(tl, 0, 0.15, 1.15, 0.15);
          a.hop(tl, 1.25);
          const MOODS = ["neutral", "curious", "happy", "sad", "smug", "surprised", "sleepy", "love", "focused"];
          const T1 = 1.8, STEP = 0.75;
          MOODS.forEach((m, i) => {
            const t = T1 + i * STEP;
            a.mood(tl, m, t, 0.3);
            tl.fromTo($("ap-mood"), { scale: 1.15, opacity: 0.4 }, { scale: 1, opacity: 1, duration: 0.25, ease: "power3.out", immediateRender: false }, t);
          });
          // acting beats inside the moods
          a.hop(tl, T1 + 2 * STEP + 0.12, 36);                       // happy
          a.look(tl, 0.2, 0.55, T1 + 3 * STEP, 0.3);                  // sad looks down
          a.look(tl, 0.7, -0.1, T1 + 4 * STEP, 0.2);                  // smug glances aside
          a.bump(tl, T1 + 5 * STEP, 0.1);                              // surprised flinch
          a.look(tl, 0, 0, T1 + 5 * STEP + 0.01, 0.12);
          a.to(tl, { shR: 70, elR: 40, clawR: 1 }, T1 + 5 * STEP, 0.15, "back.out(2)");
          a.to(tl, { shR: 8, elR: 10, clawR: 0.2 }, T1 + 6 * STEP, 0.4, "power2.inOut");
          a.to(tl, { shL: -35, elL: -80, shR: -35, elR: -80 }, T1 + 7 * STEP, 0.35, "back.out(1.4)"); // love: a hug
          a.to(tl, { shL: 8, elL: 10, shR: 8, elR: 10 }, T1 + 8 * STEP, 0.3, "power2.inOut");
          // the wave goodbye
          const W = T1 + 9 * STEP;
          a.mood(tl, "happy", W, 0.3);
          a.to(tl, { shR: 150, elR: 30, clawR: 0.8 }, W, 0.25, "back.out(1.8)");
          for (let k = 0; k < 4; k++) a.to(tl, { elR: k % 2 ? 30 : -20 }, W + 0.25 + k * 0.17, 0.17, "sine.inOut");
          tl.set({}, {}, 9);
          function render() {
            const t = tl.time(), i = Math.floor((t - T1) / STEP);
            a.apply(t);
            $("ap-mood").textContent = t < T1 ? "HELLO" : i >= MOODS.length ? "BYE" : MOODS[i].toUpperCase();
            $("ap-idx").textContent = `MOOD ${String(Math.max(0, Math.min(9, i + 1))).padStart(2, "0")} / 09`;
          }
          tl.eventCallback("onUpdate", render);
          tl.seek(0); render();
          window.__timelines["archie-sheet"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
