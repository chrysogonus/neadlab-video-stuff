<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- The finish layer of harvest-remix v8: film grain, vignette, light leaks on the register flips, drop flashes.
         v12 adds light-sweep transitions on eight cuts and an edge punch on 24 chorus/drop downbeats.
         v13: grain blends with overlay (soft-light lifted the blacks) and the vignette falls to pure black.
         Mounted above every frame for the whole film by ./vid assemble. Times are track seconds. -->
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
        #fin-vignette { position: absolute; inset: 0;
          background: radial-gradient(ellipse 78% 72% at 50% 48%, rgba(0, 0, 0, 0) 52%, rgba(0, 0, 0, 0.5) 100%); }
        #fin-grain { position: absolute; inset: -64px; background-repeat: repeat; background-size: 256px 256px;
          mix-blend-mode: overlay; opacity: 0.3; }
        .fin-leak { position: absolute; inset: -20%; opacity: 0; mix-blend-mode: screen; will-change: transform, opacity; }
        .fin-leak i { position: absolute; display: block; border-radius: 50%; filter: blur(60px); }
        .fin-leak .a { width: 40%; height: 130%; left: -16%; top: -15%; background: rgba(232, 93, 38, 0.8); }
        .fin-leak .b { width: 16%; height: 70%; left: -2%; top: 14%; background: rgba(240, 236, 229, 0.55); }
        .fin-leak .c { width: 14%; height: 150%; left: 14%; top: -25%; background: rgba(232, 93, 38, 0.45); transform: rotate(12deg); }
        #fin-flash { position: absolute; inset: 0; background: #F0ECE5; opacity: 0; }
        /* v12: a light sweep across the frame on chosen cuts, and an edge punch on the big downbeats */
        #fin-sweep { position: absolute; top: -10%; left: 0; width: 900px; height: 120%; opacity: 0; mix-blend-mode: screen;
          background: linear-gradient(90deg, rgba(232, 93, 38, 0) 0%, rgba(232, 93, 38, 0.28) 35%, rgba(255, 236, 214, 0.75) 49%,
            rgba(255, 255, 255, 0.95) 50%, rgba(255, 236, 214, 0.75) 51%, rgba(232, 93, 38, 0.28) 65%, rgba(232, 93, 38, 0) 100%);
          filter: blur(6px); transform: skewX(-14deg); }
        #fin-streak { position: absolute; left: -10%; width: 120%; top: 50%; height: 6px; margin-top: -3px; opacity: 0; mix-blend-mode: screen;
          background: linear-gradient(90deg, rgba(255, 236, 214, 0), rgba(255, 246, 236, 0.9) 50%, rgba(255, 236, 214, 0)); filter: blur(2px); }
        #fin-punch { position: absolute; inset: 0; opacity: 0;
          background: radial-gradient(ellipse 70% 64% at 50% 50%, rgba(0, 0, 0, 0) 45%, rgba(0, 0, 0, 0.6) 100%); }
      </style>

      <div data-hf-id="hf-20sg" id="root" data-composition-id="finish" data-width="1920" data-height="1080" data-duration="164.4" data-layout-ignore>
        <div data-hf-id="hf-oyfb" id="fin-leaks"></div>
        <div data-hf-id="hf-fk8t" id="fin-flash"></div>
        <div data-hf-id="hf-l8ij" id="fin-punch"></div>
        <div data-hf-id="hf-5jrf" id="fin-sweep"></div>
        <div data-hf-id="hf-1d9n" id="fin-streak"></div>
        <div data-hf-id="hf-qzb7" id="fin-vignette"></div>
        <div data-hf-id="hf-pxrm" id="fin-grain"></div>
      </div>

      <script>
        (() => {
          // light arrives on every flip to the orange register and on the big hits (track seconds)
          // v20 (V20.md #4, #9): + the chorus-1 entry 33.806, the hook shots 96.82, the final chorus 123.479
          // v22: no leak where a scene opens without a register flip (CREAM below; was also 33.806, 45.487, 123.479)
          const LEAKS = [6.117, 48.491, 81.463, 85.147, 96.82, 117.94, 145.444];
          const FLASHES = [48.491, 145.444];
          // v12: light-sweep transitions on chosen cuts; edge punches on the chorus and drop downbeats
          // v22: none at 160.058, where the right 40 % stays dark for the end screen
          // v22: none at 23.656 either (03 opens on 16's drawer, an object match); each sweep keeps its v21 direction
          const SWEEPS = [[7.96, 1], [61.346, 1], [75.987, -1], [105.243, 1], [123.479, -1], [134.514, 1]];
          const HITS = [35.631, 37.47, 39.308, 41.147, 42.987, 44.821, 50.338, 52.181, 54.016, 55.847, 57.684, 59.512,
            86.966, 88.792, 90.626, 92.461, 94.278, 96.108, 125.288, 127.105, 128.911, 130.734, 147.279, 149.101,
            150.923, 152.746];   // v20: the held "now" gets the climax's downbeats too
          const rng = (seed) => () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

          // four seeded grain tiles, baked once
          const tiles = [0, 1, 2, 3].map((k) => {
            const c = document.createElement("canvas"); c.width = c.height = 256;
            const x = c.getContext("2d"), img = x.createImageData(256, 256), r = rng(101 + k * 17);
            for (let i = 0; i < img.data.length; i += 4) {
              const v = 128 + (r() + r() + r() - 1.5) * 150;
              img.data[i] = img.data[i + 1] = img.data[i + 2] = Math.max(0, Math.min(255, v)); img.data[i + 3] = 255;
            }
            x.putImageData(img, 0, 0);
            return `url(${c.toDataURL("image/png")})`;
          });

          const box = document.getElementById("fin-leaks");
          const leaks = LEAKS.map((t, k) => {
            const d = document.createElement("div"); d.className = "fin-leak"; d.innerHTML = "<i class='a'></i><i class='b'></i><i class='c'></i>";
            box.appendChild(d); return { t, d, flip: k % 2 ? -1 : 1 };
          });

          const tl = gsap.timeline({ paused: true });
          for (const { t, d, flip } of leaks) {
            tl.fromTo(d, { opacity: 0, xPercent: -20, scale: 0.9 }, { opacity: 0.4, xPercent: 6, scale: 1, duration: 0.3, ease: "power2.out" }, Math.max(0, t - 0.06));
            tl.fromTo(d, { opacity: 0.4, xPercent: 6 }, { opacity: 0, xPercent: 46, duration: 1.2, ease: "sine.in", immediateRender: false }, t + 0.24);
          }
          for (const t of FLASHES) {
            tl.fromTo("#fin-flash", { opacity: 0.16 }, { opacity: 0, duration: 0.1, ease: "power2.out", immediateRender: false }, t);
          }

          SWEEPS.forEach(([t, dir]) => {
            const a = dir > 0 ? -1000 : 2020, b = dir > 0 ? 2020 : -1000;
            tl.fromTo("#fin-sweep", { x: a, opacity: 1 }, { x: b, opacity: 1, duration: 0.24, ease: "power2.inOut", immediateRender: false }, t - 0.12);
            tl.set("#fin-sweep", { opacity: 0 }, t + 0.12);
            tl.fromTo("#fin-streak", { opacity: 0.9, scaleX: 0.3 }, { opacity: 0, scaleX: 1.2, duration: 0.28, ease: "power2.out", immediateRender: false }, t);
            tl.fromTo("#fin-flash", { opacity: 0.1 }, { opacity: 0, duration: 0.14, ease: "power2.out", immediateRender: false }, t);
          });
          for (const t of HITS) {
            tl.fromTo("#fin-punch", { opacity: 0.55 }, { opacity: 0, duration: 0.32, ease: "power2.out", immediateRender: false }, t);
            tl.fromTo("#fin-flash", { opacity: 0.06 }, { opacity: 0, duration: 0.1, ease: "power2.out", immediateRender: false }, t);
          }

          // v17: the black vignette greys cream-paper frames; over the cream spans it drops to a trace (switched on their cuts)
          const CREAM = [[7.96, 12.357], [81.463, 85.147], [105.243, 117.94], [137.54, 143.604]]; // v18: 02's printed mail
          for (const [a, b] of CREAM) {
            tl.set("#fin-vignette", { opacity: 0.25 }, a);
            tl.set("#fin-vignette", { opacity: 1 }, b);
          }

          const grain = document.getElementById("fin-grain");
          function render() {
            const step = Math.floor(tl.time() * 24), r = rng(step * 7919 + 13);
            grain.style.backgroundImage = tiles[step % 4];
            grain.style.backgroundPosition = `${Math.floor(r() * 256)}px ${Math.floor(r() * 256)}px`;
          }
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["finish"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
