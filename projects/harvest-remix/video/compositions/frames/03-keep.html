          WOW.flash(tl, wfx, HELD, { a: 0.3, dur: 0.16 });
          WOW.shake(tl, KS, HELD, { amp: 16, dur: 0.4, seed: 15 });
          WOW.flash(tl, wfx, SHUT, { color: "fire", a: 0.3, dur: 0.22 });
          WOW.shake(tl, VG, SHUT, { amp: 12, dur: 0.4, seed: 16 });
          WOW.rays(tl, wfx, { x: 1000, y: 550, t: PULL + 0.12, n: 30, r0: 240, r1: 1500, seed: 65, color: "cream", dur: 0.55, w: 5 });
          WOW.shock(tl, wfx, { x: 1000, y: 550, t: ARRIVE, r: 1500, n: 2, w: 8, color: "cream", dur: 0.55 });
          WOW.flash(tl, wfx, ARRIVE, { a: 0.35, dur: 0.18 });
          [BOLTS[0], BOLTS[1], BOLTS[3], BOLTS[4], BOLTS[5]].forEach((b, i) => {
            WOW.shock(tl, wfx, { x: 1030, y: 550, t: b, r: 800, n: 1, w: 5, color: "fire", dur: 0.45 });
            WOW.shake(tl, VG, b, { amp: 7, dur: 0.2, seed: 20 + i, rot: 0.2 });
          });

          // -- the bolt macro: after bolt 2 the vault spins into bolt 3's housing; the bolt slides home in a close-up and the lens pulls back out
          const MW = 8.80, MCUT = 9.0, MLOCK = BOLTS[2], MOUT0 = MLOCK + 0.04, MOUT1 = MOUT0 + 0.19;
          const dvg = { p: 0 };
          tl.fromTo(dvg, { p: 0 }, { p: 1, duration: MCUT - MW, ease: "power3.in", immediateRender: false }, MW);
          tl.fromTo(dvg, { p: 1 }, { p: 0, duration: MOUT1 - MOUT0, ease: "power3.out", immediateRender: false }, MOUT0);
          const msvg = S(MAC, "svg", { viewBox: "0 0 1920 1080", "aria-hidden": "true" });
          const mg = S(msvg, "g", { transform: `translate(960 540) rotate(${(-BA[2] * 180 / Math.PI).toFixed(3)})` });
          const MUTE = "#6e6c66";
          S(mg, "rect", { x: -1800, y: -230, width: 3600, height: 460, fill: "#111111", stroke: MUTE, "stroke-width": 4 });
          S(mg, "rect", { x: -1800, y: -150, width: 3600, height: 300, fill: "#0A0A0A", stroke: "#3a3a36", "stroke-width": 3 });
          for (let x = -1760; x < 1800; x += 40) S(mg, "path", { d: `M${x} -230 v${x % 200 === 0 ? 26 : 14}`, stroke: "#3a3a36", "stroke-width": 2 });
          for (let x = -1500; x < 1800; x += 300) for (const y of [-190, 190]) { S(mg, "circle", { cx: x, cy: y, r: 17, fill: "url(#f03-rivet)", stroke: "#111111", "stroke-width": 3 }); }
          const glow = S(mg, "rect", { x: 520, y: -190, width: 120, height: 380, fill: "#E85D26", opacity: 0, style: "filter: blur(34px)" });
          const mrecv = S(mg, "rect", { x: 580, y: -190, width: 560, height: 380, fill: "#151513", stroke: MUTE, "stroke-width": 5 });
          S(mg, "rect", { x: 620, y: -140, width: 480, height: 280, fill: "none", stroke: "#3a3a36", "stroke-width": 3 });
          const mb = S(mg, "g", {});
          S(mb, "rect", { x: -640, y: -120, width: 1180, height: 240, fill: "#0A0A0A" });
          const mbo = S(mb, "rect", { x: -640, y: -120, width: 1180, height: 240, fill: "none", stroke: "#bdb8ae", "stroke-width": 5 });
          S(mb, "rect", { x: -600, y: -80, width: 1100, height: 160, fill: "none", stroke: "#6e6c66", "stroke-width": 3 });
          S(mb, "text", { x: -560, y: 22, fill: "rgba(240,236,229,0.88)", "font-family": "IBM Plex Mono", "font-weight": 600, "font-size": 84, "letter-spacing": 6 }, "BOLT 3/7");
          S(mb, "text", { x: -560, y: 62, fill: "rgba(136,136,128,0.9)", "font-family": "IBM Plex Mono", "font-weight": 500, "font-size": 24, "letter-spacing": 8 }, "RETENTION: INDEFINITE");
          tl.set(MAC, { opacity: 1 }, MCUT);
          tl.fromTo(MAC, { scale: 2.6, rotation: -10, filter: "blur(14px)", transformOrigin: "50% 50%" }, { scale: 1, rotation: 0, filter: "blur(0px)", duration: 0.14, ease: "power3.out", immediateRender: false }, MCUT);
          tl.fromTo(mb, { x: -200 }, { x: 0, duration: MLOCK - MCUT - 0.02, ease: "power4.in", immediateRender: false }, MCUT + 0.02);
          tl.set(mbo, { attr: { stroke: "#E85D26" } }, MLOCK);
          tl.set(mrecv, { attr: { stroke: "#E85D26" } }, MLOCK);
          tl.fromTo(glow, { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, MLOCK);
          WOW.shake(tl, MAC, MLOCK, { amp: 26, dur: 0.3, seed: 17 });
          WOW.shock(tl, wfx, { x: 1398, y: 889, t: MLOCK, r: 1200, n: 2, w: 8, color: "fire", dur: 0.45 });
          WOW.burst(tl, wfx, { x: 1398, y: 889, t: MLOCK, n: 34, speed: 1500, size: [4, 14], seed: 71, dur: 0.6, gravity: 700, cream: 0.4 });
          WOW.flash(tl, wfx, MLOCK, { a: 0.5, dur: 0.16 });
          tl.fromTo(MAC, { scale: 1, rotation: 0, filter: "blur(0px)", transformOrigin: "1283px 752px" }, { scale: 0.1, rotation: -14, filter: "blur(10px)", duration: MOUT1 - MOUT0, ease: "power2.in", immediateRender: false }, MOUT0);
          tl.fromTo(MAC, { opacity: 1 }, { opacity: 0, duration: 0.07, ease: "none", immediateRender: false }, MOUT1 - 0.07);

          function render() {
            const t = tl.time(), T = t + T0, step = Math.floor(t * 15);
            cam.x = A.x + N.x; cam.y = A.y + N.y; cam.z = A.z + N.z; cam.rot = A.rot + N.rot; cam.focus = A.focus;
            stage.apply(T);
            WOW.draw(tl, 23.656);
            HR.draw(tl);
            const bass = HR.band("bass", T), hat = HR.hit("hat", T, 0.07);

            lampEl.style.opacity = (0.75 + 0.25 * bass - 0.3 * hat).toFixed(3);

            // the marker voice on Plan A: the arrow draws on, then the words are written left to right
            const ap = Math.max(0, Math.min(1, (t - NOTE) / 0.2)), mp = Math.max(0, Math.min(1, (t - NOTE - 0.1) / 0.4));
            arrow.style.strokeDashoffset = (100 * (1 - ap)).toFixed(1);
            mark1.style.clipPath = `inset(-30% ${(100 - mp * 100).toFixed(1)}% -40% -5%)`;

            // Plan A: the dial and the odometer, futile and never stopping
            if (t < FLIP) {
              dialRot.setAttribute("transform", `rotate(${dialAngle(t).toFixed(2)})`);
              HR.glow(pointer, T, 0.25, 0.5);
              const ol = smooth01((t - 0.9) / 1.7);
              HR.glow(ovr, T, 0.5, 0.8);
              ovr.setAttribute("opacity", (ol * (0.55 + 0.45 * HR.hit("kick", T, 0.1))).toFixed(3));
              ovl.setAttribute("opacity", t > SLASH && Math.floor(t * 9) % 2 === 0 ? "1" : "0");
              const v = ODO0 + RATE * t + 40000 * Math.pow(Math.max(0, t - 0.4), 2);
              drums.forEach((col, i) => {
                const k = 6 - i, p10 = Math.pow(10, k);
                let pos = (v / p10) % 10;
                if (k > 0) { const low = v % p10, d = Math.floor(v / p10) % 10; pos = d + Math.max(0, low - (p10 - 1)); }
                col.style.transform = `translateY(${(-pos * 86).toFixed(1)}px)`;
              });
            }

            // glow: "break" until it is cut, the slash; heroes pulse on kicks and nudge on snares
            if (t < SLASH) HR.glow(breakW.row, T, 0.35, 0.8);
            HR.glow(slash, T, 0.3, 0.6);
            const kick = HR.hit("kick", T, 0.14), sn = HR.hit("snare", T, 0.08);
            breakW.row.style.transform = `translateX(${sn.toFixed(2)}px) scale(${(1 + 0.015 * kick).toFixed(4)})`;

            // drawer 0001: the ciphertext churns behind its window; hats re-roll a row
            const hb = Math.floor(HR.hit("hat", T, 0.05) * 3);
            hexEl.textContent = Array.from({ length: 2 }, (_, i) => HR.cipher(24, 7001 + i * 31 + (i === 0 ? step : hb * 17)).replace(/(.{4})(?!$)/g, "$1 ")).join("\n");

            archie.apply(T);
            renderVault(t, T);

            // v16: Plan A dives into the dial's hub and is gone; Plan B whips in as a ghost, then comes out of its window
            const dp = Math.pow(smooth01((t - PUSH0) / (PUSH1 - PUSH0)), 2);
            GA.style.visibility = t >= PUSH1 ? "hidden" : "visible";
            GA.style.transform = dp > 0 ? `scale(${Math.exp(Math.log(16) * dp).toFixed(3)})` : "";
            GA.style.filter = dp > 0.05 ? `blur(${(14 * dp * dp).toFixed(1)}px)` : "";
            const wu = smooth01((t - 0.3) / 0.32), we = 1 - Math.pow(1 - wu, 4), eu = smooth01((t - (PUSH1 - 0.05)) / 0.3), ee = 1 - Math.pow(1 - eu, 3);
            const out = t >= PUSH1 - 0.05;
            const gx = 1500 * (1 - we), gsk = -14 * (1 - we), gsc = out ? 0.55 + 0.45 * ee : 1, gbl = Math.max(28 * (1 - we), out ? 14 * (1 - ee) : 0);
            GB.style.transform = gx || gsk || gsc !== 1 ? `translateX(${gx.toFixed(1)}px) skewX(${gsk.toFixed(2)}deg) scale(${gsc.toFixed(4)})` : "";
            GB.style.filter = gbl > 0.3 ? `blur(${gbl.toFixed(1)}px)` : "";
            GB.style.opacity = (out ? 0.5 + 0.5 * smooth01(eu * 2.2) : 0.5).toFixed(3);
            // the vault spins toward bolt 3 and back (the macro cut sits between)
            const vp = dvg.p;
            VG.style.transform = vp > 0.001 ? `scale(${Math.exp(Math.log(3.2) * vp).toFixed(4)}) rotate(${(14 * vp).toFixed(2)}deg)` : "";
            VG.style.filter = vp > 0.05 ? `blur(${(16 * vp * vp).toFixed(1)}px)` : "";
          }
          tl.eventCallback("onUpdate", render);
          tl.seek(0); render();
          window.__timelines["03-keep"] = tl;
        })();
      </script>
    </template>
  </body>
