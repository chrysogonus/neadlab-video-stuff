            ...shuffler([...$("f10-cms").querySelectorAll(".f10-cm:not(.f10-q)")], [8, 3, 0.4], 2002), ...shuffler(ROWG, [5, 4, 0], 2003)];
          // B: the Gantt slides one quarter per push (an eased step plus a large linear share, so it never stops)
          const stepped = (times, step, t, d = 0.32) => {
            let v = 0;
            for (let i = 0; i < times.length; i++) {
              const a = times[i]; if (t < a) break;
              const b = i + 1 < times.length ? times[i + 1] : a + 0.45, u = clamp01((t - a) / d), lin = clamp01((t - a) / Math.max(d, b - a));
              v += step * (0.55 * u * u * (3 - 2 * u) + 0.45 * lin);
            }
            return v;
          };
          // cursors: keys [t, x, y, d] leave the previous point at t and arrive at t + d (smoothstep), with a hand's idle drift
          const curPath = (K, t, seed, drift = 1) => {
            let x = K[0][1], y = K[0][2];
            for (let i = 1; i < K.length; i++) {
              const [a, nx, ny, d = 0.36] = K[i]; if (t < a) break;
              const u = clamp01((t - a) / d), e = u * u * (3 - 2 * u); x += (nx - x) * e; y += (ny - y) * e;
            }
            return [x + (Math.sin(t * 1.7 + seed) * 5 + Math.sin(t * 0.9 + seed * 2) * 4) * drift, y + Math.sin(t * 1.3 + seed * 3) * 4 * drift];
          };
          const clickS = (cl, t) => { let s = 1; for (const c of cl) if (t >= c - 0.05 && t < c + 0.3) s = Math.min(s, 1 - 0.2 * Math.sin(Math.PI * clamp01((t - c + 0.05) / 0.3))); return s; };
          // A (world px): rests beside the field while a. types → CREATE (clicked on its kick) → the new card → the priority
          // list, stepping down with the highlight, and clicks LOW on its word
          const CA = [[0, 650, 356], [on(106.829), 606, 434, 0.5], [on(107.967), 196, 156, 0.42], [on(108.418), 548, 168, 0.3],
            [steps[0] - 0.12, 548, 220, 0.2], [steps[1] - 0.12, 548, 272, 0.2], [LOW - 0.12, 548, 324, 0.2]];
          const CLA = [PRESS, LOW];
          // C (screen px in the thread's scene): somebody's cursor wanders down the thread on the kicks to the question
          const CC = [[0, 1560, 330], ...[[114.35, 1480, 430], [114.805, 1600, 520], [115.252, 1500, 640], [115.707, 1620, 720],
            [116.17, 1520, 830], [116.621, 1600, 930], [117.082, 1580, 905, 0.3]].map(([T, x, y, d]) => [L(T), x, y, d])];
          const DB2 = L(112.524), DC2 = L(116.169);   // downbeats: B goes tight on the bar, C leans into the question
          const curA = $("f10-curA"), curB = $("f10-curB"), curC = $("f10-curC");
          const placeCur = (c, x, y, s) => { c.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px)`; c.firstChild.style.transform = s < 1 ? `scale(${s.toFixed(3)})` : ""; };

          // ---- per frame -------------------------------------------------------------------------------------------
          const wA = $("f10-wA"), wB = $("f10-wB"), wC = $("f10-wC"), gantt = $("f10-gantt"), cms = $("f10-cms"), bg = $("f10-bg");
          const ftext = $("f10-ftext"), fcaret = $("f10-fcaret"), pchip = $("f10-pchip"), rcv = $("f10-rcv"), tcv = $("f10-tcv");
          function render() {
            const t = tl.time(), T = t + T0;
            const dx = Math.sin(T * 0.41 + 2) * 5 + Math.sin(T * 0.13) * 4, dy = Math.sin(T * 0.33 + 1) * 4 + 2 * HR.hit("kick", T, 0.09);
            bg.style.transform = `translate3d(${(-34 * t / DUR + dx * 0.3).toFixed(2)}px, ${(dy * 0.3).toFixed(2)}px, 0)`;
            // A: the spline camera
            if (t < G2 + 0.01) {
              const [cx, cy, lz] = camAt(t), z = Math.exp(lz);
              wA.style.transform = `translate(${(960 - cx * z + dx).toFixed(2)}px, ${(540 - cy * z + dy).toFixed(2)}px) scale(${z.toFixed(4)})`;
              const [ux, uy] = curPath(CA, t, 1);
              placeCur(curA, 960 + (ux - cx) * z + dx, 540 + (uy - cy) * z + dy, clickS(CLA, t));
            }
            // B: three framings: mid on the cut, easing out to the whole roadmap, then tight from the 112.524 downbeat;
            // the Gantt slides a quarter per push
            if (t >= G2 - 0.01 && t < G3 + 0.01) {
              const u = clamp01((t - G2) / (G3 - G2));
              const po = clamp01((t - G2) / 1.4), pv = clamp01((t - DB2) / 0.7);
              const zB = 1 + 0.065 * (0.5 + 0.5 * Math.cos(Math.PI * po)) + 0.015 * u + 0.045 * pv * pv * (3 - 2 * pv);
              wB.style.transform = `translate(${(dx - 4 * u).toFixed(2)}px, ${dy.toFixed(2)}px) scale(${zB.toFixed(4)})`;
              const sc = stepped(PUSHES, SCROLL / PUSHES.length, t);
              gantt.style.transform = `translateX(${(-sc).toFixed(2)}px)`;
              // brad's cursor holds the bar's head and drags it (a press on every push)
              const bx = gsap.getProperty(bar, "x");
              placeCur(curB, 70 + 330 + bx + QW * 0.6 - sc + Math.sin(T * 1.9) * 3, 40 + 44 + SECY + 46 + Math.sin(T * 1.4) * 2, clickS(PUSHES, t));
            }
            // C: a slow push while the thread scrolls on the beat
            if (t >= G3 - 0.01) {
              const u = clamp01((t - G3) / (DUR - G3));
              const pc = clamp01((t - DC2) / 2.2), zC = 1 + 0.04 * u + 0.1 * (0.5 - 0.5 * Math.cos(Math.PI * pc));
              wC.style.transform = `translate(${dx.toFixed(2)}px, ${(dy - 10 * u).toFixed(2)}px) scale(${zC.toFixed(4)})`;
              const [ux, uy] = curPath(CC, t, 4, 0.8);
              placeCur(curC, ux, uy, 1);
              const s = scrollAt(t);
              cms.style.transform = `translateY(${(-s).toFixed(2)}px)`;
              tcv.textContent = Math.round(1461 * Math.min(1, 0.18 + 0.82 * s / 444)).toLocaleString("en-US") + " DAYS";
            }
            WOW.draw(tl, T0);
            // the kick shuffle (one eased step per kick, from the previous offset)
            let k = -1; while (k + 1 < KT.length && KT[k + 1] <= T) k++;
            const se = k < 0 ? 0 : 1 - Math.pow(1 - clamp01((T - KT[k]) / 0.24), 3);
            for (const { e, o } of SHUF) {
              const a = k > 0 ? o[k - 1] : [0, 0, 0], b = k < 0 ? [0, 0, 0] : o[k], v = [0, 1, 2].map((c) => a[c] + (b[c] - a[c]) * se);
              e.style.translate = `${v[0].toFixed(2)}px ${v[1].toFixed(2)}px`; e.style.rotate = `${v[2].toFixed(3)}deg`;
            }
            for (const { m, t: t0 } of agains) m.style.clipPath = `inset(-40% ${(100 - 100 * clamp01((t - t0) / 0.26)).toFixed(1)}% -40% -5%)`;
            const n = KEYT.filter((k) => t >= k).length;
            ftext.textContent = TITLE.slice(0, n);
            fcaret.style.opacity = n < TITLE.length || Math.floor(t * 3.4) % 2 ? "1" : "0";
            pchip.textContent = t >= LOW ? "low" : "—";
            pchip.className = "f10-chip" + (t >= LOW ? " f10-hot" : "");
            rcv.textContent = "×" + String(PUSHES.filter((p) => t >= p).length).padStart(2, "0");
            typing.textContent = t < QWORDS[0].t ? "somebody is typing" + ".".repeat(1 + (Math.floor(t * 4) % 3)) : "";
            for (const s of strokes) s.p.setAttribute("stroke-dashoffset", (100 * (1 - clamp01((t - s.t) / s.dur))).toFixed(1));
            for (const [m, t0, d] of writes) m.style.clipPath = `inset(-30% ${(100 - 100 * clamp01((t - t0) / d)).toFixed(1)}% -40% -5%)`;
          }
          tl.eventCallback("onUpdate", render);
          tl.seek(0);
          render();
          window.__timelines["10-ticket"] = tl;
        })();
      </script>
    </template>
  </body>
