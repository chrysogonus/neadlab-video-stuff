            x.lineWidth = 0.7;
            for (let k = 0; k < 140; k++) { const px = r() * 512, py = r() * 512, a = r() * Math.PI, l = 8 + r() * 20;
              x.strokeStyle = "rgba(110,100,90,0.09)"; x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(a) * l, py + Math.sin(a) * l * 0.35); x.stroke(); }
            $("f10-paper").style.backgroundImage = `url(${c.toDataURL("image/png")})`;
          })();

          // the Gantt: 16 quarters 2021–2024 and a hatched Q-DAY column; leadership's bars ship, ours is shoved
          const G = $("f10-gantt"), X0 = 330, QW = 82, ROWY = 92, RH = 74;
          const qx = (q) => X0 + q * QW;
          (() => {
            const defs = sv("defs", G, {});
            const pat = sv("pattern", defs, { id: "f10-hatch", width: 10, height: 10, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" });
            sv("rect", pat, { width: 3, height: 10, fill: "rgba(232,93,38,0.35)" });
            for (let y = 0; y < 4; y++) {
              sv("text", G, { x: qx(y * 4) + 8, y: 34, "font-family": "IBM Plex Mono", "font-weight": 600, "font-size": 16, "letter-spacing": 2, fill: "#111111" }, String(2021 + y));
              for (let q = 0; q < 4; q++) {
                sv("text", G, { x: qx(y * 4 + q) + 8, y: 60, "font-family": "IBM Plex Mono", "font-weight": 500, "font-size": 12, "letter-spacing": 1.5, fill: "#6E6A62" }, "Q" + (q + 1));
                sv("line", G, { x1: qx(y * 4 + q), y1: 44, x2: qx(y * 4 + q), y2: 470, stroke: q ? "#E6E1D8" : "#CFC9BE", "stroke-width": q ? 1 : 1.5 });
              }
            }
            sv("rect", G, { x: qx(16), y: 44, width: 1736 - qx(16) - 12, height: 426, fill: "url(#f10-hatch)" });
            sv("line", G, { x1: qx(16), y1: 44, x2: qx(16), y2: 470, stroke: "#E85D26", "stroke-width": 2, "stroke-dasharray": "6 5" });
            sv("text", G, { x: qx(16) + 12, y: 34, "font-family": "IBM Plex Mono", "font-weight": 600, "font-size": 16, "letter-spacing": 2, fill: "#C8481A" }, "Q-DAY ?");
            sv("line", G, { x1: 0, y1: 70, x2: 1736, y2: 70, stroke: "#CFC9BE", "stroke-width": 1.5 });
            const rows = [["AI everything", 1, 15, true], ["Rebrand (rounder)", 2, 5, true], ["Kombucha on tap", 3, 4, true], ["SEC-0001 · post-quantum", 0, 1, false], ["Return to office", 6, 9, true]];
            rows.forEach(([name, a, b, ship], i) => {
              const y = ROWY + i * RH;
              sv("text", G, { x: 24, y: y + 30, "font-family": ship ? "Barlow" : "IBM Plex Mono", "font-weight": 600, "font-size": ship ? 21 : 15,
                "letter-spacing": ship ? 0 : 1.5, fill: ship ? "#6E6A62" : "#111111" }, name);
              sv("line", G, { x1: 0, y1: y + RH - 12, x2: 1736, y2: y + RH - 12, stroke: "#EEEAE2", "stroke-width": 1 });
              if (ship) {
                sv("rect", G, { x: qx(a) + 4, y: y + 10, width: (b - a) * QW - 8, height: 30, fill: "#2a2a27" });
                sv("text", G, { x: qx(b) - 12, y: y + 31, "text-anchor": "end", "font-family": "IBM Plex Mono", "font-weight": 600, "font-size": 12, "letter-spacing": 1.5, fill: "#F0ECE5" }, "SHIPPED");
              }
            });
          })();
          const SECY = ROWY + 3 * RH;
          const ghosts = sv("g", G, {});
          const bar = sv("g", G, { id: "f10-bar" });
          sv("rect", bar, { x: 4, y: SECY + 10, width: QW * 2 - 8, height: 30, fill: "#E85D26" });
          sv("rect", bar, { x: 4, y: SECY + 10, width: QW * 2 - 8, height: 4, fill: "rgba(255,230,214,0.6)" });
          sv("text", bar, { x: 14, y: SECY + 31, "font-family": "IBM Plex Mono", "font-weight": 600, "font-size": 12, "letter-spacing": 1.5, fill: "#111111" }, "PQC MIGRATION");
          PUSHES.forEach((_, i) => {
            const g = sv("g", ghosts, { opacity: 0 });
            sv("rect", g, { x: qx(i * 2) + 4, y: SECY + 10, width: QW * 2 - 8, height: 30, fill: "none", stroke: "rgba(232,93,38,0.6)", "stroke-width": 1.5, "stroke-dasharray": "5 4" });
            sv("text", g, { x: qx(i * 2) + 12, y: SECY + 30, "font-family": "IBM Plex Mono", "font-weight": 600, "font-size": 11, "letter-spacing": 1.4, fill: "rgba(200,72,26,0.9)" }, "DEFERRED");
          });

          // the thread: the ticket's history, bumped and bumped; then somebody's question
          const thread = [["Q3 2021", "bumped to Q1, sorry", "B", "brad · vp velocity"], ["Q1 2022", "not this quarter", "B", "brad · vp velocity"],
            ["Q4 2022", "after the rebrand", "R", "ruth · brand"], ["Q2 2023", "is this still relevant?", "B", "brad · vp velocity"],
            ["Q4 2024", "who'd even store it?", "?", "somebody · vp"]];
          const cms = thread.map(([when, say, av, who], i) => {
            const c = el("div", "f10-cm", $("f10-cms"));
            c.style.top = (110 + i * 128) + "px";
            el("div", "f10-av", c, av);
            el("div", "f10-who", c, who + " · " + when);
            el("div", "f10-say", c, say);
            return c;
          });
          cms[4].style.borderColor = "#111111"; cms[4].style.background = "#fff";

          // marker strokes (pathLength 100, drawn on in render): the circle around LOW, the arrow to "store"
          const MK = $("f10-marks");
          const wob = (cx, cy, rx, ry, seed) => {
            const r = HR.rng(seed); let d = "";
            for (let k = 0; k <= 64; k++) { const a = -0.5 + (k / 64) * Math.PI * 2.15, j = 1 + (r() - 0.5) * 0.05;
              d += (k ? "L" : "M") + (cx + Math.cos(a) * rx * j).toFixed(1) + " " + (cy + Math.sin(a) * ry * j).toFixed(1); }
            return d;
          };
          const strokes = [
            { d: wob(1441, 379, 136, 30, 31), t: LOW + 0.08, dur: 0.3 },
            { d: "M890 840 C 820 830, 760 790, 744 742 M744 742 l -12 26 M744 742 l 24 14", t: L(117.45), dur: 0.22 },
          ].map((s) => ({ ...s, p: sv("path", MK, { d: s.d, pathLength: 100, fill: "none", stroke: "#C8481A", "stroke-width": 5.5, "stroke-linecap": "round", "stroke-linejoin": "round", "stroke-dasharray": 100, "stroke-dashoffset": 100 }) }));

          // lyrics
          const tl = gsap.timeline({ paused: true });
          const mk = (box, cls, words) => {
            const row = el("div", "f10-row" + (cls ? " " + cls : ""), box);
            return words.map(([w, t, hero, hot]) => { const s = el("span", "f10-w" + (hot ? " f10-hot" : ""), row, w); return { s, t: L(t), hero }; });
          };
          const W = [
            ...mk($("f10-l1"), "", [["ticket", 107.0], ["opened,", 107.765]]),
            ...mk($("f10-l1"), "", [["priority", 108.6]]),
            ...mk($("f10-l1b"), "f10-big", [["low", 109.54, true]]),
            ...mk($("f10-l2"), "", [["pushed", 110.66], ["to", 110.92], ["next", 111.14], ["quarter,", 111.56]]),
            ...mk($("f10-l2"), "", [["four", 111.931], ["years", 112.5], ["in", 112.819], ["a", 113.048], ["row.", 113.22, false, true]]),
            ...mk($("f10-l3"), "", [["somebody", 114.2], ["asked,", 115.747]]),
            ...mk($("f10-l3"), "f10-serif", [["“who’d", 116.12], ["even", 116.6]]),
            ...mk($("f10-l3"), "f10-serif", [["store", 116.944, true, true], ["it?”", 117.76]]),
          ];
          for (const { s, t, hero } of W) hero ? HR.hero(tl, s, t, { spread: 22, over: 1.18, pre: 0.12, sharp: true }) : HR.lead(tl, s, t);
          const writes = [[$("f10-m1"), LOW + 0.3, 0.35], ...Array.from(document.querySelectorAll(".f10-again")).map((m, i) => [m, PUSHES[2 + i * 2] ?? PUSHES[PUSHES.length - 1], 0.22]),
            [$("f10-m3"), L(117.28), 0.2], [$("f10-m3s"), L(117.52), 0.25]];

          // groups: 0 ms cuts on "pushed" and "somebody"
          tl.set("#f10-l1, #f10-l1b", { opacity: 1 }, 0); tl.set("#f10-l1, #f10-l1b", { opacity: 0 }, G2);
          tl.set("#f10-l2", { opacity: 1 }, G2); tl.set("#f10-l2", { opacity: 0 }, G3);
          tl.set("#f10-l3", { opacity: 1 }, G3);
          tl.set("#f10-g1", { opacity: 1 }, 0); tl.set("#f10-g1", { opacity: 0 }, G2);
          tl.set("#f10-g2", { opacity: 1 }, G2); tl.set("#f10-g2", { opacity: 0 }, G3);
          tl.set("#f10-g3", { opacity: 1 }, G3);
          tl.set("#f10-m1", { opacity: 1 }, 0); tl.set("#f10-m1", { opacity: 0 }, G2);
          tl.set(".f10-again", { opacity: 1 }, G2); tl.set(".f10-again", { opacity: 0 }, G3);
          tl.set(strokes[0].p, { opacity: 1 }, 0); tl.set(strokes[0].p, { opacity: 0 }, G2);

          // ---- the camera ----------------------------------------------------------------------------------
          const stage = HR.stage($("root"), { seed: 10 });
          const cam = stage.cam; cam.focus = 0.7;
          const B = { x: 24, z: 1.04 }, P = { z: 0, rot: 0 };
          const seg = (o, from, to, a, b, ease) => tl.fromTo(o, from, { ...to, duration: Math.max(0.01, b - a), ease, immediateRender: false }, a);
          const punches = [[OPENED, 0.02, 0.2], [LOW, 0.045, -0.5], ...PUSHES.map((p, i) => [p, 0.012, i % 2 ? 0.25 : -0.25]), [L(116.944), 0.035, -0.4]];
          punches.forEach(([t, z, rot], i) => {
            const next = i + 1 < punches.length ? punches[i + 1][0] : DUR;
            tl.fromTo(P, { z: 0, rot: 0 }, { z, rot, duration: 0.05, ease: "power3.out", immediateRender: false }, t);
            tl.fromTo(P, { z, rot }, { z: 0, rot: 0, duration: Math.min(0.5, next - t - 0.07), ease: "elastic.out(1, 0.5)", immediateRender: false }, t + 0.05);
          });
          seg(B, { x: 24, z: 1.04 }, { x: -10, z: 1.0 }, 0, G2, "sine.inOut");
          seg(B, { x: -10, z: 1.0 }, { x: 18, z: 1.03 }, G2, G3, "sine.inOut");
          seg(B, { x: 18, z: 1.03 }, { x: 0, z: 1.05 }, G3, DUR - 0.38, "sine.inOut");
          seg(B, { x: 0, z: 1.05 }, { x: -30, z: 1.16 }, DUR - 0.38, DUR, "power3.in");

          // ---- g1: the issue is filed, then stepped down to LOW ---------------------------------------------
          const KEYS = Array.from({ length: TITLE.length }, (_, i) => 0.18 + i * ((1.5 - 0.18) / TITLE.length));
          seg("#f10-create", { scale: 1 }, { scale: 0.9 }, OPENED - 0.2, OPENED - 0.12, "power2.out");
          seg("#f10-modal", { opacity: 1, scale: 1, x: 0, y: 0 }, { opacity: 0, scale: 0.6, x: -140, y: -120 }, OPENED - 0.12, OPENED + 0.08, "power3.in");
          seg("#f10-sec", { opacity: 0, y: -40, scale: 1.08 }, { opacity: 1, y: 0, scale: 1 }, OPENED, OPENED + 0.32, "back.out(1.6)");
          seg("#f10-drop", { opacity: 0, y: -10 }, { opacity: 1, y: 0 }, PRIO, PRIO + 0.14, "power3.out");
          const steps = [...KICKS.filter((k) => k > PRIO + 0.1 && k < LOW - 0.05), LOW].slice(-3);
          steps.forEach((t, i) => seg("#f10-hl", { y: 46 * (i + (3 - steps.length)) }, { y: 46 * (i + 1 + (3 - steps.length)) }, t - 0.02, t + 0.06, "power3.out"));
          tl.fromTo("#f10-pchip", { scale: 1.4 }, { scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, LOW);

          // ---- g2: the bar is shoved two quarters per kick; each shove leaves a DEFERRED ghost -----------------
          gsap.set(bar, { x: qx(0) - 4 });
          PUSHES.forEach((p, i) => {
            const from = qx(i * 2) - 4, to = qx(i * 2 + 2) - 4;
            tl.fromTo(bar, { x: from }, { x: to + 10, duration: 0.09, ease: "power3.in", immediateRender: false }, p - 0.07);
            tl.fromTo(bar, { x: to + 10 }, { x: to, duration: Math.min(0.22, (PUSHES[i + 1] ?? G3) - p - 0.1), ease: "elastic.out(1, 0.5)", immediateRender: false }, p + 0.02);
            tl.fromTo(ghosts.children[i], { opacity: 0 }, { opacity: 1, duration: 0.08, immediateRender: false }, p);
          });

          // ---- g3: the thread scrolls up to the question --------------------------------------------------------
          seg("#f10-cms", { y: 220 }, { y: 0 }, G3, G3 + 1.2, "power3.out");
          tl.fromTo(cms[4], { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, L(116.12) - 0.1);

          // ---- per frame ---------------------------------------------------------------------------------
          const ftext = $("f10-ftext"), fcaret = $("f10-fcaret"), pchip = $("f10-pchip"), cv = $("f10-cv"), ck = $("f10-ck");
          function render() {
            const t = tl.time(), T = t + T0;
            cam.x = B.x; cam.z = B.z + P.z; cam.rot = P.rot;
            stage.apply(T);
            const n = KEYS.filter((k) => t >= k).length;
            ftext.textContent = TITLE.slice(0, n);
            fcaret.style.opacity = n < TITLE.length || Math.floor(t * 3.4) % 2 ? "1" : "0";
            pchip.textContent = t >= LOW ? "low" : "—";
            pchip.className = "f10-chip" + (t >= LOW ? " f10-hot" : "");
            const pushes = PUSHES.filter((p) => t >= p).length;
            if (t < G3) { ck.textContent = "DEFERRED"; cv.textContent = "×" + String(pushes).padStart(2, "0"); }
            else { ck.textContent = "OPEN FOR"; cv.textContent = "1,461 DAYS"; }
            for (const s of strokes) s.p.setAttribute("stroke-dashoffset", (100 * (1 - clamp01((t - s.t) / s.dur))).toFixed(1));
            for (const [m, t0, d] of writes) m.style.clipPath = `inset(-30% ${(100 - 100 * clamp01((t - t0) / d)).toFixed(1)}% -40% -5%)`;
          }
          tl.eventCallback("onUpdate", render);
          tl.seek(0);
          render();
          window.__timelines["10-ticket"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
