      <script type="module">
        import * as THREE from "./assets/vendor/three.module.js";

        const T0 = 48.491, DUR = 12.855;
        const L = (t) => +(t - T0).toFixed(3); // track -> frame-local seconds

        // ---- the grid: every cut is a downbeat; declared once, read everywhere --------------------------
        const CUTS = [48.491, 50.338, 52.181, 54.016, 55.847, 57.684, 59.512].map(L);
        const BEATS = [48.491, 48.961, 49.421, 49.88, 50.338, 50.798, 51.255, 51.714, 52.181, 52.64, 53.098, 53.554,
          54.016, 54.471, 54.93, 55.389, 55.847, 56.307, 56.764, 57.224, 57.684, 58.149, 58.601, 59.054, 59.512,
          59.976, 60.432, 60.887].map(L);
        const BP = 0.459; // beat period
        const shotAt = (t) => { let s = 0; while (s + 1 < CUTS.length && t >= CUTS[s + 1]) s++; return s; };
        const beatOf = (s, k) => BEATS[BEATS.indexOf(CUTS[s]) + k]; // k-th beat of shot s

        // ---- "harvest" strobe: vocal-chop onsets (audio.json onsets.vocal, strength >= 0.3, plus the burst tails)
        const BURSTS = [
          [53.713, 53.947, 54.252, 54.471, 54.676],
          [55.404, 55.693],
          [57.015, 57.13, 57.469, 57.953],
          [58.582, 58.881, 59.31, 59.43],
          [60.842, 61.226],
        ].map((b) => b.map(L));

        // ---- deterministic helpers -------------------------------------------------------------------------
        const rng = (seed) => () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        const clamp01 = (x) => Math.min(1, Math.max(0, x));
        const smooth = (x) => { x = clamp01(x); return x * x * (3 - 2 * x); };
        const out3 = (x) => 1 - Math.pow(1 - clamp01(x), 3);
        const in2 = (x) => clamp01(x) * clamp01(x);
        const lerp = (a, b, k) => a + (b - a) * k;
        const NEVER = 1e6, ALWAYS = -1e6;
        const TAU = Math.PI * 2;

        // ---- renderer ------------------------------------------------------------------------------------
        const canvas = document.getElementById("f05-gl");
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true, alpha: true });
        renderer.setPixelRatio(1);
        renderer.setSize(1920, 1080, false);
        renderer.setClearColor(0x0a0a0a, 0); // #root's ink shows through; the shader fogs to the same ink
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(70, 1920 / 1080, 0.05, 400);

        // One small shader: drawers, lines of light, cards, and solid archive structure.
        // colors are the brand tokens in sRGB, written straight to the framebuffer
        const uniforms = { uTime: { value: 0 }, uFogNear: { value: 10 }, uFogFar: { value: 100 }, uDim: { value: 1 }, uPulse: { value: 0 }, uHat: { value: 0 } };
        const material = new THREE.ShaderMaterial({
          uniforms,
          vertexShader: `
            attribute vec4 aData;
            varying vec3 vN; varying vec3 vWN; varying vec2 vUv; varying vec4 vD; varying float vDepth; varying vec3 vWP;
            void main() {
              vN = normal; vWN = mat3(instanceMatrix) * normal; vUv = uv; vD = aData;
              vWP = (instanceMatrix * vec4(position, 1.0)).xyz;
              vec4 mv = modelViewMatrix * instanceMatrix * vec4(position, 1.0);
              vDepth = -mv.z;
              gl_Position = projectionMatrix * mv;
            }`,
          fragmentShader: `
            precision highp float;
            uniform float uTime, uFogNear, uFogFar, uDim, uPulse, uHat;
            varying vec3 vN; varying vec3 vWN; varying vec2 vUv; varying vec4 vD; varying float vDepth; varying vec3 vWP;
            const vec3 INK = vec3(0.0392, 0.0392, 0.0392); // #0A0A0A: the fog falls to the ground ink
            const vec3 INKALT = vec3(0.102, 0.102, 0.094);
            const vec3 FIRE = vec3(0.910, 0.365, 0.149);
            const vec3 CREAM = vec3(0.941, 0.925, 0.898);
            const vec3 MUTED = vec3(0.533, 0.533, 0.502);
            const vec3 HINT = vec3(0.314, 0.314, 0.282);
            const vec3 BORDER = vec3(0.157, 0.157, 0.149);
            float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
            float rect(vec2 p, vec2 c, vec2 h) { vec2 d = abs(p - c) - h; float m = max(d.x, d.y); float aa = max(fwidth(m), 1e-5);
              return 1.0 - smoothstep(-aa * 0.5, aa * 0.5, m); }
            float hair(float d, float wmin) { float aa = max(fwidth(d), 1e-5); float w = max(wmin, aa * 1.1);
              return 1.0 - smoothstep(w - aa * 0.5, w + aa * 0.5, d); }
            float seg(vec2 p, vec2 a, vec2 b) { vec2 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
              return length(pa - ba * h); }
            void main() {
              float kind = vD.x;
              vec3 col;
              float fogK = 1.0;
              float age = uTime - vD.y;
              float lit = step(0.0, age);
              if (kind < 0.5) {
                // ---- drawer: ink box, cream hairline edges, a fire-orange lamp on its front
                vec3 n = abs(vN);
                bool front = vN.z > 0.5;
                vec2 fs = n.y > 0.5 ? vec2(1.6, 1.6) : vec2(1.6, 1.0);
                vec2 p = vUv * fs;
                float d = min(min(p.x, fs.x - p.x), min(p.y, fs.y - p.y));
                if (front) {
                  float detail = 1.0 - smoothstep(0.004, 0.011, fwidth(p.x));
                  // A broad recessed panel under raking light (brighter top-left), a raised upper lip, a lower shadow.
                  float panel = rect(p, vec2(0.8, 0.5), vec2(0.725, 0.425));
                  col = mix(BORDER, INKALT * (0.66 + 0.2 * p.y - 0.04 * p.x), panel);
                  float rim = hair(abs(d - 0.055), 0.019);
                  col = mix(col, HINT, 0.55 * rim);
                  col = mix(col, MUTED, 0.24 * rect(p, vec2(0.8, 0.955), vec2(0.735, 0.023)));
                  col = mix(col, INK, rect(p, vec2(0.8, 0.075), vec2(0.71, 0.023)));
                  vec2 lc = vec2(1.40, 0.80);
                  // some lamps stutter on the hats
                  float fl = 1.0 - 0.72 * uHat * step(0.6, fract(vD.z * 7.13));
                  float on = lit * fl;
                  vec3 lamp = mix(CREAM, FIRE, smoothstep(0.0, 0.3, age));
                  lamp = mix(lamp, CREAM, 0.25 * uPulse);
                  // the pull: a recessed slot, a lit lip above it, two screws
                  col = mix(col, INK, rect(p, vec2(0.8, 0.185), vec2(0.19, 0.03)));
                  col = mix(col, MUTED, 0.7 * rect(p, vec2(0.8, 0.226), vec2(0.19, 0.01)));
                  col = mix(col, HINT, 0.8 * rect(p, vec2(0.8, 0.158), vec2(0.17, 0.005)));
                  for (int i = 0; i < 2; i++) {
                    vec2 sc = vec2(i == 0 ? 0.55 : 1.05, 0.19);
                    float sr = length(p - sc), saa = max(fwidth(sr), 1e-5);
                    col = mix(col, HINT, 1.0 - smoothstep(0.017 - saa, 0.017 + saa, sr));
                    col = mix(col, MUTED, detail * (1.0 - smoothstep(0.007 - saa, 0.007 + saa, length(p - sc - vec2(-0.005, 0.005)))));
                  }
                  if (vD.w < 0.5) {
                    // the label card in its holder: dim paper, two rows of ciphertext, warmed by the lamp
                    vec2 cc = vec2(0.40, 0.72);
                    col = mix(col, HINT * 0.9, rect(p, cc, vec2(0.272, 0.102)));
                    vec3 paper = mix(INKALT, MUTED, 0.36 + 0.3 * on) + FIRE * 0.07 * on;
                    col = mix(col, paper, rect(p, cc - vec2(0.0, 0.01), vec2(0.255, 0.082)));
                    col = mix(col, INK, 0.45 * rect(p, cc + vec2(0.0, 0.066), vec2(0.255, 0.008)));
                    if (detail > 0.0) {
                      vec2 q = (p - vec2(0.17, 0.705)) / vec2(0.042, 0.048);
                      if (q.x >= 0.0 && q.x < 11.0 && q.y >= 0.0 && q.y < 1.0) {
                        vec2 cell = floor(q);
                        float ink = step(0.22, hash(cell + vec2(vD.z * 31.0, 7.0))) * step(0.5, mod(cell.x + 1.0, 4.0));
                        col = mix(col, INK, detail * 0.75 * ink * rect(fract(q), vec2(0.5), vec2(0.3, 0.36)));
                      }
                      vec2 q2 = (p - vec2(0.17, 0.655)) / vec2(0.042, 0.03);
                      if (q2.x >= 0.0 && q2.x < 6.0 && q2.y >= 0.0 && q2.y < 1.0) {
                        float ink = step(0.35, hash(floor(q2) + vec2(vD.z * 17.0, 3.0)));
                        col = mix(col, FIRE * 0.8, detail * 0.8 * ink * rect(fract(q2), vec2(0.5), vec2(0.42, 0.3)));
                      }
                    }
                  } else {
                    // the open slot of drawer 0001
                    float sl = rect(p, vec2(0.8, 0.5), vec2(0.56, 0.045));
                    col = mix(col, INK, sl);
                    vec2 sd = abs(p - vec2(0.8, 0.5)) - vec2(0.56, 0.045);
                    col = mix(col, MUTED, hair(abs(max(sd.x, sd.y)), 0.004));
                    col = mix(col, FIRE, lit * 0.55 * rect(p, vec2(0.8, 0.5), vec2(0.54, 0.012)));
                  }
                  col += FIRE * on * (0.16 + 0.08 * uPulse) * exp(-length(p - lc) * 2.6);
                  col = mix(col, INK, rect(p, lc, vec2(0.092)));
                  col = mix(col, HINT, 0.65 * hair(abs(max(abs(p.x-lc.x), abs(p.y-lc.y)) - 0.083), 0.006));
                  col = mix(col, lit > 0.5 ? mix(BORDER, lamp, 0.28 + 0.72 * fl) : BORDER, rect(p, lc, vec2(0.065)));
                  col = mix(col, CREAM, 0.55 * on * detail * rect(p, lc + vec2(-0.03, 0.03), vec2(0.012)));
                  col = mix(col, vD.w > 0.5 && vD.w < 1.5 ? FIRE : MUTED, hair(d, 0.012));
                } else {
                  col = n.y > 0.5 ? INKALT : INK;
                  col = mix(col, n.y > 0.5 ? HINT : BORDER, hair(d, 0.012));
                }
              } else if (kind < 1.5) {
                // ---- a line of light
                col = vD.z > 0.5 ? CREAM : FIRE;
                col = mix(BORDER, col, lit);
                // packets of light run along the line into the archive (vD.w = speed; head leads, tail fades)
                float pk = vD.w != 0.0 ? smoothstep(0.8, 1.0, 1.0 - fract(dot(vWP, vec3(1.0)) * 0.04 + uTime * vD.w)) : 0.0;
                col = mix(col, CREAM, lit * max(0.2 * uPulse, 0.9 * pk));
                fogK = 0.75;
              } else if (kind > 2.5) {
                // Structural ribs have real box depth; broad face light replaces wireframe outlines.
                float face = 0.13 + 0.30 * max(dot(normalize(vWN), normalize(vec3(-0.5, 0.8, 0.35))), 0.0);
                col = mix(INKALT, HINT, face * (0.65 + 0.55 * vD.z));
                float edge = min(min(vUv.x, 1.0-vUv.x), min(vUv.y, 1.0-vUv.y));
                col = mix(col, MUTED, 0.16 * (1.0-smoothstep(0.015,0.045,edge)));
              } else {
                // ---- an envelope (01's design): shaded flaps, fold highlights, ciphertext, the sculpted fire seal;
                // its back is the address side: postmark, address rows, a fire stamp and a sorting barcode.
                // vD.w = aspect (1 = standard, 1.22 = long, 0.84 = square card)
                if (abs(vN.z) > 0.5) {
                  float W = 0.8 * vD.w, H = 0.5;
                  vec2 p = (vUv - 0.5) * vec2(1.6 * vD.w, 1.0);
                  float detail = 1.0 - smoothstep(0.0025, 0.008, fwidth(p.x));
                  // paper under raking light, with a little fibre up close
                  col = CREAM * (0.985 + 0.05 * (p.y / H) - 0.035 * (p.x / W));
                  col *= 1.0 - 0.035 * detail * hash(floor(p * 160.0) + vD.z * 9.0);
                  if (vN.z > 0.5) {
                    float ax = abs(p.x) / W;
                    float eT = p.y - H * ax;                    // > 0: the top flap
                    float eB = p.y - (-H + (H + 0.03) * (1.0 - ax)); // < 0: the bottom flap
                    if (eT > 0.0) col *= 1.0 - 0.07 * (1.0 - p.y / H);
                    else if (eB < 0.0) col *= 1.0 - 0.06 * (1.0 + p.y / H) * 0.6 - 0.02;
                    else col *= 1.0 - 0.06 * ax;
                    // ciphertext body, upper left, glyph cells of mono hex (scrambles on its rows)
                    if (detail > 0.0) {
                      vec2 q = (p - vec2(-W + 0.09, 0.08)) / vec2(0.036, 0.062);
                      if (q.x >= 0.0 && q.x < 15.0 && q.y >= 0.0 && q.y < 5.0) {
                        vec2 cell = floor(q);
                        if (mod(cell.x, 5.0) < 3.5) {
                          float scr = mod(cell.y, 2.0) < 0.5 ? floor(uTime * 15.0) : 0.0;
                          vec2 g = floor(fract(q) * vec2(3.0, 5.0));
                          float on = step(0.3, hash(cell * 7.0 + g + vec2(vD.z * 13.0 + scr, scr * 0.37)));
                          float inG = rect(fract(q), vec2(0.5), vec2(0.36, 0.38));
                          col = mix(col, vec3(0.373, 0.357, 0.329), detail * 0.85 * on * inG);
                        }
                      }
                    }
                    // flap edges: a soft shadow under the top flap, its fold line, a paper highlight just inside
                    float sT = eT * 0.85;
                    col *= 1.0 - 0.16 * step(sT, 0.0) * exp(sT * 32.0);
                    col = mix(col, INK, 0.26 * hair(abs(sT), 0.0028));
                    col = mix(col, vec3(1.0), 0.45 * detail * hair(abs(sT - 0.009), 0.002));
                    col = mix(col, INK, 0.12 * hair(abs(eB * 0.85), 0.0025));
                    col = mix(col, vec3(1.0), 0.35 * detail * hair(abs(eB * 0.85 + 0.007), 0.002));
                    col = mix(col, vec3(1.0), 0.6 * detail * step(H - 0.012, p.y));
                    // the sorting barcode, fire ink, along the bottom right
                    vec2 bq = (p - vec2(W - 0.52, -H + 0.05)) / vec2(0.0145, 0.05);
                    if (bq.x >= 0.0 && bq.x < 30.0 && bq.y >= 0.0 && bq.y < 1.0) {
                      float h = hash(vec2(floor(bq.x), vD.z * 5.0));
                      col = mix(col, FIRE, detail * 0.85 * step(fract(bq.x), 0.45) * step(h < 0.5 ? 0.5 : 0.0, bq.y));
                    }
                    // the seal: drip-lobed rim, radial wax, inner ring, bead ring, embossed "a.", a highlight arc
                    vec2 c = p - vec2(0.0, 0.01);
                    float r = length(c), ang = atan(c.y, c.x);
                    float aa = max(fwidth(r), 1e-5);
                    float rim = 0.152 * (1.0 + 0.06 * sin(ang * 5.0 + vD.z * 20.0) + 0.035 * sin(ang * 11.0 + vD.z * 9.0));
                    col *= 1.0 - 0.22 * (1.0 - smoothstep(rim, rim + 0.035, length(c + vec2(-0.012, 0.02))));
                    float rimM = 1.0 - smoothstep(rim - aa, rim + aa, r);
                    col = mix(col, mix(vec3(0.725, 0.263, 0.102), vec3(0.557, 0.188, 0.063), smoothstep(0.1, rim, r)), rimM);
                    float disc = 1.0 - smoothstep(0.125 - aa, 0.125 + aa, r);
                    float gr = length(c - vec2(-0.03, 0.035)) / 0.16;
                    vec3 wax = mix(vec3(0.965, 0.549, 0.361), FIRE, smoothstep(0.0, 0.45, gr));

          if (hit) {
            strobeEl.style.top = hit.j % 2 ? "4.5cqw" : "auto"; strobeEl.style.bottom = hit.j % 2 ? "auto" : "4.5cqw";
            const slam = hit.age < 0.07 ? 0.08 * Math.pow(1 - hit.age / 0.07, 2) : 0;
            const nudge = HR.hit("snare", T, 0.08);
            strobeEl.style.transform = `translateX(${nudge.toFixed(2)}px) scale(${(1 + slam).toFixed(4)})`;
            const fr = hit.age < DT ? 1 : 0;
            frc.style.opacity = fr; frf.style.opacity = fr;
            frc.style.transform = "translate(-3px, -1px)"; frf.style.transform = "translate(3px, 1px)";
            HR.glow(word, T, 0.12, 0.22);
          }

          if (s === 4 && !hit) {
            proj.copy(tagPoint).project(camera);
            const dist = camera.position.distanceTo(tagPoint);
            const ppu = 1080 / (2 * dist * Math.tan((camera.fov * Math.PI) / 360));
            const fs = 0.085 * ppu;
            tag.style.opacity = 1;
            tag.style.fontSize = fs.toFixed(2) + "px";
            tag.style.transform = `translate(${((proj.x + 1) / 2 * 1920).toFixed(1)}px, ${((1 - proj.y) / 2 * 1080 - fs).toFixed(1)}px)`;
          } else if (s === 5 && lt > 2.95 && !hit) {
            proj.set(-0.61,-95.72,-7.19).project(camera);
            tag.style.opacity = 1;
            tag.style.fontSize = "18px";
            tag.style.transform = `translate(${((proj.x+1)*960).toFixed(1)}px, ${((1-proj.y)*540).toFixed(1)}px)`;
          } else tag.style.opacity = 0;
          drawOdo(t, T);

          updateDescent(s, lt, T);
          WOW.draw(tl, T0);
          renderer.render(scene, camera);
        }
        tl.eventCallback("onUpdate", render);
        render();
        tl.seek(0);
        window.__timelines["05-harvest"] = tl;
      </script>
    </template>
  </body>
</html>
