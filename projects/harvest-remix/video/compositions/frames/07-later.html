            hline(30, 700, 640, 1.2, "rgba(17,17,17,0.5)");
            txt("FIG. 1 — A MODULE LATTICE, RANK 3 (NOT TO SCALE)", 30, 666, MONO6, "#111111", "left", "1.5px");
            txt("HARD FOR A QUANTUM COMPUTER. EASY TO PUT OFF.", 30, 690, MONO5, "#6a655c", "left", "1.5px");
            txt("ML-KEM-768", 700, 666, MONO6, "#C24A1C", "right", "2px");
            BASE();
            // the engraved figure: every bond and point of the lattice printed flat where its points will land
            for (const n of nodes) { const p = P3(n.h[0], n.h[2], fo, v, YP + 0.01); n.ex = p.x; n.ey = p.y; }
            ctx.beginPath();
            for (const e of edges) if (!e.brace) { ctx.moveTo(e.a.ex, e.a.ey); ctx.lineTo(e.b.ex, e.b.ey); }
            ctx.lineWidth = 1.3 * v.s / 124; ctx.strokeStyle = "rgba(17,17,17,0.3)"; ctx.stroke();
            for (const n of nodes) { ctx.beginPath(); ctx.arc(n.ex, n.ey, 5 * v.s / 124, 0, Math.PI * 2); ctx.lineWidth = 1.3 * v.s / 124; ctx.strokeStyle = "rgba(17,17,17,0.45)"; ctx.stroke(); }
            // DEFERRED, stamped on the hat after "math": it drops, presses, stays
            if (t >= STAMP2 - 0.09) {
              const u = clamp01((t - (STAMP2 - 0.09)) / 0.09), e = u * u * u, squash = decay(t, STAMP2, 0.06);
              onPlane(FD.page[0], FD.page[3], fo, v);
              ctx.translate(500, 420); ctx.rotate(-0.13); ctx.scale((1.7 - 0.7 * e) * 0.6 * (1 + 0.05 * squash), (1.7 - 0.7 * e) * 0.6 * (1 - 0.07 * squash));
              ctx.globalAlpha = 0.25 + 0.7 * e; ctx.globalCompositeOperation = "multiply";
              ctx.drawImage(stampImage(), -320, -125);
              ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
              BASE();
            }
            // the desk lamp: a warm pool over the paper, falling off to dark at the folder's rim
            const lc = P3(0.4, 0.6, fo, v), R = 7.4 * v.s;
            ctx.save(); ctx.beginPath(); for (const r of [FD.cover, FD.back, FD.tab]) pathQ(quad(r, fo, v, edgeY + (r === FD.tab ? 0.07 : 0))); ctx.clip();
            const g = ctx.createRadialGradient(lc.x, lc.y, 0, lc.x, lc.y, R);
            g.addColorStop(0, "#FFFFFF"); g.addColorStop(0.42, "#F3EDE3"); g.addColorStop(0.75, "#9C958A"); g.addColorStop(1, "#2A2724");
            ctx.globalCompositeOperation = "multiply"; ctx.fillStyle = g; ctx.fillRect(-PAD, -PAD, 1920 + 2 * PAD, 1080 + 2 * PAD);
            ctx.restore(); ctx.globalCompositeOperation = "source-over";
          }

          // the sparks thrown off the cube's eight corners as the basis snaps square on "math"
          const SPARKS = (() => {
            const r = HR.rng(7191), out = [];
            const corners = nodes.filter((n) => (n.i % (SI - 1) === 0) && (n.j % (SI - 1) === 0) && (n.k % (SK - 1) === 0));
            for (const n of corners) for (let s = 0; s < 8; s++) {
              const a = r() * Math.PI * 2, sp = 2.5 + r() * 4.5;
              out.push({ n, vx: Math.cos(a) * sp, vy: 1.5 + r() * 4, vz: Math.sin(a) * sp, life: 0.3 + r() * 0.45, d: r() * 0.03 });
            }
            return out;
          })();
          function drawSparks(t, v) {
            if (t < MATH || t > MATH + 0.85) return;
            const at = (s, tau) => { const o = {}; project([s.n.lock[0] + s.vx * tau, s.n.lock[1] + s.vy * tau - 6 * tau * tau, s.n.lock[2] + s.vz * tau], v, o); return o; };
            ctx.lineCap = "round";
            for (const s of SPARKS) {
              const tau = t - MATH - s.d; if (tau < 0 || tau > s.life) continue;
              const a = at(s, Math.max(0, tau - 0.04)), b = at(s, tau), fade = 1 - tau / s.life;
              ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineWidth = 5 * b.ps; ctx.strokeStyle = rgba(FI, 0.85 * fade); ctx.stroke();
              ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineWidth = 2 * b.ps; ctx.strokeStyle = rgba(HOT, fade); ctx.stroke();
            }
          }

          // one pass of the lattice: 'dark' (v17's light on black, then printed ink on the card) or 'ink' (over the
          // folder's paper: ink bonds, fire route and lit points, paper struts down to the page)
          function drawPass(mode, t, hat, v, lp, pr, W, foFull) {
            const ink = mode === "ink";
            if (!ink) for (let k = 0; k < SK; k++) {
              const q = [[0, 0], [SI - 1, 0], [SI - 1, SI - 1], [0, SI - 1]].map(([i, j]) => nodes[idx(i, j, k)]);
              ctx.beginPath(); q.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y))); ctx.closePath();
              ctx.fillStyle = rgba(lp > 0.5 ? CR : INK, 0.028); ctx.fill();
              ctx.lineWidth = 1; ctx.strokeStyle = lp > 0.5 ? rgba("136,136,128", 0.3 * lp) : rgba("80,80,72", 0.3 * pr); ctx.stroke();
            }
            if (ink) {
              // the pop-up's paper struts: each bottom point is held to its printed spot on the page
              const sa = 1 - clamp01((t - FOLD_OUT) / 0.2);
              ctx.beginPath();
              for (const n of nodes) if (n.k === 0 && popE(t, 0) > 0.02) { ctx.moveTo(n.x, n.y); ctx.lineTo(n.ex, n.ey); }
              ctx.lineWidth = 2.2 * W; ctx.strokeStyle = rgba("90,84,74", 0.55 * sa); ctx.stroke();
              for (const e of edges) {
                const q = smooth(e.at - 0.2, e.at, t); if (q <= 0) continue;
                const f = (e.a.fog + e.b.fog) / 2, ps = (e.a.ps + e.b.ps) / 2;
                ctx.beginPath(); seg2(e.a, e.b, q);
                ctx.lineWidth = (e.brace ? 1.3 : 2.8) * ps; ctx.strokeStyle = rgba(INK, (e.brace ? 0.35 : 0.5 + 0.4 * f) * lit.crisp); ctx.stroke();
              }
            } else if (lp > 0) {
              for (const e of edges) {
                const m = (e.a.m + e.b.m) / 2, f = (e.a.fog + e.b.fog) / 2;
                ctx.beginPath(); seg2(e.a, e.b, 1); ctx.lineWidth = 1.3 * W; ctx.strokeStyle = rgba(CR, (e.brace ? 0.1 : 0.24) * f * m * lp); ctx.stroke();
              }
              ctx.globalCompositeOperation = "lighter";
              for (const e of edges) {
                if (e.brace) continue;
                const q = smooth(e.at - 0.2, e.at, t); if (q <= 0) continue;
                const m = (e.a.m + e.b.m) / 2, f = (e.a.fog + e.b.fog) / 2, ps = (e.a.ps + e.b.ps) / 2;
                ctx.beginPath(); seg2(e.a, e.b, q); ctx.lineWidth = 11 * ps; ctx.strokeStyle = rgba(FI, 0.16 * f * m * lp * lit.glow); ctx.stroke();
              }
              ctx.globalCompositeOperation = "source-over";
              for (const e of edges) {
                const q = smooth(e.at - 0.2, e.at, t); if (q <= 0) continue;
                const m = (e.a.m + e.b.m) / 2, f = (e.a.fog + e.b.fog) / 2, ps = (e.a.ps + e.b.ps) / 2;
                ctx.beginPath(); seg2(e.a, e.b, q);
                ctx.lineWidth = (e.brace ? 1.4 : 3) * ps; ctx.strokeStyle = rgba(CR, (e.brace ? 0.3 : 0.45 + 0.5 * f) * m * lp * lit.crisp); ctx.stroke();
              }
            }
            if (!ink && pr > 0) for (const e of edges) {
              const f = (e.a.fog + e.b.fog) / 2;
              ctx.beginPath(); seg2(e.a, e.b, 1); ctx.lineWidth = (e.brace ? 0.9 : 1.6) * W; ctx.strokeStyle = rgba(INK, (e.brace ? 0.22 : 0.32 + 0.5 * f) * pr); ctx.stroke();
            }
            // the basis vectors light on the kick before "math"
            const bq = smooth(PRE - 0.02, PRE + 0.14, t);
            if (bq > 0) for (const b of BTIPS) {
              ctx.beginPath(); seg2(ORIGIN, b, bq);
              if (lp > 0 && !ink) { ctx.globalCompositeOperation = "lighter"; ctx.lineWidth = 14 * ORIGIN.ps; ctx.strokeStyle = rgba(FI, 0.25 * lp * lit.glow); ctx.stroke(); ctx.globalCompositeOperation = "source-over"; }
              ctx.lineWidth = (lp > 0.5 ? 5.5 : 3) * ORIGIN.ps; ctx.strokeStyle = lp > 0.5 ? rgba(FI, 0.95) : rgba(RED, 0.9 * pr); ctx.stroke();
            }
            // the lit route: it draws node by node from the origin, then a spark runs it twice on "math"
            const rf = clamp01((t - RSTART) / (MATH - 0.06 - RSTART)) * (route.length - 1);
            if (rf > 0) {
              const rm = ink ? 1 : route.reduce((s, p) => s + p.m, 0) / route.length;
              if (lp > 0) {
                if (!ink) { ctx.globalCompositeOperation = "lighter"; polyTo(route, rf); ctx.lineWidth = 22 * W; ctx.strokeStyle = rgba(FI, 0.22 * lp * lit.route * rm); ctx.stroke(); ctx.globalCompositeOperation = "source-over"; }
                polyTo(route, rf); ctx.lineWidth = 6.5 * W; ctx.strokeStyle = rgba(FI, lp * rm); ctx.stroke();
                for (const s0 of [MATH, MATH + 0.55]) {
                  const u = (t - s0) / 0.5; if (u < 0 || u > 1) continue;
                  const f = u * u * (route.length - 1 + 0.6);
                  if (!ink) ctx.globalCompositeOperation = "lighter";
                  const a = Math.max(0, f - 0.6), b = Math.min(route.length - 1, f);
                  ctx.beginPath();
                  for (let x = a; x <= b + 1e-6; x += 0.1) {
                    const n = Math.min(route.length - 2, Math.floor(x)), q = x - n, p = route[n], r = route[n + 1];
                    const px = p.x + (r.x - p.x) * q, py = p.y + (r.y - p.y) * q;
                    x === a ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
                  }
                  if (ink) { ctx.lineWidth = 9 * W; ctx.strokeStyle = rgba(FI, 0.9); ctx.stroke(); }
                  ctx.lineWidth = 6 * W; ctx.strokeStyle = rgba(ink ? HOT : CR, 0.95 * lp); ctx.stroke();
                  ctx.globalCompositeOperation = "source-over";
                }
              }
              if (!ink && pr > 0) { polyTo(route, rf); ctx.lineWidth = 4 * W; ctx.strokeStyle = rgba(RED, pr); ctx.stroke(); }
            }
            // the nodes, far to near: a ring that occludes the bonds behind, a cream (or lit fire) core, a halo; each
            // wave flashes as it lands on its kick, every point flashes white-hot on the lock
            const order = nodes.slice().sort((p, q) => q.z - p.z);
            for (const n of order) {
              const landE = smooth(0, n.land, t) * 0.5 + (t >= n.land ? 0.5 : 0);
              const fire = n.lit != null && t >= n.lit, hotE = decay(t, n.front, 0.2);
              if (lp > 0) {
                const m = ink ? 1 : n.m;
                const op = (0.5 + 0.5 * landE) * m * (0.55 + 0.45 * n.fog) * (t >= MATH && t < CARD && n.flick ? 1 - 0.6 * hat : 1) * lp;
                const r = 8.5 * n.ps * (1 + 0.5 * decay(t, n.land, 0.12) + 0.5 * hotE);
                ctx.beginPath(); ctx.arc(n.x, n.y, r + 3.5 * n.ps, 0, Math.PI * 2); ctx.fillStyle = ink ? rgba(INK, op) : rgba("10,10,10", op); ctx.fill();
                ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI * 2); ctx.fillStyle = hotE > 0.3 ? rgba(HOT, op) : rgba(fire ? FI : ink ? "247,243,236" : CR, op); ctx.fill();
                const ha = (0.12 + 0.88 * decay(t, n.land, 0.16)) * (t >= n.land ? 1 : 0.4) + (fire ? 0.7 * decay(t, n.lit, 0.18) + 0.2 : 0) + 0.8 * hotE;
                if (ha > 0.02) {
                  const hs = 74 * n.ps * (1 + 0.5 * decay(t, n.land, 0.2) + 0.6 * hotE);
                  if (ink) { ctx.globalAlpha = Math.max(0, Math.min(1, (ha - 0.12) * 0.9 * lp)); }
                  else { ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = Math.max(0, Math.min(1, ha * m * n.fog * lp)); }
                  if (ctx.globalAlpha > 0.01) ctx.drawImage(ink ? HALO_F : HALO, n.x - hs / 2, n.y - hs / 2, hs, hs);
                  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
                }
              }
              if (!ink && pr > 0) { ctx.beginPath(); ctx.arc(n.x, n.y, 5 * n.ps, 0, Math.PI * 2); ctx.fillStyle = rgba(n.onR ? RED : INK, pr); ctx.fill(); }
            }
          }

          const inQuad = (q, x, y) => { let s = 0; for (let i = 0; i < 4; i++) { const a = q[i], b = q[(i + 1) % 4], c = (b.x - a.x) * (y - a.y) - (b.y - a.y) * (x - a.x); if (c !== 0) { if (s === 0) s = Math.sign(c); else if (Math.sign(c) !== s) return false; } } return true; };
          function drawLattice(t, hat) {
            const v = view(t), pr = smooth(CARD - 0.42, CARD - 0.05, t), lp = 1 - pr, BC = basisAt(t);
            for (const n of nodes) { const w = pos(n, t, BC); n.lock = w; project(w, v, n); n.m = textMask(n.x, n.y, lp); }
            BASE(); ctx.clearRect(-PAD, -PAD, 1920 + 2 * PAD, 1080 + 2 * PAD);
            ctx.lineCap = "round"; ctx.lineJoin = "round";
            const W = v.s / BIG.s; // line widths follow the fit
            const fi = foIn(t), fx = foOut(t), fo = [fi[0] + fx[0], 0, fi[2] + fx[2]];
            const folder = t < FOLD_GONE + 0.05;
            let quads = null;
            if (folder) {
              drawFolder(t, v, fo); BASE();
              quads = [FD.cover, FD.back, FD.tab].map((r) => quad(r, fo, v));
              ctx.save(); ctx.beginPath(); ctx.rect(-PAD, -PAD, 1920 + 2 * PAD, 1080 + 2 * PAD); quads.forEach(pathQ); ctx.clip("evenodd");
              drawPass("dark", t, hat, v, lp, pr, W, fo); ctx.restore();
              ctx.save(); ctx.beginPath(); quads.forEach(pathQ); ctx.clip();
              drawPass("ink", t, hat, v, lp, pr, W, fo); ctx.restore();
            } else drawPass("dark", t, hat, v, lp, pr, W, fo);
            drawSparks(t, v);
            // the engraved coordinates, the basis names and the lock tag ride the projected points
            for (const n of nodes) if (n.lab) {
              n.lab.style.transform = `translate(${n.x.toFixed(1)}px, ${n.y.toFixed(1)}px) scale(${Math.max(0.75, Math.min(1.15, n.ps)).toFixed(3)})`;
              const onPaper = quads && quads.some((q) => inQuad(q, n.x, n.y));
              n.lab.firstChild.style.color = onPaper ? (n.onR ? "#C24A1C" : "#4A463F") : "";
              n.lab.style.opacity = ((onPaper ? 1 : n.m) * lp * (0.35 + 0.65 * smooth(0, n.land, t)) * (0.5 + 0.5 * n.fog) + pr).toFixed(3);
            }
            BTIPS.forEach((b, i) => { const o = [[18, 8], [-10, -40], [-50, -16]][i]; blabs[i].style.transform = `translate(${(b.x + o[0]).toFixed(1)}px, ${(b.y + o[1]).toFixed(1)}px)`; });
            lockt.style.left = (END.x + 20).toFixed(1) + "px"; lockt.style.top = (END.y - 58).toFixed(1) + "px";
          }

          // ---- per-frame draw -------------------------------------------------------------------------------
          const root = $("root"), num = $("f07-num"), kickEl = $("f07-kick"), clabel = $("f07-clabel"), wallbox = $("f07-wallbox");
          const light = $("f07-light"), sure = $("f07-sure"), cntLabel = $("f07-clabel");
          let wasG2 = null;
          const mathRow = l14.find((w) => w.hero).s, aroundW = l15.find((w) => w.hero).s;
          function render() {
            const t = tl.time(), T = t + T0;
            cam.x = A.x + N.x; cam.y = A.y + N.y; cam.z = A.z + N.z; cam.rot = A.rot + N.rot; cam.focus = A.focus;
            stage.apply(T);
            WOW.draw(tl, T0);
            HR.draw(tl);
            const rms = HR.band("rms", T), kick = HR.hit("kick", T, 0.14), hat = HR.hit("hat", T, 0.07);
            let k = -1;
            for (let i = 0; i < K.length; i++) if (t >= K[i] - 1e-6) k = i;
            const g2 = k >= 0;
            if (wasG2 !== g2) {
              wasG2 = g2;
              // chrome on cream is ink (10-ticket); inline, since #id rules under a toggled class never match
              kickEl.style.color = g2 ? "#111111" : ""; num.style.color = g2 ? "#111111" : ""; cntLabel.style.color = g2 ? "#111111" : "";
              kickEl.style.fontWeight = g2 ? "600" : "";
            }

            // light behind the lattice in g1, flaring on the lock
            light.style.opacity = g2 ? "0" : ((0.55 + 0.9 * rms + 0.3 * kick) * flare.o).toFixed(3);
            if (g2) wallbox.style.transform = "none";

            // glow: "math" and "around" on dark, the fire excuses, the basis; settled nodes twinkle on hats
            HR.glow(mathRow, T, 0.4, 0.8);
            HR.glow(aroundW, T, 0.4, 0.8);
            if (!g2) drawLattice(t, hat);

            // the roll: only the current excuse is on screen; the lock holds into the cut
            const kk = Math.min(k, 17), cur = g2 ? START + 1 + kk : -1, since = g2 ? t - K[kk] : 0;
            cols.forEach(({ c, u, slot }, i) => {
              c.classList.toggle("f07-on", i === cur);
              u.style.transform = `scaleX(${i === cur ? clamp01(since / 0.08).toFixed(3) : 0})`;
              slot.style.opacity = i === cur - 1 && kk > 0 ? Math.max(0, 1 - since / 0.45).toFixed(3) : "0";
            });
            excuses.forEach((e, i) => { e.style.visibility = g2 && i === k ? "visible" : "hidden"; });
            fin.style.visibility = k >= 17 ? "visible" : "hidden";
            sure.style.clipPath = `inset(-30% ${(100 - 100 * clamp01((t - SURE) / 0.28)).toFixed(1)}% -40% -5%)`;
            kickEl.textContent = g2 ? "SEC-0001 · SPRINT BOARD" : "THE NEW MATH";
            clabel.textContent = g2 ? "RESCHEDULED" : "OBJ";
            num.textContent = g2 ? "×" + String(kk + 1).padStart(2, "0") : "0002";
          }
          tl.eventCallback("onUpdate", render);
          tl.seek(0);
          render();
          window.__timelines["07-later"] = tl;
        })();
      </script>
    </template>
