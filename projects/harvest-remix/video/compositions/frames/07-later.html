          seg(0, MATH - 0.05, "sine.inOut", { x: -14, z: 1, focus: 0.35 }, { x: 26, z: 1.045 });
          seg(MATH - 0.05, 0.05, "power3.in", { z: 1.045, rot: 0, focus: 0.35 }, { z: 1.085, rot: -0.45, focus: 0.15 });
          seg(MATH, 0.65, "elastic.out(1, 0.45)", { z: 1.085, rot: -0.45 }, { z: 1.06, rot: 0 });
          seg(MATH + 0.65, CARD - MATH - 0.65, "sine.inOut", { z: 1.06, x: 26, focus: 0.15 }, { z: 1.07, x: 12, focus: 0.3 });
          seg(CARD, G2 - CARD, "power2.in", { z: 1.07, x: 12 }, { z: 1.095, x: 34 });
          seg(G2, 0.001, "none", { z: 1.095, x: 34, y: 0, rot: 0, focus: 0.3 }, { z: 1.0, x: 0, y: 0, rot: 0, focus: 0.5 });
          seg(G2 + 0.001, LOCK - G2 - 0.001, "power2.in", { z: 1.0 }, { z: 1.065 });
          seg(LOCK, DUR - LOCK, "power3.in", { z: 1.065 }, { z: 1.11 });
          nudge(MATH, { y: 4 }, 0.3);
          nudge(CARD, { y: 4, z: 0.008 }, 0.3);
          nudge(STAMP, { y: 7, z: 0.018, rot: 0.35 }, 0.32);
          K.slice(0, 17).forEach((k, i) => {
            const s = i % 2 ? -1 : 1, a = Math.min(1, i / 14);
            nudge(k, { x: s * (7 + 9 * a), rot: s * (0.25 + 0.3 * a), z: 0.014 + 0.012 * a }, Math.min(0.2, K[i + 1] - k));
          });
          nudge(LOCK, { z: 0.05, rot: -0.6, y: 6 }, 0.28);
          tl.fromTo("#f07-wall", { x: 0 }, { x: -130, duration: G2, ease: "none" }, 0);
          tl.fromTo("#f07-near", { x: 0 }, { x: -260, duration: DUR, ease: "none" }, 0);

          // ---- lyrics -----------------------------------------------------------------------------------------
          // the carried tail of L13 is on screen at the cut; its last "true" is still rising
          const lastTrue = l13[3].s, ltG = lastTrue._hrG = HR.glyphs(lastTrue);
          lastTrue.classList.add("hr-clip");
          tl.fromTo(ltG, { yPercent: 45, opacity: 0.55, filter: "blur(3px)" }, { yPercent: 0, opacity: 1, filter: "blur(0px)", duration: 0.24, ease: "expo.out", stagger: 0.012 }, 0);
          l13.slice(0, 3).forEach((w) => HR.glyphs(w.s));
          HR.exit(tl, $("f07-l13"), L(76.46) - 0.26);
          tl.set("#f07-l13", { opacity: 0 }, L(76.46));
          for (const w of l14.concat(l15)) w.hero ? HR.hero(tl, w.s, w.t, { spread: w.s.textContent === "math" ? 46 : 18, over: 1.28, sharp: true }) : HR.lead(tl, w.s, w.t);
          HR.exit(tl, $("f07-l14"), L(79.84) - 0.26);
          tl.set("#f07-l14", { opacity: 0 }, L(79.84));
          tl.fromTo("#f07-l14", { scale: 1 }, { scale: 1.035, duration: L(79.84) - L(76.46), ease: "none" }, L(76.46));
          tl.fromTo("#f07-l15", { scale: 1 }, { scale: 1.03, duration: G2 - L(79.84), ease: "none" }, L(79.84));

          // ---- g1: the lattice packs in a wave, wired with light ------------------------------------------------
          const SNAP = 0.2;
          for (const p of nodes) {
            tl.fromTo(p.n, { x: p.ax, y: p.ay, scale: p.z, opacity: 0.38, filter: `blur(${(Math.abs(p.z - 1) * 3.2).toFixed(1)}px)` },
              { x: p.bx, y: p.by, scale: 1 + (p.z - 1) * 0.5, duration: p.land - SNAP - L(76.46), ease: "sine.inOut" }, L(76.46));
            tl.fromTo(p.n, { x: p.bx, y: p.by, scale: 1 + (p.z - 1) * 0.5 },
              { x: 0, y: 0, scale: 1, opacity: p.op, filter: `blur(${p.blur}px)`, duration: SNAP, ease: "power3.in", immediateRender: false }, p.land - SNAP);
            tl.fromTo(p.halo, { opacity: 1, scale: 1.7 }, { opacity: 0.22, scale: 1, duration: 0.4, ease: "power2.out", immediateRender: false }, p.land);
            tl.fromTo(p.core, { scale: 1.8 }, { scale: 1, duration: 0.3, ease: "elastic.out(1, 0.5)", immediateRender: false }, p.land);
          }
          for (const { els, len, at } of lines) {
            tl.fromTo(els, { attr: { "stroke-dashoffset": len } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.18, ease: "power2.out", immediateRender: false }, at - 0.18);
          }
          facets.forEach(({face,k}) => tl.fromTo(face, {opacity:0,y:-36-k*24},
            {opacity:1,y:0,duration:0.65,ease:"power2.out",immediateRender:false}, L(76.46)+k*0.34));
          // the lit path: it draws node by node from the origin and each route point catches fire as the light reaches it
          tl.fromTo([route, rglow], {attr:{"stroke-dashoffset":routeLen}},
            {attr:{"stroke-dashoffset":0},duration:MATH-0.06-RSTART,ease:"none",immediateRender:false}, RSTART);
          for (const p of nodes) if (p.lit != null) {
            tl.fromTo(p.core, { backgroundColor: "#F0ECE5" }, { backgroundColor: "#E85D26", duration: 0.08, ease: "none", immediateRender: false }, p.lit);
            tl.fromTo(p.halo, { opacity: 1, scale: 1.9 }, { opacity: 0.3, scale: 1, duration: 0.35, ease: "power2.out", immediateRender: false }, p.lit);
          }
          // on "math": the route flares, a spark runs it twice, the end point reads LOCKED, the basis vectors are named
          tl.fromTo(rglow, { opacity: 1 }, { opacity: 0.5, duration: 0.8, ease: "power2.out", immediateRender: false }, MATH);
          tl.fromTo(spark, { attr: { "stroke-dashoffset": 70 } }, { attr: { "stroke-dashoffset": -routeLen - 10 }, duration: 0.5, ease: "power2.in", immediateRender: false }, MATH);
          tl.fromTo(spark, { attr: { "stroke-dashoffset": 70 } }, { attr: { "stroke-dashoffset": -routeLen - 10 }, duration: 0.5, ease: "power2.in", immediateRender: false }, MATH + 0.55);
          tl.fromTo(lockt, { opacity: 0, scale: 1.6, x: -10 }, { opacity: 1, scale: 1, x: 0, duration: 0.18, ease: "back.out(2)", immediateRender: false }, MATH);
          tl.fromTo(blabs, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out", stagger: 0.05, immediateRender: false }, MATH);
          // the lock on "math": the basis vectors light, a light front runs out from the origin, a ring expands
          basis.forEach(({ e, len }) => tl.fromTo(e, { attr: { "stroke-dashoffset": len } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.1, ease: "power3.in", immediateRender: false }, MATH - 0.1));
          for (const p of nodes) {
            const at = MATH + p.d * 0.00045;
            tl.fromTo(p.halo, { opacity: 0.55, scale: 1.25 }, { opacity: 0.12, scale: 1, duration: 0.55, ease: "power2.out", immediateRender: false }, at);
            tl.fromTo(p.core, { scale: 1.35 }, { scale: 1, duration: 0.45, ease: "elastic.out(1, 0.45)", immediateRender: false }, at);
          }
          tl.fromTo("#f07-lcrisp", { opacity: 0.55 }, { opacity: 1, duration: 0.06, ease: "power2.out", immediateRender: false }, MATH);
          tl.fromTo("#f07-lcrisp", { opacity: 1 }, { opacity: 0.72, duration: 0.7, ease: "power2.out", immediateRender: false }, MATH + 0.06);
          tl.fromTo("#f07-lglow", { opacity: 0.45 }, { opacity: 1, duration: 0.06, ease: "power2.out", immediateRender: false }, MATH);
          tl.fromTo("#f07-lglow", { opacity: 1 }, { opacity: 0.6, duration: 0.8, ease: "power2.out", immediateRender: false }, MATH + 0.06);
          const flare = { o: 1 };
          tl.fromTo(flare, { o: 1.9 }, { o: 1, duration: 0.9, ease: "power2.out", immediateRender: false }, MATH);
          tl.fromTo("#f07-file", { scale: 1.05 }, { scale: 1, duration: 0.5, ease: "elastic.out(1, 0.5)", immediateRender: false }, MATH);
          tl.fromTo("#f07-file", { rotation: 0, x: 0 }, { rotation: -1.2, x: -14, duration: CARD - MATH - 0.5, ease: "sine.inOut", immediateRender: false }, MATH + 0.5);

          // ---- g1: filed. The paper card rises under it on "you'd" and the lattice prints onto it; it shrinks on
          // "get"; LATER is stamped on "around"; it is shoved aside on "to" ---------------------------------------
          tl.set("#f07-card", { opacity: 1 }, CARD - 0.2);
          tl.fromTo("#f07-card", { y: 760, rotation: 5, filter: "blur(6px)" }, { y: 0, rotation: 0, filter: "blur(0px)", duration: 0.24, ease: "power3.out" }, CARD - 0.2);
          tl.set("#f07-file", { className: "f07-printed" }, CARD);
          tl.fromTo("#f07-file", { y: 0 }, { y: 6, duration: 0.05, ease: "power2.out", immediateRender: false }, CARD + 0.04);
          tl.fromTo("#f07-file", { y: 6 }, { y: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, CARD + 0.09);
          tl.fromTo("#f07-filepos", { x: 0, y: 0, scale: 1, rotation: 0 }, { x: 10, y: 70, scale: 0.74, rotation: -4, duration: STAMP - 0.14 - L(80.54), ease: "power3.inOut", immediateRender: false }, L(80.54));
          tl.fromTo("#f07-stamp", { opacity: 0, scale: 2.3, rotation: -15, filter: "blur(10px)" }, { opacity: 1, scale: 1, rotation: -8, filter: "blur(0px)", duration: 0.12, ease: "power4.in" }, STAMP - 0.12);
          tl.fromTo("#f07-stamp", { scaleX: 1, scaleY: 1 }, { scaleX: 1.07, scaleY: 0.9, duration: 0.05, ease: "power2.out", immediateRender: false }, STAMP);
          tl.fromTo("#f07-stamp", { scaleX: 1.07, scaleY: 0.9 }, { scaleX: 1, scaleY: 1, duration: 0.4, ease: "elastic.out(1, 0.4)", immediateRender: false }, STAMP + 0.05);
          const dr = HR.rng(7170);
          for (let i = 0; i < 9; i++) {
            // outside the stamp's mask box, on the card: 352/540 is the stamp's corner, 460 x 184 its size
            const d = el("span", "f07-dot", $("f07-file")), side = dr() < 0.5 ? -1 : 1, sz = 3 + dr() * dr() * 15;
            Object.assign(d.style, { width: sz + "px", height: sz + "px", left: (352 + (side < 0 ? -8 - dr() * 18 : 466 + dr() * 18)).toFixed(0) + "px", top: (540 + 184 * (0.15 + dr() * 0.7)).toFixed(0) + "px" });
            const dx = side * (10 + dr() * 34), dy = (dr() - 0.5) * 30;
            tl.fromTo(d, { opacity: 0, x: -dx * 0.6, y: 0, scale: 0.3 }, { opacity: 0.9, x: 0, y: dy * 0.3, scale: 1, duration: 0.09, ease: "power3.out", immediateRender: false }, STAMP);
            tl.to(d, { x: dx * 0.25, y: dy * 0.4, duration: 0.5, ease: "power2.out" }, STAMP + 0.09);
          }
          tl.fromTo("#f07-file", { y: 0, rotation: -1.2 }, { y: 12, rotation: -2.2, duration: 0.05, ease: "power2.out", immediateRender: false }, STAMP);
          tl.fromTo("#f07-file", { y: 12, rotation: -2.2 }, { y: 0, rotation: -1.2, duration: 0.4, ease: "power3.out", immediateRender: false }, STAMP + 0.05);
          tl.fromTo("#f07-filepos", { x: 10, rotation: -4, filter: "blur(0px)" }, { x: 1150, rotation: 9, filter: "blur(9px)", duration: 0.3, ease: "power3.in", immediateRender: false }, SHOVE - 0.04);
          tl.set("#f07-mid", { opacity: 0 }, G2);

          tl.set("#f07-l15", { opacity: 0 }, G2);
          tl.set("#f07-spec", { opacity: 0 }, G2);
          // g2 cuts to the cream register on the first kick: the dark world goes, the board comes up
          tl.set("#f07-bg, #f07-near", { opacity: 0 }, G2);
          tl.set("#f07-g2bg, #f07-board, #f07-ml", { opacity: 1 }, G2);
          // the drag: on every kick the ticket is lifted and dropped one column on (landing ON the kick), then the
          // board glides left to bring it back, so the backlog streams past without end
          const colX = (c) => c * COLW + 20, trkX = (c) => -(c - REST) * COLW;
          gsap.set(task, { x: colX(START + 1) - 20 }); gsap.set("#f07-trk", { x: trkX(START + 1) });
          K.slice(1, 18).forEach((at, i) => {
            const k = i + 1, c = START + 1 + k, gap = (K[k + 1] ?? DUR) - at, pre = Math.min(0.07, (at - K[k - 1]) * 0.45);
            tl.fromTo(task, { x: colX(c - 1) - 20, rotation: 0, y: 0 }, { x: colX(c) - 20, rotation: 2.5, y: -10, duration: pre, ease: "power3.in", immediateRender: false }, at - pre);
            tl.fromTo(task, { rotation: 2.5, y: -10, scaleX: 1.05, scaleY: 0.9 }, { rotation: 0, y: 0, scaleX: 1, scaleY: 1, duration: Math.min(0.24, gap - 0.075), ease: "elastic.out(1, 0.5)", immediateRender: false }, at);
            tl.fromTo("#f07-trk", { x: trkX(c - 1) }, { x: trkX(c), duration: gap * 0.85, ease: "power2.inOut", immediateRender: false }, at);
          });
          tl.fromTo(task, { scaleX: 1.05, scaleY: 0.9 }, { scaleX: 1, scaleY: 1, duration: 0.2, ease: "elastic.out(1, 0.5)", immediateRender: false }, G2);
          tl.set("#f07-roll-lyric", { opacity: 1 }, G2);

          // ---- g2: the excuse roll, one word per kick: the column the ticket was just dropped in ---------------------
          // every excuse is dragged in from the left, the way the ticket goes; alternate kicks lean the other way
          const ENTER = [
            (e, at, d) => tl.fromTo(e, { x: -140, skewX: 12 }, { x: 0, skewX: 0, duration: d, ease: "expo.out", immediateRender: false }, at),
            (e, at, d) => tl.fromTo(e, { x: -90, scale: 1.12, rotation: -1.5 }, { x: 0, scale: 1, rotation: 0, duration: d, ease: "power4.out", immediateRender: false }, at),
          ];
          excuses.forEach((e, k) => {
            const at = K[k], gap = K[k + 1] - at, d = Math.min(0.17, gap * 0.75);
            ENTER[k % ENTER.length](e, at, d);
            // motion blur on the flip only: two frames at 60 fps, a non-overshooting ease, crisp once landed
            tl.fromTo(e, { filter: "blur(8px)" }, { filter: "blur(0px)", duration: 0.034, ease: "power1.out", immediateRender: false }, at);
            tl.fromTo(e, { scale: 1 }, { scale: 1.035, duration: gap - d, ease: "none", immediateRender: false }, at + d); // it keeps coming
          });
          // the lock: "later." slams ON the last kick before the chorus, glyphs settle in a wave, the extrusion grows
          tl.fromTo(fin, { scale: 1.2 }, { scale: 1, duration: 0.1, ease: "power4.out", immediateRender: false }, LOCK);
          tl.fromTo(fin, { filter: "blur(8px)" }, { filter: "blur(0px)", duration: 0.034, ease: "power1.out", immediateRender: false }, LOCK);
          finG.forEach((g, i) => {
            tl.fromTo(g, { y: -28 - i * 4 }, { y: 0, duration: 0.42, ease: "elastic.out(1, 0.45)", immediateRender: false }, LOCK + i * 0.014);
          });
          tl.fromTo(fin, { "--d": 0 }, { "--d": 1, duration: 0.18, ease: "power3.out", immediateRender: false }, LOCK + 0.02);
          const SURE = K[8]; // the archive's one note on this board, written beside the count
          K.slice(0, 18).forEach((k) => tl.fromTo("#f07-num", { scale: 1.22 }, { scale: 1, duration: 0.14, ease: "power3.out", immediateRender: false }, k));
          LANDS.forEach((t) => tl.fromTo("#f07-num", { scale: 1.2 }, { scale: 1, duration: 0.2, ease: "power3.out", immediateRender: false }, t));

          // ---- per-frame draw -------------------------------------------------------------------------------
          const root = $("root"), num = $("f07-num"), kickEl = $("f07-kick"), clabel = $("f07-clabel"), wallbox = $("f07-wallbox");
          const light = $("f07-light"), sure = $("f07-sure"), cntLabel = $("f07-clabel");
          const clamp01 = (x) => Math.max(0, Math.min(1, x));
          let wasG2 = null;
          const mathRow = l14.find((w) => w.hero).s, aroundW = l15.find((w) => w.hero).s;
          function render() {
            const t = tl.time(), T = t + T0;
            cam.x = A.x + N.x; cam.y = A.y + N.y; cam.z = A.z + N.z; cam.rot = A.rot + N.rot; cam.focus = A.focus;
            stage.apply(T);
            HR.draw(tl);
            const rms = HR.band("rms", T), kick = HR.hit("kick", T, 0.14), hat = HR.hit("hat", T, 0.07);
            let k = -1;
            for (let i = 0; i < K.length; i++) if (t >= K[i] - 1e-6) k = i;
            const g2 = k >= 0;
            if (wasG2 !== g2) {
              wasG2 = g2;
              // chrome on cream is ink (10-ticket); inline, since #id rules under a toggled class never match
              kickEl.style.color = g2 ? "#111111" : ""; num.style.color = g2 ? "#111111" : ""; cntLabel.style.color = g2 ? "#111111" : "";
              kickEl.style.fontWeight = g2 ? "600" : "";
            }

            // light behind the lattice in g1, flaring on the lock
            light.style.opacity = g2 ? "0" : ((0.55 + 0.9 * rms + 0.3 * kick) * flare.o).toFixed(3);
            if (g2) wallbox.style.transform = "none";

            // glow: "math" and "around" on dark, the fire excuses, the basis; settled nodes twinkle on hats
            HR.glow(mathRow, T, 0.4, 0.8);
            HR.glow(aroundW, T, 0.4, 0.8);
            HR.glow($("f07-basis"), T, 0.5, 0.6);
            if (t >= MATH && t < CARD) for (const p of nodes) p.core.style.opacity = p.flick ? (1 - 0.7 * hat).toFixed(2) : "1";

            // the roll: only the current excuse is on screen; the lock holds into the cut
            const kk = Math.min(k, 17), cur = g2 ? START + 1 + kk : -1, since = g2 ? t - K[kk] : 0;
            cols.forEach(({ c, u, slot }, i) => {
              c.classList.toggle("f07-on", i === cur);
              u.style.transform = `scaleX(${i === cur ? clamp01(since / 0.08).toFixed(3) : 0})`;
              slot.style.opacity = i === cur - 1 && kk > 0 ? Math.max(0, 1 - since / 0.45).toFixed(3) : "0";
            });
            excuses.forEach((e, i) => { e.style.visibility = g2 && i === k ? "visible" : "hidden"; });
            fin.style.visibility = k >= 17 ? "visible" : "hidden";
            sure.style.clipPath = `inset(-30% ${(100 - 100 * clamp01((t - SURE) / 0.28)).toFixed(1)}% -40% -5%)`;
            kickEl.textContent = g2 ? "SEC-0001 · SPRINT BOARD" : "THE NEW MATH";
            clabel.textContent = g2 ? "RESCHEDULED" : "OBJ";
            num.textContent = g2 ? "×" + String(kk + 1).padStart(2, "0") : "0002";
          }
          tl.eventCallback("onUpdate", render);
          tl.seek(0);
          render();
          window.__timelines["07-later"] = tl;
        })();
      </script>
    </template>
