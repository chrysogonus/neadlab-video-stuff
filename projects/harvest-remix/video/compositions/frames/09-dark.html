            // the figure's caption types in once the camera is wide enough to clear the axis labels (bar 3)
            kicker.style.clipPath = `inset(-10px ${(100 - 100 * Math.floor(44 * clamp01((t - D2 - 0.2) / 0.9)) / 44).toFixed(2)}% -10px -10px)`;
            xsub.style.clipPath = `inset(-10px ${(100 - 100 * Math.floor(46 * clamp01((t - 0.35) / 1.2)) / 46).toFixed(2)}% -10px -10px)`;
            tinted(xb, 160, 1050, "#F0ECE5", "#EE9A76");
            tinted(yb, 1210, 420, "#2A2A27", "#6E3018");
            zg.style.transform = `translateX(${X(S.zx).toFixed(1)}px)`;
            zl.style.transform = `translateX(${X(S.zx).toFixed(1)}px)`;
            flight(t);
            const clip = `inset(0 ${(100 * (1 - S.fire)).toFixed(2)}% 0 0)`;
            win.style.clipPath = clip; band.style.clipPath = clip;
            heat.style.opacity = (S.heat * (0.7 + 0.5 * HR.band("bass", T))).toFixed(3);
            HR.glow(band, T, 0.3 + 0.5 * HR.hit("hat", T, 0.2), 0.6); HR.glow(zdot, T);
            for (const [k, g] of glyphs) g.style.clipPath = `inset(-30% ${(180 * (1 - S[k]) - 40).toFixed(2)}% -30% -40%)`;
            // the axis: years behind the front lit cream, the year at the front brightest, all lifted on each kick
            const F = frontAt(t), kick = HR.hit("kick", T, 0.22);
            for (const k of ticks) {
              const lit = clamp01(F - k.yr + 1), head = clamp01(1 - Math.abs(F - k.yr) / 2.5);
              const c = mix(k.major ? CREAMC : GREY, CREAMC, lit);
              k.l.setAttribute("stroke", `rgb(${c})`);
              k.l.setAttribute("stroke-opacity", (k.major ? 0.8 + 0.2 * lit : 0.7 + 0.3 * lit).toFixed(3));
              k.l.setAttribute("y2", (900 + (k.major ? 18 : 9) + lit * (k.major ? 4 : 5) + head * (6 + 8 * kick)).toFixed(1));
              k.l.setAttribute("stroke-width", ((k.major ? 2 : 1.2) + lit * 0.6 + head * 1.4).toFixed(2));
              if (k.lab) k.lab.setAttribute("fill", `rgb(${mix(GREY, CREAMC, clamp01(lit * (0.75 + 0.25 * kick) + head * 0.25))})`);
            }
            for (const s of strokes) s.p.setAttribute("stroke-dashoffset", (100 * (1 - smooth(clamp01((t - s.t) / s.dur)))).toFixed(1));
            for (const { g, t: t0, d } of pen) {   // a glyph is written left to right; its overhangs show once it is done
              const p = clamp01((t - t0) / d);
              g.style.opacity = p > 0 ? "1" : "0";
              g.style.clipPath = p >= 1 ? "none" : `inset(-45% ${(130 - 160 * smooth(p)).toFixed(1)}% -50% -30%)`;
            }
          }
          tl.eventCallback("onUpdate", render);
          tl.seek(0);
          render();
          window.__timelines["09-dark"] = tl;
        })();
      </script>
    </template>
