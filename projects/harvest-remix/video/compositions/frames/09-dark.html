          seg(S, { fire: 0 }, { fire: 1 }, D2 + 0.02, D2 + 0.42, "expo.out");
          seg(S, { heat: 0 }, { heat: 1 }, D2, D2 + 0.5, "power2.out");
          for (const t of [K4, K5]) { seg("#f09-band", { scaleY: 1 }, { scaleY: 0.88 }, t - 0.02, t + 0.03, "power2.out"); seg("#f09-band", { scaleY: 0.88 }, { scaleY: 1 }, t + 0.03, t + 0.4, "elastic.out(1, 0.4)"); }

          // the hand-off: a cream sheet slides over from the right, accelerating into 10's cut
          seg(S, { wipe: 0 }, { wipe: 1 }, WIPE, DUR, "power3.in");

          // ---- the camera ----------------------------------------------------------------------------------------
          const stage = HR.stage($("root"), { seed: 9 });
          const cam = stage.cam; cam.focus = 0.75;
          const B = { x: 36, z: 1.0 }, P = { z: 0, rot: 0 };
          const punches = [[0, 0.03, -0.3], [PLUS, 0.012, 0.2], [Y, 0.015, -0.2], [D1, 0.03, 0.35], [D2, 0.05, -0.5], [K4, 0.012, 0.2], [K5, 0.02, -0.25]];
          punches.forEach(([t, z, rot], i) => {
            const next = i + 1 < punches.length ? punches[i + 1][0] : DUR;
            tl.fromTo(P, { z: 0, rot: 0 }, { z, rot, duration: 0.05, ease: "power3.out", immediateRender: false }, t);
            tl.fromTo(P, { z, rot }, { z: 0, rot: 0, duration: Math.min(0.5, next - t - 0.07), ease: "elastic.out(1, 0.5)", immediateRender: false }, t + 0.05);
          });
          seg(B, { x: 36, z: 1.0 }, { x: -16, z: 1.035 }, 0, D2, "sine.inOut");
          seg(B, { x: -16, z: 1.035 }, { x: 24, z: 1.06 }, D2, DUR, "sine.inOut");

          // ---- per frame ---------------------------------------------------------------------------------------------
          const xb = $("f09-xb"), yb = $("f09-yb"), zg = $("f09-z"), win = $("f09-win"), tint = $("f09-tint"), band = $("f09-band");
          const heat = $("f09-heat"), wipe = $("f09-wipe"), zdot = $("f09-zdot"), fx = $("f09-fx");
          function render() {
            const t = tl.time(), T = t + T0;
            cam.x = B.x; cam.z = B.z + P.z; cam.rot = P.rot;
            stage.apply(T);
            xb.style.transform = `scaleY(${S.sq.toFixed(4)})`; xb.style.clipPath = `inset(-20px ${(100 * (1 - S.xb)).toFixed(2)}% -20px 0)`;
            yb.style.transform = `scaleY(${S.sq.toFixed(4)})`; yb.style.clipPath = `inset(-20px ${(100 * (1 - S.yb)).toFixed(2)}% -20px 0)`;
            zg.style.transform = `translate(${X(S.zx).toFixed(1)}px, ${S.zy.toFixed(1)}px)`;
            const clip = `inset(0 ${(100 * (1 - S.fire)).toFixed(2)}% 0 0)`;
            win.style.clipPath = clip; tint.style.clipPath = clip; band.style.clipPath = clip;
            heat.style.opacity = (S.heat * (0.7 + 0.5 * HR.band("bass", T))).toFixed(3);
            HR.glow(band, T, 0.3, 0.6); HR.glow(zdot, T);
            band.style.translate = `${(HR.hit("snare", T, 0.08) * 1.5).toFixed(2)}px 0`;
            fx.style.translate = `0 ${(-HR.hit("snare", T, 0.08) * 2).toFixed(2)}px`;
            wipe.style.transform = `translateX(${(1940 * (1 - S.wipe)).toFixed(1)}px)`;
            for (const s of strokes) s.p.setAttribute("stroke-dashoffset", (100 * (1 - clamp01((t - s.t) / s.dur))).toFixed(1));
            for (const [m, t0, d] of writes) m.style.clipPath = `inset(-30% ${(100 - 100 * clamp01((t - t0) / d)).toFixed(1)}% -40% -5%)`;
          }
          tl.eventCallback("onUpdate", render);
          tl.seek(0);
          render();
          window.__timelines["09-dark"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
