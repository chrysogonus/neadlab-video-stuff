          const stamp = (id, t, rot) => {
            tl.fromTo("#" + id, { opacity: 0, scale: 1.7, rotation: rot, filter: "blur(9px)" },
              { opacity: 0.8, scale: 1, rotation: 0, filter: "blur(0px)", duration: 0.12, ease: "power4.in" }, t - 0.12);
            tl.fromTo("#" + id, { scale: 1 }, { scale: 1.03, duration: 0.04, ease: "power2.out", immediateRender: false }, t);
            tl.fromTo("#" + id, { scale: 1.03 }, { scale: 1, duration: 0.35, ease: "elastic.out(1, 0.5)", immediateRender: false }, t + 0.04);
          };
          stamp("f18-round", ROUND, -10);
          stamp("f18-copy", COPY, 8);
          // v20: the slam is mechanical: ink flecks off the stamp's rim, the sheet recoils under it (≤ 6 px, 11 Hz)
          WOW.burst(tl, $("f18-mid"), { x: 1600, y: 780, t: ROUND, n: 18, speed: 620, size: [3, 9], gravity: 900, dur: 0.6, cream: 0.15, seed: 1861 });
          WOW.burst(tl, $("f18-mid"), { x: 350, y: 856, t: COPY, n: 12, speed: 520, size: [3, 8], gravity: 900, dur: 0.55, cream: 0.15, seed: 1862 });
          WOW.shake(tl, $("f18-form"), ROUND, { amp: 6, dur: 0.32, rot: 0.15, seed: 18 });
          WOW.shake(tl, $("f18-form"), COPY, { amp: 5, dur: 0.3, rot: 0.12, seed: 19 });
          WOW.punch(tl, $("f18-type"), ROUND, { s: 1.025, dur: 0.35 });

          // the record folds into the envelope: from the downbeat stamp to "decrypt" the sheet's print fades and the folds draw
          // v20: the folds snap in on the 46.662 downbeat, the flap draws down and closes on the 47.133 kick
          const FOLD = W.decrypt - DOWN;
          tl.fromTo("#f18-forminner", { opacity: 0.1 }, { opacity: 0, duration: FOLD, ease: "sine.inOut", immediateRender: false }, DOWN);
          tl.fromTo(eg, { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power2.out", immediateRender: false }, DOWN);
          tl.fromTo(folds, { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.3, ease: "power3.out", immediateRender: false }, DOWN);
          tl.fromTo(flap, { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: COPY - DOWN, ease: "power2.in", immediateRender: false }, DOWN);
          tl.fromTo(flapFill, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, COPY);
          tl.to(".f18-stamp", { opacity: 0.55, duration: 0.3, ease: "power2.out" }, W.decrypt);
          // the seal presses onto the flap's point on "later": the hero accent (chorus), a ring and a few rays from the seal
          tl.fromTo("#f18-seal", { opacity: 0, scale: 1.7 }, { opacity: 1, scale: 1, duration: 0.12, ease: "power4.in", immediateRender: false }, W.later - 0.12);
          tl.fromTo("#f18-seal", { scale: 1 }, { scale: 1.06, duration: 0.05, ease: "power2.out", immediateRender: false }, W.later);
          tl.fromTo("#f18-seal", { scale: 1.06 }, { scale: 1, duration: 0.4, ease: "elastic.out(1, 0.5)", immediateRender: false }, W.later + 0.05);
          WOW.shock(tl, $("f18-sealpos"), { x: 0, y: 0, t: W.later, r: 1100, n: 2, w: 6, color: "fire", dur: 0.6 });
          WOW.rays(tl, $("f18-sealpos"), { x: 0, y: 0, t: W.later, n: 16, r0: 120, r1: 900, seed: 18, color: "cream", dur: 0.45 });
          WOW.punch(tl, $("f18-type"), W.later, { s: 1.04, dur: 0.4 });

          // ---- the camera: one continuous push (a pure function of time), then the dive into the seal ----------------
          const stage = HR.stage($("root"), { seed: 18, drift: 1 });
          const cam = stage.cam;
          cam.focus = 1;
          const DIVE = 2.62; // after "later" has held for 0.1 s; quadratic start, so the speed never jumps
          // v20: on top of the slow push, the camera steps on each hit (smoothstep over 0.4 s: no jolts), alternating sides
          const STEPS = [[HAT1, 0.012, -40, -0.5], [ROUND, 0.016, 52, 0.7], [HAT2, 0.012, -46, -0.6], [DOWN, 0.016, 44, 0.6], [COPY, 0.016, -50, -0.7], [W.decrypt, 0.01, 30, 0.3]];
          const sm = (u) => { u = Math.max(0, Math.min(1, u)); return u * u * (3 - 2 * u); };
          const camAt = (t) => {
            const u = Math.max(0, (t - DIVE) / (DUR - DIVE));
            let dz = 0, dx = 0, dr = 0;
            for (const [a, z, x, r] of STEPS) { const k = sm((t - a) / 0.4); dz += z * k; dx += x * k; dr += r * k; }
            const keep = 1 - u * u;   // the steps hand over to the dive, so the frame's last instant is v19's
            cam.rot = dr * keep;
            cam.z = 1 + 0.075 * (t / DUR) + dz * keep + 0.45 * u * u;
            cam.y = (cam.z - 1) * (TIP.y - 540); // keeps the seal fixed in frame while the camera closes on it
            cam.x = 24 - 48 * (t / DUR) + dx * keep;
          };
          tl.fromTo("#f18-near", { x: 0 }, { x: -240, duration: DUR, ease: "none" }, 0);
          const host = document.getElementById("el-18-hook");
          // the pullOut in pivots on the line (so "harvest" stays in frame), the dive out on the seal; the host is
          // unscaled between the two switches, so the pivot changes invisibly at mid-frame
          const pivot = (t) => { host.style.transformOrigin = t < DUR / 2 ? "50% 22%" : `${(TIP.x / 19.2).toFixed(1)}% ${(TIP.y / 10.8).toFixed(1)}%`; };
          WOW.transition(tl, host, { in: "pullOut", out: "pushIn", dur: 0.46, total: DUR });

          // ---- per frame -----------------------------------------------------------------------------------------
          const h18 = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };
          const lightEl = $("f18-light"), held = $("f18-held");
          const heldTxt = (t) => {
            const n = LOCKS.filter((a) => t >= a).length;
            if (t >= W.later) return "HELD <b>3/3</b> BLOCKS · KEY: <b>LATER</b>";
            if (t >= W.decrypt) return "HELD <b>3/3</b> BLOCKS · KEY: <b>NOT YET</b>";
            return n ? `HELD <b>${n}/3</b> BLOCKS · READ: <b>0 B</b>` : "CIPHERTEXT · 2,048 B · READ: <b>0 B</b>";
          };
          function render() {
            const t = tl.time(), T = T0 + t;
            camAt(t); pivot(t);
            stage.apply(T);
            WOW.draw(tl); HR.draw(tl);
            HR.glow($("f18-r2"), T, 0.4, 0.9);
            HR.glow($("f18-seal"), T, 0.4, 0.8);
            const rms = HR.band("rms", T);
            lightEl.style.transform = `scale(${(0.94 + 0.12 * rms).toFixed(3)})`;
            // cipher until each letter's slot time; the last instant before the drop, "later" falls back into hex
            const back = Math.max(0, (t - 2.86) / (DUR - 2.86)), hat = HR.hit("hat", T, 0.08);
            const lit = Math.min(1, 0.62 + 0.2 * Math.min(1, t / W.decrypt) + 0.18 * hat); // v17: ≥ 3:1 at its dimmest
            chars.forEach((c, n) => {
              const lg = c.word === "later" && c.i >= 2 && back > 0 && (c.i - 1) / 4 < back;
              const hex = t < c.at || lg;
              c.b.style.opacity = hex ? 0 : 1;
              c.x.style.opacity = hex ? (lg ? 1 : lit).toFixed(3) : 0;
              // v20: an uncaptured glyph flickers; a captured one rolls fast for 0.22 s, then holds its byte in cream
              const dl = t - c.lock, kept = dl >= 0.22 && !lg, roll = dl >= 0 && dl < 0.22 && !lg;
              if (hex) c.x.textContent = kept ? HR.HEX[(h18(n + 3, 91) * 16) | 0]
                : HR.HEX[(h18(n + 7, Math.floor(t * (roll ? 30 : 5 + (n % 3)) + n * 0.37) + (hat > 0.5 ? 1 : 0)) * 16) | 0];
              c.x.style.color = kept || roll ? "#F0ECE5" : "";
              if (kept || roll) c.x.style.opacity = hex ? (roll ? 1 : 0.92) : 0;
              c.x.style.textShadow = roll ? "0 0 18px rgba(240,236,229,0.8)" : "";
            });
            held.innerHTML = heldTxt(t);
          }
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["18-hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
