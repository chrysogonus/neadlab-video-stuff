            if (wi === 0) el("span", "", $("f18-r2"), " ");
            [...key].forEach((ch, i) => {
              const c = el("span", "f18-c", w), b = el("b", "", c, ch), x = el("span", "f18-x", c, "0");
              const adv = { d: 0.57, e: 0.54, c: 0.49, r: 0.38, y: 0.52, p: 0.57, t: 0.37, l: 0.27, a: 0.54 }[ch];
              x.style.transform = `translateX(-50%) scaleX(${Math.max(0.62, Math.min(1, (adv + 0.02) / 0.444))})`;
              b.style.display = "inline-block";
              const grp = key === "later" ? 2 : i < 4 ? 0 : 1;
              chars.push({ b, x, c, at: t - 0.05 + i * each, word: key, i, grp, lock: LOCKS[grp] + (key === "later" ? i : i % 4) * 0.018 });
            });
          });
          $("f18-r2").classList.add("hr-glow");

          // ---- the timeline -----------------------------------------------------------------------------------------------
          const tl = gsap.timeline({ paused: true });
          tl0.forEach((f) => f());
          tl.set({}, {}, DUR);

          // shot 1: "harvest" is on screen from the frame's first instant (the pullOut in), pressed into the sheet on the kick
          const hw = $("f18-harvest");
          tl.fromTo(hw, { scale: 1.06 }, { scale: 1, duration: 0.5, ease: "power2.out" }, 0);
          tl.fromTo(hw, { scaleY: 1, scaleX: 1 }, { scaleY: 0.88, scaleX: 1.04, duration: 0.045, ease: "power2.out", immediateRender: false }, PRESS);
          tl.fromTo(hw, { scaleY: 0.88, scaleX: 1.04 }, { scaleY: 1, scaleX: 1, duration: 0.45, ease: "elastic.out(1, 0.45)", immediateRender: false }, PRESS + 0.045);
          WOW.punch(tl, $("f18-t1"), PRESS, { s: 1.045, dur: 0.35 });
          WOW.burst(tl, $("f18-fx1"), { x: 960, y: 560, t: PRESS, n: 34, speed: 1000, size: [4, 13], gravity: 1000, spread: 160, aim: 90, dur: 0.6, cream: 0.85, color: "cream", seed: 1860 });
          WOW.shake(tl, $("f18-form"), PRESS, { amp: 5, dur: 0.3, rot: 0.12, seed: 17 });
          // the ARCHIVE stamp on the snare: anticipation above, slam, ink flecks off its rim, the sheet recoils
          const stamp = (id, t, rot, pre) => {
            tl.fromTo("#" + id, { opacity: 0, scale: 1.7, rotation: rot, filter: "blur(9px)" },
              { opacity: 0.85, scale: 1, rotation: 0, filter: "blur(0px)", duration: pre, ease: "power4.in", immediateRender: false }, t - pre);
            tl.fromTo("#" + id, { scale: 1 }, { scale: 1.03, duration: 0.04, ease: "power2.out", immediateRender: false }, t);
            tl.fromTo("#" + id, { scale: 1.03 }, { scale: 1, duration: 0.35, ease: "elastic.out(1, 0.5)", immediateRender: false }, t + 0.04);
          };
          stamp("f18-round", ROUND, -10, 0.12);
          WOW.burst(tl, $("f18-fx1"), { x: 1690, y: 860, t: ROUND, n: 18, speed: 620, size: [3, 9], gravity: 900, dur: 0.6, cream: 0.15, seed: 1861 });
          WOW.shake(tl, $("f18-form"), ROUND, { amp: 6, dur: 0.32, rot: 0.15, seed: 18 });
          WOW.punch(tl, $("f18-t1"), ROUND, { s: 1.02, dur: 0.35 });

          // shot 2: "now," is stamped full-width on its time while the centre shutter slams behind it
          const nw = $("f18-now");
          tl.fromTo(nw, { scale: 1.12, filter: "blur(1.5px)" }, { scale: 1, filter: "blur(0px)", duration: 0.07, ease: "power4.in", immediateRender: false }, CUT2 - 0.001);
          tl.fromTo(nw, { scaleY: 1, scaleX: 1 }, { scaleY: 0.93, scaleX: 1.02, duration: 0.05, ease: "power2.out", immediateRender: false }, CUT2 + 0.07);
          tl.fromTo(nw, { scaleY: 0.93, scaleX: 1.02 }, { scaleY: 1, scaleX: 1, duration: 0.45, ease: "elastic.out(1, 0.45)", immediateRender: false }, CUT2 + 0.12);
          // each later shutter knocks the word on its baseline (a recoil, ≤ 8 px)
          [[HAT2, 4, 0.17], [DOWN, 8, 0.3]].forEach(([t, a, back]) => {
            tl.fromTo(nw, { y: 0 }, { y: a, duration: 0.05, ease: "power2.out", immediateRender: false }, t);
            tl.fromTo(nw, { y: a }, { y: 0, duration: back, ease: "power2.out", immediateRender: false }, t + 0.05);
          });

          // shot 3: COPY is struck on the cut (the kick), the row resolves word by word, the seal presses on "later"
          tl.fromTo("#f18-copy", { opacity: 0.85, scale: 1.08, rotation: 4 }, { opacity: 0.85, scale: 1, rotation: 0, duration: 0.3, ease: "elastic.out(1, 0.5)", immediateRender: false }, CUT3);
          WOW.burst(tl, $("f18-fxc"), { x: 350, y: 866, t: CUT3, n: 12, speed: 520, size: [3, 8], gravity: 900, dur: 0.55, cream: 0.15, seed: 1862 });
          for (const c of chars) tl.fromTo(c.b, { scale: c.word === "later" ? 1.1 : 1.28 }, { scale: 1, duration: 0.32, ease: "power3.out", immediateRender: false }, c.at);
          // a captured block jumps up and drops back into its slot (each glyph a hair after the last)
          for (const c of chars) tl.fromTo(c.c, { y: -46, scale: 1.18 }, { y: 0, scale: 1, duration: 0.34, ease: "back.out(2.4)", immediateRender: false }, c.lock);
          // the seal on "later": it drops onto the flap's point, squashes the wax flat and throws it (no ring, no rays)
          tl.fromTo("#f18-seal", { opacity: 0, scale: 1.7 }, { opacity: 1, scale: 1, duration: 0.12, ease: "power4.in", immediateRender: false }, W.later - 0.12);
          tl.fromTo("#f18-seal", { scaleX: 1, scaleY: 1 }, { scaleX: 1.16, scaleY: 0.88, duration: 0.05, ease: "power2.out", immediateRender: false }, W.later);
          tl.fromTo("#f18-seal", { scaleX: 1.16, scaleY: 0.88 }, { scaleX: 1, scaleY: 1, duration: 0.42, ease: "elastic.out(1, 0.45)", immediateRender: false }, W.later + 0.05);
          for (let k = 0; k < 6; k++) {
            const a = -90 + k * 60 + 30, ax = Math.cos((a * Math.PI) / 180), ay = Math.sin((a * Math.PI) / 180);
            WOW.burst(tl, $("f18-fx3"), { x: ax * 100, y: ay * 96, t: W.later + (k % 2) * 0.01, n: 6, speed: 900, size: [4, 13], gravity: 1300, spread: 60, aim: a, dur: 0.8, cream: 0.05, seed: 1880 + k });
          }
          tl.fromTo("#f18-env", { y: 0 }, { y: 7, duration: 0.05, ease: "power2.out", immediateRender: false }, W.later);
          tl.fromTo("#f18-env", { y: 7 }, { y: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, W.later + 0.05);
          WOW.punch(tl, $("f18-r2wrap"), W.later, { s: 1.035, dur: 0.4 });

          // ---- the camera: a push per shot (a pure function of time), steps on the hits, then the dive into the seal ----------
          const stage = HR.stage($("root"), { seed: 18, drift: 1 });
          const cam = stage.cam;
          cam.focus = 1;
          const DIVE = 2.72; // r1: after "later" has held for 0.2 s; quadratic start, so the speed never jumps
          const STEPS = [[ROUND, 0.014, 34, 0.4], [HAT2, 0.012, -30, -0.4], [DOWN, 0.022, 40, 0.5], [W.decrypt, 0.012, -24, -0.3]];
          const camAt = (t) => {
            let dz = 0, dx = 0, dr = 0;
            for (const [a, z, x, r] of STEPS) { const k = sm((t - a) / 0.4); dz += z * k; dx += x * k; dr += r * k; }
            if (t < CUT3) {
              const a = t < CUT2 ? 0 : CUT2, u = t < CUT2 ? t / CUT2 : (t - CUT2) / (CUT3 - CUT2);
              cam.z = 1 + (t < CUT2 ? 0.05 : 0.06) * u + dz;
              cam.x = (t < CUT2 ? 20 - 40 * u : -18 + 36 * u) + dx;
              cam.y = 0; cam.rot = dr;
            } else {
              const u = (t - CUT3) / (DUR - CUT3), d = Math.max(0, (t - DIVE) / (DUR - DIVE)), keep = 1 - d * d;
              cam.z = 1 + 0.075 * u + dz * keep * 0.5 + 0.45 * d * d;
              cam.y = (cam.z - 1) * (TIP.y - 540); // keeps the seal fixed in frame while the camera closes on it
              cam.x = 12 - 36 * u + dx * keep * 0.3;
              cam.rot = dr * keep * 0.5;
            }
          };
          const host = document.getElementById("el-18-hook");
          // the pullOut in pivots on "harvest", the dive out on the seal; the host is unscaled between the two switches
          const pivot = (t) => { host.style.transformOrigin = t < DUR / 2 ? "50% 40%" : `${(TIP.x / 19.2).toFixed(1)}% ${(TIP.y / 10.8).toFixed(1)}%`; };
          WOW.transition(tl, host, { in: "pullOut", out: "pushIn", dur: 0.46, total: DUR });

          // ---- per frame -----------------------------------------------------------------------------------------------
          const h18 = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };
          const held = $("f18-held"), r2w = $("f18-r2wrap");
          const shots = [["f18-b1", "f18-m1", "f18-t1"], ["f18-b2", "f18-t2"], ["f18-b3", "f18-m3"]].map((ids) => ids.map($));
          const heldTxt = (t) => {
            const n = LOCKS.filter((a) => t >= a).length;
            if (t >= W.later) return "HELD <b>3/3</b> BLOCKS · KEY: <b>LATER</b>";
            if (t >= W.decrypt) return "HELD <b>3/3</b> BLOCKS · KEY: <b>NOT YET</b>";
            return n ? `HELD <b>${n}/3</b> BLOCKS · READ: <b>0 B</b>` : "CIPHERTEXT · 2,048 B · READ: <b>0 B</b>";
          };
          function render() {
            const t = tl.time(), T = T0 + t;
            // the shot switches: one clock (this function) for every element of a cut
            const si = t < CUT2 ? 0 : t < CUT3 ? 1 : 2;
            shots.forEach((els, i) => els.forEach((e) => { e.style.opacity = i === si ? "1" : "0"; }));
            r2w.style.transform = si < 2 ? "translateY(392px) scale(0.3)" : "";
            held.style.top = si < 2 ? "1018px" : "968px"; // under the shutters' floor in shot 2, under the envelope in shot 3
            camAt(t); pivot(t);
            stage.apply(T);
            WOW.draw(tl); HR.draw(tl);
            HR.glow($("f18-r2"), T, 0.4, 0.9);
            HR.glow($("f18-seal"), T, 0.4, 0.8);
            // cipher until each letter's slot time; the last instant before the drop, "later" falls back into hex
            const back = Math.max(0, (t - 2.86) / (DUR - 2.86)), hat = HR.hit("hat", T, 0.08);
            const lit = Math.min(1, 0.62 + 0.2 * Math.min(1, t / W.decrypt) + 0.18 * hat);
            chars.forEach((c, n) => {
              const lg = c.word === "later" && c.i >= 2 && back > 0 && (c.i - 1) / 4 < back;
              const hex = t < c.at || lg;
              c.b.style.opacity = hex ? 0 : 1;
              c.x.style.opacity = hex ? (lg ? 1 : lit).toFixed(3) : 0;
              // an uncaptured glyph flickers; a captured one rolls fast for 0.22 s, then holds its byte in cream
              const dl = t - c.lock, kept = dl >= 0.22 && !lg, roll = dl >= 0 && dl < 0.22 && !lg;
              if (hex) c.x.textContent = kept ? HR.HEX[(h18(n + 3, 91) * 16) | 0]
                : HR.HEX[(h18(n + 7, Math.floor(t * (roll ? 30 : 5 + (n % 3)) + n * 0.37) + (hat > 0.5 ? 1 : 0)) * 16) | 0];
              c.x.style.color = kept || roll ? "#F0ECE5" : "";
              if (kept || roll) c.x.style.opacity = hex ? (roll ? 1 : 0.92) : 0;
              c.x.style.textShadow = roll ? "0 0 18px rgba(240,236,229,0.8)" : "";
            });
            held.innerHTML = heldTxt(t);
          }
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["18-hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
