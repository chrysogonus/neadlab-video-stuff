            // shakes dust off the bezel on each kick, render; the glass cracks on "time")
            const D2 = WOW.on(125.288, { kinds: ["down"] });
            WOW.punch(tl, $("f12-clocksvg"), L(D2), { s: 1.025, dur: 0.45 });
            // "time": the years slam to a stop — sparks off the hub, the glass cracks from a point on the upper face and
            // throws glass chips
            WOW.punch(tl, HOST, L(TIME), { s: 1.05, dur: 0.45 });
            WOW.burst(tl, fx, { x: CX, y: CY, t: L(TIME), n: 36, speed: 1300, size: [6, 18], seed: 127, dur: 0.9 });
            crackLines.forEach(({ el, i }) => tl.fromTo(el, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: i < 9 ? 0.07 : 0.1, ease: "expo.out", immediateRender: false }, L(TIME) + (i < 9 ? (i % 3) * 0.008 : 0.04)));
            WOW.burst(tl, fx, { x: CX + CRK[0] * CK, y: CY + CRK[1] * CK, t: L(TIME), n: 18, speed: 700, size: [3, 8], spread: 240, aim: -100, gravity: 1600, cream: 1, color: "cream", dur: 0.8, seed: 1267 });
            // bar 3's downbeat (kick + snare): Archie lands from his startle, "time" loosens, the year drum makes 2025
            const D3 = WOW.on(127.105, { kinds: ["down"] });
            WOW.punch(tl, $("f12-clocksvg"), L(D3), { s: 1.02, dur: 0.4 });
            // v21: the counter's hits are mechanical. The downbeat jump into the billions: the digit wheels slam over in a
            // left-to-right ripple (the carry running through the reel) and the reel throws sparks off its window edges
            const plate = $("f12-plate");
            WOW.punch(tl, HOST, L(JUMP), { s: 1.025, dur: 0.4 });
            cells.forEach((cl, d) => {
              const t0 = L(JUMP) + d * 0.012;
              tl.fromTo(cl, { y: 0 }, { y: 18, duration: 0.04, ease: "power2.in", immediateRender: false }, t0);
              tl.fromTo(cl, { y: 18 }, { y: 0, duration: 0.28, ease: "power3.out", immediateRender: false }, t0 + 0.04);
            });
            [[150, 290, 90], [580, 290, 90], [1010, 290, 90], [1440, 290, 90], [360, 50, -90], [1220, 50, -90]].forEach(([x, y, aim], i) =>
              WOW.burst(tl, plate, { x, y, t: L(JUMP) + i * 0.012, n: 18, speed: 1500, size: [7, 18], aim, spread: 110, gravity: 1500, cream: 0.75, dur: 0.75, seed: 1290 + i }));
            // ...and the wheels run white-hot for a beat as the carry rips through, cooling back to fire
            tl.fromTo(cols, { color: "#FFF4E0" }, { color: "#E85D26", duration: 0.32, ease: "power2.in", immediateRender: false }, L(JUMP));
            // "mine" locks it (the last downbeat lands with it): every wheel slams down at once and the clamps strike sparks
            WOW.punch(tl, HOST, L(MINE), { s: 1.06, dur: 0.5 });
            tl.fromTo(cells, { y: 0, scaleY: 1 }, { y: 26, scaleY: 0.94, duration: 0.05, ease: "power3.in", immediateRender: false }, L(MINE));
            tl.fromTo(cells, { y: 26, scaleY: 0.94 }, { y: 0, scaleY: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, L(MINE) + 0.05);
            [[24, 170, 180, 18], [1808, 170, 0, 18], [300, 290, 90, 12], [900, 290, 90, 12], [1500, 290, 90, 12], [640, 50, -90, 12], [1160, 50, -90, 12]].forEach(([x, y, aim, n], i) =>
              WOW.burst(tl, plate, { x, y, t: L(MINE), n: n + 8, speed: 1800, size: [8, 20], aim, spread: 120, gravity: 1600, cream: 0.8, dur: 0.85, seed: 1300 + i }));
          }

          // g2 — the plate thunks on the torrent's kicks (hardest on the downbeat jump) and, lighter, its snares
          [[JUMP, 2], [129.252, 0.6], [129.605, 1], [130.058, 1], [130.276, 0.6]].forEach(([b, k]) => {
            const tb = WOW.on(b);
            tl.fromTo("#f12-plate", { y: 0 }, { y: 4 * k, duration: 0.05, ease: "power2.out", immediateRender: false }, L(tb));
            tl.fromTo("#f12-plate", { y: 4 * k }, { y: 0, duration: 0.3, ease: "sine.out", immediateRender: false }, L(tb) + 0.05);
          });
          tl.fromTo("#f12-plight", { opacity: 0 }, { opacity: 0.8, duration: 0.4, ease: "power2.out" }, L(G2));
          // "mine" locks it: the brackets clamp on, the plate slams, the digits flash cream, the torrent goes dark
          tl.fromTo(".f12-brk", { opacity: 0, scaleX: 2.6 }, { opacity: 1, scaleX: 1, duration: 0.12, ease: "power4.in" }, L(MINE) - 0.12);
          tl.fromTo("#f12-plate", { scale: 1, y: 0 }, { scale: 1.04, y: 10, duration: 0.05, ease: "power2.out", immediateRender: false }, L(MINE));
          tl.fromTo("#f12-plate", { scale: 1.04, y: 10 }, { scale: 1, y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, L(MINE) + 0.05);
          tl.fromTo(cols, { color: "#F0ECE5" }, { color: "#E85D26", duration: 0.28, ease: "power2.in", immediateRender: false }, L(MINE));
          tl.fromTo("#f12-plight", { opacity: 0.8 }, { opacity: 1.6, duration: 0.05, ease: "power2.out", immediateRender: false }, L(MINE));
          tl.fromTo("#f12-cables", { opacity: 1 }, { opacity: 0.3, duration: 0.14, ease: "power2.out", immediateRender: false }, L(MINE));
          tl.fromTo("#f12-mid", { opacity: 1 }, { opacity: 0.3, duration: 0.12, ease: "power2.out", immediateRender: false }, L(MINE));

          // ---- per-frame draw -------------------------------------------------------------------------------
          // the race: each hand spins at a constant rate, brakes hard over the last 0.24 s and slams to a stop on
          // "time" with one sprung overshoot that settles smoothly (v17: no ringing). The minute hand lands pointing at
          // the hero word.
          const TS = L(TIME), DEC = 0.24, T1 = TS - DEC;
          const racer = (w, final, kick) => {
            const rem = w * DEC / 3, total = w * T1 + rem, a0 = final - total;
            const raw = (t) => t < T1 ? a0 + w * t : t < TS ? a0 + w * T1 + rem * eo3((t - T1) / DEC) : final;
            return {
              at: (t) => raw(t) + (t > TS ? kick * ((t - TS) / 0.07) * Math.exp(1 - (t - TS) / 0.07) : 0),
              prog: (t) => clamp01((raw(t) - a0) / total),
            };
          };
          const rM = racer(760, 260 + 360 * 7, 5), rH = racer(110, 321 + 360, 2), rS = racer(1900, 312 + 360 * 17, 7);
          const sBeats = BEATS.filter((b) => b > TIME && b < G2); // the stopped clock still ticks the beat
          const secAt = (t) => {
            let a = rS.at(t);
            const T = t + T0;
            for (const b of sBeats) a += 12 * eo3((T - b) / 0.12);
            return a;
          };
          const heroes = Object.values(lines).flat().filter((w) => w.big).map((w) => w.r);
          const lightEl = $("f12-light"), plightEl = $("f12-plight"), archEl = $("f12-arch"), orbitEl = $("f12-orbit");
          const stt = $("f12-stt"), stdot = $("f12-stdot"), pad = $("f12-pad"), rateEl = $("f12-rate"), mark = $("f12-mark");
          const rot = (g, a, dx = 0, dy = 0) => g.setAttribute("transform", `translate(${dx} ${dy}) rotate(${a.toFixed(3)})`);
          const ang = (y, x) => Math.atan2(y, x) * 180 / Math.PI;
          // the count: 4 GiB held, an exponential climb, the downbeat jump to 32 GiB, the torrent into the
          // trillions; "mine" slams it to 4 TiB and holds
          const k1 = Math.log(17179869184 / START) / (JUMP - G2), k2 = Math.log(PRE / JV) / (MINE - JUMP);
          const bytesAt = (T) => {
            if (T < G2) return START;
            if (T < JUMP) return START * Math.exp(k1 * (T - G2));
            if (T < MINE) { const base = JV * Math.exp(k2 * (T - JUMP)); return 17179869184 + (base - 17179869184) * eo3((T - JUMP) / 0.12); }
            return FINAL - (FINAL - PRE) * (1 - eo3((T - MINE) / 0.14));
          };
          const rateStr = (r) => r >= 1e12 ? (r / 1e12).toFixed(1) + " TB/S" : r >= 1e9 ? (r / 1e9).toFixed(1) + " GB/S" : r >= 1e6 ? (r / 1e6).toFixed(1) + " MB/S" : (r / 1e3).toFixed(0) + " KB/S";
          let lastDim = -1, lastYrs = "", lastBlur = [];
          // the in-frame push-through (the v17 `pushIn` shape on #root): in over the last beat of g1, out over the first
          // beat of g2; about a point left of centre so the sung "time" and the incoming "every" stay on the canvas
          const rootEl = $("root"), tG = L(G2);
          rootEl.style.transformOrigin = "420px 780px";
          const pushThrough = (t) => {
            const u1 = clamp01((t - (tG - SW)) / SW), u2 = clamp01((t - tG) / SW), e2 = 1 - (1 - u2) * (1 - u2);
            return t < tG ? { s: 1 + 0.2 * u1 * u1, b: 4 * u1 * u1 } : { s: 1.14 - 0.14 * e2, b: 4 * (1 - e2) };
          };
          function render() {
            const t = tl.time(), T = t + T0;
            fgLayer.d = T < G2 ? 0.15 : FG_D;
            const nn = T < G2 ? notchAt(T) : 0, nz = 0.04 * nn, nxx = 0;
            cam.z += nz; cam.x += nxx;
            stage.apply(T);
            cam.z -= nz; cam.x -= nxx;
            HR.draw(tl);
            WOW.draw(tl, 123.479);
            // the host's switches and punches scale about the clock in g1 and about the lyric corner in g2, so "mine"
            // stays on the canvas through its punch and the `glideDown` out (origin y ≥ 520 keeps the glide covering)
            HOST.style.transformOrigin = t < tG ? `${CX}px ${CY}px` : "25% 88%";
            const pt = pushThrough(t);
            rootEl.style.scale = pt.s > 1.0001 ? pt.s.toFixed(4) : "";
            rootEl.style.filter = pt.b > 0.3 ? `blur(${pt.b.toFixed(1)}px)` : "";
            // g1: the racing chronometer
            if (T < G2) {
              const h = rH.at(t), m = rM.at(t), s = secAt(t);
              rot(handH, h); rot(handM, m); rot(handS, s);
              rot(shH, h, 10, 16); rot(shM, m, 14, 22); rot(shS, s, 18, 28);
              ghostM.forEach(({ o, g }, i) => { const a = rM.at(t - (i + 1) * 0.014); g.setAttribute("opacity", (o * clamp01(Math.abs(m - a) / 4)).toFixed(3)); rot(g, a); });
              ghostS.forEach(({ o, g }, i) => { const a = rS.at(t - (i + 1) * 0.008); g.setAttribute("opacity", (o * clamp01(Math.abs(s - a) / 4)).toFixed(3)); rot(g, a); });
              // the elapsed ring closes as the years go by; v20: the YEAR drum clunks over 2021 → 2025, one year per kick
              const pr = rM.prog(t), sw = 360 * pr;
              if (sw < 0.5) arc.setAttribute("d", "");
              else if (sw > 359.5) arc.setAttribute("d", `M0 -551 A551 551 0 1 1 0 551 A551 551 0 1 1 0 -551`);
              else { const [bx, by] = P(sw, 551); arc.setAttribute("d", `M0 -551 A551 551 0 ${sw > 180 ? 1 : 0} 1 ${f1(bx)} ${f1(by)}`); }
              HR.glow(arc, T, 0.2, 0.5); HR.glow(handS, T, 0.15, 0.4);
              const pos = TICKS.reduce((v, tk) => v + eo3((T - tk) / 0.12), 0);
              drums[3].setAttribute("transform", `translate(0 ${(-(1 + pos) * DH).toFixed(2)})`);
              const yrs = "YEARS HELD · " + String(Math.round(pos)).padStart(2, "0");
              // the orbit (the clock turns on its vertical axis), with a clunk on each tick; scratches glint in turn as
              // the light angle passes theirs; dust in the shaft
              const clunk = TICKS.reduce((v, tk) => { const u = T - tk; return v + (u < 0 ? 0 : u < 0.05 ? u / 0.05 : Math.exp(-(u - 0.05) / 0.12)); }, 0);
              orbitEl.style.transform = `perspective(2600px) rotateY(${O.ry.toFixed(3)}deg) rotateX(${O.rx.toFixed(3)}deg) translateY(${(4 * clunk).toFixed(2)}px)`;
              sheen.setAttribute("transform", `rotate(-32) translate(${(-O.ry * 52).toFixed(1)} 0)`);
              for (const sc of scratches) { const g = Math.exp(-Math.pow((O.ry - sc.at) / 1.6, 2)); sc.p.setAttribute("opacity", (0.06 + 0.5 * g).toFixed(3)); }
              drawDust(t, T);
              if (yrs !== lastYrs) { yrsLab.forEach((n) => { n.textContent = yrs; }); lastYrs = yrs; }

              // Archie: leaned back, eyes on the clock (drifting after the hour hand), head cocked, a lazy sway;
              // a contented nod on "waited", a firmer one on "time"
              const hx = AX + 157 * AS, hy = AY + 137 * AS;
              const [tx, ty] = P(h, 320);
              const dx = CX + tx * CK - hx, dy = CY + ty * CK - hy, dd = Math.hypot(dx, dy) || 1;
              archie.s.lookX = dx / dd; archie.s.lookY = 0.8 * dy / dd; archie.s.turn = 0.3 * dx / dd;
              const blow = t - L(TIME) - 0.62;
              wb.setAttribute("transform", blow < 0 ? "" : `translate(${blow * 130} ${-blow * 70}) rotate(${blow * 90} 172 190)`);
              wb.setAttribute("opacity", blow < 0 ? 1 : Math.max(0, 1 - blow / 0.5));
              for (const p of dustPuff) {
                p.m.style.transform = `translate(${p.x + p.vx * Math.max(0, blow)}px, ${p.y + p.vy * Math.max(0, blow) + 60 * blow * blow}px)`;
                p.m.style.opacity = blow < 0 ? 0 : Math.max(0, 0.85 * (1 - blow / 0.9));
              }
              archEl.style.transform = `rotate(${(-4 + 0.6 * Math.sin(t * 0.9)).toFixed(2)}deg)`;
              webEl.style.transform = archEl.style.transform;
              for (const { m, x0, y0, vx, vy, ph, a } of MOTES) {
                const mx = x0 + vx * t + 9 * Math.sin(t * 0.8 + ph), my = y0 + vy * t + 6 * Math.sin(t * 0.55 + ph * 1.7);
                m.style.transform = `translate(${mx.toFixed(1)}px, ${my.toFixed(1)}px)`;
                m.style.opacity = (a * (0.55 + 0.45 * Math.sin(t * 1.1 + ph))).toFixed(3);
              }
              archie.apply(T);
            }

            // g2: the torrent and the odometer
            const v = bytesAt(T), r = Math.max(0, (v - bytesAt(T - 0.016)) / 0.016);
            const locked = T >= MINE;
            if (T >= G2) {
              cables.forEach((c, i) => {
                const on = clamp01((T - c.on) / 0.2);
                const surge = 1 + 2.2 * clamp01((T - JUMP) / (MINE - JUMP));
                const flowT = locked ? MINE - T0 : t;
                c.flow.setAttribute("opacity", (on * (locked ? 0.35 : 1)).toFixed(3));
                c.flow.setAttribute("stroke-dashoffset", (-(c.ph + flowT * c.sp * surge)).toFixed(1));
                if (c.tp) c.tp.setAttribute("startOffset", (((flowT * 14 * surge + i * 7) % 50) - 50).toFixed(2) + "%");
                HR.glow(c.flow, T, 0.4, 0.6);
              });
              PKTS.forEach(([, w], i) => {
                const q = clamp01((T - w) / FLY), e = q * q * (3 - 2 * q);
                pkts[i].setAttribute("startOffset", (T < w ? 0 : e * 125).toFixed(2) + "%");
                pkts[i].parentNode.setAttribute("opacity", q >= 1 ? 0 : 1);
              });
              // each digit column rolls like a mechanical counter; fast columns smear; leading zeros sit dim
              const n = Math.max(1, String(Math.floor(v)).length);
              for (let d = 0; d < ND; d++) {
                const place = Math.pow(10, ND - 1 - d);
                let pos;
                if (place === 1) pos = v % 10;
                else { const lower = v % place; pos = Math.floor(v / place) % 10 + clamp01(lower - (place - 1)); }
                cols[d].style.transform = `translateY(${(-pos * 232).toFixed(1)}px)`;
                const bl = Math.min(7, Math.max(0, (r / place - 5) / 5)).toFixed(1);
                if (bl !== lastBlur[d]) { cols[d].style.filter = bl === "0.0" ? "none" : `blur(${bl}px)`; lastBlur[d] = bl; }
                HR.glow(cols[d], T, locked ? 0.6 : 0.3, 0.5);
              }
              if (n !== lastDim) { cells.forEach((c, d) => { c.style.opacity = d < ND - n ? "0.3" : "1"; }); lastDim = n; }
              stt.textContent = locked ? "LOCKED" : "OPEN";
              stt.style.color = locked ? "#E85D26" : "#F0ECE5";
              stdot.style.display = locked ? "none" : "block";
              stdot.style.opacity = (0.45 + 0.55 * Math.abs(Math.sin(t * 9))).toFixed(2);
              pad.style.display = locked ? "block" : "none";
              rateEl.textContent = locked ? "RATE — · HELD" : "RATE " + rateStr(r);
              mark.style.clipPath = `inset(-30% ${(100 - 100 * clamp01((T - MARK) / 0.5)).toFixed(1)}% -40% -5%)`;
            }

            for (const hr of heroes) HR.glow(hr, T, 0.35, 0.8);
            // the archive's streams: brighter as the years pass, full while the torrent runs, dimmed when locked
            drawRain(t, (T < G2 ? 0.7 + 0.3 * (T - T0) / (G2 - T0) : 1) * (locked ? 1 - 0.4 * clamp01((T - MINE) / 0.3) : 1));
            lightEl.style.opacity = ((0.6 + 0.5 * HR.band("bass", T)) * (locked ? 0.3 : 1)).toFixed(3);
            plightEl.style.transform = `scale(${(0.96 + 0.08 * HR.band("bass", T)).toFixed(3)})`;
          }
          tl.eventCallback("onUpdate", render);
          tl.seek(0); render();
          window.__timelines["12-key"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
