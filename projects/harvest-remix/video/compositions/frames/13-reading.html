              c.style.background = "linear-gradient(180deg, rgba(17,17,17,0) 0%, rgba(17,17,17,0.06) 40%, rgba(17,17,17,0.17) 49.5%, rgba(255,255,255,0.75) 51%, rgba(255,255,255,0.18) 56%, rgba(17,17,17,0) 80%)";

            Object.assign(v.style, { position: "absolute", top: 0, bottom: 0, left: "1180px", width: "70px",
              background: "linear-gradient(90deg, rgba(17,17,17,0) 0%, rgba(17,17,17,0.05) 48%, rgba(255,255,255,0.4) 51%, rgba(17,17,17,0) 100%)" });

            const poly = cracks[k].concat(arc, cracks[k2].slice().reverse());
            S("path", {}, S("clipPath", { id: `f13-cp${k}` }, $("f13-clips"))).setAttribute("d", "M" + pts(poly).join(" L") + "Z");
            // centroid of the shard's wax (the part inside the rim), for the burst direction

            const c = inner.reduce((s, [x, y]) => [s[0] + x / inner.length, s[1] + y / inner.length], [0, 0]);

              else if (p < 0.5) { const u = p / 0.5; st = "fl"; rot = 90 * u * u; }
              else if (p < 1) { const u = (p - 0.5) / 0.5; st = "pt"; rot = -90 * (1 - u) * (1 - u); }
              else st = q.fk ? "enc" : "pt";
              if (st !== q.st) {
                q.g.classList.toggle("f13-enc", st !== "pt");
                q.g.classList.toggle("f13-fl", st === "fl");
                q.st = st;
              }
              if (st !== "pt") {
                const hx = HR.HEX[(q.seed + step * 7 + (st === "fl" ? Math.floor(t * 30) * 5 : 0)) % 16];
                if (hx !== q.hx) { q.x.textContent = hx; q.hx = hx; }
              }
              const rs = rot ? `rotateX(${rot.toFixed(1)}deg)` : "";
              if (rs !== q.rot) { q.g.style.transform = rs; q.rot = rs; }
            }
          }
          tl.eventCallback("onUpdate", render);
          tl.seek(0);
          render();
          window.__timelines["13-reading"] = tl;
        })();
      </script>
