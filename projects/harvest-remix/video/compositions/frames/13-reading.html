          const cardHex = $("f13-cardhex"), sealEl = $("f13-seal"), seal2 = $("f13-seal2"), keyEl = $("f13-key"), lightEl = $("f13-light");
          const objEl = $("f13-obj"), marker = $("f13-marker"), archEl = $("f13-arch");
          const clamp01 = (v) => Math.max(0, Math.min(1, v));
          const markerWords = lyr.l28a.concat(lyr.l28b);
          // v20: the marker writes in real time: each word's glyphs are written left to right in turn at a pen's pace
          // (narrow glyphs quicker), starting ON the word's time ("later" is a fast slash, done by the downbeat 139.888)
          const WRITE = { i: 0.09, said: 0.42, sooner: 0.5, or: 0.14, later: 0.24 };
          const WIDE = { m: 1.4, w: 1.3, i: 0.55, r: 0.75, s: 0.85, o: 0.95 };
          const pen = [];
          for (const [word, at] of markerWords) {
            word.style.clipPath = "none";
            const gs = Array.from(word.querySelectorAll(".hr-g")), units = gs.map((g) => WIDE[g.textContent] ?? 1);
            const k = (WRITE[word.textContent.trim()] ?? 0.3) / units.reduce((a, b) => a + b, 0);
            let tt = at;
            gs.forEach((g, i) => { pen.push({ g, t: tt, d: units[i] * k * 0.92 }); tt += units[i] * k; });
          }
          const swash = $("f13-swash");
          // v20: Archie leans in on the hits (additive on his pose in render, a pure function of time): the double hat
          // into the downbeat, the downbeat 139.888, the kick 142.229 and the hat 143.131
          const LEANS = [[137.889, 0.7], [139.888, 1], [142.229, 0.8], [143.131, 1]].map(([h, a]) => [L(h), a]);
          const leanAt = (t) => LEANS.reduce((v, [h, a]) => {
            const u = t - h + 0.06;
            return v + (u <= 0 ? 0 : u < 0.16 ? a * (1 - Math.pow(1 - u / 0.16, 3)) : a * Math.exp(-(u - 0.16) / 0.55));
          }, 0);
          const smooth = (u) => u * u * (3 - 2 * u);
          function render() {
            const t = tl.time(), T = t + T0, step = Math.floor(t * 15);
            // a small kick pulse on the envelope shot only: the page never moves with the music
            const k = t < SHOT ? HR.hit("kick", T, 0.14) * 0.012 : 0;
            cam.z += k; stage.apply(T); cam.z -= k;
            WOW.draw(tl, T0);
            HR.draw(tl);

            // light: the warm pool behind the card breathes and flares on the crack; the seal and key catch it
            const flare = Math.max(t >= K2 ? 0.7 * Math.exp(-(t - K2) / 0.22) : 0, t >= ABOUT ? Math.exp(-(t - ABOUT) / 0.4) : 0);
            const rms = HR.band("rms", T);
            lightEl.style.transform = `scale(${(0.94 + 0.12 * rms + 0.12 * flare).toFixed(3)})`;
            if (t < SHOT) lightEl.style.opacity = (0.7 + 0.4 * rms + 0.6 * flare).toFixed(3);
            HR.glow(sealEl, T, 0.4 + 1.4 * flare, 0.7);
            HR.glow(seal2, T, 0.25, 0.5);
            // r2: the crumbs shaken off the seal by the second stamp: thrown up, then falling down the page under gravity
            for (const c of falls) {
              const u = t - c.t0;
              if (u < 0 || u > 1.3) { if (c.d._on !== 0) { c.d.style.opacity = "0"; c.d._on = 0; } continue; }
              const x = c.x0 + c.vx * u, y = c.y0 + c.vy * u + 0.5 * 2600 * u * u;
              c.d.style.opacity = (1 - clamp01((u - 1.0) / 0.3)).toFixed(3); c.d._on = 1;
              c.d.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${(c.spin * u).toFixed(1)}deg) scale(${c.s.toFixed(2)})`;
            }
            keyEl.style.setProperty("--hr-glow", (0.08 + 1.3 * flare + 0.15 * HR.band("bass", T)).toFixed(3));
            // The reference’s draw-on treatment: path and word masks are pure functions of timeline time.
            const ap = clamp01((t - SHOT) / 0.3);
            marker.style.strokeDasharray = "100";
            marker.style.strokeDashoffset = (100 * (1 - ap)).toFixed(2);
            marker.style.opacity = (1 - clamp01((t - (L(140.675) - 0.3)) / 0.22)).toFixed(3);
            for (const { g, t: t0, d } of pen) {   // a glyph is written left to right; its overhangs show once it is done
              const p = clamp01((t - t0) / d);
              const cp = p <= 0 ? "inset(0 100% 0 0)" : p >= 1 ? "none" : `inset(-45% ${(130 - 160 * smooth(p)).toFixed(1)}% -50% -30%)`;
              if (g._cp !== cp) { g.style.clipPath = cp; g._cp = cp; }
            }
            swash.setAttribute("stroke-dashoffset", (100 * (1 - smooth(clamp01((t - SWASH + 0.03) / 0.2)))).toFixed(1));
            swSvg.style.opacity = marker.style.opacity;
            archie.s.lookX = -0.85; archie.s.lookY = 0.3; archie.s.turn = -0.45; // he reads leftwards, across the page
            // his eye-light on the sung zone breathes with the song, and flares as he leans in
            const lean = leanAt(t);
            $("f13-beam").style.filter = `blur(16px) brightness(${(0.85 + 0.3 * rms + 0.35 * lean).toFixed(3)})`;

            if (t >= SHOT - 0.1) {
              // the lean: neck out, head dipped toward the page, the upper body tipped left, pupils wide; restored after
              const a = archie.s, d = { neck: 0.32 * lean, tilt: -9 * lean, rot: -5 * lean, pupil: 0.3 * lean, lookY: 0.25 * lean };
              for (const key in d) a[key] += d[key];
              archie.apply(T);
              for (const key in d) a[key] -= d[key];
            }
            // the key's half turn about its shaft: shaded edge-on, the engraving only on its near face
            const ks = KT.s;
            $("f13-keyturn").style.transform = `scaleY(${ks.toFixed(4)})`;
            $("f13-kshade").setAttribute("opacity", (0.5 * clamp01(1 - Math.abs(ks))).toFixed(3));
            $("f13-ktext").setAttribute("opacity", ks > 0 ? 1 : 0);
            const wiping = t >= WIPE && t < WIPE + 0.8;
            const grip = archie.handAt("L"), lens = archie.headAt();
            const reach = clamp01((t - WIPE) / 0.2) * (1 - clamp01((t - WIPE - 0.54) / 0.24));
            const wx = grip.x + (lens.x - 25 - grip.x) * reach + (wiping ? 6 * Math.sin((t - WIPE) * 32) : 0);
            const wy = grip.y + (lens.y - grip.y) * reach;
            cloth.setAttribute("transform", `translate(${wx} ${wy}) scale(0.55)`);
            clothArm.setAttribute("d", `M${grip.x} ${grip.y} L${wx} ${wy}`);
            clothArm.setAttribute("opacity", wiping ? 1 : 0);

            // the card's ciphertext body: a few rows scramble, hats flick more
            const objText = t >= ABOUT ? "THE SEAL IS BROKEN" : "SEALED · TLS 1.3";
            if (objEl.textContent !== objText) objEl.textContent = objText;
            if (t < SHOT) cardHex.textContent = Array.from({ length: 7 }, (_, i) =>
              HR.cipher(16, 977 + i * 31 + (i % 3 === 0 || HR.hit("hat", T, 0.08) > 0.4 ? step * 1000 : 0)).replace(/(.{4})/g, "$1 ")).join("\n");

            // the decrypt: each glyph flips over in X (hex face away, plaintext face in), resolving ON its time
            let flick = null;
            for (let h = HATS.length - 1; h >= 0; h--) if (HATS[h] <= T) { if (T - HATS[h] < 0.09) flick = HR.rng(Math.round(HATS[h] * 1000)); break; }
            const fset = new Set();
            if (flick) for (let n = 0; n < 4; n++) fset.add((flick() * bodyG.length) | 0);
            bodyG.forEach((q, i) => { q.fk = fset.has(i); });
            for (const q of glyphs) {
              const p = (t - (q.t - q.fd)) / q.fd;
              let st, rot = 0;
              if (p <= 0) st = "enc";
              else if (p < 0.5) { const u = p / 0.5; st = "fl"; rot = 90 * u * u; }
              else if (p < 1) { const u = (p - 0.5) / 0.5; st = "pt"; rot = -90 * (1 - u) * (1 - u); }
              else st = q.fk ? "enc" : "pt";
              if (st !== q.st) {
                q.g.classList.toggle("f13-enc", st !== "pt");
                q.g.classList.toggle("f13-fl", st === "fl");
                q.st = st;
              }
              if (st !== "pt") {
                const hx = HR.HEX[(q.seed + step * 7 + (st === "fl" ? Math.floor(t * 30) * 5 : 0)) % 16];
                if (hx !== q.hx) { q.x.textContent = hx; q.hx = hx; }
              }
              const rs = rot ? `rotateX(${rot.toFixed(1)}deg)` : "";
              if (rs !== q.rot) { q.g.style.transform = rs; q.rot = rs; }
            }
          }
          tl.eventCallback("onUpdate", render);
          tl.seek(0);
          render();
          window.__timelines["13-reading"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
