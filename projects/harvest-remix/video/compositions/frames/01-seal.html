      <script src="assets/kit/hr-kit.js"></script>
      <script src="assets/kit/wow-kit.js"></script>
      <script>
        (() => {
          const DUR = 7.96;
          const STAMP = 6.117; // the first kick
          const RINGS = [6.439, 6.737, 7.044];
          const FILL = [7.036, 7.175, 7.338, 7.477, 7.593, 7.732, 7.918];
          const $ = (id) => document.getElementById(id);
          const el = (tag, cls, parent, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; parent.appendChild(e); return e; };
          const h01 = (a, b) => HR.rng(a * 7919 + b * 104729 + 13)();

          // ---- static build ---------------------------------------------------------------------------------

          // paper: seeded fibre noise baked once into the card's background
          (() => {
            const c = document.createElement("canvas"); c.width = 288; c.height = 180;
            const x = c.getContext("2d"), r = HR.rng(404);
            x.fillStyle = "#F0ECE5"; x.fillRect(0, 0, 288, 180);
            const img = x.getImageData(0, 0, 288, 180);
            for (let i = 0; i < img.data.length; i += 4) { const v = (r() - 0.5) * 14; img.data[i] += v; img.data[i + 1] += v; img.data[i + 2] += v * 0.9; }
            x.putImageData(img, 0, 0);
            x.strokeStyle = "rgba(110,100,90,0.10)"; x.lineWidth = 0.6;
            for (let k = 0; k < 70; k++) { const px = r() * 288, py = r() * 180, a = r() * Math.PI, l = 6 + r() * 16;
              x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(a) * l, py + Math.sin(a) * l * 0.4); x.stroke(); }
            const url = `url(${c.toDataURL("image/png")})`;
            $("f01-card").style.backgroundImage = url;
            // harvested copies behind: the same letter, filed again, out of focus
            [].forEach(([l, tp, rot], i) => {
              const g = el("div", "f01-ghost", $("f01-ghosts"));
              Object.assign(g.style, { left: l + "px", top: tp + "px", transform: `rotate(${rot}deg)`, backgroundImage: url });
              g.innerHTML = '<svg viewBox="0 0 576 360" preserveAspectRatio="none"><path d="M0 0 L288 180 L576 0 Z" fill="rgba(17,17,17,0.09)"/><path d="M0 0 L288 180 L576 0" fill="none" stroke="rgba(17,17,17,0.35)" stroke-width="3"/><circle cx="288" cy="180" r="34" fill="#E85D26"/></svg>';
            });
          })();

          // postal sorting barcode (fire ink) along the bottom edge of the flap side
          (() => {
            const g = $("f01-sort"), r = HR.rng(611);
            for (let x = 330, i = 0; i < 46; i++, x += 4.9) {
              const tall = r() < 0.5, b = document.createElementNS("http://www.w3.org/2000/svg", "rect");
              b.setAttribute("x", x.toFixed(1)); b.setAttribute("y", tall ? 326 : 334); b.setAttribute("width", 2.2);
              b.setAttribute("height", tall ? 20 : 12); b.setAttribute("fill", "rgba(232,93,38,0.78)"); g.appendChild(b);
            }
          })();

          // the seal: a hand-poured rim (wobble and three drips) and a pressed bead ring
          (() => {
            let d = "";
            const drips = [[0.6, 7], [2.5, 5], [4.4, 8.5]];
            for (let k = 0; k <= 120; k++) {
              const a = (k / 120) * Math.PI * 2;
              let rr = 55.5 + 1.8 * Math.sin(7 * a + 0.5) + 1.2 * Math.sin(13 * a + 2) + 0.7 * Math.sin(23 * a);
              for (const [a0, h] of drips) { const da = Math.atan2(Math.sin(a - a0), Math.cos(a - a0)); rr += h * Math.exp(-(da * da) / 0.012); }
              d += (k ? "L" : "M") + (Math.cos(a) * rr).toFixed(2) + " " + (Math.sin(a) * rr).toFixed(2);
            }
            $("f01-rim").setAttribute("d", d + "Z");
            const beads = $("f01-beads");
            for (let i = 0; i < 30; i++) {
              const a = (i / 30) * Math.PI * 2, c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
              c.setAttribute("cx", (Math.cos(a) * 36.5).toFixed(2)); c.setAttribute("cy", (Math.sin(a) * 36.5).toFixed(2));
              c.setAttribute("r", 1.35); c.setAttribute("fill", "rgba(17,17,17,0.26)"); beads.appendChild(c);
            }
          })();

          // "harvest now," splits into glyphs (they jolt on the stamp); "decrypt later" carries a hex glyph per letter
          const nowG = HR.glyphs($("f01-now"));
          const chars = [];
          for (const ch of "decrypt later") {
            if (ch === " ") { el("span", "", $("f01-later"), " "); continue; }
            const c = el("span", "f01-c", $("f01-later"));
            const p = el("span", "", c, ch);
            const x = el("span", "f01-x", c, "0");
            const adv = { d: 0.57, e: 0.54, c: 0.49, r: 0.38, y: 0.52, p: 0.57, t: 0.37, l: 0.27, a: 0.54 }[ch];
            x.style.transform = `translateX(-50%) scaleX(${Math.max(0.62, Math.min(1, (adv + 0.02) / 0.444))})`;
            chars.push({ c, p, x });
          }
          $("f01-later").classList.add("hr-glow");

          // near plane: a few huge out-of-focus hex glyphs
          const nr = HR.rng(77);
          for (let i = 0; i < 0; i++) {
            const b = el("div", "f01-bokeh", $("f01-near"), HR.cipher(2 + (i % 3), 300 + i));
            Object.assign(b.style, { left: `${-100 + nr() * 2000}px`, top: `${-80 + nr() * 1100}px`, fontSize: `${180 + nr() * 160}px` });
          }

          // stamp burst, rings, wax droplets
          const N = 18, spokes = [];
          for (let i = 0; i < N; i++) {
            const s = el("div", "f01-spoke", $("f01-spokes"));
            s.style.transform = `rotate(${(i / N) * 360 + 5}deg)`;
            const line = el("i", "", s), r0 = 92 + (i % 3) * 12, len = 70 + (i % 4) * 30;
            line.style.top = -(r0 + len) + "px"; line.style.height = len + "px";
            spokes.push(line);
          }
          const rings = [STAMP].concat(RINGS).map(() => el("div", "f01-ring", $("f01-sealpos")));
          const dr = HR.rng(909);
          const drops = Array.from({ length: 16 }, (_, i) => {
            const d = el("div", "f01-drop", $("f01-drops"));
            const a = (i / 16) * Math.PI * 2 + dr() * 0.3, v = 120 + dr() * 170, s = 0.35 + dr() * 0.8;
            return { d, dx: Math.cos(a) * v, dy: Math.sin(a) * v * 0.62 - 40, s };
          });

          // ---- timeline -------------------------------------------------------------------------------------
          const tl = gsap.timeline({ paused: true });
          const stage = HR.stage($("root"), { seed: 5, drift: 1 });
          const cam = stage.cam;
          cam.focus = 0.35;

          // the camera: one slow dolly over the pad, a kick on the stamp, a lean through the fill
          tl.fromTo(cam, { z: 1, x: 18 }, { z: 1.05, x: -6, duration: STAMP, ease: "sine.inOut" }, 0);
          tl.fromTo(cam, { z: 1.05, rot: 0 }, { z: 1.09, rot: -0.5, duration: 0.06, ease: "power3.out", immediateRender: false }, STAMP);
          tl.fromTo(cam, { z: 1.09, rot: -0.5 }, { z: 1.065, rot: 0, duration: 0.55, ease: "elastic.out(1, 0.5)", immediateRender: false }, STAMP + 0.06);
          tl.fromTo(cam, { z: 1.065, x: -6 }, { z: 1.085, x: -20, duration: DUR - STAMP - 0.61, ease: "power2.in", immediateRender: false }, STAMP + 0.61);
          tl.fromTo("#f01-wall", { x: 0 }, { x: -120, duration: DUR, ease: "none" }, 0);
          tl.fromTo("#f01-near", { x: 0 }, { x: -260, duration: DUR, ease: "none" }, 0);
          tl.fromTo("#f01-ghosts", { x: 0, y: 0 }, { x: -70, y: -14, duration: DUR, ease: "none" }, 0);

          // the wax pools through the pad (its path is drawn per frame from `wax.r`)
          const wax = { r: 8, a: 1 };
          tl.fromTo(wax, { r: 8 }, { r: 58, duration: STAMP - 0.5, ease: "power1.out" }, 0.25);
          // the soft kick at 2.269 nudges the card
          tl.fromTo("#f01-card", { y: 0 }, { y: 4, duration: 0.07, ease: "power2.out" }, 2.269);
          tl.fromTo("#f01-card", { y: 4 }, { y: 0, duration: 0.55, ease: "power2.inOut", immediateRender: false }, 2.339);

          // the stamp: anticipation above (big, blurred), slams ON the kick, squashes, lifts off the embossed seal
          tl.fromTo("#f01-stamp", { opacity: 0, scale: 1.9, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.16, ease: "power4.in" }, STAMP - 0.16);
          tl.fromTo("#f01-stamp", { scaleX: 1, scaleY: 1 }, { scaleX: 1.08, scaleY: 0.92, duration: 0.05, ease: "power2.out", immediateRender: false }, STAMP);
          tl.fromTo("#f01-stamp", { scale: 1, opacity: 1 }, { scale: 1.5, opacity: 0, filter: "blur(8px)", duration: 0.32, ease: "power2.in", immediateRender: false }, STAMP + 0.12);
          tl.set("#f01-wax", { opacity: 0 }, STAMP);
          tl.set("#f01-seal", { opacity: 1 }, STAMP);
          tl.fromTo("#f01-seal", { scale: 1.12 }, { scale: 1, duration: 0.45, ease: "elastic.out(1, 0.45)", immediateRender: false }, STAMP);
          tl.fromTo("#f01-card", { y: 0 }, { y: 9, duration: 0.05, ease: "power2.out", immediateRender: false }, STAMP);
          tl.fromTo("#f01-card", { y: 9 }, { y: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, STAMP + 0.05);
          drops.forEach(({ d, dx, dy, s }, i) => {
            const t0 = STAMP + (i % 3) * 0.008;
            tl.fromTo(d, { opacity: 1, x: 0, scale: s }, { x: dx, duration: 0.55, ease: "power2.out", immediateRender: false }, t0);
            tl.fromTo(d, { y: 0 }, { y: dy, duration: 0.22, ease: "power2.out", immediateRender: false }, t0);
            tl.fromTo(d, { y: dy }, { y: dy + 150, opacity: 0, scale: s * 0.4, duration: 0.4, ease: "power2.in", immediateRender: false }, t0 + 0.22);
          });

          // v13: no register flip. The seal's light flares on the kick and rakes the card; the title answers in a glyph wave
          const flare = { v: 0 };
          tl.fromTo(flare, { v: 0 }, { v: 1, duration: 0.05, ease: "power2.out", immediateRender: false }, STAMP);
          tl.fromTo(flare, { v: 1 }, { v: 0.22, duration: 1.1, ease: "power2.out", immediateRender: false }, STAMP + 0.05);
          tl.set("#f01-label", { color: "var(--cream)" }, STAMP);
          // the outbox: the letter leaves on the kick
          tl.set("#f01-obpend", { opacity: 0 }, STAMP);
          tl.set("#f01-obsent", { opacity: 1 }, STAMP);
          tl.fromTo("#f01-obsent", { scale: 1.12, transformOrigin: "559px 70px" }, { scale: 1, duration: 0.4, ease: "elastic.out(1, 0.5)", immediateRender: false }, STAMP);
          const waveG = nowG.concat(chars.map((c) => c.c));
          waveG.forEach((g, i) => {
            const t0 = STAMP + 0.012 * i;
            tl.fromTo(g, { y: 0 }, { y: 30, duration: 0.06, ease: "power2.out", immediateRender: false }, t0);
            tl.fromTo(g, { y: 30 }, { y: 0, duration: 0.5, ease: "elastic.out(1, 0.4)", immediateRender: false }, t0 + 0.06);
          });

          spokes.forEach((s, i) => {
            const t0 = STAMP + (i % 4) * 0.012;
            tl.fromTo(s, { opacity: 1, scaleY: 0, y: 0 }, { scaleY: 1, y: -18, duration: 0.2, ease: "power4.out", immediateRender: false }, t0);
            tl.fromTo(s, { opacity: 1, y: -18 }, { opacity: 0, y: -44, duration: 0.45, ease: "power2.in", immediateRender: false }, t0 + 0.25);
          });
          [STAMP].concat(RINGS).forEach((t, k) => {
            tl.fromTo(rings[k], { opacity: 1, scale: 1 }, { opacity: 0, scale: k === 0 ? 3.8 : 3.0, duration: 0.6, ease: "power2.out", immediateRender: false }, t);
          });
          FILL.forEach((t, k) => {
            const dx = (k % 2 ? -1 : 1) * (2 + k * 0.7);
            tl.fromTo("#f01-cardpos", { x: 0 }, { x: dx, duration: 0.03, ease: "none", immediateRender: false }, t);
            tl.fromTo("#f01-cardpos", { x: dx }, { x: 0, duration: 0.09, ease: "power2.out", immediateRender: false }, t + 0.03);
          });


          // ---- v16 (V16.md §1): the opening is alive from frame one; the stamp is a detonation; the camera dives into the seal ----
          const SEAL = { x: 1509, y: 520 }; // the seal's centre in frame px (card 1186,318 + half of 646 × 404)
          const fx = $("f01-fx"), SHK = [$("f01-bg"), $("f01-mid"), $("f01-fg"), $("f01-streams")];
          const shakeAll = (t, amp, dur = 0.4) => SHK.forEach((e, i) => WOW.shake(tl, e, t, { amp, dur, seed: 11 + i * 7 }));
          const wave = (t, amp) => waveG.forEach((g, i) => {
            tl.fromTo(g, { y: 0 }, { y: amp, duration: 0.06, ease: "power2.out", immediateRender: false }, t + 0.012 * i);
            tl.fromTo(g, { y: amp }, { y: 0, duration: 0.5, ease: "elastic.out(1, 0.4)", immediateRender: false }, t + 0.012 * i + 0.06);
          });
          const sweep = (t) => {
            tl.fromTo("#f01-sweep", { x: -700, opacity: 1 }, { x: 2300, opacity: 1, duration: 0.9, ease: "power2.inOut", immediateRender: false }, t);
            tl.set("#f01-sweep", { opacity: 0 }, t + 0.9);
          };

          // ciphertext packets stream past behind the letter, faster as the pad builds
          {
            const rnd = HR.rng(321), lanes = [96, 150, 700, 770, 830, 900, 960, 1010, 1052, 735];
            lanes.forEach((y, k) => {
              const pk = el("div", "f01-pk", $("f01-streams"));
              pk.style.top = y + "px"; pk.innerHTML = HR.cipher(8, 500 + k).replace(/(.{4})/g, "$1 ") + "<i></i>";
              pk.querySelector("i").style.width = 160 + rnd() * 160 + "px";
              let t0 = rnd() * 0.9;
              while (t0 < DUR - 0.2) {
                const d = (2.0 - 1.2 * Math.min(1, t0 / 6.1)) * (0.8 + rnd() * 0.5);
                tl.fromTo(pk, { x: -420, opacity: 0.55 }, { x: 2300, opacity: 0.55, duration: d, ease: "none", immediateRender: false }, t0);
                t0 += d + rnd() * 0.3;
              }
            });
          }

          // the pad's three soft events: sweep, glyph wave, tilt of the letter, embers
          sweep(0.12);
          [0.498, 2.269, 4.253].forEach((t, k) => {
            const amp = [8, 12, 16][k];
            wave(t, amp); shakeAll(t, [4, 6, 8][k], 0.32); WOW.punch(tl, $("f01-mid"), t, { s: 1.025, dur: 0.4 });
            WOW.shock(tl, fx, { x: SEAL.x, y: SEAL.y, t, r: 520 + k * 120, n: 1, w: 3, color: "fire", dur: 0.7 });
            WOW.rays(tl, fx, { x: SEAL.x, y: SEAL.y, t, n: 12 + k * 4, r0: 120, r1: 700, seed: 40 + k, color: "cream", dur: 0.5 });
            if (k) sweep(t - 0.05);
          });
          tl.fromTo("#f01-cardpos", { rotationY: 0, transformPerspective: 1400 }, { rotationY: -15, duration: 0.5, ease: "power2.out", immediateRender: false }, 1.25);
          tl.fromTo("#f01-cardpos", { rotationY: -15 }, { rotationY: 0, duration: 0.9, ease: "elastic.out(1, 0.5)", immediateRender: false }, 1.75);
          tl.fromTo("#f01-cardpos", { rotationX: 0 }, { rotationX: 10, duration: 0.4, ease: "power2.out", immediateRender: false }, 3.4);
          tl.fromTo("#f01-cardpos", { rotationX: 10 }, { rotationX: 0, duration: 0.9, ease: "elastic.out(1, 0.5)", immediateRender: false }, 3.8);
          [1.0, 1.9, 3.0, 3.7, 4.6].forEach((t, k) => WOW.burst(tl, fx, { x: SEAL.x, y: SEAL.y + 20, t, n: 10, speed: 520, size: [4, 9], gravity: -260, spread: 150, aim: -90, seed: 70 + k, dur: 1.2 }));
          WOW.pulse(tl, $("f01-title"), { band: "bass", amt: 0.03, y: 4 });
          WOW.pulse(tl, $("f01-title"), { kind: "kick", amt: 0.05, y: 8 });
          WOW.pulse(tl, $("f01-cardpos"), { band: "bass", amt: 0.02 });

          // the build: bursts of speed lines and tremors tighten toward the stamp, and the camera dollies in
          [[5.15, 4], [5.45, 6], [5.7, 9], [5.88, 12], [6.0, 16]].forEach(([t, a], k) => {
            shakeAll(t, a, 0.28);
            WOW.rays(tl, fx, { x: SEAL.x, y: SEAL.y, t, n: 14 + k * 3, r0: 160, r1: 900, seed: 80 + k, color: k < 3 ? "fire" : "cream", dur: 0.4 });
            WOW.shock(tl, fx, { x: SEAL.x, y: SEAL.y, t, r: 380, n: 1, w: 3, color: "cream", dur: 0.4 });
          });
          tl.fromTo(cam, { x: -6 }, { x: -2, duration: 0.9, ease: "power3.in", immediateRender: false }, 5.2);

          // 6.117: the detonation
          shakeAll(STAMP, 30, 0.6);
          WOW.punch(tl, document.getElementById("el-01-seal"), STAMP, { s: 1.06, dur: 0.5 });
          WOW.shock(tl, fx, { x: SEAL.x, y: SEAL.y, t: STAMP, r: 1500, n: 3, w: 9, color: "fire", dur: 0.7, gap: 0.07 });
          WOW.rays(tl, fx, { x: SEAL.x, y: SEAL.y, t: STAMP, n: 34, r0: 100, r1: 1400, seed: 91, color: "cream", dur: 0.6, w: 6 });
          WOW.burst(tl, fx, { x: SEAL.x, y: SEAL.y, t: STAMP, n: 44, speed: 1500, size: [6, 20], seed: 92, dur: 1.0, cream: 0.35 });
          WOW.flash(tl, fx, STAMP, { a: 0.85, dur: 0.22 });
          sweep(STAMP - 0.1);
          RINGS.forEach((t, k) => {
            shakeAll(t, 12, 0.3); WOW.punch(tl, $("f01-mid"), t, { s: 1.06, dur: 0.3 });
            WOW.shock(tl, fx, { x: SEAL.x, y: SEAL.y, t, r: 1000, n: 1, w: 6, color: k % 2 ? "cream" : "fire", dur: 0.55 });
            WOW.rays(tl, fx, { x: SEAL.x, y: SEAL.y, t, n: 14, r0: 130, r1: 900, seed: 100 + k, color: "fire", dur: 0.4 });
          });
          // the fill: a strobing roll, then the camera dives into the seal (zoom out of this frame, into 02)
          FILL.forEach((t, k) => {
            WOW.flash(tl, fx, t, { a: 0.14 + k * 0.025, dur: 0.07 });
            shakeAll(t, 5 + k, 0.1);
            WOW.shock(tl, fx, { x: SEAL.x, y: SEAL.y, t, r: 520 + k * 60, n: 1, w: 4, color: "fire", dur: 0.3 });
          });
          document.getElementById("el-01-seal").style.transformOrigin = `${(SEAL.x / 19.2).toFixed(1)}% ${(SEAL.y / 10.8).toFixed(1)}%`;
          WOW.transition(tl, document.getElementById("el-01-seal"), { out: "zoom", dur: 0.9, total: DUR });

          // ---- per-frame draw (all from timeline time) ------------------------------------------------------
          const ANCHORS = [[0.498, 0.12], [2.269, 0.08], [4.253, 0.03]];
          function density(t) {
            if (t >= STAMP) return Math.min(1, 0.45 + 0.55 * Math.pow((t - STAMP) / (DUR - 0.1 - STAMP), 1.6));
            let p = 0.3;
            for (const [a, lo] of ANCHORS) {
              const d = t - a;
              if (d >= 0 && d < 1.0) { const w = d < 0.12 ? d / 0.12 : d < 0.45 ? 1 : 1 - (d - 0.45) / 0.55; p = Math.min(p, 0.3 - (0.3 - lo) * w); }
            }
            return p;
          }
          function waxPath(r, t) {
            let d = "";
            for (let k = 0; k <= 48; k++) {
              const a = (k / 48) * Math.PI * 2;
              const rr = r * (1 + 0.05 * Math.sin(5 * a + t * 1.3) + 0.035 * Math.sin(9 * a - t * 2.1) + 0.02 * Math.sin(13 * a + 1.7));
              d += (k ? "L" : "M") + (Math.cos(a) * rr).toFixed(2) + " " + (Math.sin(a) * rr * 0.97).toFixed(2);
            }
            return d + "Z";
          }
          const waxEl = $("f01-waxpath"), waxHi = $("f01-waxhi"), lightEl = $("f01-light");
          function render() {
            const t = tl.time();
            const step = Math.floor(t * 15);
            stage.apply(t);
            WOW.draw(tl);
            // wax: a living pool with a wet highlight; glow with the pad, then the seal glows with the bass
            waxEl.setAttribute("d", waxPath(wax.r, t));
            const hr = wax.r * 0.62;
            waxHi.setAttribute("d", `M${(-hr * 0.8).toFixed(1)} ${(-hr * 0.45).toFixed(1)} A${hr.toFixed(1)} ${hr.toFixed(1)} 0 0 1 ${(-hr * 0.1).toFixed(1)} ${(-hr * 0.85).toFixed(1)}`);
            HR.glow($("f01-wax"), t, 0.35, 0.9);
            HR.glow($("f01-seal"), t, 0.4, 0.8);
            HR.glow($("f01-later"), t, 0.3, 0.6);
            const breath = 0.92 + 0.16 * HR.band("rms", t);
            lightEl.style.transform = `scale(${breath.toFixed(3)})`;
            lightEl.style.opacity = (0.65 + 0.5 * HR.band("rms", t)).toFixed(3);
            // the seal's flare: hot light raking the card from the seal, decaying after the kick
            $("f01-flare").style.opacity = (flare.v * (0.85 + 0.3 * HR.band("bass", t))).toFixed(3);

            // the outbox progress bar fills with the wax, full on the stamp
            $("f01-obprog").setAttribute("width", (644 * Math.min(1, Math.max(0, (t - 0.25) / (STAMP - 0.25)))).toFixed(1));
            $("f01-label").textContent = t >= STAMP ? "OBJ 0001 · SEALED · TLS 1.3" : "OBJ 0001 · OPEN";
            // the letter's body: a few rows scramble; in the fill every row churns, reshuffled per hit
            const fill = t >= FILL[0], hits = FILL.filter((f) => t >= f).length;
            $("f01-hex").textContent = Array.from({ length: 7 }, (_, i) => {
              const live = fill || (t >= STAMP ? i % 2 === 0 : i % 3 === 0);
              return HR.cipher(16, 977 + i * 31 + (live ? step + hits * 101 : 0)).replace(/(.{4})/g, "$1 ");
            }).join("\n");

            // "decrypt later": letters drift in and out of hex, never all settling; hats flick one glyph
            const p = Math.min(1, density(t) + 0.25 * HR.hit("hat", t, 0.08));
            const states = chars.map((c, i) => h01(i + 1, Math.floor(t * (2.2 + (i % 3) * 0.7) + i * 0.37)) < p);
            if (!states.some(Boolean)) states[Math.floor(t * 1.5) % chars.length] = true;
            chars.forEach((c, i) => {
              const hx = t >= 2.269 && states[i];
              c.p.style.opacity = hx ? 0 : 1;
              c.x.style.opacity = hx ? 1 : 0;
              if (hx) c.x.textContent = HR.HEX[(h01(i + 41, step) * 16) | 0];
            });
          }
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["01-seal"] = tl;
        })();
      </script>
    </template>
  </body>
