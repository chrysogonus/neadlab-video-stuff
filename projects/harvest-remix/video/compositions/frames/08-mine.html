          // Six Enigma-style rotor drums, each ringed with its own scrambled wiring of 24 glyphs, behind a fire-lit

          const SEGS = [["steps", T0 - 0.1, TIME - 0.45], ["seek", TIME - 0.45, TIME, "·time·"], ["hold", TIME, C17],
            ["spin", C17, MINE - 0.5], ["seek", MINE - 0.5, MINE, "·mine·"], ["hold", MINE, C18],

              v = s[0] === "seek" ? fin : s[0] === "hold" ? v : segVal(k, s, v, s[2], fin);
