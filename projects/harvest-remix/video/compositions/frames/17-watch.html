              b.slot.setAttribute("d", `M${P(s0)}L${P(s1)}`);
              b.slotHi.setAttribute("d", `M${P([s0[0] + 2, s0[1] + 4])}L${P([s1[0] + 2, s1[1] + 4])}`);
              const lp = inFace(RB - 98, 0.5); let la = ((Math.atan2(lp[1], lp[0]) * 180 / Math.PI + 90) % 360 + 360) % 360; if (la > 90 && la < 270) la -= 180;
              b.label.setAttribute("transform", `translate(${P(lp)}) rotate(${la.toFixed(1)})`);
            }
            // the ring: the scale turns with the aperture (stop number under the index), shudders on each step
            const sIdx = Math.max(0, 4.2 * Math.log2(330 / Math.max(60, rho)));
            const sh = shudder(T), bandRot = -12 * sIdx + sh * Math.sin(T * 90) * 0.8;
            band.setAttribute("transform", `rotate(${bandRot.toFixed(2)})`);
            numerals.forEach(({ t: n, x, y }) => n.setAttribute("transform", `rotate(${(-bandRot).toFixed(2)} ${f1(x)} ${f1(y)})`));
            const slam = T >= 44.58 ? Math.exp(-(T - 44.58) / 0.12) : 0;
            iris.setAttribute("transform", `translate(${CX} ${CY}) scale(${(SC - SC * 0.012 * slam * Math.cos((T - 44.58) * 40)).toFixed(4)})`);
            // the letter sits deeper than the blades: it drifts against them
            card.setAttribute("transform", `translate(${f1(Math.sin(T * 0.7) * 10 - (330 - rho) * 0.02)} ${f1(Math.cos(T * 0.55) * 6)})`);
            hexRows[1].textContent = HR.cipher(12, 1760 + step).replace(/(.{4})/g, "$1 ");
            hexRows[4].textContent = HR.cipher(12, 1790 + (step >> 1)).replace(/(.{4})/g, "$1 ");
            const bass = HR.band("bass", T);
            spill.setAttribute("opacity", (0.55 + 0.6 * bass + 0.5 * slam).toFixed(3));
            sealGlow.setAttribute("opacity", (0.5 + 0.7 * bass + 0.8 * slam).toFixed(3));
            const lit = T >= 44.58 ? 1 : 0.25 + 0.75 * HR.hit("hat", T, 0.07);
            lamp.setAttribute("opacity", lit.toFixed(3));
            lampGlow.setAttribute("opacity", (lit * (0.7 + 0.5 * bass)).toFixed(3));
            lightEl.style.transform = `scale(${(0.93 + 0.14 * HR.band("rms", T)).toFixed(3)})`;
            // the plate: drum rolls to the stop, the pointer rides the scale
            const sd = Math.min(8, sIdx);
            drumRoll.setAttribute("transform", `translate(0 ${f1(-sd * 92)})`);
            ptr.setAttribute("transform", `translate(${f1(SX0 + sd * SDX)} 0)`);
            ptrState.textContent = T >= 44.58 ? "SEALED IN VIEW" : rho > 300 ? "WIDE OPEN" : T >= 43.6 ? "CLOSING" : "WATCHING";
          }
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines[ID] = tl;
        })();
      </script>
    </template>
  </body>
</html>
