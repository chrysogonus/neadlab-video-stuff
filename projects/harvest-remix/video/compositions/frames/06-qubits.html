                if (dS < 0) { const u = (dS + 0.1) / 0.1; sc = 1.6 - 0.6 * u * u; rot -= 14 * (1 - u * u); op = clamp01(u * 3); y -= 70 * (1 - u * u); }
                else { sc = 1 + 0.06 * Math.exp(-dS / 0.09) * Math.cos(dS * 45); rot += 3 * Math.exp(-dS / 0.15) * Math.sin(dS * 30); }
                if (i === top) rot += 2.2 * kick;
                const dR = T - n.rip;
                if (dR > 0) {
                  const u = clamp01(dR / 0.62), peel = clamp01(dR / 0.12);
                  x = lerp(n.ox, n.lx - NCX, u); y = n.oy - 26 * peel * (1 - u) + (n.ly - NCY - n.oy) * u * u;
                  rot = n.rot + n.spin * u * (1 - u) + n.lrot * u + 18 * Math.sin(u * 9) * (1 - u);
                  sy = lerp(1, 0.3, Math.pow(u, 1.6)); sc = 1 - 0.12 * u;
                }
                n.e.style.opacity = op.toFixed(3);
                n.e.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(1, ${sy.toFixed(3)}) rotate(${rot.toFixed(2)}deg) scale(${sc.toFixed(4)})`;
              });
              // drawer 0001 sits further back (parallax 0.72); its lamp swings once on each stamp; dust drifts in the cone
              const c = cam(T);
              cBack.style.transform = `translate(${((Math.max(c.cx, 2420) - 2880) * 0.28).toFixed(1)}px, ${((c.cy + 540) * 0.28).toFixed(1)}px)`;
              let sw = 0.8 * Math.sin(T * 0.9);
              for (const h of [STAMP, PRESS]) if (T > h) sw += 3.2 * Math.exp(-(T - h) / 0.9) * Math.sin((T - h) * 5.2);
              lampG.setAttribute("transform", `rotate(${sw.toFixed(3)} 1580 -400)`);
              const jolt = (h) => (T > h ? 5 * Math.exp(-(T - h) / 0.1) * Math.cos((T - h) * 40) : 0);
              drawerEl.style.transform = `translateY(${(jolt(STAMP) + jolt(PRESS)).toFixed(2)}px)`;
              for (const m of motes) {
                const cy = 220 + ((m.y * 640 + (T - T0) * m.sp) % 640), wid = 100 + (cy - 140) * 0.75; // drifting down the cone
                m.c.setAttribute("cx", (1580 + (m.x - 0.5) * 0.85 * wid + 14 * Math.sin(T * 0.7 + m.ph)).toFixed(1));
                m.c.setAttribute("cy", cy.toFixed(1));
                m.c.setAttribute("opacity", (0.25 + 0.45 * (0.5 + 0.5 * Math.sin(T * 1.3 + m.ph))).toFixed(3));
              }
              dlight.style.opacity = (0.85 + 0.15 * bass).toFixed(3);
              lamp.style.transform = `scale(${(1 + 0.5 * kick + 0.4 * snare).toFixed(3)})`;
              unch.style.setProperty("--hr-glow", (0.4 + 0.5 * bass + 1.2 * env(T - STAMP, 0.4) + 1.2 * env(T - PRESS, 0.35)).toFixed(3));
            }

            // s4 — the three shots: slow continuous cameras with a kick pulse
            if (T >= C4) {
              const kp = 1 + 0.012 * kick;
              if (T < XB) {
                const u = clamp01((T - C4) / (XB - C4)), e3 = (x) => 1 - Math.pow(1 - clamp01(x), 3);
                bpPaths.forEach((p, i) => {
                  p.setAttribute("stroke-dashoffset", (100 * (1 - e3((T - (C4 - 0.02) - i * 0.004) / 0.12))).toFixed(1));
                  const lit = env(T - BLUE, 0.28) * (i < 5 ? 1 : 0.6);
                  p.setAttribute("stroke", lit > 0.05 ? `rgb(${Math.round(lerp(240, 232, lit))}, ${Math.round(lerp(236, 93, lit))}, ${Math.round(lerp(229, 38, lit))})` : "#F0ECE5");
                });
                const pb = 1 + 0.035 * env(T - BLUE, 0.3) * (T >= BLUE ? 1 : 0);
                $("f06x-ca").style.transform = `scale(${((1.1 - 0.06 * u) * pb * kp).toFixed(4)}) rotate(${(-0.8 + 0.8 * u).toFixed(3)}deg)`;
              } else if (T < XC) {
                const u = clamp01((T - XB) / (XC - XB));
                flames.forEach(({ g, f, k }) => {
                  const on = clamp01((T - LIGHT[k] + 0.04) / 0.1), fl = T >= BDAY ? env(T - BDAY, 0.16) : 0;
                  g.setAttribute("opacity", on.toFixed(3));
                  f.setAttribute("transform", `scale(${(1 + 0.08 * Math.sin(T * 23 + k) + 0.35 * fl).toFixed(3)} ${(1 + 0.12 * Math.sin(T * 31 + k * 2) + 0.2 * env(T - LIGHT[k], 0.12) + 0.6 * fl).toFixed(3)})`);
                });
                const pb = 1 + 0.03 * (T >= BDAY ? env(T - BDAY, 0.3) : 0);
                $("f06x-cb").style.transform = `scale(${((1.2 + 0.1 * u) * pb * kp).toFixed(4)})`;
              } else {
                const fall = (t0) => { const q = clamp01((T - t0) / 0.34); return -110 + 680 * q * q; };
                drRoll.setAttribute("transform", `translate(1150 ${fall(XC).toFixed(1)}) rotate(${(-8 + 30 * clamp01((T - XC) / 0.32)).toFixed(1)})`);
                drCake.setAttribute("transform", `translate(1440 ${fall(XC + 0.08).toFixed(1)}) rotate(${(6 - 14 * clamp01((T - XC - 0.08) / 0.32)).toFixed(1)})`);
                const cl = sio((T - (SLAM - 0.24)) / 0.24), d = T - SLAM;
                const settle = d > 0 ? 3 * Math.exp(-d / 0.12) * Math.cos(d * 26) : 0;
                drFront.setAttribute("transform", `translate(0 ${(-120 * cl + settle).toFixed(1)})`);
                drLeak.setAttribute("opacity", (T >= SLAM ? clamp01((T - SLAM) / 0.1) * (0.55 + 0.2 * Math.sin(T * 17) + 0.12 * Math.sin(T * 29)) : 0).toFixed(3));
                const ue = clamp01((T - XC) / (END - XC)), e = 1 - (1 - ue) * (1 - ue);
                $("f06x-cc").style.transform = `scale(${((1 + 0.45 * e) * kp).toFixed(4)})`;
                for (const id of ["f06x-st1", "f06x-st2"]) $(id).style.setProperty("--hr-glow", (0.4 + 0.5 * bass).toFixed(3));
              }
            }
          }
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["06-qubits"] = tl;
        })();
      </script>
    </template>
  </body>
