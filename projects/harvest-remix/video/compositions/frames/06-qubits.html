            // g1 — each core flashes as its chip lands, a pulse runs down the stack, and the stack burns brighter as it grows
            if (T < C2) {
              const n = chips.filter((c) => T >= c.b - 1e-6).length;
              let latest = 0;
              chips.forEach((c, j) => {
                const flash = env(T - c.b, 0.3);
                let wave = 0;
                for (let i = j + 1; i < chips.length; i++) wave = Math.max(wave, env(T - (chips[i].b + (i - j) * 0.035), 0.16));
                const g = 0.3 + 0.55 * (n / chips.length) + 0.3 * bass + 1.3 * flash + 0.7 * wave;
                c.core.style.setProperty("--hr-glow", g.toFixed(3));
                c.hot.setAttribute("opacity", clamp01(flash * 1.1 + 0.5 * wave).toFixed(3));
                c.spill.setAttribute("opacity", clamp01(0.25 + 0.35 * g).toFixed(3));
                latest = Math.max(latest, flash);
              });
              plinth.spill.setAttribute("opacity", clamp01(0.2 + 0.05 * n + 0.3 * bass).toFixed(3));
              slight.style.opacity = clamp01(0.3 + 0.55 * (n / chips.length) + 0.3 * bass + 0.35 * latest).toFixed(3);
              slight.style.transform = `translateY(${(-n * 18).toFixed(1)}px) scale(${(0.85 + 0.03 * n + 0.04 * latest).toFixed(3)})`;
              const cur = years.filter((y) => T >= y.b - 1e-6).length - 1;
              years.forEach(({ e }, j) => {
                const now = j === cur;
                e.style.color = now ? "#E85D26" : j < cur ? "#888880" : "#505048";
                e.classList.toggle("hr-glow", now);
                if (now) HR.glow(e, T, 0.3, 0.6);
              });
            }

            // g2 — the beam: a bright head drawing to the ninth tick on "here", ticks lighting as it passes
            if (T >= C2 && T < C3) {
              const p = beamP(T), lit = T >= DECADE;
              beam.style.transform = `scaleX(${p.toFixed(4)})`;
              bglow.style.transform = `scaleX(${p.toFixed(4)})`;
              bglow.style.opacity = (lit ? 0.45 + 0.35 * bass + 0.5 * fx.flare : 0).toFixed(3);
              head.style.transform = `translateX(${(BEAMW * p).toFixed(1)}px)`;
              const ign = env(T - DECADE, 0.25);
              head.style.opacity = lit ? "1" : (0.25 + 0.25 * HR.hit("kick", T, 0.2)).toFixed(3);
              halo.style.transform = `scale(${(0.8 + 0.25 * bass + 0.6 * ign + 0.9 * fx.flare).toFixed(3)})`;
              streak.style.transform = `scaleX(${(lit ? 0.7 + 0.5 * clamp01((T - DECADE) / D2) + 0.8 * fx.flare : 0.2).toFixed(3)})`;
              streak.style.opacity = lit ? "1" : "0.3";
              ticks.forEach(({ t: tk, n }, i) => {
                const ct = crossT(i), passed = i <= 8 && T >= ct && lit;
                const f = passed ? env(T - ct, 0.28) : 0;
                tk.style.backgroundColor = passed ? "#E85D26" : i === 9 ? "#F0ECE5" : "#888880";
                tk.style.boxShadow = passed ? `0 0 ${(6 + 22 * f).toFixed(1)}px rgba(232, 93, 38, ${(0.5 + 0.5 * f).toFixed(2)})` : "none";
                n.style.color = passed ? "#E85D26" : i === 9 ? "#888880" : "#505048";
                if (i !== 8) tk.style.transform = `scaleY(${(1 + 0.6 * f).toFixed(3)})`;
              });
            }

            // g3 — the passwords re-type on every beat: a flicker, then a scanning cursor; drawer 0001 stays exactly as it is
            if (T >= C3 && T < C4) {
              const stepF = Math.floor(t * 60);
              for (const { box, ds, caret, scan, f } of fields) {
                let k = -1;
                for (let i = 0; i < G3B.length; i++) if (T >= G3B[i] + f * 0.05) k = i;
                const len = pwLen(f, k), dt = k < 0 ? 9 : T - G3B[k] - f * 0.05;
                const shown = k < 0 ? len : Math.min(len, Math.floor(Math.max(0, dt - 0.08) / 0.026));
                const flick = dt < 0.1;
                ds.forEach((d, i) => { d.style.opacity = i < (flick ? pwLen(f, k - 1) : shown) ? (flick ? (stepF % 2 ? 0.25 : 0.9) : 1) : 0; });
                caret.style.left = (150 + shown * 25 + 2) + "px";
                caret.style.opacity = shown < len || Math.floor(t * 4) % 2 === 0 ? 1 : 0;
                const sweep = k >= 0 && dt < 0.08 + len * 0.026 + 0.15;
                scan.style.left = (150 + shown * 25) + "px";
                scan.style.opacity = sweep ? "1" : "0";
                const hotB = T >= PASS ? 0.75 + 0.25 * env(T - PASS, 0.4) : 0;
                const fl = flick ? 1 : env(dt, 0.12) * 0.6;
                box.style.borderColor = hotB || fl > 0.3 ? "#E85D26" : "#3a3a36";
                box.style.boxShadow = `inset 0 3px 8px rgba(0, 0, 0, 0.6), 0 0 ${(4 + 20 * Math.max(fl, hotB * 0.6)).toFixed(1)}px rgba(232, 93, 38, ${(0.5 * Math.max(fl, hotB * 0.7)).toFixed(3)})`;
              }
              dlight.style.opacity = "1";
            }

            // g4 — the stamp's light: a flare on impact, then a slow bass breath
            if (T >= C4) {
              stampwrap.style.setProperty("--hr-glow", (0.4 + 0.5 * bass + 1.6 * fx.tflare).toFixed(3));
              tlight.style.opacity = (0.55 + 0.3 * bass + 0.9 * fx.tflare).toFixed(3);
              tlight.style.transform = `scale(${(0.9 + 0.08 * bass + 0.2 * fx.tflare).toFixed(3)})`;
            }

            // v12 g4: the three shots
            if (T >= XA) {
              for (const r of xBig) HR.glow(r, T, 0.35, 0.7);
              const e3 = (x) => 1 - Math.pow(1 - clamp01(x), 3), shake = (t0, k) => { const d = T - t0; return d < 0 ? [0, 0] : [Math.sin(d * 90) * k * Math.exp(-d / 0.09), Math.cos(d * 77) * k * 0.7 * Math.exp(-d / 0.09)]; };
              if (T < XB) {
                const u = clamp01((T - XA) / (XB - XA));
                $("f06x-bp").style.clipPath = `inset(0 0 ${(100 * (1 - e3((T - XA) / 0.24))).toFixed(1)}% 0)`;
                bpPaths.forEach((p, i) => p.setAttribute("stroke-dashoffset", (100 * (1 - e3((T - XA - 0.04 - i * 0.016) / 0.32))).toFixed(1)));
                const [kx, ky] = shake(73.22, 10);
                $("f06x-ca").style.transform = `translate(${kx.toFixed(1)}px, ${ky.toFixed(1)}px) scale(${(1.1 - 0.08 * e3(u)).toFixed(4)}) rotate(${(-1.5 + 1.5 * e3(u)).toFixed(3)}deg)`;
              } else if (T < XC) {
                const u = clamp01((T - XB) / (XC - XB));
                flames.forEach(({ g, f, k }) => {
                  const on = clamp01((T - LIGHT[k]) / 0.06);
                  g.setAttribute("opacity", on.toFixed(3));
                  f.setAttribute("transform", `scale(${(1 + 0.08 * Math.sin(T * 23 + k)).toFixed(3)} ${(1 + 0.14 * Math.sin(T * 31 + k * 2) + 0.4 * Math.exp(-Math.max(0, T - LIGHT[k]) / 0.08)).toFixed(3)})`);
                });
                let kx = 0, ky = 0;
                for (const l of LIGHT) { const [a, b2] = shake(l, 5); kx += a; ky += b2; }
                $("f06x-cb").style.transform = `translate(${kx.toFixed(1)}px, ${ky.toFixed(1)}px) scale(${(1 + 0.07 * u).toFixed(4)})`;
              } else {
                const fall = (t0) => { const q = clamp01((T - t0) / 0.34); return -110 + 680 * q * q; };
                drRoll.setAttribute("transform", `translate(1150 ${fall(XC).toFixed(1)}) rotate(${(-8 + 30 * clamp01((T - XC) / 0.32)).toFixed(1)})`);
                drCake.setAttribute("transform", `translate(1440 ${fall(XC + 0.12).toFixed(1)}) rotate(${(6 - 14 * clamp01((T - XC - 0.12) / 0.32)).toFixed(1)})`);
                const close = clamp01((T - (SLAM - 0.1)) / 0.1), cl = close * close * close, d = T - SLAM;
                const bounce = d > 0 ? 10 * Math.exp(-d / 0.08) * Math.cos(d * 40) : 0;
                drFront.setAttribute("transform", `translate(0 ${(-120 * cl + bounce).toFixed(1)})`);
                const lit = T >= SLAM ? 0.55 + 0.25 * Math.sin(T * 17) + 0.15 * Math.sin(T * 29) : 0;
                drLeak.setAttribute("y", "250"); drLeak.setAttribute("height", "52"); drLeak.setAttribute("opacity", lit.toFixed(3));
                drLeak.setAttribute("transform", "scale(1 -1) translate(0 -552)");
                let kx = 0, ky = 0;
                for (const [t0, k] of [[SLAM, 14], [75.02, 22], [TRUE2, 18]]) { const [a, b2] = shake(t0, k); kx += a; ky += b2; }
                const push = 1 + 0.05 * clamp01((T - XC) / (END - XC)) + 0.08 * Math.pow(clamp01((T - (END - 0.3)) / 0.3), 2);
                $("f06x-cc").style.transform = `translate(${kx.toFixed(1)}px, ${ky.toFixed(1)}px) scale(${push.toFixed(4)})`;
                for (const id of ["f06x-st1", "f06x-st2"]) $(id).style.setProperty("--hr-glow", (0.4 + 0.5 * bass).toFixed(3));
                for (const k of inks) {
                  const q = T - k.t0; if (q < 0) { k.d.style.opacity = "0"; continue; }
                  const e = 1 - Math.exp(-q / 0.08);
                  k.d.style.transform = `translate(${(k.dx * 0.35 * e).toFixed(1)}px, ${(k.dy * 0.35 * e + 300 * q * q).toFixed(1)}px) scale(${k.s.toFixed(2)})`;
                  k.d.style.opacity = (0.9 * (1 - clamp01((q - 0.4) / 0.4))).toFixed(3);
                }
              }
            }
          }
          function beamP(T) { const u = clamp01((T - DECADE) / D2); return u * u; }
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["06-qubits"] = tl;
        })();
      </script>
    </template>
  </body>
