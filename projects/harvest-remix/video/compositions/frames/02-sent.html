              $("f02-tlsk").textContent = st[1];
              $("f02-tls").textContent = st[2];
              $("f02-sendt").textContent = locked ? "SENT" : "SEND";
              $("f02-stt").textContent = locked ? "SENT 14:02 · CONNECTION SECURE · TLS 1.3" : T >= PAD ? "CONNECTION SECURE · TLS 1.3 · X25519" : "HANDSHAKE · TLS 1.3 · X25519 · AES-256-GCM";
              $("f02-stdot").setAttribute("fill", T >= PAD ? "#E85D26" : "#505048");
              $("f02-light2").style.opacity = ((T >= PAD ? 0.8 : 0.4) + 0.4 * bass).toFixed(3);
              // outgoing packets on the fibre below: faster and brighter once sent
              const sp = locked ? 1500 : 900;
              pks.forEach((e, k) => { e.style.transform = `translateX(${(((t * sp + k * 760) % 2600) - 400).toFixed(1)}px)`; e.style.opacity = (T >= PAD ? 0.95 : 0.5).toFixed(2); });
              $("f02-outcore").setAttribute("opacity", (0.3 + (T >= PAD ? 0.3 : 0) + 0.3 * bass).toFixed(3));
              // the marker voice: the arrow draws on, then "(it isn't)" is written left to right
              const ap = clamp01((t - L(NOTE)) / 0.22), mp = clamp01((t - L(NOTE) - 0.12) / 0.3);
              arrow.style.strokeDashoffset = (100 * (1 - ap)).toFixed(1);
              mark1.style.clipPath = `inset(-20% ${(100 - mp * 100).toFixed(1)}% -30% -5%)`;
              // the popover's fine print types on after "done"
              $("f02-fine").style.clipPath = `inset(-20% ${(100 - clamp01((T - DONE - 0.25) / 0.35) * 100).toFixed(1)}% -20% 0)`;
            }
          }
          tl.eventCallback("onUpdate", render);
          tl.seek(0); render();
          window.__timelines["02-sent"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
