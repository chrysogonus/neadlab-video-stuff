              '<g fill="none" stroke="#C8481A" opacity="0.8"><circle r="104" stroke-width="5"/><circle r="62" stroke-width="2.5"/></g>' +
              '<text font-family="IBM Plex Mono" font-weight="600" font-size="19" letter-spacing="3.4" fill="#C8481A" opacity="0.85"><textPath href="#f02-pmp">A-TO-B MAIL · SENT · A-TO-B MAIL · SENT ·</textPath></text>' +
              '<text y="-6" text-anchor="middle" font-family="IBM Plex Mono" font-weight="600" font-size="22" fill="#C8481A" opacity="0.85">09 MAR</text>' +
              '<text y="22" text-anchor="middle" font-family="IBM Plex Mono" font-weight="600" font-size="22" fill="#C8481A" opacity="0.85">2021</text>';
          })();

          // lyric words
          const words = [];
          const addW = (parent, w, t) => { const s = el("span", "f02-w", parent, w); words.push([s, L(t)]); return s; };
          W0.forEach(([w, t]) => addW($("f02-l0a"), w, t));
          const r1 = document.querySelector("#f02-l1 .f02-r1"), r2 = document.querySelector("#f02-l1 .f02-r2");
          W1.forEach(([w, t]) => { const s = addW(r1, w, t); if (w === "green") s.id = "f02-green"; });
          const padW = el("span", "f02-w", r2, "padlock");
          WP1.forEach(([w, t]) => addW($("f02-p1"), w, t));
          WP2.forEach(([w, t]) => addW($("f02-p2"), w, t));

          // ---- timeline -----------------------------------------------------------------------------------------
          const tl = gsap.timeline({ paused: true });
          tl.fromTo({ t: 0 }, { t: 0 }, { t: DUR, duration: DUR, ease: "none" }, 0); // the timeline spans the frame
          const host = document.getElementById("el-02-sent") || $("root");
          WOW.transition(tl, host, { in: "pushIn", out: "glideL", dur: 0.46, total: DUR });

          // lead words: soft entrances on their own times (verse)
          words.forEach(([s, t]) => WOW.word(tl, s, t, { kind: "rise", dur: 0.4 }));

          // A — the page creeps in while the line types; "tuesday," is the hero (one soft punch on the page)
          tl.fromTo("#f02-page", { scale: 1, y: 0 }, { scale: 1.05, y: -14, duration: DIVE, ease: "sine.inOut" }, 0);
          WOW.word(tl, $("f02-tues"), L(TUES), { kind: "settle", dur: 0.46 });
          WOW.punch(tl, $("f02-tues"), L(TUES), { s: 1.04, dur: 0.5 });
          // the marker: "Tue," circled on the downbeat kick, the note written after it
          const CIRC0 = L(9.814), NOTE0 = L(10.0);
          tl.fromTo("#f02-circ", { attr: { "stroke-dashoffset": 100 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.26, ease: "power2.inOut", immediateRender: false }, CIRC0);
          tl.fromTo("#f02-arA", { attr: { "stroke-dashoffset": 100 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.16, ease: "power2.out", immediateRender: false }, CIRC0 + 0.2);
          tl.set("#f02-note", { clipPath: "inset(-30% 100% -40% -5%)" }, 0);
          tl.fromTo("#f02-note", { clipPath: "inset(-30% 100% -40% -5%)" }, { clipPath: "inset(-30% 0% -40% -5%)", duration: 0.3, ease: "none", immediateRender: false }, NOTE0);
          // the dive into the year on the 10.255 snare: the page rushes past the camera, the reels arrive
          const D1 = L(10.6);
          tl.fromTo("#f02-page", { scale: 1.05, y: -14, filter: "blur(0px)" }, { scale: 7, y: -14, filter: "blur(10px)", duration: D1 - DIVE, ease: "power3.in", immediateRender: false }, DIVE);
          tl.fromTo("#f02-page", { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "none", immediateRender: false }, DIVE + 0.16);
          tl.fromTo("#f02-reels", { opacity: 0, scale: 0.42, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: D1 - DIVE - 0.16, ease: "power2.out", immediateRender: false }, DIVE + 0.16);
          tl.fromTo("#f02-reels", { scale: 1 }, { scale: 1.045, duration: SB - D1, ease: "none", immediateRender: false }, D1);
          // the second reel rolls 19 → 20 → 21, landing on "twenty-one"; one soft punch on the kick that follows
          const ROLL = $("f02-roll");
          tl.set(ROLL, { y: -1120 }, 0);
          tl.fromTo(ROLL, { y: -1120, filter: "blur(0px)" }, { y: -2264, filter: "blur(3px)", duration: L(TW1) - L(10.62), ease: "power2.in", immediateRender: false }, L(10.62));
          tl.fromTo(ROLL, { y: -2264, filter: "blur(3px)" }, { y: -2240, filter: "blur(0px)", duration: 0.45, ease: "elastic.out(1, 0.5)", immediateRender: false }, L(TW1));
          WOW.word(tl, $("f02-c1"), L(TW), { kind: "rise", dur: 0.4 });
          WOW.word(tl, $("f02-c2"), L(TW1), { kind: "settle", dur: 0.42 });
          WOW.punch(tl, $("f02-w2"), L(TW1), { s: 1.03, dur: 0.45 });
          WOW.punch(tl, $("f02-reels"), L(11.179), { s: 1.012, dur: 0.4 });
          tl.fromTo("#f02-yf", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out", immediateRender: false }, L(11.644));

          // the cut to B on the line start
          tl.set("#f02-sA", { opacity: 0 }, SB);
          tl.set("#f02-sB", { opacity: 1 }, SB);
          tl.set("#f02-sB", { opacity: 0 }, 0);

          // B — "padlock" settles on its word as the push arrives; the popover opens on "said"
          WOW.word(tl, padW, L(PAD), { kind: "settle", dur: 0.46 });
          const POP = L(13.844) - 0.12;
          tl.fromTo("#f02-pop", { opacity: 0, scale: 0.9, x: -30 }, { opacity: 1, scale: 1, x: 0, duration: 0.34, ease: "power3.out", immediateRender: false }, POP);
          tl.set("#f02-pop", { opacity: 0 }, 0);
          tl.set("#f02-foot", { opacity: 0 }, 0);
          tl.fromTo("#f02-foot", { opacity: 0 }, { opacity: 1, duration: 0.4, immediateRender: false }, POP + 0.4);
          WOW.word(tl, $("f02-done"), L(DONE), { kind: "settle", dur: 0.42 });
          // "done": the shackle shuts — the frame's one weighted accent (a soft punch, one thin green ring, the tick)
          const SH = $("f02-shackle");
          tl.set(SH, { y: -46 }, 0);
          tl.fromTo(SH, { y: -46 }, { y: 4, duration: 0.12, ease: "power3.in", immediateRender: false }, L(DONE) - 0.12);
          tl.fromTo(SH, { y: 4 }, { y: 0, duration: 0.35, ease: "elastic.out(1, 0.45)", immediateRender: false }, L(DONE));
          WOW.punch(tl, $("f02-lockpos"), L(DONE), { s: 1.04, dur: 0.5 });
          // v20: before "done" the shackle clicks on the hats: a rattle down and a spring back (it stays open)
          const CLICKS = HR_ENV.onsets.hat.filter(([t, a]) => t > PAD && t < DONE - 0.5 && a > 0.4).map(([t, a]) => [L(t), a]);
          CLICKS.forEach(([c, a]) => {
            const d = -46 + 16 * a;
            tl.fromTo(SH, { y: -46 }, { y: d, duration: 0.05, ease: "power2.in", immediateRender: false }, c - 0.05);
            tl.fromTo(SH, { y: d }, { y: -46, duration: 0.32, ease: "elastic.out(1, 0.4)", immediateRender: false }, c);
          });
          tl.fromTo("#f02-ph i", { opacity: 0, scale: 2 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, L(DONE));
          const ring = el("div", "", $("f02-fxB"));
          Object.assign(ring.style, { position: "absolute", left: "-100px", top: "-100px", width: "200px", height: "200px", borderRadius: "50%",
            border: "3px solid rgba(61,220,122,0.9)", boxShadow: "0 0 24px rgba(61,220,122,0.5)", opacity: "0" });
          tl.fromTo(ring, { opacity: 1, scale: 0.6 }, { opacity: 0, scale: 5, duration: 0.9, ease: "expo.out", immediateRender: false }, L(DONE));
          // the marker answers
          tl.fromTo("#f02-arB", { attr: { "stroke-dashoffset": 100 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.18, ease: "power2.out", immediateRender: false }, NOTE_B);
          tl.set("#f02-markB", { clipPath: "inset(-30% 100% -40% -5%)" }, 0);
          tl.fromTo("#f02-markB", { clipPath: "inset(-30% 100% -40% -5%)" }, { clipPath: "inset(-30% 0% -40% -5%)", duration: 0.32, ease: "none", immediateRender: false }, NOTE_B + 0.12);
          // the verse's kick pulse, small
          WOW.pulse(tl, $("f02-l1"), { kind: "kick", amt: 0.01, y: 2 });

          // ---- per-frame draw -------------------------------------------------------------------------------------
          // the push into the address bar's padlock: the browser scales about the icon (in log space, so the speed reads
          // constant) while the icon travels to its place left of the popover; the padlock is drawn big and starts at 1/17
          const ICON = [292, 421], LOCK = [560, 404], P0 = 36 / 330, ZEND = 0.9 / P0, PUSH0 = SB, PUSH1 = L(PAD);
          const chrome = $("f02-chrome"), lockpos = $("f02-lockpos"), glow = $("f02-gl");
          function render() {
            const t = tl.time(), T = t + T0;
            WOW.draw(tl, T0);
            if (t < SB) return;
            const u = sineIO((t - PUSH0) / (PUSH1 - PUSH0)), Z = Math.exp(u * Math.log(ZEND));
            const cx = ICON[0] + (LOCK[0] - ICON[0]) * u, cy = ICON[1] + (LOCK[1] - ICON[1]) * u;
            const drift = t > PUSH1 ? 1 + 0.035 * (t - PUSH1) / (DUR - PUSH1) : 1;
            // v20: the lock breathes from "padlock" (one swell a bar, eased in) and ticks on each click
            const bin = clamp01((t - PUSH1) / 0.6), ph = 2 * Math.PI * (T - 13.493) / 1.849;
            const breath = bin * (0.5 - 0.5 * Math.cos(ph)), sway = bin * Math.sin(ph);   // sway moves while the swell turns
            let tick = 0; for (const [c, a] of CLICKS) if (t >= c) tick = Math.max(tick, a * Math.exp(-(t - c) / 0.12));
            chrome.style.transform = `translate(${(cx - Z * ICON[0]).toFixed(2)}px, ${(cy - Z * ICON[1]).toFixed(2)}px) scale(${Z.toFixed(4)})`;
            chrome.style.opacity = (1 - clamp01((u - 0.72) / 0.22)).toFixed(3);
            const bz = 1 + 0.045 * breath + 0.025 * tick;
            lockpos.style.transform = `translate(${(cx + 22 * sway).toFixed(2)}px, ${(cy - 10 * breath).toFixed(2)}px) rotate(${(1.8 * sway).toFixed(3)}deg) scale(${(P0 * Z * drift * bz).toFixed(4)})`;
            const ft = $("f02-fxB"); ft.style.transform = `translate(${cx.toFixed(1)}px, ${(cy + 60).toFixed(1)}px)`;
            const g = 0.55 + 0.35 * HR.band("bass", T) + 0.45 * breath + 0.4 * tick + 0.5 * Math.exp(-Math.max(0, t - L(DONE)) * 3) * (t >= L(DONE) ? 1 : 0);
            glow.style.opacity = (u * g).toFixed(3);
            glow.style.transform = `translate(${(cx - 560).toFixed(1)}px, ${(cy - 404).toFixed(1)}px)`;
          }
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["02-sent"] = tl;
        })();
      </script>
    </template>
  </body>
