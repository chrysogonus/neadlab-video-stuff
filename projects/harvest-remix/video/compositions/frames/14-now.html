  E.push({a,line});}

  const m=[(p[0]+q[0])/2,(p[1]+q[1])/2],l=Math.hypot(m[0],m[1]),k=(l+(cr()-.5)*3.5)/l;return[m[0]*k,m[1]*k];});

  pieces.push({poly:[e[0],e[1],M1[i],n[1]],rim:[0,0,0,0],kind:0});

  let vx=Math.cos(a)*sp,vy=Math.sin(a)*sp-200;vx*=awayFromWord(vx,vy);sparks.push({p,vx,vy,life:.22+cs()*.36,hot:cs()<.4});}

const kickStep=t=>.12*sstep((t-KICK)/.08);
const radialGrow=i=>{const t0=.02+((i*3)%N)/N*.18;return t=>clamp(Math.pow(clamp((t-t0)/.5),1.35)+kickStep(t)*clamp((t-t0)*8));};

const ringGrow=(i,r)=>t=>clamp(Math.pow(clamp((t-(r===12?.36:.44)-i*.012)/.18),1.2));
function partial(c,pl,f){   // a polyline drawn up to fraction f of its length
  const seg=[];let tot=0;for(let i=1;i<pl.length;i++){const l=Math.hypot(pl[i][0]-pl[i-1][0],pl[i][1]-pl[i-1][1]);seg.push(l);tot+=l;}

  E.forEach((e,i)=>{const re=rimAt(e.a);out.push([[...e.line,re],grow[i](t)]);});
  E.forEach((e,i)=>{const n=E[(i+1)%N].line;out.push([[e.line[1],M1[i],n[1]],ringGrow(i,12)(t)]);out.push([[e.line[3],M2[i],n[3]],ringGrow(i,40)(t)]);});

// ---- timeline ------------------------------------------------------------------------------------------------

function sealXf(c,sw,jx,jy){c.setTransform(U*sw,0,0,U*sw,CX+jx,CY+jy);}

  if(Math.abs(sp)>.04){for(let j=0;j<scr.length;j++){const P=scr[j],Q=scr[(j+1)%scr.length];
    const nx=Q[1]-P[1],ny=P[0]-Q[0],nl=Math.hypot(nx,ny)||1,lit=clamp(.5+.5*(-(nx*.6+ny*.8)/nl));
