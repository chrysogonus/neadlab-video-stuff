const L=t=>+(t-T0).toFixed(3),clamp=x=>Math.max(0,Math.min(1,x));

  rim+=(k?"L":"M")+(Math.cos(a)*q).toFixed(2)+" "+(Math.sin(a)*q).toFixed(2);}

<circle r="43.5" fill="none" stroke="rgba(255,206,176,0.38)" stroke-width="1.2" transform="translate(0.8 0.8)"/>
<circle r="41" fill="rgba(17,17,17,0.06)" stroke="rgba(17,17,17,0.30)" stroke-width="2.4"/>${beads}

<text x="-1.1" y="12.4" text-anchor="middle" font-family="Barlow" font-weight="900" font-size="40" fill="rgba(255,214,188,0.5)">a.</text>
<text x="0" y="13.8" text-anchor="middle" font-family="Barlow" font-weight="900" font-size="40" fill="#D4521E">a.</text>
<path d="M-38 -24 A44 44 0 0 1 -8 -45" fill="none" stroke="rgba(255,236,224,0.6)" stroke-width="3.5" stroke-linecap="round"/>
<path d="M30 34 A44 44 0 0 1 12 44" fill="none" stroke="rgba(255,236,224,0.22)" stroke-width="2" stroke-linecap="round"/>`;
$("f14-art").innerHTML=ART;
$("f14-rimonly").setAttribute("d",rim+"Z");$("f14-rimclip").setAttribute("d",rim+"Z");

// ---- the fracture: 7 radial cracks from the impact point cut the wax into 7 inner wedges and 7 outer pieces (14 shards) ----------
const N=7,cr=HR.rng(1403),fx=$("f14-fx"),sdefs=$("f14-sdefs");
const f2=v=>v.toFixed(2),P=p=>p.map(([x,y])=>f2(x)+","+f2(y)).join(" ");

for(let i=0;i<N;i++){const a=(i+.5*(cr()-.5))/N*Math.PI*2,line=[[0,0]];
  [9,21,40,75].forEach((r,j)=>{const aa=a+(j<3?(cr()-.5)*.28:0),rr=r+(j<3?(cr()-.5)*3:0);line.push([Math.cos(aa)*rr,Math.sin(aa)*rr]);});
  E.push(line);}

  polys.push([[0,0],e[1],e[2],e[3],mid[i],n[3],n[2],n[1]].map(p=>p.slice()));                       // inner wedge (i)
  polys.push([e[3],e[4],n[4],n[3],mid[i]].map(p=>p.slice()));                                         // outer piece (i), e[3]=v1
}
// outer piece also takes the shoulder between e[3]..e[4] along the crack; inner wedge stops at the ring (e[3], mid, n[3])
const light=[-1,-1];
const shardInfo=polys.map((poly,k)=>{
  const cx=poly.reduce((s,p)=>s+p[0],0)/poly.length,cy=poly.reduce((s,p)=>s+p[1],0)/poly.length;
  S("path",{d:"M"+P(poly).split(" ").join(" L")+"Z"},S("clipPath",{id:"f14-cp"+k},sdefs));
  const g=S("g",{id:"f14-sh"+k},sdefs),cl=S("g",{"clip-path":`url(#f14-cp${k})`},g);
  S("use",{href:"#f14-rimonly",fill:"#5E220B",transform:"translate(1.5 2.4)"},cl);
  S("use",{href:"#f14-art"},cl);
  const bv=S("g",{"clip-path":"url(#f14-rimcp)"},cl);
  poly.forEach((p,j)=>{const q=poly[(j+1)%poly.length],nx=(p[1]-q[1]),ny=(q[0]-p[0]),m=[(p[0]+q[0])/2-cx,(p[1]+q[1])/2-cy];

    S("path",{d:`M${f2(p[0])} ${f2(p[1])} L${f2(q[0])} ${f2(q[1])}`,fill:"none",stroke:lit?"rgba(255,226,206,.55)":"rgba(60,20,6,.8)","stroke-width":lit?1.1:1.5,"stroke-linejoin":"round"},bv);});
  return{k,cx,cy,inner:k%2===0,ang:Math.atan2(cy,cx)};

// per-shard flight: dir, speed, toward-camera growth, spin, tumble (all seeded)
const fr2=HR.rng(1405);

  const out=!si.inner,a=si.ang+(fr2()-.5)*.5,v=out?1700+fr2()*1500:900+fr2()*1100;
  const sh={...si,dx:Math.cos(a),dy:Math.sin(a),v,zv:out?1+fr2()*3:4+fr2()*4,w:(fr2()<.5?-1:1)*(350+fr2()*1000),ps:fr2()*6.28,pw:4+fr2()*6,ph:fr2()*6.28};
  sh.t1=S("use",{href:"#f14-sh"+si.k},$("f14-shardsvg"));sh.t2=S("use",{href:"#f14-sh"+si.k},$("f14-shardsvg"));
  sh.m=S("g",{},$("f14-shardsvg"));S("use",{href:"#f14-sh"+si.k},sh.m);
  const og=S("g",{"clip-path":"url(#f14-cp"+si.k+")"},sh.m);sh.ov=S("use",{href:"#f14-rimonly",fill:"#000","fill-opacity":0},og);
  return sh;});

  const drag=1.4,d=sh.v*(1-Math.exp(-drag*tau))/drag,x=sh.dx*d,y=sh.dy*d+260*tau*tau,s=S0*(1+sh.zv*tau);
  const rot=sh.w*tau,c=Math.cos(sh.ps+sh.pw*tau),sy=(c<0?-1:1)*Math.max(Math.abs(c),.1);
  e.setAttribute("transform",`translate(${f2(CX+x)} ${f2(CY+y)}) rotate(${f2(rot)}) scale(${f2(KS*s)} ${f2(KS*s*sy)}) translate(${f2(-sh.cx)} ${f2(-sh.cy)})`);

}

// ---- cracks (drawn on in the pressure phase, then the wax comes apart along them) --------------------------------------
const crk=$("f14-crack"),cl=[];
const clen=pl=>{let l=0;for(let i=1;i<pl.length;i++)l+=Math.hypot(pl[i][0]-pl[i-1][0],pl[i][1]-pl[i-1][1]);return l;};

E.forEach((e,i)=>crack([e[3],mid[i],E[(i+1)%N][3]],.3+i*.03,.16));

  return{a,e:S("line",{stroke:i%2?"#F0ECE5":"#E85D26","stroke-width":3,"stroke-linecap":"round",opacity:0},$("f14-rays"))};});

const tl=gsap.timeline({paused:true});
const stage=HR.stage(root,{seed:14,drift:1}),cam=stage.cam;cam.focus=.45;

tl.fromTo(cam,{z:1.03,rot:0},{z:1.08,rot:-.9,duration:.05,ease:"power3.out",immediateRender:false},LD);

tl.fromTo(cam,{focus:.45},{focus:.15,duration:DUR-LD,ease:"power2.in",immediateRender:false},LD);

WOW.flash(tl,root,LD,{color:"cream",a:.62,dur:.12});

// ---- per-frame draw (all from timeline time) -----------------------------------------------------------------

const kick=$("f14-kicker"),label=$("f14-label"),ticks=$("f14-ticks"),dec=$("f14-dec"),now=$("f14-now");

    r.e.setAttribute("x1",(CX+r.c*d).toFixed(1));r.e.setAttribute("y1",(CY+r.s*d).toFixed(1));
    r.e.setAttribute("x2",(CX+r.c*(d+len)).toFixed(1));r.e.setAttribute("y2",(CY+r.s*(d+len)).toFixed(1));
    r.e.setAttribute("opacity",(op*fade*r.w).toFixed(3));}

  const sc=1+.14*Math.pow(u,2.2)+.02*kk*u;
  const jx=(Math.sin(t*97)+.6*Math.sin(t*53+1))*amp*.6,jy=(Math.sin(t*89+2)+.6*Math.sin(t*61))*amp*.6;
  seal.style.transform=`translate(${(jx*KS).toFixed(1)}px,${(jy*KS).toFixed(1)}px) scale(${sc.toFixed(4)})`;
  seal.style.display=broke?"none":"";
  const leak=Math.pow(u,2);
