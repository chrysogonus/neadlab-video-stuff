         and a tap clamp hovering open over the bare fibre. The lyric rides strands of fibre laid parallel to the
         cable: each word arrives as a light pulse and rises out of its strand. On "copy" the clamp slams shut and
         the light forks into a copy fibre that prints the copy; Archie (v12, first appearance) rises in from the
         bottom-right on "myself", lights the copy with his eyes, and files it into the cold store on "ice".
         v13 (SYSTEM.md V7): black ground (no cable duct, ciphertext wall, bokeh or wide orange wash; the core's glow sits
         tight on the tap); the tap carries a paper tag on a string, "TAP 07 · RETENTION: INDEFINITE · REASON: JUST IN
         CASE", and the cold store's front reads "COLD STORAGE ≈ $0.001/GB·MONTH"; on "ice" (22.96) the word lands
         cold and frost grows across its glyphs (seeded crystal texture clipped to the type, dendrites off its edges).
         v15: the attached longitudinal cable cutaway replaces the ambiguous concentric section. The sole printer
         is Archie’s chest; a narrow scanning beam follows the real emerging copy, then it is held and filed.
         v16 (V16.md §3): three shots. A (16.06–19.74): the camera dollies fast along the real cable and the bare fibre,
         pulses and hex rush past, "read" fails under strike bars, a whip to the open clamp. B (19.74–22.0): the clamp
         slams on "copy" (explosion, shake, flash), Archie prints the copy. C (22.0–23.656): the copy falls into the cold

          const cracks = [];

          const rushEl = $("f16-rush"), rr = HR.rng(1650), RUSH = [];
