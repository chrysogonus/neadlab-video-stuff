         - 160.058 the opening instant is v20's (the cut from 23 matches 23's cracked seal onto the envelope's seal); the
           camera pushes into the client (log-space zoom about the seal, power2.inOut, landing 160.74) until the browser fills
           ~75 % of the frame; a cursor drifts onto the address bar's padlock and hovers it.
         - 160.58 the lock's tooltip drops open (lands on the 160.755 kick): a cream-paper popover (02's "Connection is secure*", now paper) hanging from
           the padlock. "connection" builds in it on 160.76 beside a big green padlock (02's plant, the film's one second
           colour); "secure." slams across ≥ 60 % of the frame on 161.563. Deadpan rows: KEY EXCHANGE · X25519 · classical,
           RECORDED IN TRANSIT · 1 COPY · archive.nead.
         - 161.873 (downbeat) both padlocks pop open: the shackle springs up and swings off its long leg, chips fly from the
           hinge; the tooltip loses its hook on the lock and swings down and away; the client recedes into the dark.
         - 162.0 the envelope's cracked wax seal pops off and rolls to centre, growing, while the archive's catalogue card
           for OBJ 0001 rises from below; the seal lands on the card on the 162.325 kick (squash, wax drops, the registry
           ring clamps). NEAD is rubber-stamped letter by letter on the bar's four beats: 162.325 / 162.798 / 163.249 /
           163.708. The end card is cream paper under the seal's light (paper whites), on screen 162.3 → 164.4.

                <text data-hf-id="hf-5eed" font-family="IBM Plex Mono" font-weight="500" font-size="12.5" fill="#6b665d"><textPath data-hf-id="hf-hc2y" href="#f15-ringp" textLength="836" lengthAdjust="spacing">OBJ 0001 · SEALED 09.03.2021 · HARVESTED · RETENTION INDEFINITE · X25519 ·</textPath></text>
              </svg>
              <div id="f15-eanchor"></div>

            <div data-hf-id="hf-5x1o" id="f15-nead"><span class="f15-nl">N</span><span class="f15-nl">E</span><span class="f15-nl">A</span><span class="f15-nl">D</span></div>
            <div data-hf-id="hf-pzly" id="f15-rule"><i data-hf-id="hf-wt6k"></i></div>

            <div data-hf-id="hf-zb4u" id="f15-file"><span data-hf-id="hf-9hsl">OBJ 0001</span><svg data-hf-id="hf-gudv" id="f15-bars" viewBox="0 0 190 20" data-layout-ignore></svg><span data-hf-id="hf-sex4">STATUS · READ 1 TIME</span></div>
            <div class="f15-cf" id="f15-cb1" style="left: 40px;">RE: MY LOVE · <em>lovely letter.</em> — THE ARCHIVE</div>

        <div data-hf-id="hf-je0u" class="hr-layer" id="f15-chrome" data-depth="0.2">
          <div data-hf-id="hf-c089" class="f15-kicker" id="f15-kicker" style="position: absolute; left: 5.5cqw; top: 4.2cqw; font-family: 'IBM Plex Mono'; font-weight: 500; font-size: 16px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fire); white-space: nowrap;"><span style="display: inline-block; width: 36px; height: 2px; background: currentColor; vertical-align: middle; margin-right: 16px;"></span>THE SENT FOLDER</div>

      <script src="assets/kit/env.js"></script>
      <script src="assets/kit/hr-kit.js"></script>
      <script src="assets/kit/wow-kit.js"></script>
      <script>
        (() => {
          const T0 = 160.058, DUR = 4.342; // frame span, track seconds
          const L = (t) => +(t - T0).toFixed(3);
          // music: the read receipt on the 160.755 kick; the line's two words; the 161.873 downbeat pops the locks;
          // the bar's four beats (kicks 162.325 / 162.798 / 163.249, downbeat 163.708) land the seal and stamp NEAD
          const READ = 160.75, CONN = 160.76, SEC = 161.563, POP = 161.873;
          const STAMPS = [162.325, 162.798, 163.249, 163.708], LAND = STAMPS[0];
          const $ = (id) => document.getElementById(id);
          const el = (tag, cls, parent, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; parent.appendChild(e); return e; };
          const clamp01 = (x) => Math.max(0, Math.min(1, x));
          const NS = "http://www.w3.org/2000/svg";
          const sv = (tag, parent, attrs, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; parent.appendChild(e); return e; };
          const DPR = Math.min(2, window.devicePixelRatio || 1);

          // ---- static build ---------------------------------------------------------------------------------
          // paper: 01's seeded fibre, baked once (the envelope thumbnail), and a repeating fibre tile for the tooltip and card
          const paper = (w, h, seed, fibres) => {
            const c = document.createElement("canvas"); c.width = w; c.height = h;
            const x = c.getContext("2d", { willReadFrequently: true }), r = HR.rng(seed);
            x.fillStyle = "#F0ECE5"; x.fillRect(0, 0, w, h);
            const img = x.getImageData(0, 0, w, h);
            for (let i = 0; i < img.data.length; i += 4) { const v = (r() - 0.5) * 14; img.data[i] += v; img.data[i + 1] += v; img.data[i + 2] += v * 0.9; }
            x.putImageData(img, 0, 0);
            x.strokeStyle = "rgba(110,100,90,0.10)"; x.lineWidth = 0.6 * (w / 288);
            for (let k = 0; k < fibres; k++) { const px = r() * w, py = r() * h, a = r() * Math.PI, l = (6 + r() * 16) * (w / 288);
              x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(a) * l, py + Math.sin(a) * l * 0.4); x.stroke(); }
            return `url(${c.toDataURL("image/png")})`;
          };
          $("f15-thumb").style.backgroundImage = paper(288, 180, 404, 70);
          const tile = paper(256 * DPR, 256 * DPR, 405, 60);
          $("f15-pop").style.backgroundImage = tile;
          $("f15-card").style.backgroundImage = tile;

          // the rubber stamp's ink: a speckle mask baked once (ink skips on the paper's grain)
          (() => {
            const S = 256 * DPR, c = document.createElement("canvas"); c.width = S; c.height = S;
            const x = c.getContext("2d"), r = HR.rng(1606);
            x.fillStyle = "#000"; x.fillRect(0, 0, S, S);
            x.globalCompositeOperation = "destination-out";
            for (let k = 0; k < 900; k++) { x.fillStyle = `rgba(0,0,0,${(0.25 + r() * 0.75).toFixed(2)})`; x.beginPath();
              x.arc(r() * S, r() * S, (0.4 + r() * r() * 2.6) * DPR, 0, Math.PI * 2); x.fill(); }
            for (let k = 0; k < 40; k++) { x.fillStyle = "rgba(0,0,0,0.22)"; const px = r() * S, py = r() * S;
              x.fillRect(px, py, (8 + r() * 30) * DPR, (0.6 + r()) * DPR); }
            const url = `url(${c.toDataURL("image/png")})`;
            document.querySelectorAll(".f15-nl").forEach((n, i) => {
              n.style.webkitMaskImage = url; n.style.maskImage = url;
              n.style.webkitMaskSize = n.style.maskSize = "256px 256px";
              n.style.webkitMaskPosition = n.style.maskPosition = `${i * 61}px ${i * 37}px`;
            });
          })();

          // the sculpted seal (01), for the thumbnail and the end card; the card's seal carries the thumbnail's crack
          document.querySelectorAll(".f15-sealsvg").forEach((svg, n) => {
            const id = `f15-s${n}`;
            const defs = sv("defs", svg, {});
            const wg = sv("radialGradient", defs, { id: id + "wg", cx: 0.38, cy: 0.34, r: 0.78 });
            [[0, "#F68C5C"], [0.42, "#E85D26"], [0.82, "#C94A1C"], [1, "#A63B14"]].forEach(([o, c]) => sv("stop", wg, { offset: o, "stop-color": c }));
            const wr = sv("radialGradient", defs, { id: id + "wr", cx: 0.5, cy: 0.5, r: 0.5 });
            [[0.82, "#B9431A"], [1, "#8E3010"]].forEach(([o, c]) => sv("stop", wr, { offset: o, "stop-color": c }));
            let d = "";
            const drips = [[0.6, 7], [2.5, 5], [4.4, 8.5]];
            for (let k = 0; k <= 120; k++) {
              const a = (k / 120) * Math.PI * 2;
              let rr = 55.5 + 1.8 * Math.sin(7 * a + 0.5) + 1.2 * Math.sin(13 * a + 2) + 0.7 * Math.sin(23 * a);
              for (const [a0, h] of drips) { const da = Math.atan2(Math.sin(a - a0), Math.cos(a - a0)); rr += h * Math.exp(-(da * da) / 0.012); }
              d += (k ? "L" : "M") + (Math.cos(a) * rr).toFixed(2) + " " + (Math.sin(a) * rr).toFixed(2);
            }
            sv("path", svg, { d: d + "Z", fill: `url(#${id}wr)` });
            sv("circle", svg, { r: 50, fill: `url(#${id}wg)` });
            sv("circle", svg, { r: 43.5, fill: "none", stroke: "rgba(255,206,176,0.38)", "stroke-width": 1.2, transform: "translate(0.8 0.8)" });
            sv("circle", svg, { r: 41, fill: "rgba(17,17,17,0.06)", stroke: "rgba(17,17,17,0.30)", "stroke-width": 2.4 });
            for (let i = 0; i < 30; i++) {
              const a = (i / 30) * Math.PI * 2;
              sv("circle", svg, { cx: (Math.cos(a) * 36.5).toFixed(2), cy: (Math.sin(a) * 36.5).toFixed(2), r: 1.35, fill: "rgba(17,17,17,0.26)" });
            }
            const A = { "text-anchor": "middle", "font-family": "Barlow", "font-weight": 900, "font-size": 40 };
            sv("text", svg, { ...A, x: 1.6, y: 15.4, fill: "rgba(17,17,17,0.36)" }, "a.");
            sv("text", svg, { ...A, x: -1.1, y: 12.4, fill: "rgba(255,214,188,0.5)" }, "a.");
            sv("text", svg, { ...A, x: 0, y: 13.8, fill: "#D4521E" }, "a.");
            sv("path", svg, { d: "M-38 -24 A44 44 0 0 1 -8 -45", fill: "none", stroke: "rgba(255,236,224,0.6)", "stroke-width": 3.5, "stroke-linecap": "round" });
            if (n === 1) {
              const crack = "M-5.6 -63.9 l16.7 27.8 -13.9 19.4 19.4 25 -11.1 25 16.7 22.2";
              sv("path", svg, { d: crack, fill: "none", stroke: "#111111", "stroke-width": 3.4, "stroke-linejoin": "round" });
              sv("path", svg, { d: crack, fill: "none", stroke: "rgba(255,214,188,0.7)", "stroke-width": 1.4, "stroke-linejoin": "round", transform: "translate(2 -2)" });
            }
          });

          // the card's file barcode: the same code as 01's letter (object 0001)
          (() => {
            const r2 = HR.rng(611);
            for (let x = 1, i = 0; i < 38; i++, x += 4.95) {
              const tall = r2() < 0.5;
              sv("rect", $("f15-bars"), { class: "f15-bar", x: x.toFixed(1), y: tall ? 0 : 7, width: 2.2, height: tall ? 20 : 13, fill: "#E85D26" });
            }
          })();

          // ticks on the registry ring; the seal's wax drops
          for (let i = 0; i < 120; i++) {
            const a = (i / 120) * Math.PI * 2, long = i % 10 === 0, r0 = long ? 149 : 152;
            sv("line", $("f15-ticks"), { x1: (Math.cos(a) * r0).toFixed(2), y1: (Math.sin(a) * r0).toFixed(2),
              x2: (Math.cos(a) * 158).toFixed(2), y2: (Math.sin(a) * 158).toFixed(2),
              stroke: i % 30 === 0 ? "#E85D26" : long ? "#6b665d" : "#a49e92", "stroke-width": i % 30 === 0 ? 3 : long ? 1.6 : 1 });
          }
          const edr = HR.rng(1599);
          const edrops = Array.from({ length: 14 }, (_, i) => {
            const d = el("div", "f15-edrop", $("f15-edrops"));
            const a = (i / 14) * Math.PI * 2 + edr() * 0.3, v = 110 + edr() * 120, s = 0.35 + edr() * 0.7;
            return { d, dx: Math.cos(a) * v, dy: Math.sin(a) * v * 0.62 + 18, s };
          });

          // end card glyphs
          const titleG = HR.glyphs($("f15-t1")).concat(HR.glyphs($("f15-t2")));
          titleG.forEach((g) => { g.dataset.ch = g.textContent; });
          const letters = Array.from(document.querySelectorAll(".f15-nl"));
          const tilt = [-1.6, 1.1, -0.7, 1.8], nudge = [[0, 3], [-2, -2], [2, 4], [-1, -1]];

          // ---- timeline -------------------------------------------------------------------------------------
          const tl = gsap.timeline({ paused: true });
          const stage = HR.stage($("root"), { seed: 15 });
          const cam = stage.cam;
          const B = { x: 30, y: 0, z: 1.1 };      // the stage camera (v20's opening values)
          const P = { z: 0, rot: 0 };             // punches
          const U = { u: 0 };                     // the push into the client, 0..1
          const Q = { q: 0 };                     // the slow push under the tooltip
          const R = { r: 0 };                     // the client recedes, 0..1
          const PF = { a: 0, y: 0 };              // the tooltip falls off the lock
          const LK = { k: 0 };                    // the shackles pop
          const CU = { x: 1530, y: 760 };         // the cursor (objs px)
          const CARD = { y: 860, k: 0 };          // the card rises; k = impact recoil (px)
          const seg = (o, from, to, a, b, ease) => tl.fromTo(o, from, { ...to, duration: Math.max(0.01, b - a), ease, immediateRender: false, force3D: false }, a);
          const punch = (t, z, rot, settle = 0.55) => {
            tl.fromTo(P, { z: 0, rot: 0 }, { z, rot, duration: 0.06, ease: "power3.out", immediateRender: false }, t);
            tl.fromTo(P, { z, rot }, { z: 0, rot: 0, duration: settle, ease: "elastic.out(1, 0.5)", immediateRender: false }, t + 0.06);
          };

          // 1 — the push: log-space zoom about the envelope's seal, the stage camera settling with it
          seg(U, { u: 0 }, { u: 1 }, 0, 0.68, "power2.inOut");
          seg(B, { z: 1.1, x: 30 }, { z: 1.0, x: 0 }, 0, 0.68, "power2.inOut");
          seg(Q, { q: 0 }, { q: 0.04 }, 0.68, L(POP), "sine.inOut");
          HR.exit(tl, $("f15-kicker"), 0.1, { dir: -1, dur: 0.3 });
          // the cursor drifts onto the padlock and hovers it; the hover lights the icon's background
          tl.fromTo("#f15-cur", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none", immediateRender: false }, 0.12);
          seg(CU, { x: 1530, y: 760 }, { x: 1074, y: 249 }, 0.12, 0.5, "power2.inOut");
          seg(CU, { x: 1074, y: 249 }, { x: 1079, y: 253 }, 0.5, L(POP), "sine.inOut");
          tl.fromTo("#f15-hover", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none", immediateRender: false }, 0.46);
          // the read receipt flips on the kick
          tl.fromTo("#f15-status", { scale: 1.25, svgOrigin: "1707 307" }, { scale: 1, duration: 0.4, ease: "elastic.out(1, 0.5)", immediateRender: false }, L(READ));

          // 2 — the tooltip drops open from its arrow; the line builds in it
          seg("#f15-pop", { opacity: 0, scaleX: 0.55, scaleY: 0.1 }, { opacity: 1, scaleX: 1, scaleY: 1 }, L(160.58), L(160.755), "power3.out");
          HR.lead(tl, $("f15-pl1"), L(CONN));
          const heroG = HR.hero(tl, $("f15-pl2"), L(SEC), { spread: 30, over: 1.2, sharp: true });
          punch(L(SEC), 0.03, -0.4, 0.6);
          tl.set(["#f15-pr1", "#f15-pr2"], { clipPath: "inset(-20% 100% -20% 0)" }, 0);
          tl.fromTo("#f15-pr1", { clipPath: "inset(-20% 100% -20% 0)" }, { clipPath: "inset(-20% 0% -20% 0)", duration: 0.32, ease: "steps(16)", immediateRender: false }, L(160.95));
          tl.fromTo("#f15-pr2", { clipPath: "inset(-20% 100% -20% 0)" }, { clipPath: "inset(-20% 0% -20% 0)", duration: 0.36, ease: "steps(18)", immediateRender: false }, L(161.2));
          tl.fromTo("#f15-prule", { scaleX: 0, transformOrigin: "0 50%" }, { scaleX: 1, duration: 0.3, ease: "expo.out", immediateRender: false, force3D: false }, L(160.9));

          // 3 — on the downbeat both padlocks pop open; chips fly off the hinge; the tooltip loses its hook and falls
          tl.fromTo(LK, { k: 0 }, { k: 1, duration: 0.16, ease: "back.out(2.6)", immediateRender: false }, L(POP));
          WOW.burst(tl, $("f15-psparks"), { x: 38, y: 22, t: L(POP), n: 12, speed: 520, size: [3, 8], dur: 0.45, gravity: 900, spread: 120, aim: -120, cream: 0.5, seed: 21 });
          punch(L(POP), 0.015, 0.3, 0.45);
          seg(PF, { a: 0 }, { a: -34 }, L(POP) + 0.02, L(162.14), "power2.in");
          seg(PF, { a: -34 }, { a: -48 }, L(162.14), L(162.34), "power1.out");
          seg(PF, { y: 0 }, { y: 640 }, L(161.95), L(162.32), "power2.in");
          seg(R, { r: 0 }, { r: 1 }, L(161.95), L(162.34), "power2.in");

          // 4 — the seal rolls to centre (render) while the card rises; it lands on the kick
          const ROLL0 = L(162.04), ROLL1 = L(LAND);
          tl.set("#f15-tseal", { opacity: 0 }, ROLL0);
          tl.set("#f15-resid", { opacity: 1 }, ROLL0);
          tl.fromTo("#f15-eseal", { opacity: 1 }, { opacity: 1, duration: 0.01, immediateRender: false }, ROLL0);
          tl.fromTo("#f15-card", { opacity: 1 }, { opacity: 1, duration: 0.01, immediateRender: false }, L(162.06));
          seg(CARD, { y: 860 }, { y: 0 }, L(162.06), L(162.31), "power2.out");

          // the end card: the seal lands (squash, wax drops, the ring clamps), NEAD is stamped on the bar's four beats
          const E0 = L(LAND);
          seg("#f15-eseal", { scaleX: 1, scaleY: 1 }, { scaleX: 1.1, scaleY: 0.9 }, E0, E0 + 0.05, "power2.out");
          seg("#f15-eseal", { scaleX: 1.1, scaleY: 0.9 }, { scaleX: 1, scaleY: 1 }, E0 + 0.05, E0 + 0.5, "elastic.out(1, 0.45)");
          edrops.forEach(({ d, dx, dy, s }, i) => {
            const t0 = E0 + (i % 3) * 0.008;
            tl.fromTo(d, { opacity: 1, x: 0, y: 0, scale: s }, { x: dx, y: dy, duration: 0.34, ease: "power3.out", immediateRender: false }, t0);
          });
          seg("#f15-ring", { opacity: 0, scale: 0.86, rotation: -40 }, { opacity: 1, scale: 1, rotation: 0 }, E0 - 0.1, E0 + 0.5, "power3.out");
          seg("#f15-ring", { rotation: 0 }, { rotation: 9 }, E0 + 0.5, DUR, "none");
          seg("#f15-cwarm", { opacity: 0 }, { opacity: 1 }, E0 - 0.05, E0 + 0.15, "power2.out");
          STAMPS.forEach((T, i) => {
            const t = L(T), n = letters[i];
            tl.fromTo(n, { opacity: 1, scale: 1.16, rotation: tilt[i] * 2, x: nudge[i][0], y: nudge[i][1] - 6 },
              { scale: 1, rotation: tilt[i], x: nudge[i][0], y: nudge[i][1], duration: 0.09, ease: "power3.out", immediateRender: false, force3D: false }, t);
            tl.fromTo(CARD, { k: 0 }, { k: i ? 5 : 12, duration: 0.04, ease: "power2.out", immediateRender: false }, t);
            tl.fromTo(CARD, { k: i ? 5 : 12 }, { k: 0, duration: 0.45, ease: "elastic.out(1, 0.5)", immediateRender: false }, t + 0.04);
            punch(t, i ? 0.01 : 0.022, 0, 0.5);
          });
          seg(B, { z: 1.0 }, { z: 1.07 }, E0, DUR, "sine.inOut");
          seg(B, { y: 0, x: 0 }, { y: -10, x: 24 }, E0, DUR, "sine.inOut");
          tl.fromTo(["#f15-ct1", "#f15-ct2"], { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out", stagger: 0.05, immediateRender: false }, E0 + 0.04);
          tl.set(["#f15-ct1", "#f15-ct2", "#f15-cb1", "#f15-cb2"], { opacity: 0 }, 0);
          seg("#f15-chr", { scaleX: 0 }, { scaleX: 1 }, E0 + 0.02, E0 + 0.36, "expo.out");
          seg("#f15-rule", { scaleX: 0 }, { scaleX: 1 }, E0 + 0.1, E0 + 0.44, "expo.out");
          tl.set(titleG, { opacity: 0 }, 0);
          tl.fromTo(titleG, { opacity: 0, yPercent: 60 }, { opacity: 1, yPercent: 0, duration: 0.2, ease: "expo.out", stagger: 0.007, immediateRender: false }, E0 + 0.12);
          const TITLE_AT = (i) => E0 + 0.14 + i * 0.012 + 0.12;
          tl.fromTo("#f15-file span", { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power2.out", stagger: 0.06, immediateRender: false }, L(STAMPS[1]) + 0.02);
          tl.set(".f15-bar", { scaleY: 0, transformOrigin: "50% 100%" }, 0);
          tl.fromTo(".f15-bar", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.14, ease: "power3.out", stagger: 0.004, immediateRender: false }, L(STAMPS[1]));
          tl.fromTo(["#f15-cb1", "#f15-cb2"], { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power2.out", stagger: 0.08, immediateRender: false }, L(STAMPS[2]) + 0.02);
          tl.set({}, {}, DUR);

          // ---- per-frame draw (all from timeline time) ------------------------------------------------------
          // the stage's layer transform, replicated (HR.stage.apply) so the rolling seal can be placed without measuring
          const layerAt = (d, T) => {
            const dx = Math.sin(T * 0.41 + 15) * 7 + Math.sin(T * 0.13 + 30) * 5;
            const dy = Math.sin(T * 0.33 + 45) * 5 + Math.sin(T * 0.09 + 15) * 4;
            const dr = Math.sin(T * 0.21 + 15) * 0.18;
            const k = HR.hit("kick", T, 0.14) * 0.014;
            return { s: 1 + (cam.z - 1) * d + k * d, tx: -(cam.x + dx) * d, ty: -(cam.y + dy) * d, r: ((cam.rot + dr) * d) * Math.PI / 180 };
          };
          const toScreen = (Lr, x, y) => {
            const vx = x - 960, vy = y - 540, c = Math.cos(Lr.r), s = Math.sin(Lr.r);
            return [960 + Lr.tx + Lr.s * (vx * c - vy * s), 540 + Lr.ty + Lr.s * (vx * s + vy * c)];
          };
          const ZS = 1.62, SX = 1124, SY = 411;           // the seal's place in the client (objs px)
          const A0 = [1124, 389], A1 = [512.7, 411.9];      // its place on screen: the opening instant, the pushed-in frame
          const SEAL_D = 128 * 0.36;                        // the thumbnail seal's box (objs px); the card's is 200
          const objs = $("f15-objs"), popfall = $("f15-popfall"), cur = $("f15-cur"), card = $("f15-card");
          const sealpos = $("f15-esealpos"), roll = $("f15-eroll"), disc = $("f15-eseal");
          const pshk = $("f15-pshk"), ishk = $("f15-ishk"), pl2 = $("f15-pl2"), cwarm = $("f15-cwarm");
          const stt = $("f15-stt"), stbox = $("f15-stbox"), bar = $("f15-bar"), stdot = $("f15-stdot");
          const sineIO = (x) => 0.5 - 0.5 * Math.cos(Math.PI * clamp01(x));
          function render() {
            const t = tl.time(), T = t + T0;
            cam.x = B.x; cam.y = B.y; cam.z = B.z + P.z; cam.rot = P.rot; cam.focus = 1;
            stage.apply(T);
            HR.draw(tl);

            // the client: push (about the seal), slow push and recede (about the frame centre)
            const u = U.u, s = Math.exp(u * Math.log(ZS));
            let tx = A0[0] + (A1[0] - A0[0]) * u - s * SX, ty = A0[1] + (A1[1] - A0[1]) * u - s * SY;
            const m = (1 + Q.q) * (1 - 0.24 * R.r);
            tx = 960 + m * (tx - 960); ty = 540 + m * (ty - 540) + 30 * R.r;
            const S = s * m;
            objs.style.transform = `translate(${tx.toFixed(2)}px, ${ty.toFixed(2)}px) scale(${S.toFixed(5)})`;
            objs.style.opacity = (1 - R.r).toFixed(3);
            popfall.style.transform = `translate(0px, ${PF.y.toFixed(2)}px) rotate(${PF.a.toFixed(3)}deg)`;
            cur.style.transform = `translate(${CU.x.toFixed(2)}px, ${CU.y.toFixed(2)}px)`;

            // the read receipt and the status bar
            const read = T >= READ, locked = T >= SEC;
            stt.textContent = read ? "READ · 1 TIME" : "DELIVERED";
            stt.setAttribute("fill", read ? "#E85D26" : "#888880");
            stbox.setAttribute("stroke", read ? "#E85D26" : "#505048");
            bar.textContent = locked ? "CONNECTION SECURE · TLS 1.3 · X25519 · AES-256-GCM" : "CONNECTING · TLS 1.3 · X25519 · AES-256-GCM";
            bar.setAttribute("fill", locked ? "#E85D26" : "#888880");
            stdot.setAttribute("fill", locked ? "#E85D26" : "#505048");

            // the shackles: lift out of the body, swing off the long (right) leg
            const k = LK.k;
            pshk.setAttribute("transform", `translate(0 ${(-11 * k).toFixed(2)}) rotate(${(24 * k).toFixed(2)} 14 0)`);
            ishk.setAttribute("transform", `translate(0 ${(-4.5 * k).toFixed(2)}) rotate(${(24 * k).toFixed(2)} 6 -1)`);
            HR.glow(pl2, T, 0.12, 0.25);

            // the seal: pops off the envelope and rolls to the card's centre, growing toward the lens
            const Lm = layerAt(0.65, T), Le = layerAt(0.8, T);
            if (t >= ROLL0 && t < ROLL1) {
              const e = Math.pow(clamp01((t - ROLL0) / (ROLL1 - ROLL0)), 1.7);
              const a = toScreen(Lm, tx + S * SX, ty + S * SY);
              const rest = toScreen(Le, 240 + 720, 130 + 222 + CARD.y + CARD.k);
              const kc = Le.s, d0 = SEAL_D * S * Lm.s;
              const px = a[0] + (rest[0] - a[0]) * e, py = a[1] + (rest[1] - a[1]) * e - 150 * Math.sin(Math.PI * e) * (1 - 0.35 * e);
              const sc = Math.exp(Math.log(d0 / (200 * kc)) * (1 - e));
              sealpos.style.transform = `translate(${((px - rest[0]) / kc).toFixed(2)}px, ${((py - rest[1]) / kc).toFixed(2)}px)`;
              roll.style.transform = `rotate(${(-460 * (1 - e)).toFixed(2)}deg) scale(${sc.toFixed(4)})`;
            } else {
              sealpos.style.transform = "none";
              roll.style.transform = "none";
            }
            card.style.transform = `translate(0px, ${(CARD.y + CARD.k).toFixed(2)}px)`;

            // the end card: the seal's light breathes on the paper; the title decrypts glyph by glyph
            const breath = 0.5 + 0.5 * Math.sin(t * 3.2);
            cwarm.style.transform = `scale(${(0.96 + 0.05 * breath).toFixed(3)})`;
            disc.style.setProperty("--hr-glow", (t >= ROLL1 ? 0.3 + 0.15 * breath + 0.5 * HR.hit("kick", T, 0.22) : 0.25).toFixed(3));
            const step = Math.floor(t * 15);
            titleG.forEach((gl, i) => {
              const ch = t >= TITLE_AT(i) || gl.dataset.ch === "," ? gl.dataset.ch : HR.HEX[(i * 7 + step * 5) % 16];
              if (gl.textContent !== ch) gl.textContent = ch;
            });
          }
          tl.eventCallback("onUpdate", render);
          tl.seek(0);
          render();
          window.__timelines["15-secure"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
