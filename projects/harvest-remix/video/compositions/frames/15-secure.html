        <div data-hf-id="hf-je0u" class="hr-layer" id="f15-chrome" data-depth="0.2">

      <script src="assets/kit/env.js"></script>
      <script src="assets/kit/hr-kit.js"></script>
      <script src="assets/kit/archie.js"></script>
      <script>
        (() => {
          const T0 = 160.058, DUR = 4.342; // frame span, track seconds
          const L = (t) => +(t - T0).toFixed(3);
          const READ = 160.75, CONN = 160.76, SEC = 161.563, NOTE = 161.92, TYPE = 162.321, K2 = 162.798, K3 = 163.249, END = 163.708;
          const REPLY = "lovely letter.";
          const LINE = { hero: ["secure."], words: [["Connection", CONN], ["secure.", SEC]] };
          const $ = (id) => document.getElementById(id);
          const el = (tag, cls, parent, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; parent.appendChild(e); return e; };
          const clamp01 = (x) => Math.max(0, Math.min(1, x));
          const NS = "http://www.w3.org/2000/svg";
          const sv = (tag, parent, attrs, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; parent.appendChild(e); return e; };

          // ---- static build ---------------------------------------------------------------------------------
          // paper: 01's seeded fibre, baked once (the thumbnail)
          (() => {
            const c = document.createElement("canvas"); c.width = 288; c.height = 180;
            const x = c.getContext("2d", { willReadFrequently: true }), r = HR.rng(404);
            x.fillStyle = "#F0ECE5"; x.fillRect(0, 0, 288, 180);
            const img = x.getImageData(0, 0, 288, 180);
            for (let i = 0; i < img.data.length; i += 4) { const v = (r() - 0.5) * 14; img.data[i] += v; img.data[i + 1] += v; img.data[i + 2] += v * 0.9; }
            x.putImageData(img, 0, 0);
            x.strokeStyle = "rgba(110,100,90,0.10)"; x.lineWidth = 0.6;
            for (let k = 0; k < 70; k++) { const px = r() * 288, py = r() * 180, a = r() * Math.PI, l = 6 + r() * 16;
              x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(a) * l, py + Math.sin(a) * l * 0.4); x.stroke(); }
            const url = `url(${c.toDataURL("image/png")})`;
            $("f15-thumb").style.backgroundImage = url;
          })();

          // the sculpted seal (01), for the thumbnail and the end card
          document.querySelectorAll(".f15-sealsvg").forEach((svg, n) => {
            const id = `f15-s${n}`;
            const defs = sv("defs", svg, {});
            const wg = sv("radialGradient", defs, { id: id + "wg", cx: 0.38, cy: 0.34, r: 0.78 });
            [[0, "#F68C5C"], [0.42, "#E85D26"], [0.82, "#C94A1C"], [1, "#A63B14"]].forEach(([o, c]) => sv("stop", wg, { offset: o, "stop-color": c }));
            const wr = sv("radialGradient", defs, { id: id + "wr", cx: 0.5, cy: 0.5, r: 0.5 });
            [[0.82, "#B9431A"], [1, "#8E3010"]].forEach(([o, c]) => sv("stop", wr, { offset: o, "stop-color": c }));
            let d = "";
            const drips = n ? [[1.1, 6], [3.3, 7.5], [5.2, 5]] : [[0.6, 7], [2.5, 5], [4.4, 8.5]];
            for (let k = 0; k <= 120; k++) {
              const a = (k / 120) * Math.PI * 2;
              let rr = 55.5 + 1.8 * Math.sin(7 * a + 0.5 + n) + 1.2 * Math.sin(13 * a + 2) + 0.7 * Math.sin(23 * a);
              for (const [a0, h] of drips) { const da = Math.atan2(Math.sin(a - a0), Math.cos(a - a0)); rr += h * Math.exp(-(da * da) / 0.012); }
              d += (k ? "L" : "M") + (Math.cos(a) * rr).toFixed(2) + " " + (Math.sin(a) * rr).toFixed(2);
            }
            sv("path", svg, { d: d + "Z", fill: `url(#${id}wr)` });
            sv("circle", svg, { r: 50, fill: `url(#${id}wg)` });
            sv("circle", svg, { r: 43.5, fill: "none", stroke: "rgba(255,206,176,0.38)", "stroke-width": 1.2, transform: "translate(0.8 0.8)" });
            sv("circle", svg, { r: 41, fill: "rgba(17,17,17,0.06)", stroke: "rgba(17,17,17,0.30)", "stroke-width": 2.4 });
            for (let i = 0; i < 30; i++) {
              const a = (i / 30) * Math.PI * 2;
              sv("circle", svg, { cx: (Math.cos(a) * 36.5).toFixed(2), cy: (Math.sin(a) * 36.5).toFixed(2), r: 1.35, fill: "rgba(17,17,17,0.26)" });
            }
            const A = { "text-anchor": "middle", "font-family": "Barlow", "font-weight": 900, "font-size": 40 };
            sv("text", svg, { ...A, x: 1.6, y: 15.4, fill: "rgba(17,17,17,0.36)" }, "a.");
            sv("text", svg, { ...A, x: -1.1, y: 12.4, fill: "rgba(255,214,188,0.5)" }, "a.");
            sv("text", svg, { ...A, x: 0, y: 13.8, fill: "#D4521E" }, "a.");
            sv("path", svg, { d: "M-38 -24 A44 44 0 0 1 -8 -45", fill: "none", stroke: "rgba(255,236,224,0.6)", "stroke-width": 3.5, "stroke-linecap": "round" });
          });

          // the end card's file barcode: the same code as 01's letter (object 0001)
          (() => {
            const r2 = HR.rng(611);
            for (let x = 1, i = 0; i < 38; i++, x += 4.95) {
              const tall = r2() < 0.5;
              sv("rect", $("f15-bars"), { class: "f15-bar", x: x.toFixed(1), y: tall ? 0 : 7, width: 2.2, height: tall ? 20 : 13, fill: "#E85D26" });
            }
          })();


          // ---- Archie types the reply (v12: replaces the lamp-headed Archivist) ----------------------------------
          const archie = HR.archie($("f15-arch"), { id: "f15a", x: 150, y: 372, scale: 0.68, seed: 10 });

          // the lyric: a lead row and the hero display row
          const box = $("f15-l30"), words = [];
          for (const [w, t] of LINE.words) {
            const hero = LINE.hero.includes(w.toLowerCase());
            const row = el("div", "f15-row" + (hero ? " f15-big hr-glow" : ""), box);
            words.push({ s: el("span", "f15-w", row, w.toLowerCase()), t, hero, row });
          }
          const heroRow = words.find((w) => w.hero).row;

          // end card glyphs
          const titleG = HR.glyphs($("f15-t1")).concat(HR.glyphs($("f15-t2")));
          titleG.forEach((g) => { g.dataset.ch = g.textContent; });

          // ticks on the registry ring; the stamp's wax drops
          for (let i = 0; i < 120; i++) {
            const a = (i / 120) * Math.PI * 2, long = i % 10 === 0, r0 = long ? 149 : 152;
            sv("line", $("f15-ticks"), { x1: (Math.cos(a) * r0).toFixed(2), y1: (Math.sin(a) * r0).toFixed(2),
              x2: (Math.cos(a) * 158).toFixed(2), y2: (Math.sin(a) * 158).toFixed(2),
              stroke: i % 30 === 0 ? "#E85D26" : long ? "#888880" : "#505048", "stroke-width": i % 30 === 0 ? 3 : long ? 1.6 : 1 });
          }
          const edr = HR.rng(1599);
          const edrops = Array.from({ length: 14 }, (_, i) => {
            const d = el("div", "f15-edrop", $("f15-edrops"));
            const a = (i / 14) * Math.PI * 2 + edr() * 0.3, v = 110 + edr() * 120, s = 0.35 + edr() * 0.7;
            return { d, dx: Math.cos(a) * v, dy: Math.sin(a) * v * 0.7 - 30, s };
          });

          // marker geometry, measured once at build (the arrow is drawn on in render)
          const arrow = $("f15-arrow"), arrowLen = 520;
          gsap.set("#f15-rule", { scaleX: 0 });
          gsap.set("#f15-arch", { y: 600 });

          // the reply's keystrokes: one per sixteenth, starting on the kick, done before the send on K3
          const KEYS = Array.from({ length: REPLY.length }, (_, i) => L(TYPE) - 0.34 + i * (0.78 / REPLY.length));

          // ---- timeline -------------------------------------------------------------------------------------
          const tl = gsap.timeline({ paused: true });
          const stage = HR.stage($("root"), { seed: 15 });
          const cam = stage.cam;
          const B = { x: 30, y: 0, z: 1.1, focus: 0.35 };
          const P = { z: 0, rot: 0 };
          const seg = (o, from, to, a, b, ease) => tl.fromTo(o, from, { ...to, duration: Math.max(0.01, b - a), ease, immediateRender: false }, a);
          const punch = (t, z, rot, settle = 0.55) => {
            tl.fromTo(P, { z: 0, rot: 0 }, { z, rot, duration: 0.06, ease: "power3.out", immediateRender: false }, t);
            tl.fromTo(P, { z, rot }, { z: 0, rot: 0, duration: settle, ease: "elastic.out(1, 0.5)", immediateRender: false }, t + 0.06);
          };
          const OUT = L(END) - 0.42;

          seg(B, { z: 1.1 }, { z: 1.0 }, 0, 0.7, "expo.out");
          seg(B, { z: 1.0 }, { z: 1.035 }, 0.7, L(SEC), "sine.inOut");
          seg(B, { z: 1.035 }, { z: 1.06 }, L(SEC), OUT, "sine.inOut");
          seg(B, { z: 1.06 }, { z: 1.0 }, OUT, L(END), "power2.inOut");
          seg(B, { z: 1.0 }, { z: 1.03 }, L(END), DUR, "sine.out");
          seg(B, { x: 30 }, { x: 0 }, 0, L(TYPE), "sine.inOut");
          seg(B, { x: 0 }, { x: 46 }, L(TYPE), OUT, "sine.inOut");
          seg(B, { x: 46 }, { x: 0 }, OUT, L(END), "power2.inOut");
          seg(B, { y: 0 }, { y: -8 }, L(END), DUR, "sine.out");
          seg(B, { focus: 0.35 }, { focus: 0.15 }, OUT, L(END), "power2.inOut");
          punch(L(SEC), 0.05, -0.5, 0.6);
          punch(L(TYPE), 0.02, 0.25, 0.4);
          punch(L(END), 0.025, 0, 0.7);
          tl.fromTo("#f15-win, #f15-thumb, #f15-prev", { y: -22 }, { y: 0, duration: 0.8, ease: "expo.out" }, 0);

          // lyric
          for (const { s, t, hero } of words) hero ? HR.hero(tl, s, L(t), { spread: 34, over: 1.2, sharp: true }) : HR.lead(tl, s, L(t));
          HR.exit(tl, box, OUT, { stagger: 0.006 });
          HR.exit(tl, $("f15-kicker"), OUT - 0.06, { dir: -1, dur: 0.3 });

          // the read receipt flips on the kick; the padlock flashes on "secure."; the archive's note answers
          tl.fromTo("#f15-status", { scale: 1.25, transformOrigin: "1707px 307px" }, { scale: 1, duration: 0.4, ease: "elastic.out(1, 0.5)", immediateRender: false }, L(READ));
          tl.fromTo("#f15-icon", { scale: 1 }, { scale: 2.1, duration: 0.06, ease: "power3.out", immediateRender: false }, L(SEC));
          tl.fromTo("#f15-icon", { scale: 2.1 }, { scale: 1, duration: 0.5, ease: "elastic.out(1, 0.45)", immediateRender: false }, L(SEC) + 0.06);
          tl.fromTo("#f15-mark1", { scale: 1.12, rotation: -6 }, { scale: 1, rotation: -3, duration: 0.35, ease: "back.out(2)", immediateRender: false }, L(NOTE));

          // Archie leans in from below the window on the kick, then types; the reply box opens in his eyes' light
          seg("#f15-arch", { y: 600, rotation: 2 }, { y: 0, rotation: 0 }, L(TYPE) - 0.92, L(TYPE) - 0.25, "power2.out");
          seg("#f15-reply", { opacity: 0, y: 20 }, { opacity: 1, y: 0 }, L(TYPE) - 0.44, L(TYPE) - 0.24, "power3.out");
          seg("#f15-beam", { opacity: 0 }, { opacity: 1 }, L(TYPE) - 0.4, L(TYPE) - 0.2, "power2.out");
          tl.fromTo("#f15-rsig", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, KEYS[KEYS.length - 1] + 0.06);
          seg("#f15-rsend", { scale: 1 }, { scale: 0.9 }, L(K3), L(K3) + 0.04, "power2.out");
          seg("#f15-rsend", { scale: 0.9 }, { scale: 1 }, L(K3) + 0.04, L(K3) + 0.4, "elastic.out(1, 0.5)");

          archie.mood(tl, "focused", L(TYPE) - 0.4, 0.4);
          archie.mood(tl, "smug", L(K3) - 0.04, 0.32);

          // v13, plant 2 pays off: on the hit the ticket's notification slides into the window's corner and settles
          seg("#f15-toast", { opacity: 0, x: 56 }, { opacity: 1, x: -6 }, L(TYPE), L(TYPE) + 0.25, "power2.out");
          seg("#f15-toast", { x: -6 }, { x: 0 }, L(TYPE) + 0.25, L(TYPE) + 0.5, "power2.out");

          // the scene falls back out of focus as the end card arrives
          seg("#f15-objs, #f15-markl", { opacity: 1, scale: 1, filter: "blur(0px)" }, { opacity: 0, scale: 0.93, filter: "blur(12px)" }, L(K3) + .27, L(END) - .04, "power2.inOut");

          // end card on the silence (v10)
          const E0 = L(END);
          seg("#f15-eseal", { opacity: 0, scale: 1.9, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)" }, E0 - 0.14, E0, "power4.in");
          seg("#f15-eseal", { scaleX: 1, scaleY: 1 }, { scaleX: 1.08, scaleY: 0.92 }, E0, E0 + 0.05, "power2.out");
          seg("#f15-eseal", { scaleX: 1.08, scaleY: 0.92 }, { scaleX: 1, scaleY: 1 }, E0 + 0.05, E0 + 0.5, "elastic.out(1, 0.45)");
          document.querySelectorAll(".f15-ering").forEach((r, i) => {
            seg(r, { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 2.2 + i * 0.8 }, E0 + i * 0.07, E0 + i * 0.07 + 0.5, "power2.out");
          });
          edrops.forEach(({ d, dx, dy, s }, i) => {
            const t0 = E0 + (i % 3) * 0.008;
            tl.fromTo(d, { opacity: 1, x: 0, scale: s }, { x: dx, duration: 0.5, ease: "power2.out", immediateRender: false }, t0);
            tl.fromTo(d, { y: 0 }, { y: dy, duration: 0.2, ease: "power2.out", immediateRender: false }, t0);
            tl.fromTo(d, { y: dy }, { y: dy + 110, opacity: 0, scale: s * 0.4, duration: 0.3, ease: "power2.in", immediateRender: false }, t0 + 0.2);
          });
          seg("#f15-ring", { opacity: 0, scale: 0.86, rotation: -40 }, { opacity: 1, scale: 1, rotation: 0 }, E0 - 0.02, E0 + 0.5, "expo.out");
          seg("#f15-ring", { rotation: 0 }, { rotation: 3 }, E0 + 0.5, DUR, "none");
          seg("#f15-elight", { opacity: 0 }, { opacity: 1 }, E0 - 0.04, E0 + 0.12, "power2.out");
          HR.lead(tl, $("f15-nead"), E0 + 0.05, { stagger: 0.045, dur: 0.32 });
          seg("#f15-rule", { scaleX: 0 }, { scaleX: 1 }, E0 + 0.08, E0 + 0.42, "expo.out");
          tl.fromTo(titleG, { opacity: 0, yPercent: 60 }, { opacity: 1, yPercent: 0, duration: 0.2, ease: "expo.out", stagger: 0.007 }, E0 + 0.12);
          const TITLE_AT = (i) => E0 + 0.12 + i * 0.007 + 0.1;
          tl.fromTo("#f15-file span", { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power2.out", stagger: 0.06 }, E0 + 0.24);
          tl.fromTo(".f15-bar", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.14, ease: "power3.out", stagger: 0.004 }, E0 + 0.22);
          tl.fromTo(".f15-crop", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, E0 + 0.1);
          tl.fromTo(".f15-cm", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out", stagger: 0.04 }, E0 + 0.18);

          // ---- per-frame draw (all from timeline time) ------------------------------------------------------
          const elightEl = $("f15-elight"), disc = $("f15-eseal"), nead = $("f15-nead"), t2 = $("f15-t2");
          const stt = $("f15-stt"), stbox = $("f15-stbox"), bar = $("f15-bar"), stdot = $("f15-stdot");
          const rtext = $("f15-rtext"), caret = $("f15-caret"), mark1 = $("f15-mark1");
          const sendt = $("f15-rsendt");
          function render() {
            const t = tl.time(), T = t + T0;
            cam.x = B.x; cam.y = B.y; cam.z = B.z + P.z; cam.rot = P.rot; cam.focus = B.focus;
            stage.apply(T);
            HR.draw(tl);
            const vocal = HR.band("vocal", T), kick = HR.hit("kick", T, 0.12);
            const breath = 0.5 + 0.5 * Math.sin(t * 3.2);
            const read = T >= READ, locked = T >= SEC, ended = T >= END;

            // the read receipt and the status bar
            stt.textContent = read ? "READ · 1 TIME" : "DELIVERED";
            stt.setAttribute("fill", read ? "#E85D26" : "#888880");
            stbox.setAttribute("stroke", read ? "#E85D26" : "#505048");
            bar.textContent = locked ? "CONNECTION SECURE · TLS 1.3 · X25519 · AES-256-GCM" : "CONNECTING · TLS 1.3 · X25519 · AES-256-GCM";
            bar.setAttribute("fill", locked ? "#E85D26" : "#888880");
            stdot.setAttribute("fill", locked ? "#E85D26" : "#505048");

            // the marker voice: the arrow draws on, then the words are written left to right
            const ap = clamp01((t - L(NOTE)) / 0.22), mp = clamp01((t - L(NOTE) - 0.12) / 0.34);
            arrow.style.strokeDasharray = `${arrowLen}`;
            arrow.style.strokeDashoffset = `${(arrowLen * (1 - ap)).toFixed(1)}`;
            mark1.style.clipPath = `inset(-20% ${(100 - mp * 100).toFixed(1)}% -30% -5%)`;

            // the reply types, one key per step; the caret blinks between keys; the send flips to SENT on K3
            const n = KEYS.filter((k) => t >= k).length;
            rtext.textContent = REPLY.slice(0, n);
            caret.style.opacity = t < L(TYPE) - 0.1 ? "0" : (n < REPLY.length || Math.floor(t * 3.4) % 2 === 0 ? "1" : "0");
            sendt.textContent = T >= K3 ? "SENT" : "SEND";

            // Small finger strokes; the head follows one deliberate ticket glance and settles.
            const smooth = x => { x = clamp01(x); return x * x * (3 - 2 * x); };
            const lastKey = n ? KEYS[n - 1] : -9;
            const finger = n && n < REPLY.length ? Math.pow(Math.sin(Math.PI * clamp01((t - lastKey) / 0.058)), 2) : 0;
            const glance = smooth((t - L(TYPE) - 0.10) / 0.32) * (1 - smooth((t - L(TYPE) - 0.48) / 0.38));
            const sent = smooth((t - L(K3) + 0.06) / 0.38);
            const press = smooth((t - L(K3) + 0.18) / 0.18) * (1 - smooth((t - L(K3)) / 0.28));
            const M = archie.s;
            M.lookX = 0.70 * (1 - sent) + 0.10 * glance;
            M.lookY = 0.30 + 0.22 * glance;
            M.turn = 0.28 * (1 - sent);
            M.tilt = 1.8 * glance - 1.4 * sent;
            M.shR = 47 - 8 * sent + 6 * press;
            M.elR = -26 + 2.2 * finger + 9 * press;
            M.clawR = 0.48 + 0.09 * finger;
            archie.apply(T);

            // the end card's seal light breathes
            elightEl.style.transform = `scale(${(0.95 + 0.06 * breath).toFixed(3)})`;

            HR.glow(heroRow, T, 0.3 + 0.35 * vocal, 0.7);
            heroRow.style.translate = `${(HR.hit("snare", T, 0.09) * 1.2).toFixed(2)}px 0`;

            // end card
            const g = 0.45 + 0.25 * breath + 0.6 * HR.hit("kick", T, 0.25);
            disc.style.setProperty("--hr-glow", (ended ? g : 0.45).toFixed(3));
            nead.style.setProperty("--hr-glow", (0.25 + 0.2 * breath).toFixed(3));
            t2.style.setProperty("--hr-glow", (0.2 + 0.15 * breath).toFixed(3));
            const step = Math.floor(t * 15);
            titleG.forEach((gl, i) => {
              const ch = t >= TITLE_AT(i) || gl.dataset.ch === "," ? gl.dataset.ch : HR.HEX[(i * 7 + step * 5) % 16];
              if (gl.textContent !== ch) gl.textContent = ch;
            });
          }
          tl.eventCallback("onUpdate", render);
          tl.seek(0);
          render();
          window.__timelines["15-secure"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
