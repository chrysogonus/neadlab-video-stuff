          const archie2 = HR.archie($("f04-arch2"), { id: "f04b", x: A2.x, y: A2.y, scale: A2.sc, seed: 4 });
          archie2.to(tl, { ...HR.archie.MOODS.asleep, sway: 1, zz: 1, idle: 0.4 }, 0, 0.01);
          const clock2 = alarm($("f04-arch2"));
          clock2.g.setAttribute("transform", `translate(${(A2.x - 262 * A2.sc).toFixed(1)} ${(A2.y - 84 * A2.sc * CK).toFixed(1)}) scale(${(A2.sc * CK).toFixed(3)})`);
          archie2.startle(tl, L(MINE) + 0.03, { h: 100, air: 0.3, settle: false });
          // lands at ~41.27: arms down, a glare at the clock
          archie2.to(tl, { ...HR.archie.MOODS.focused, lidL: 0.42, lidR: 0.42, browL: 10, browR: 10, browRotL: 16, browRotR: -16, pupil: 0.75,
            neck: 0.5, glow: 1.2, shL: 8, elL: 10, shR: 8, elR: 10, clawL: 0.2, clawR: 0.2 }, L(41.28), 0.08, "power2.out");
          // the slap: the L claw winds up high, leaning away, then whips down onto the plunger
          archie2.to(tl, { shL: 150, elL: -10, clawL: 0.3, rot: 7 }, L(41.3), 0.08, "power2.out");
          archie2.to(tl, { shL: 82, elL: 16, rot: -16, clawL: 0 }, L(SLAP) - 0.04, 0.04, "power3.in");
          // ...click. Silence; a small satisfied look, the claw still on the button
          archie2.to(tl, { lidL: 0.5, lidR: 0.36, browL: 2, browR: -10, browRotL: 7, browRotR: -5, pupil: 0.9 }, L(41.52), 0.16, "power2.out");

          // lyrics: g1 lead words build by glyph; g2 lead words are thrown in with varied fast moves; hero words explode ON their word time
          const fx = $("f04-fx"), CLK = { x: 1230, y: 520 };
          const HEROC = { l6: [390, 836], l7: [414, 851] }; // hero word centres in frame px
          const KIND = { every: "left", byte: "drop", you: "pop", ever: "right", sent: "zoom", is: "flip" };
          for (const [key, ws] of Object.entries(lines)) for (const { s, t, big } of ws) {
            if (big) {
              tl.set(s, { opacity: 1 }, Math.max(0, L(t) - 0.215)); // glyphs start at ~t-0.23; any earlier and a seek shows stale glyph state
              WOW.explode(tl, s, L(t), { parent: fx, x: HEROC[key][0], y: HEROC[key][1], from: key === "l6" ? "burst" : "left", burst: key === "l6" ? 36 : 56, seed: key === "l6" ? 7 : 9, r: 1100 });
            } else if (key === "l6") { HR.lead(tl, s, L(t)); tl.set(s, { opacity: 1 }, L(t)); }
            else WOW.word(tl, s, L(t), { kind: KIND[s.textContent] });
          }
          HR.exit(tl, $("f04-l6"), L(G2) - 0.26);

          // hero slams squash into the floor and spit a few fire dots
          const sr = HR.rng(4404);
          for (const { s, t, big, r } of Object.values(lines).flat()) {
            if (!big) continue;
            tl.fromTo(r, { scaleY: 1, scaleX: 1 }, { scaleY: 0.93, scaleX: 1.02, duration: 0.05, ease: "power2.out", immediateRender: false }, L(t));
            tl.fromTo(r, { scaleY: 0.93, scaleX: 1.02 }, { scaleY: 1, scaleX: 1, duration: 0.45, ease: "elastic.out(1, 0.45)", immediateRender: false }, L(t) + 0.05);
            for (let i = 0; i < 8; i++) {
              const d = el("span", "f04-dot", s), side = i % 2 ? -1 : 1, z = 4 + sr() * sr() * 16;
              d.setAttribute("data-layout-ignore", "");
              Object.assign(d.style, { width: z + "px", height: z + "px", left: (side < 0 ? -2 - sr() * 4 : 100 + sr() * 4) + "%", top: (25 + sr() * 55) + "%" });
              const dx = side * (14 + sr() * 50), dy = (sr() - 0.5) * 40;
              tl.fromTo(d, { opacity: 0, x: -dx * 0.5, y: 0, scale: 0.3 }, { opacity: 0.95, x: 0, y: dy * 0.3, scale: 1, duration: 0.09, ease: "power3.out", immediateRender: false }, L(t));
              tl.fromTo(d, { opacity: 0.95, x: 0, y: dy * 0.3 }, { opacity: 0, x: dx * 0.4, y: dy + 30, duration: 0.7, ease: "power2.in", immediateRender: false }, L(t) + 0.09);
            }
          }
          // "time" loosens on the downbeat
          const timeG = lines.l6.find((w) => w.big).s._hrG;
          tl.fromTo(timeG, { x: 0 }, { x: (i) => i * 20, duration: 1.1, ease: "power2.out", immediateRender: false }, L(37.47));

          // g2 — each word-packet that lands thunks the plate and rings the intake
          const LAND = PKTS.map(([, t]) => t + FLY);
          LAND.forEach((b, i) => {
            tl.fromTo("#f04-plate", { y: 0 }, { y: 5, duration: 0.04, ease: "power2.out", immediateRender: false }, L(b));
            tl.fromTo("#f04-plate", { y: 5 }, { y: 0, duration: 0.36, ease: "elastic.out(1, 0.5)", immediateRender: false }, L(b) + 0.04);
            const [gx, gy] = scr(b, IX - 20, IY);
            WOW.shock(tl, fx, { x: gx, y: gy, t: L(b), r: 420, n: 1, w: 5, color: "fire", dur: 0.4 });
            WOW.burst(tl, fx, { x: gx, y: gy, t: L(b), n: 10, speed: 700, size: [3, 8], aim: 180, spread: 110, dur: 0.5, seed: 30 + i });
            WOW.shake(tl, $("f04-g2"), L(b), { amp: 5, dur: 0.22, seed: 40 + i });
          });
          WOW.flash(tl, fx, L(LAND[4]), { a: 0.3, dur: 0.14 }); // "sent" is swallowed
          tl.fromTo("#f04-plight", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, L(G2));
          // kicks and snares in the torrent: every shot is shaken, punched and ringed on the beat
          const shotOf = (T) => (T < SA ? "#f04-s1" : T < SB ? "#f04-s2" : "#f04-s3");
          HR.onsetsIn("kick", G2, MINE - 0.05).forEach((t, k) => {
            WOW.shake(tl, $(shotOf(t).slice(1)), L(t), { amp: 7, dur: 0.28, seed: 60 + k }); WOW.shake(tl, $("f04-g2"), L(t), { amp: 4, dur: 0.22, seed: 70 + k });
            WOW.punch(tl, $(shotOf(t).slice(1)), L(t), { s: 1.03, dur: 0.3 });
            const [gx, gy] = scr(t, IX - 20, IY); WOW.shock(tl, fx, { x: gx, y: gy, t: L(t), r: 330, n: 1, w: 3, color: "cream", dur: 0.45 });
          });
          HR.onsetsIn("snare", G2, MINE - 0.05).forEach((t, k) => { WOW.shake(tl, $(shotOf(t).slice(1)), L(t), { amp: 4, dur: 0.2, seed: 80 + k }); WOW.punch(tl, $("f04-m2"), L(t), { s: 1.012, dur: 0.25 }); });
          // the in-frame switches: whip down the wire (A→B), then the camera is swallowed by the intake and pulls back out (B→C)
          WOW.transition(tl, $("f04-s1"), { out: "whipL", dur: 0.2, total: L(SA) });
          WOW.transition(tl, $("f04-s2"), { in: "whipL", out: "zoom", dur: 0.2, start: L(SA), total: L(SB) });
          WOW.transition(tl, $("f04-s3"), { in: "zoom", dur: 0.26, start: L(SB) });
          WOW.flash(tl, fx, L(SB), { a: 0.4, dur: 0.16 });
          // "mine": the intake slams shut ON the word and the counter locks at 256
          {
            const [gx, gy] = scr(MINE, IX - 20, IY), PL = [1198, 118];
            const hit = [$("f04-s3"), $("f04-m2"), $("f04-g2"), $("f04-world")];
            hit.forEach((e, i) => WOW.shake(tl, e, L(MINE), { amp: 28, dur: 0.6, seed: 90 + i }));
            WOW.punch(tl, document.getElementById("el-04-wait"), L(MINE), { s: 1.06, dur: 0.5 });
            WOW.shock(tl, fx, { x: gx, y: gy, t: L(MINE), r: 1500, n: 3, w: 9, color: "fire", dur: 0.7, gap: 0.07 });
            WOW.rays(tl, fx, { x: gx, y: gy, t: L(MINE), n: 34, r0: 90, r1: 1400, seed: 93, color: "cream", dur: 0.6, w: 6 });
            WOW.burst(tl, fx, { x: gx, y: gy, t: L(MINE), n: 56, speed: 1700, size: [5, 18], aim: 180, spread: 150, seed: 94, dur: 1.0, cream: 0.4 });
            WOW.flash(tl, fx, L(MINE), { a: 0.85, dur: 0.22 });
            WOW.shock(tl, fx, { x: PL[0], y: PL[1], t: L(MINE) + 0.14, r: 900, n: 1, w: 5, color: "cream", dur: 0.5 });
            WOW.burst(tl, fx, { x: gx + 40, y: gy, t: L(MINE) + 0.1, n: 14, speed: 600, size: [3, 8], seed: 95, dur: 0.5 });
            // the alarm's ring answers: three small rings off the floor clock
            [0.04, 0.2, 0.36].forEach((d, i) => WOW.shock(tl, fx, { x: 1444, y: 955, t: L(MINE) + d, r: 300, n: 1, w: 3, color: "cream", dur: 0.35 }));
          }
          // "mine" locks the counter: the brackets clamp on, the plate slams
          tl.fromTo([".f04-brk"], { opacity: 0, scaleX: 2.2 }, { opacity: 1, scaleX: 1, duration: 0.12, ease: "power4.in" }, L(MINE) - 0.1);
          tl.fromTo("#f04-plate", { scale: 1 }, { scale: 1.025, duration: 0.05, ease: "power2.out", immediateRender: false }, L(MINE));
          tl.fromTo("#f04-plate", { scale: 1.025 }, { scale: 1, duration: 0.5, ease: "elastic.out(1, 0.45)", immediateRender: false }, L(MINE) + 0.05);
          tl.fromTo("#f04-wall", { opacity: 0.075 }, { opacity: 0.03, duration: 0.25, ease: "power2.out", immediateRender: false }, L(MINE));
          // the frame leaves on the alarm: the lens pushes into Archie's eye (paired with 17-watch's zoom in)
          document.getElementById("el-04-wait").style.transformOrigin = "86% 60%";
          WOW.transition(tl, document.getElementById("el-04-wait"), { out: "zoom", dur: 0.25, total: DUR });

          // ---- g1 v16: the clock gets pace. Every beat ticks a ring and a spark off the second hand; kicks and snares shake and punch;
          // "time" is a detonation on the minute hand's arrival ----
          g1Beats.slice(1).forEach((b, k) => {
            const [tx, ty] = P(312 + 12 * (k + 1), 520 * CS);
            WOW.burst(tl, fx, { x: CLK.x + tx, y: CLK.y + ty, t: L(b), n: 9, speed: 460, size: [3, 8], dur: 0.5, seed: 200 + k, gravity: 300 });
            WOW.shock(tl, fx, { x: CLK.x, y: CLK.y, t: L(b), r: 520, n: 1, w: 3, color: "cream", dur: 0.5 });
          });
          HR.onsetsIn("kick", T0, G2 - 0.05).forEach((t, k) => { WOW.shake(tl, $("f04-mid"), L(t), { amp: 5, dur: 0.26, seed: 110 + k }); WOW.punch(tl, $("f04-mid"), L(t), { s: 1.014, dur: 0.3 }); });
          HR.onsetsIn("snare", T0, G2 - 0.05).forEach((t, k) => WOW.shake(tl, $("f04-g1"), L(t), { amp: 4, dur: 0.2, seed: 130 + k }));
          {
            const t = L(TIME);
            ["f04-mid", "f04-g1"].forEach((id, i) => WOW.shake(tl, $(id), t, { amp: i ? 14 : 24, dur: 0.55, seed: 150 + i }));
            WOW.punch(tl, document.getElementById("el-04-wait"), t, { s: 1.05, dur: 0.5 });
            WOW.shock(tl, fx, { x: CLK.x, y: CLK.y, t, r: 1500, n: 3, w: 9, color: "fire", dur: 0.7, gap: 0.07 });
            WOW.rays(tl, fx, { x: CLK.x, y: CLK.y, t, n: 32, r0: 120, r1: 1400, seed: 160, color: "cream", dur: 0.6, w: 6 });
            WOW.flash(tl, fx, t, { a: 0.6, dur: 0.2 });
          }

          // ---- per-frame draw -------------------------------------------------------------------------------
          const VALS = BEATS.map((_, k) => Math.max(1, Math.round(Math.pow(1.9, k))));
          const digit = (v, d) => Math.floor(v / Math.pow(10, 3 - d)) % 10;
          const heroes = Object.values(lines).flat().filter((w) => w.big).map((w) => w.r);
          const lightEl = $("f04-light"), plightEl = $("f04-plight"), archEl = $("f04-arch");
          const platew = $("f04-platew"), l6 = $("f04-l6"), l7 = $("f04-l7"), clocksvg = $("f04-clocksvg"), stt = $("f04-stt"), stdot = $("f04-stdot"), pad = $("f04-pad"), pk = $("f04-pk");
          const rot = (g, a, dx = 0, dy = 0) => g.setAttribute("transform", `translate(${dx} ${dy}) rotate(${a.toFixed(3)})`);
          const ang = (y, x) => Math.atan2(y, x) * 180 / Math.PI;
          // the count: 0 before g2, a trickle, an eased jump as each packet lands; "mine" slams it to FINAL and holds
          const bytesAt = (T) => {
            if (T < G2) return 0;
            if (T >= MINE) return FINAL - (FINAL - 129) * Math.pow(1 - clamp01((T - MINE) / 0.14), 3);
            let v = (T - G2) * 2;
            LAND.forEach((b, i) => { if (T >= b) v += DELTA[i] * (1 - Math.pow(1 - clamp01((T - b) / 0.3), 3)); });
            return v;
          };
          tl.seek(L(PUT)); archie.apply(PUT);
          const put = archie.handAt("R");
          clockF.g.setAttribute("transform", `translate(${put.x.toFixed(1)} ${(372 - 84 * 0.68 * CK).toFixed(1)}) scale(${0.68 * CK})`);
          tl.seek(0);
          let lastDim = -1;
          function render() {
            const t = tl.time(), T = t + T0;
            stage.apply(T);
            HR.draw(tl); WOW.draw(tl);
            // kick pulses on the type, the clock and the counter (own elements: WOW.pulse reads the local clock, not track time)
            const kk = HR.hit("kick", T, 0.14);
            for (const e of [l6, l7]) { e.style.scale = (1 + 0.03 * kk).toFixed(4); e.style.translate = `0px ${(-6 * kk).toFixed(2)}px`; }
            platew.style.scale = (1 + 0.06 * kk).toFixed(4);
            clocksvg.style.scale = (1 + 0.02 * kk).toFixed(4);
            // hands and their shadows (light from the upper left)
            rot(handH, hands.h); rot(handM, hands.m); rot(handS, hands.s);
            rot(shH, hands.h, 10, 16); rot(shM, hands.m, 14, 22); rot(shS, hands.s, 18, 28);
            const [ax, ay] = P(150, 551), [bx, by] = P(hands.m, 551);
            arc.setAttribute("d", `M${f1(ax)} ${f1(ay)} A551 551 0 ${hands.m - 150 > 180 ? 1 : 0} 1 ${f1(bx)} ${f1(by)}`);
            HR.glow(arc, T, 0.2, 0.5); HR.glow(handS, T, 0.15, 0.4);
            // DAYS HELD drums roll to the new count on each beat
            const k = g1Beats.filter((b) => b <= T + 1e-6).length;
            const cur = VALS[Math.max(0, k - 1)], prev = VALS[Math.max(0, k - 2)];
            const p = k >= 1 ? 1 - Math.pow(1 - Math.min(1, (T - g1Beats[k - 1]) / 0.12), 3) : 1;
            drums.forEach((col, d) => {
              const a = digit(prev, d), b = digit(cur, d), pos = (a + ((b - a + 10) % 10) * p) % 10;
              col.setAttribute("transform", `translate(0 ${(-pos * 72).toFixed(2)})`);
            });

            // Archie: eyes on the clock in his claw (then on the floor), on the big second hand's tip (so the gaze
            // ticks with it), or down as he sleeps
            const hx = AX + 157 * AS, hy = AY + 137 * AS + A.y;
            const [sx, sy] = P(hands.s, 520 * CS);
            const hc = T < PUT ? archie.handAt("R") : put;
            const vx = W.small * (AX + hc.x * AS - hx) / 160 + W.big * (CX + sx - hx) / 600;
            const vy = W.small * (AY + hc.y * AS + A.y + 40 - hy) / 160 + W.big * (CY + sy - hy) / 600 + (1 - W.small - W.big) * 0.8;
            const vd = Math.max(1, Math.hypot(vx, vy));
            archie.s.lookX = vx / vd; archie.s.lookY = 0.8 * vy / vd; archie.s.turn = 0.35 * vx / vd * (W.small + W.big);
            archEl.style.transform = `translateY(${A.y.toFixed(1)}px) rotate(${A.lean.toFixed(2)}deg)`;
            archie.apply(T);
            const down = T >= PUT;
            clockH.g.setAttribute("opacity", down ? "0" : "1");
            clockF.g.setAttribute("opacity", down ? "1" : "0");
            wind(clockH, W.key);
            if (T >= G2) {
              const woke = clamp01((T - 41.25) / 0.08);
              archie2.s.lookX = -0.95 * woke; archie2.s.lookY = 0.6 * woke; archie2.s.turn = -0.5 * woke;
              archie2.apply(T);
              ring(clock2, T, T >= MINE && T < SLAP);
              if (T >= SLAP) { // the plunger goes down and the clock squashes under the slap
                const q = Math.exp(-(T - SLAP) / 0.06);
                clock2.body.setAttribute("transform", `translate(0 ${(84 * 0.14 * q).toFixed(2)}) scale(${(1 + 0.08 * q).toFixed(3)} ${(1 - 0.14 * q).toFixed(3)})`);
                clock2.btn.setAttribute("transform", "translate(0 5)");
              } else clock2.btn.setAttribute("transform", "");
            }

            // g2: the torrent canvases
            SHOTS.forEach(([, a, b], k) => { if (T >= a && (T < b || k === 2) && T >= G2) drawWorld(ctxs[k], T, k); });

            // the odometer: each digit column rolls like a mechanical counter; leading zeros sit dim
            const v = bytesAt(T);
            const n = Math.max(1, String(Math.floor(v)).length);
            for (let d = 0; d < 10; d++) {
              const place = Math.pow(10, 9 - d);
              let pos;
              if (place === 1) pos = v % 10;
              else { const lower = v % place; pos = Math.floor(v / place) % 10 + clamp01(lower - (place - 1)); }
              cols[d].style.transform = `translateY(${(-pos * 172).toFixed(1)}px)`;
            }
            if (n !== lastDim) { cells.forEach((c, d) => { c.style.opacity = d < 10 - n ? "0.3" : "1"; }); lastDim = n; }
            for (const c of cols) HR.glow(c, T, T >= MINE ? 0.55 : 0.3, 0.5);
            const locked = T >= MINE;
            stt.textContent = locked ? "LOCKED" : "OPEN";
            stt.style.color = locked ? "#E85D26" : "#F0ECE5";
            stdot.style.display = locked ? "none" : "block";
            stdot.style.opacity = (0.45 + 0.55 * Math.abs(Math.sin(t * 6))).toFixed(2);
            pad.style.display = locked ? "block" : "none";
            pk.textContent = "PKT " + String(LAND.filter((b) => T >= b).length).padStart(4, "0") + " · " + fmt(Math.floor(v)) + " B";

            for (const h of heroes) HR.glow(h, T, 0.35, 0.8);
            // the archive fills: more ghost glyphs light as the chorus goes on, faster once the bytes pour in; hats flicker a few
            const fill = T < G2 ? 0.08 + 0.22 * (T - T0) / (G2 - T0) : 0.3 + 0.7 * clamp01(v / 70000);
            const hat = HR.hit("hat", T, 0.07);
            for (const { u, order, flick } of lits) {
              const on = order < fill;
              u.style.opacity = on ? (flick ? (0.6 - 0.45 * hat).toFixed(2) : "0.6") : "0";
            }
            lightEl.style.opacity = ((0.6 + 0.5 * HR.band("bass", T)) * (T >= MINE ? 0.3 : 1)).toFixed(3);
            plightEl.style.transform = `scale(${(0.96 + 0.08 * HR.band("bass", T)).toFixed(3)})`;
          }
          tl.eventCallback("onUpdate", render);
          tl.seek(0); render();
          window.__timelines["04-wait"] = tl;
        })();
      </script>
    </template>
  </body>
