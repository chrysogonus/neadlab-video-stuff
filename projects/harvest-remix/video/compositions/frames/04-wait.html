          let lastDim = -1;
          function render() {
            const t = tl.time(), T = t + T0;
            const sm = (u) => { u = clamp01(u); return u * u * (3 - 2 * u); };
            const nz = T < G2 ? 0.05 * sm((T - 35.631) / 0.45) + 0.07 * sm((T - 37.47) / 0.45) : 0;
            cam.z += nz; stage.apply(T); cam.z -= nz;
            HR.draw(tl); WOW.draw(tl);
            // kick pulses on the type, the clock and the counter (own elements: WOW.pulse reads the local clock, not track time)
            const kk = HR.hit("kick", T, 0.14);
            for (const e of [l6, l7]) { e.style.scale = (1 + 0.02 * kk).toFixed(4); e.style.translate = `0px ${(-4 * kk).toFixed(2)}px`; }
            platew.style.scale = (1 + 0.03 * kk).toFixed(4);
            clocksvg.style.scale = (1 + 0.02 * kk).toFixed(4);
            // hands and their shadows (light from the upper left); v21: ghost hands smear while they race
            if (T < G2) {
              Object.assign(hands, handsAt(T));
              const at = (dt) => handsAt(T - dt);
              ghostM.forEach(({ o, g }, i) => { const a = at((i + 1) * 0.014).m; g.setAttribute("opacity", (o * clamp01(Math.abs(hands.m - a) / 5)).toFixed(3)); rot(g, a); });
              ghostH.forEach(({ o, g }, i) => { const a = at((i + 1) * 0.02).h; g.setAttribute("opacity", (o * clamp01(Math.abs(hands.h - a) / 3)).toFixed(3)); rot(g, a); });
              ghostS.forEach(({ o, g }, i) => { const a = at((i + 1) * 0.008).s; g.setAttribute("opacity", (o * clamp01(Math.abs(hands.s - a) / 5)).toFixed(3)); rot(g, a); });
              rot(handH, hands.h); rot(handM, hands.m); rot(handS, hands.s);
              rot(shH, hands.h, 10, 16); rot(shM, hands.m, 14, 22); rot(shS, hands.s, 18, 28);
              const sw = Math.min(359.9, hands.m - 150), [ax, ay] = P(150, 551), [bx, by] = P(150 + sw, 551);
              arc.setAttribute("d", sw > 359.5 ? "M0 -551 A551 551 0 1 1 0 551 A551 551 0 1 1 0 -551" : `M${f1(ax)} ${f1(ay)} A551 551 0 ${sw > 180 ? 1 : 0} 1 ${f1(bx)} ${f1(by)}`);
              HR.glow(arc, T, 0.2, 0.5); HR.glow(handS, T, 0.15, 0.4);
              // DAYS HELD: the drums roll like an odometer
              const dv = daysAt(T);
              drums.forEach((col, d) => {
                const place = Math.pow(10, 3 - d), pos = place === 1 ? dv % 10 : Math.floor(dv / place) % 10 + clamp01((dv % place) - (place - 1));
                col.setAttribute("transform", `translate(0 ${(-pos * 72).toFixed(2)})`);
              });
              // sparks: white-hot heads, fire tails, gravity (clock units)
              for (const k of SPK) {
                const d = T - k.t;
                if (d < 0 || d > k.life) { if (k.on) { k.p.setAttribute("opacity", "0"); k.on = false; } continue; }
                const x = k.x + k.vx * d, y = k.y + k.vy * d + 1300 * d * d, d2 = Math.max(0, d - 0.03), x2 = k.x + k.vx * d2, y2 = k.y + k.vy * d2 + 1300 * d2 * d2, l = d / k.life;
                k.p.setAttribute("d", `M${f1(x2)} ${f1(y2)}L${f1(x)} ${f1(y)}`);
                k.p.setAttribute("stroke", l < 0.45 ? "#FFF4E0" : "#E85D26"); k.p.setAttribute("stroke-width", (k.w * (1 - 0.5 * l)).toFixed(2));
                k.p.setAttribute("opacity", (1 - l * l).toFixed(3)); k.on = true;
              }
              // the camera pushes on the downbeats 35.631 and 37.47 (eased notches on top of the carrier)
            }

            // Archie: eyes on the clock in his claw (then on the floor), on the big second hand's tip (so the gaze
            // ticks with it), or down as he sleeps
            const hx = AX + 157 * AS, hy = AY + 137 * AS + A.y;
            const [sx, sy] = P(hands.s, 520 * CS);
            const hc = T < PUT ? archie.handAt("R") : put;
            const vx = W.small * (AX + hc.x * AS - hx) / 160 + W.big * (CX + sx - hx) / 600;
            const vy = W.small * (AY + hc.y * AS + A.y + 40 - hy) / 160 + W.big * (CY + sy - hy) / 600 + (1 - W.small - W.big) * 0.8;
            const vd = Math.max(1, Math.hypot(vx, vy));
            archie.s.lookX = vx / vd; archie.s.lookY = 0.8 * vy / vd; archie.s.turn = 0.35 * vx / vd * (W.small + W.big);
            archEl.style.transform = `translateY(${A.y.toFixed(1)}px) rotate(${A.lean.toFixed(2)}deg)`;
            archie.apply(T);
            const down = T >= PUT;
            clockH.g.setAttribute("opacity", down ? "0" : "1");
            clockF.g.setAttribute("opacity", down ? "1" : "0");
            wind(clockH, W.key);
            if (T >= G2) {
              const woke = clamp01((T - 41.4) / 0.06);
              archie2.s.lookX = -0.95 * woke; archie2.s.lookY = 0.6 * woke; archie2.s.turn = -0.5 * woke;
              archie2.apply(T);
              ring(clock2, T, T >= MINE && T < SLAP);
              if (T >= SLAP) { // the plunger goes down and the clock squashes under the slap
                const q = Math.exp(-(T - SLAP) / 0.06);
                clock2.body.setAttribute("transform", `translate(0 ${(84 * 0.14 * q).toFixed(2)}) scale(${(1 + 0.08 * q).toFixed(3)} ${(1 - 0.14 * q).toFixed(3)})`);
                clock2.btn.setAttribute("transform", "translate(0 5)");
              } else clock2.btn.setAttribute("transform", "");
            }

            // g2: the torrent canvases
            if (T >= G2 - 0.002) drawWorld(T);

            // the odometer: each digit column rolls like a mechanical counter; leading zeros sit dim
            const v = bytesAt(T);
            const n = Math.max(1, String(Math.floor(v)).length);
            for (let d = 0; d < 10; d++) {
              const place = Math.pow(10, 9 - d);
              let pos;
              if (place === 1) pos = v % 10;
              else { const lower = v % place; pos = Math.floor(v / place) % 10 + clamp01(lower - (place - 1)); }
              cols[d].style.transform = `translateY(${(-pos * 172).toFixed(1)}px)`;
            }
            if (n !== lastDim) { cells.forEach((c, d) => { c.style.opacity = d < 10 - n ? "0.3" : "1"; }); lastDim = n; }
            for (const c of cols) HR.glow(c, T, T >= MINE ? 0.55 : 0.3, 0.5);
            const locked = T >= MINE;
            stt.textContent = locked ? "LOCKED" : "OPEN";
            stt.style.color = locked ? "#E85D26" : "#F0ECE5";
            stdot.style.display = locked ? "none" : "block";
            stdot.style.opacity = (0.45 + 0.55 * Math.abs(Math.sin(t * 6))).toFixed(2);
            pad.style.display = locked ? "block" : "none";
            pk.textContent = "PKT " + String(LAND.filter((b) => T >= b).length).padStart(4, "0") + " · " + fmt(Math.floor(v)) + " B";

            for (const h of heroes) HR.glow(h, T, 0.35, 0.8);
            // the archive fills: more ghost glyphs light as the chorus goes on, faster once the bytes pour in; hats flicker a few
            const fill = T < G2 ? 0.08 + 0.22 * (T - T0) / (G2 - T0) : 0.3 + 0.7 * clamp01(v / 70000);
            const hat = HR.hit("hat", T, 0.07);
            for (const { u, order, flick } of lits) {
              const on = order < fill;
              u.style.opacity = on ? (flick ? (0.6 - 0.45 * hat).toFixed(2) : "0.6") : "0";
            }
            lightEl.style.opacity = ((0.6 + 0.5 * HR.band("bass", T)) * (T >= MINE ? 0.3 : 1)).toFixed(3);
            plightEl.style.transform = `scale(${(0.96 + 0.08 * HR.band("bass", T)).toFixed(3)})`;
          }
          tl.eventCallback("onUpdate", render);
          tl.seek(0); render();
          window.__timelines["04-wait"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
