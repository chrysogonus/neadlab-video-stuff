          return (2 * u3 - 3 * u2 + 1) * CK[i][c] + (u3 - 2 * u2 + u) * h * tan(i) + (-2 * u3 + 3 * u2) * CK[i + 1][c] + (u3 - u2) * h * tan(i + 1);
        };
        // "key": a soft swell (short eased attack, slow release) used by the fov, the chip and the ring
        const keyEnv = (t) => (t < KEY ? 0 : smooth(0, 0.07, t - KEY) * Math.exp(-(t - KEY - 0.07 > 0 ? t - KEY - 0.07 : 0) * 2.6));
        const tgt = new THREE.Vector3();
        let camAz = 0;
        // v19: until the push through the fridge door the camera stands back so the whole cryostat hangs in the doorway
        // (lens-shifted onto the window); it dollies in with the push and settles into the descent by ~132.8.
        const lerp = (a, b, u) => a + (b - a) * u;
        function placeCamera(t) {
          const b = smooth(PUSH0 - 0.08, PUSH1 + 0.25, t);
          camAz = 0.92 - 0.16 * t;
          const y = lerp(44, camPath(t, 1), b), rh = lerp(215, camPath(t, 2), b);
          camera.position.set(rh * Math.sin(camAz), y, rh * Math.cos(camAz));
          tgt.set(0, lerp(30, camPath(t, 3), b), 0);
          const sx = lerp(WCX / 1920, SX, b), sy = lerp(WCY / 1080, SY, b);
          camera.setViewOffset(1920, 1080, -(sx - 0.5) * 1920, (0.5 - sy) * 1080, 1920, 1080);
          camera.fov = 40 - 1.4 * keyEnv(t);
          camera.updateProjectionMatrix();
          camera.lookAt(tgt);
          camera.updateMatrixWorld();
          return y;
        }

        // ---- stage tags and the "next stop" readout ----------------------------------------------------------
        const tags = PLATES.filter((p) => p.label).map((p) => {
          const d = el("div", "f21-tag" + (p.mxc ? " f21-mxc" : ""), $("f21-tags"));
          el("i", "", d); const s = el("span", "", d); el("b", "", s, p.label[0]); s.append(p.label[1]);
          return { p, d, v: new THREE.Vector3() };
        });
        const STOPS = [[25, "NEXT STOP · <b>800 mK</b> STILL"], [12.5, "NEXT STOP · <b>100 mK</b> COLD PLATE"], [3, "NEXT STOP · <b>10 mK</b> MIXING CHAMBER"], [-1e9, "LAST STOP · <b>THE CHIP</b> · 10 mK"]];
        let stopShown = -1;

        // ---- v21: the key that falls out: 13's key, physical. It is computed on "key" (the chip flashes white-hot and throws
        // it out, glowing), tumbles toward the lens from "falls" (a perspective approach: small at the chip, growing fast),
        // lands ON "out" blade-tip first with sparks, the bow slams down on the kick 134.133, it hops and settles on the kick
        // 134.393 — at 13's key position and height, so 13's key glides in where this one lies. Sparks are metal on enamel.
        const KEYHEX = HR.cipher(64, 9113).toLowerCase();
        const fxc = $("f21-fx"), DPR = window.devicePixelRatio || 1;
        fxc.width = Math.round(1920 * DPR); fxc.height = Math.round(1080 * DPR);
        const fx = fxc.getContext("2d"); fx.setTransform(DPR, 0, 0, DPR, 0, 0);
        const SLOT_X = 0.055 * 1920, SLOT_Y = 905, ADV = 17.6;
        const B1 = L(134.133), B2 = L(134.393);
        const LX = 1290, LY = 527, KS = 1.15, SYR = 0.56, HALF = 220 * KS, TIP = [LX - HALF, LY], TILT = -16;
        const keyPath = "M0 0 H72 V72 H0 Z M22 25 V47 H48 V25 Z M72 26 H230 V44 H218 V58 H204 V44 H188 V54 H172 V44 H156 V60 H140 V44 H72 Z";
        $("f21-keys").innerHTML = [0.16, 0.32].map(() => `<div class="f21-key f21-ghost"><svg viewBox="0 0 230 72" aria-hidden="true"><g transform="translate(230 0) scale(-1 1)"><path d="${keyPath}" fill-rule="evenodd" fill="#FFE6CC"/></g></svg></div>`).join("") +
          `<div class="f21-key" id="f21-key"><svg viewBox="0 0 230 72" aria-hidden="true"><defs>
            <path id="f21-kp" fill-rule="evenodd" d="${keyPath}"/><clipPath id="f21-kclip"><use href="#f21-kp"/></clipPath>
            <linearGradient id="f21-kg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/><stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.7" stop-color="#111111" stop-opacity="0.06"/><stop offset="1" stop-color="#111111" stop-opacity="0.24"/></linearGradient></defs>
            <g transform="translate(230 0) scale(-1 1)">
              <use href="#f21-kp" fill="#888880" transform="translate(0 4)"/><use href="#f21-kp" fill="#F0ECE5"/>
              <g clip-path="url(#f21-kclip)">
                <rect x="0" y="0" width="230" height="72" fill="url(#f21-kg)"/>
                <path d="M78 33 H226" stroke="rgba(17,17,17,0.22)" stroke-width="2.2"/><path d="M78 35.4 H226" stroke="rgba(255,255,255,0.7)" stroke-width="1"/>
                <path d="M18 21 H52 V51" fill="none" stroke="rgba(17,17,17,0.3)" stroke-width="2"/><path d="M18 51 H52" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/>
                <circle cx="10" cy="10" r="2.2" fill="rgba(17,17,17,0.35)"/><circle cx="62" cy="10" r="2.2" fill="rgba(17,17,17,0.35)"/>
                <circle cx="10" cy="62" r="2.2" fill="rgba(17,17,17,0.35)"/><circle cx="62" cy="62" r="2.2" fill="rgba(17,17,17,0.35)"/>
                <rect id="f21-kheat" x="0" y="0" width="230" height="72" fill="#FFF8EE" opacity="0"/>
                <rect id="f21-kshade" x="0" y="0" width="230" height="72" fill="#111111" opacity="0"/>
              </g>
              <use href="#f21-kp" fill="none" stroke="#111111" stroke-width="1.6" stroke-linejoin="miter"/>
            </g>
            <text id="f21-ktext" x="30" y="41.4" font-family="IBM Plex Mono" font-weight="600" font-size="7.4" letter-spacing="1.4" fill="rgba(17,17,17,0.5)">X25519 · RECORDED KEY EXCHANGE</text></svg></div>`;
        const keyEl = $("f21-key"), ghosts = Array.from(document.querySelectorAll(".f21-ghost")), kshadow = $("f21-kshadow");
        const chipV = new THREE.Vector3(0, CHIP_Y - 0.5, 0);
        const toScreen = (v) => { const p = v.clone().project(camera); return [(p.x + 1) * 960, (1 - p.y) * 540]; };
        const rc = new THREE.Raycaster();
        const onShelf = (sx, sy, out) => { // the shelf point under a screen point (camera as currently placed)
          rc.setFromCamera(new THREE.Vector2(sx / 960 - 1, 1 - sy / 540), camera);
          const o = rc.ray.origin, d = rc.ray.direction, k = d.y < -1e-4 ? (SHELF - o.y) / d.y : 400;
          return out.set(o.x + d.x * k, SHELF, o.z + d.z * k);
        };
        const heatOf = (t) => (t < KEY ? 0 : 0.12 + 0.88 * Math.exp(-(t - KEY) * 1.7));
        // the key's pose (centre x, y; rotation deg; scale; scaleY of the flip about its shaft, signed) at local time t
        function keyPose(t) {
          if (t < KEY) return null;
          const flip = (u) => Math.cos(3 * Math.PI * (1 - u)); // three half turns about the shaft, face up on landing
          if (t < LAND) {
            const ua = (t - KEY) / (LAND - KEY), rot = TILT - 400 * (LAND - t);
            const [cx, cy] = toScreen(chipV);
            const sy = flip(ua) * lerp(1, SYR, smooth(FALL, LAND, t));
            if (t < FALL) { // thrown out of the chip: a short pop up and out
              const u = (t - KEY) / (FALL - KEY), e = 1 - (1 - u) * (1 - u);
              return { x: cx + 70 * e, y: cy + 10 - 44 * e, rot, sc: 0.13 + 0.09 * u, sy };
            }
            const u = (t - FALL) / (LAND - FALL);
            const P1 = [TIP[0] + HALF * Math.cos((TILT * Math.PI) / 180), TIP[1] + HALF * Math.sin((TILT * Math.PI) / 180)];
            const sx0 = cx + 70, sy0 = cy - 34, wx = 1 - Math.pow(1 - u, 1.6), wy = Math.pow(u, 1.25);
            const sc = 1 / (1 / 0.22 + (1 / KS - 1 / 0.22) * Math.pow(u, 0.95));
            return { x: sx0 + (P1[0] - sx0) * wx, y: sy0 + (P1[1] - sy0) * wy, rot, sc, sy };
          }
          if (t < B1) { // blade tip down: the key pivots on its tip and the bow slams onto the shelf
            const v = (t - LAND) / (B1 - LAND), th = TILT * (1 - v * v), a = (th * Math.PI) / 180;
            return { x: TIP[0] + HALF * Math.cos(a), y: TIP[1] + HALF * Math.sin(a), rot: th, sc: KS, sy: SYR };
          }
          if (t < B2) { // the rebound: a hop, the bow lifting a little
            const v = (t - B1) / (B2 - B1), h = 30 * 4 * v * (1 - v);
            return { x: LX + 6 * Math.sin(Math.PI * v), y: LY - h, rot: -5 * Math.sin(Math.PI * v), sc: KS * (1 + 0.02 * Math.sin(Math.PI * v)), sy: SYR, hop: h };
          }
          const w = t - B2, d = Math.exp(-w * 13);
          return { x: LX, y: LY - 4 * Math.abs(Math.sin(w * 34)) * d, rot: 1.6 * Math.sin(w * 34) * d, sc: KS, sy: SYR };
        }
        const placeKey = (node, p, alpha) => {
          if (!p || alpha <= 0.002) { node.style.opacity = "0"; return; }
          node.style.opacity = alpha.toFixed(3);
          node.style.transform = `translate(${(p.x - 220).toFixed(1)}px, ${(p.y - 68.75).toFixed(1)}px) rotate(${p.rot.toFixed(2)}deg) scale(${p.sc.toFixed(4)}, ${(p.sc * p.sy).toFixed(4)})`;
        };
        function drawKey(t) {
          const p = keyPose(t);
          placeKey(keyEl, p, p ? smooth(KEY - 0.01, KEY + 0.05, t) : 0);
          if (p) {
            const h = heatOf(t), f = Math.abs(p.sy) / Math.max(0.01, Math.abs(p.sy) > SYR ? 1 : SYR);
            $("f21-kheat").setAttribute("opacity", (0.92 * h).toFixed(3));
            $("f21-kshade").setAttribute("opacity", (0.5 * clamp01(1 - f)).toFixed(3));
            $("f21-ktext").setAttribute("opacity", p.sy > 0 ? 1 : 0);
            keyEl.style.filter = `drop-shadow(0 0 1.5px rgba(10,10,10,0.95)) drop-shadow(0 0 ${(6 + 34 * h).toFixed(1)}px rgba(232,93,38,${(0.35 + 0.55 * h).toFixed(2)}))`;
          }
          // two trailing copies while it flies (a shutter smear on the fall only)
          ghosts.forEach((g, i) => {
            const lag = 0.035 * (i + 1), q = t > FALL && t < LAND + 0.03 ? keyPose(Math.max(KEY, Math.min(t, LAND) - lag)) : null;
            placeKey(g, q, (i ? 0.14 : 0.28) * smooth(FALL, FALL + 0.2, t) * (1 - smooth(LAND - 0.05, LAND + 0.03, t)));
          });
          // the contact shadow on the shelf: soft and wide while the key is high, tight and dark on contact
          if (!p || t < FALL) { kshadow.style.opacity = "0"; return; }
          const u = t < LAND ? (t - FALL) / (LAND - FALL) : 1, lift = t < LAND ? 1 - u : (p.hop || 0) / 30;
          kshadow.style.opacity = (0.85 * smooth(0.25, 1, u) * (1 - 0.35 * lift)).toFixed(3);
          kshadow.style.transform = `translate(${(p.x - 280).toFixed(1)}px, ${(LY + 30 - 38).toFixed(1)}px) scale(${(0.35 + 0.65 * u * (1 - 0.1 * lift)).toFixed(3)}, ${(0.6 + 0.4 * u).toFixed(3)})`;
        }

        // sparks: metal on enamel. Each spray is seeded; positions are simulated from the spawn to t (pure function of t).
        const SPRAYS = [];
        const spray = (t0, x, y, n, a0, a1, floor, sp, seed) => {
          const r = HR.rng(seed);
          for (let i = 0; i < n; i++) {
            const a = ((a0 + (a1 - a0) * r()) * Math.PI) / 180, v = sp * (0.3 + 0.7 * r());
            SPRAYS.push({ t0: t0 + r() * 0.03, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.35 + 0.55 * r(), floor, hot: r() });
          }
        };
        const simTo = (s, dt) => { // fixed-step ballistic flight with a damped bounce on the shelf line
          let x = s.x, y = s.y, vx = s.vx, vy = s.vy; const h = 1 / 240, n = Math.floor(dt / h);
          for (let k = 0; k < n; k++) { vy += 2400 * h; x += vx * h; y += vy * h; if (y > s.floor && vy > 0) { y = s.floor; vy *= -0.32; vx *= 0.7; } }
          return [x, y];
        };
        function drawSparks(t) {
          for (const s of SPRAYS) {
            const dt = t - s.t0; if (dt <= 0 || dt > s.life) continue;
            const fade = 1 - dt / s.life, [x, y] = simTo(s, dt), [x0, y0] = simTo(s, Math.max(0, dt - 0.024));
            fx.lineCap = "round";
            fx.strokeStyle = `rgba(232,93,38,${(0.5 * fade).toFixed(3)})`; fx.lineWidth = 5;
            fx.beginPath(); fx.moveTo(x0, y0); fx.lineTo(x, y); fx.stroke();
            fx.strokeStyle = s.hot > 0.35 ? `rgba(255,246,234,${fade.toFixed(3)})` : `rgba(255,190,140,${fade.toFixed(3)})`; fx.lineWidth = 2;
            fx.beginPath(); fx.moveTo(x0, y0); fx.lineTo(x, y); fx.stroke();
          }
        }
        function drawFx(t) {
          fx.clearRect(0, 0, 1920, 1080);
          if (t < KEY) return;
          drawSparks(t);
          // the session key's hex prints under the derivation once the key is down
          const n = Math.floor(64 * clamp01((t - LAND - 0.06) / 0.36));
          if (n > 0) {
            fx.font = '600 29px "IBM Plex Mono"'; fx.textAlign = "left"; fx.textBaseline = "middle";
            fx.shadowColor = "rgba(232,93,38,0.6)"; fx.shadowBlur = 10; fx.fillStyle = "#F0ECE5";
            for (let i = 0; i < n; i++) fx.fillText(KEYHEX[i], SLOT_X + i * ADV, SLOT_Y);
            fx.shadowBlur = 0;
          }
        }

        // ---- timeline -----------------------------------------------------------------------------------------
        const tl = gsap.timeline({ paused: true });
        const clock = { t: 0 };
        tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none" }, 0);
        const stage = HR.stage($("root"), { seed: 21 });
        const cam = stage.cam;
        // the type rides a slow push of its own (carrier) — no elastic kicks
        tl.fromTo(cam, { z: 1.0, y: -6 }, { z: 1.045, y: 4, duration: DUR, ease: "none" }, 0);

        // lead words: soft entrances; "The" is sung on the frame's first instant and arrives with the glide.
        // "falls" and "out" sink into place: the words fall.
        for (const [s, t, big] of spans) {
          if (big) continue;
          if (t === T0) continue;
          WOW.word(tl, s, L(t), { kind: t >= 133.2 ? "sink" : "rise", dur: 0.3 });
        }
        // the hero: a soft hit (small overshoot), a gentle punch of the row; the physical key comes out of the chip (drawKey)
        const [keySpan, , , keyRow] = spans.find((x) => x[2]);
        // v21: sparks — from the chip as the key is thrown out, then metal on enamel at each impact; the world shakes with them
        placeCamera(KEY);
        const [chx, chy] = toScreen(chipV);
        spray(KEY, chx, chy, 26, 0, 360, chy + 130, 900, 2101);
        spray(LAND, TIP[0] + 6, LY + 14, 54, -175, -95, LY + 40, 1150, 2102);
        spray(LAND, TIP[0] + 6, LY + 14, 16, -85, -20, LY + 40, 800, 2103);
        spray(B1, LX + HALF - 40, LY + 18, 40, -85, -5, LY + 40, 1050, 2104);
        spray(B2, LX - HALF + 30, LY + 18, 14, -170, -110, LY + 40, 650, 2105);
        spray(B2, LX + HALF - 40, LY + 18, 14, -70, -10, LY + 40, 650, 2106);
        WOW.shake(tl, $("f21-world"), LAND, { amp: 7, dur: 0.3, seed: 21 });
        WOW.shake(tl, $("f21-world"), B1, { amp: 5, dur: 0.26, seed: 22 });
        WOW.shake(tl, $("f21-world"), B2, { amp: 3, dur: 0.24, seed: 23 });
        const IMPACTS = [[LAND, 1], [B1, 0.75], [B2, 0.45]];
        const impactAt = (t) => IMPACTS.reduce((m, [ti, s]) => Math.max(m, t < ti ? 0 : s * Math.exp(-(t - ti) / 0.22)), 0);
        const landP = new THREE.Vector3(), heatP = new THREE.Vector3();
        placeCamera(LAND); onShelf(LX, LY + 30, landP);
        HR.hero(tl, keySpan, KEY, { spread: 16, over: 1.12, pre: 0.16, sharp: true });
        WOW.punch(tl, keyRow, KEY, { s: 1.035, dur: 0.5 });
        WOW.pulse(tl, $("f21-l26"), { kind: "kick", amt: 0.012, y: 2 });

        // the derivation types on after the flash; the label and the marker after the last character lands
        const typeOn = (id, at, d) => tl.fromTo("#" + id, { clipPath: "inset(-20% 100% -20% 0)" }, { clipPath: "inset(-20% 0% -20% 0)", duration: d, ease: "none" }, at);
        typeOn("f21-s1", KEY + 0.08, 0.4);
        typeOn("f21-s2", KEY + 0.42, 0.36);
        tl.fromTo("#f21-klabel", { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, FALL + 0.1);
        tl.fromTo("#f21-mark", { clipPath: "inset(-20% 100% -30% -5%)" }, { clipPath: "inset(-20% 0% -30% -5%)", duration: 0.3, ease: "none" }, LAND + 0.08);
        tl.fromTo("#f21-foot", { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, PUSH1 + 0.05); // v19: once inside (was 0.4, under the fridge)

        // switches: glideDown in from 12, glideL out to 13 (one beat each side)
        const host = document.getElementById("el-21-fridge") || $("root");
        WOW.transition(tl, host, { in: "glideDown", out: "glideL", dur: 0.46, total: DUR });

        const v = new THREE.Vector3();
        function render() {
          const t = tl.time(), T = t + T0;
          stage.apply(T);
          WOW.draw(tl, T0);
          renderFridge(t);
          const bass = HR.band("bass", T), kick = HR.hit("kick", T, 0.12);
          const camY = placeCamera(t);
          // the computation: pulses run faster and denser toward "key"; on the flash they all fire, then thin out
          const run = smooth(0.3, KEY, t), post = t > KEY ? Math.exp(-(t - KEY) * 3) : 0;
          for (let i = 0; i < NP; i++) {
            const p = pulses[i], path = COAX[p.line];
            const u = ((t * p.sp * (0.6 + 1.6 * run) + p.ph) % 1);
            const s = u * (path.length - 1), k = Math.floor(s), w = s - k, a = path[k], b = path[Math.min(k + 1, path.length - 1)];
            posAttr.setXYZ(PULSE0 + i, a[0] + (b[0] - a[0]) * w, a[1] + (b[1] - a[1]) * w, a[2] + (b[2] - a[2]) * w);
            aVis.setX(PULSE0 + i, (0.35 + 0.65 * run) * smooth(p.born * 0.6, p.born * 0.6 + 0.25, t) * (1 - 0.7 * post * (i % 3 ? 1 : 0)));
          }
          posAttr.needsUpdate = true; aVis.needsUpdate = true;
          // the hum: the whole cryostat trembles a hair with the bass
          group.position.set(0.04 * bass * Math.sin(T * 2 * Math.PI * 23), 0, 0.04 * bass * Math.cos(T * 2 * Math.PI * 19));
          const flash = keyEnv(t);
          uni.uTime.value = t; uni.uHum.value = bass; uni.uRun.value = run; uni.uFlash.value = flash;
          // v21: the stages light one per hit (flare white-hot, then warm; the chip pre-heats the mixing chamber from the
          // cold plate's hit); the shelf takes the chip's light from "key"
          for (let i = 0; i < 6; i++) {
            const d = t - STAGE_T[i], lit = Math.max(d < 0 ? 0 : smooth(0, 0.04, d), i === 5 ? 0.4 * smooth(STAGE_T[4], KEY, t) : 0), fl = d < 0 ? 0 : smooth(0, 0.015, d) * Math.exp(-d / 0.22);
            uni.uLit.value[i] = lit; uni.uFlare.value[i] = fl;
            bandMats[i].uniforms.uLit.value = lit; bandMats[i].uniforms.uFlare.value = fl;
          }
          uni.uLit.value[6] = smooth(KEY - 0.02, KEY + 0.04, t); uni.uFlare.value[6] = flash;
          const imp = impactAt(t), sm = shelfMat.uniforms;
          sm.uPool.value = smooth(KEY - 0.04, KEY + 0.12, t) * (0.78 + 0.35 * flash) + 0.4 * imp;
          sm.uImpact.value = imp; sm.uLand.value.copy(landP);
          sm.uHeat.value = t > FALL ? heatOf(t) * smooth(FALL, LAND, t) : 0;
          if (t > FALL) { const p = keyPose(t); if (p) onShelf(p.x, LY + 30, heatP); sm.uHeatP.value.copy(heatP); }
          uni.uScale.value = 540 / Math.tan((camera.fov * Math.PI) / 360);
          uni.uBloom.value = 0.08 * (1 + 0.6 * bass + 0.6 * kick) + 0.06 * flash;
          hazeMat.uniforms.uHaze.value = 0.3 + 0.35 * run + 0.5 * flash;
          haze.quaternion.copy(camera.quaternion);
          renderer.render(scene, camera);
          // tags follow their plates' right-hand rim as seen from the camera; they fade at the frame's edges
          for (const g of tags) {
            const a = -camAz + 0.12;
            v.set(g.p.r * Math.cos(a), g.p.y, g.p.r * Math.sin(a)).applyMatrix4(group.matrixWorld);
            const [x, y] = toScreen(v);
            g.d.style.transform = `translate(${(x + 14).toFixed(1)}px, ${(y - 10).toFixed(1)}px)`;
            g.d.style.opacity = (smooth(20, 110, y) * (1 - smooth(860, 940, y)) * (1 - smooth(1700, 1800, x))).toFixed(3);
          }
          // the next stop: the first stage still below the camera
          const k = STOPS.findIndex(([y]) => camY > y);
          if (k !== stopShown) { stopShown = k; $("f21-stop").innerHTML = STOPS[k][1]; }
          drawKey(t);
          drawFx(t);
          HR.glow(keyRow, T, 0.5, 0.9);
        }
        tl.eventCallback("onUpdate", render);
        render();
        window.__timelines["21-fridge"] = tl;
      </script>
    </template>
