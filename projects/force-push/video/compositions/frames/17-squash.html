        (() => {

          const tl = gsap.timeline({ paused: true });

          // ---- the todo list: oldest first, `pick` everywhere until the substitution ----
          const N = 1095, f = HR.rng(17);
          const hex = () => { let s = ""; for (let i = 0; i < 7; i++) s += "0123456789abcdef"[(f() * 16) | 0]; return s; };
          const SUBJ = ["wip", "fix", "sorry", "fix typo", "later", "small fix", "update us.txt", "we'll talk", "tomorrow", "it's fine",
            "one more thing", "temp", "forgot", "cleanup", "trust me", "really fixed now", "wip (again)", "ok", "promise", "fix the fix",
            "just checking", "busy", "soon", "nothing", "revert \"sorry\""];

            7: ["d27a0c5", "just a feature"], 11: ["6b1e9f3", "we'll get to it"], [N]: ["e81b0d4", "ready."] };
          const todo = [];

          // git's help block, wrapped as vim (linebreak) shows it in this window: [text, continuation?, key line?]
          const HELP = [["", 0], ["# Rebase e81b0d4 onto 7c3d9a2 (1095 commands)", 0], ["#", 0], ["# Commands:", 0],

            }

            return `<span class="f17-n">${cont ? "     " : String(i + 1).padStart(4) + " "}</span><span class="${key ? "f17-d" : "f17-c"}">${esc(txt)}</span>`;
          };
          const list = $("f17-list"), pool = [];

          const ed = { k: 2.25 };

          // three years, down: the view runs to the end of the file, arriving as "a" is sung (a pure function of time, so
          // render() knows its speed for the motion blur)
          const SC_A = at(85.0), SC_B = at(87.0), scE = gsap.parseEase("power2.inOut");
          const scrollAt = (t) => (t <= SC_A ? 0 : t >= SC_B ? S_END : S_END * scE((t - SC_A) / (SC_B - SC_A)));
          const SUB = ":2,$s/^pick/squash/", SUB_A = 0.12, SUB_B = SQUASHED - 0.1, MATCH_LEN = ":2,$s/^pick".length;

          // ---- the lyric, stacked: "squashed" slams and is squashed; the rest builds on its word times ----

          tl.fromTo($("f17-sq"), { scaleY: 0.5, scaleX: 1.16 }, { scaleY: 1, scaleX: 1, duration: 0.62, ease: "elastic.out(1, 0.38)" }, SQUASHED);
          const sw = root.querySelectorAll(".f17-w");

          const stackEl = $("f17-stack"), win = $("f17-win");

          gsap.set(win, { transformOrigin: "0% 66%" });
          tl.fromTo(win, { scaleY: 1 }, { scaleY: 0.03, duration: SINGLE - PRESS, ease: "power3.in", immediateRender: false }, PRESS);
          tl.set(win, { opacity: 1 }, 0).set(win, { opacity: 0 }, SINGLE);
          tl.set($("f17-msg"), { opacity: 0 }, 0).set($("f17-msg"), { opacity: 1 }, SINGLE + 0.04);
          // the single line: what was sung drops onto the pressed stack as one line (a fixed-content slam: motion-blurred,

          const pre = $("f17-pre"), DROP_A = SINGLE - 0.09;
          tl.set(pre, { opacity: 0, y: -780, scaleY: 1.8 }, 0).set(pre, { opacity: 1 }, DROP_A);
          tl.fromTo(pre, { y: -780, scaleY: 1.8 }, { y: 0, scaleY: 1, duration: SINGLE - DROP_A, ease: "power2.in", immediateRender: false }, DROP_A);
          tl.fromTo(pre, { scaleY: 0.78 }, { scaleY: 1, duration: 0.5, ease: "elastic.out(1, 0.42)", immediateRender: false }, SINGLE);
          const sq = { x: 1 };
          tl.fromTo(sq, { x: 1.14 }, { x: 1, duration: 0.3, ease: "expo.out", immediateRender: false }, SINGLE);

          HR.lead(tl, $("f17-last"), LINE);
          // the counter: 1,095 is pressed to a hairline, 1 lands
          tl.fromTo($("f17-old"), { scaleY: 1 }, { scaleY: 0.12, duration: SINGLE - PRESS, ease: "power3.in", immediateRender: false }, PRESS);
          tl.set($("f17-new"), { opacity: 0 }, 0).set($("f17-new"), { opacity: 1 }, SINGLE);

          const pk = (t) => 0.02 + 0.04 * HR.band("drums", T0 + t + 0.03);
          tl.fromTo(stage.cam, { z: 1.0, x: 0, y: 0 }, { z: 1.03, x: -10, y: 8, duration: SQUASHED - 0.06, ease: "sine.inOut" }, 0);
          tl.to(stage.cam, { z: 1.03 + pk(SQUASHED), y: 2, duration: 0.06, ease: "power2.in" }, SQUASHED - 0.06);
          tl.to(stage.cam, { z: 1.02, x: 0, y: 0, duration: 0.5, ease: "elastic.out(1, 0.55)" }, SQUASHED);
          tl.to(stage.cam, { z: 1.075, x: 40, y: 26, duration: PRESS - SQUASHED - 0.5, ease: "sine.inOut" }, SQUASHED + 0.5);
          tl.to(stage.cam, { z: 1.11, y: 14, duration: SINGLE - PRESS, ease: "power2.in" }, PRESS);
          tl.to(stage.cam, { z: 1.03, x: 0, y: 0, duration: 0.5, ease: "elastic.out(1, 0.5)" }, SINGLE);
          tl.to(stage.cam, { z: 1.05, x: -12, duration: DUR - SINGLE - 0.5, ease: "none" }, SINGLE + 0.5);
          WOW.shake(tl, cam, SINGLE + 0.005, { amp: 6 + 10 * WOW.energy(T0 + SINGLE), dur: 0.34, rot: 0.25, seed: 17 });
          tl.set({}, {}, DUR);

          // ---- per-frame state: the list window, the command line, the ruler, the fit of the squashed line, the light ----
          const cl = $("f17-cl"), cur = $("f17-cur"), ruler = $("f17-ruler"), file = $("f17-file"), line = $("f17-line");
          const sqWord = $("f17-sq"), single = $("f17-single"), glow = $("f17-glow"), wash = $("f17-wash"), cmdl = $("f17-cmdline");
          const vbg = $("f17-vbg"), pbg = $("f17-pbg");
          const blink = (t, since) => t - since < 0.35 || Math.floor((t - since) * 2) % 2 === 0;
          const typed = (s, a, b, t) => s.slice(0, t < a ? 0 : Math.min(s.length, 1 + Math.floor(((t - a) / (b - a)) * s.length)));
          const lastKey = (s, a, b, t) => a + ((b - a) * Math.max(0, typed(s, a, b, t).length - 1)) / s.length;
          const ROW = 2.24 * PX;
          // the squashed line's width, measured once from the font (fixed composition coordinates, not the DOM)
          let LINE_EM = 18.3; // fallback before the font is ready
          const measureLine = () => {
            const c = document.createElement("canvas").getContext("2d");
            c.font = '800 100px "Barlow"'; c.letterSpacing = "-3px";
            LINE_EM = c.measureText("squashed three years down to a single line").width / 100; // not textContent: the blur copies live inside the line
          };
          const FONT_PX = 11 * PX, MEASURE_PX = 89 * PX, fitNow = () => MEASURE_PX / (LINE_EM * FONT_PX);
          // the glow's anchors (layout offsets, transforms ignored): the command line, "squashed", "single"
          let A = null;
          const anchors = (fit) => {
            const stk = { x: stackEl.offsetLeft + sqWord.offsetLeft + sqWord.offsetWidth / 2, y: stackEl.offsetTop + sqWord.offsetTop + sqWord.offsetHeight * 0.55 };
            const sgl = { x: line.offsetLeft + (single.offsetLeft + single.offsetWidth / 2) * fit, y: line.offsetTop + single.offsetTop + single.offsetHeight * 0.55 };
            return { cmd: { x: cmdl.offsetLeft + 20 * PX, y: cmdl.offsetTop + 1.2 * PX }, stk, sgl };
          };
          // measured at build time and again once the fonts are in, never inside render()
          const measureAll = () => { measureLine(); A = anchors(fitNow()); };
          if (document.fonts.check('800 100px "Barlow"')) measureLine();
          A = anchors(fitNow());
          document.fonts.load('800 100px "Barlow"').then(() => { measureAll(); render(); });
          const e3 = gsap.parseEase("power3.out"), pressE = gsap.parseEase("power3.in");
          const mix = (p, q, u) => ({ x: p.x + (q.x - p.x) * u, y: p.y + (q.y - p.y) * u });
          function render() {
            const t = tl.time(), T = T0 + t;
            const bass = HR.band("bass", T), kick = HR.hit("kick", T, 0.2);
            // the window: scale and scroll; the scroll's speed blurs it along its travel
            const s = scrollAt(t), top = Math.floor(s), frac = s - top;
            list.style.transform = `scale(${ed.k.toFixed(4)}) translateY(${(-frac * ROW).toFixed(2)}px)`;
            const vRows = (scrollAt(t + 1 / 120) - scrollAt(t - 1 / 120)) * 60; // rows per second
            const vb = Math.min(18, (vRows * ROW) / 120 * 0.5);
            vbg.setAttribute("stdDeviation", `0 ${vb.toFixed(2)}`);
            list.style.filter = vb > 0.3 ? "url(#f17-vb)" : "none";
            const typedSub = t < SQUASHED ? typed(SUB, SUB_A, SUB_B, t) : "";
            const match = t < SQUASHED && typedSub.length >= MATCH_LEN;
            const cursorRow = t < SQUASHED ? 0 : t >= flipAt(19) + HOT ? Math.min(N - 1, top + 8) : -1;
            for (let k = 0; k < pool.length; k++) {
              const i = top + k, html = i < ROWS ? rowHTML(i, t, match, i === cursorRow) : "";
              if (pool[k]._h !== html) { pool[k].innerHTML = html; pool[k]._h = html; }
            }
            // the press: the stack and the list blur vertically as they are flattened
            const pu = t < PRESS || t >= SINGLE ? 0 : pressE((t - PRESS) / (SINGLE - PRESS));
            pbg.setAttribute("stdDeviation", `0 ${(14 * pu).toFixed(2)}`);
            const pf = pu > 0.02 ? "url(#f17-pb)" : "none";
            stackEl.style.filter = pf; win.style.filter = pf;
            // vim's command line and status bar
            let txt = "", curOn = false;
            if (t < SQUASHED) {
              txt = t < SUB_A ? '".git/rebase-merge/git-rebase-todo" 1131L, 37604B' : typedSub;
              curOn = t >= SUB_A && blink(t, lastKey(SUB, SUB_A, SUB_B, t));
            } else if (t < WQ_A) txt = "1094 substitutions on 1094 lines";
            else if (t < PRESS) { txt = typed(":wq", WQ_A, WQ_B, t); curOn = true; }
            else if (t >= SINGLE) txt = '".git/COMMIT_EDITMSG" 3297L, 51762B';
            cl.textContent = txt; cur.style.opacity = curOn ? 1 : 0;
            if (t < SINGLE) {
              const squashed = t >= SQUASHED;
              file.textContent = ".git/rebase-merge/git-rebase-todo" + (squashed ? " [+]" : "");
              const ln = !squashed ? 1 : Math.min(N, Math.round(s) + 9);
              const pos = s <= 0.01 ? "Top" : s >= S_END - 0.01 ? "Bot" : Math.round((s / S_END) * 100) + "%";
              ruler.textContent = `${ln},1`.padEnd(14) + pos.padStart(4);
            } else { file.textContent = ".git/COMMIT_EDITMSG"; ruler.textContent = "1,1".padEnd(14) + " Top"; }
            // the single line, squashed to the frame's measure
            const fit = fitNow();
            line.style.transform = `scaleX(${(fit * sq.x).toFixed(4)})`;
            // the light: the glow waits on the command line, jumps to "squashed", then to "single"; the screen breathes
            const u1 = t < SQUASHED ? 0 : e3(Math.min(1, (t - SQUASHED) / 0.3)), u2 = t < SINGLE ? 0 : e3(Math.min(1, (t - SINGLE) / 0.3));
            const g = mix(mix(A.cmd, A.stk, u1), A.sgl, u2);
            glow.style.transform = `translate(${g.x.toFixed(1)}px, ${g.y.toFixed(1)}px)`;
            const lit = t < SQUASHED ? 0.4 + 0.15 * (t / SQUASHED) : 0.82;
            glow.style.opacity = Math.min(1, lit + 0.3 * bass + 0.25 * kick).toFixed(3);
            wash.style.opacity = Math.min(1, 0.86 + 0.14 * bass + 0.08 * kick).toFixed(3);
            HR.glow(sqWord, T); HR.glow(single, T, 0.3, 0.5);
            stage.apply(T);
            WOW.draw(tl, T0);
          }
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["17-squash"] = tl;
        })();
      </script>
    </template>
