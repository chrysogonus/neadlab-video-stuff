            back.style.color = `rgb(${Math.round(mix(240, 136, u))}, ${Math.round(mix(236, 136, u))}, ${Math.round(mix(229, 128, u))})`;
            back.style.setProperty("--f36-who-a", mix(1, 0.8, u).toFixed(3));
            bcmd.style.opacity = Math.max(0, Math.min(1, (t - 0.12) / 0.26)).toFixed(3);
          }
          WOW.transition(tl, $("f36-cam"), { in: "cut", out: "cut", dur: 0, total: DUR }); // both cuts hard (REFINE-1 table)
          tl.set({}, {}, DUR);

          // ---- per-frame: typing, cursors, light, the camera ----
          const page = $("f36-page"), cmd = $("f36-cmd"), cur1 = $("f36-cur1"), cur2 = $("f36-cur2");
          const heroes = root.querySelectorAll(".f36-hero.hr-glowbox");
          const blink = (t, since) => t - since < 0.35 || Math.floor((t - since) * 2) % 2 === 0;
          function render() {
            const t = tl.time(), T = T0 + t;
            let k = keys[0]; for (const s of keys) if (s[0] <= t) k = s;
            cmd.textContent = k[1];
            cur1.style.opacity = t < ENTER && (t < 0.3 || (t > at(193.2) && t < TYPED + 0.05) || blink(t, Math.max(k[0], 0.26))) ? 1 : 0;
            cur2.style.opacity = t >= QUIT ? 1 : 0; // lit from the prompt's return to the cut (37 opens on it)
            // light: the screen glow follows the camera's centre a little; the accent breathes with the voice (no drums here)
            const [cx, cy, s] = camAt(t);
            const v = (HR.band("vocal", T - 0.1) + HR.band("vocal", T) + HR.band("vocal", T + 0.1)) / 3;
            screen.style.opacity = (0.062 + 0.02 * v).toFixed(4);
            const end = Math.max(0, Math.min(1, (t - QUIT) / (DUR - QUIT)));
            glow.style.opacity = ((0.085 + 0.05 * v) * (1 - 0.7 * end)).toFixed(4);
            clight.style.opacity = t < QUIT ? "0" : (0.55 + 0.45 * end * end).toFixed(3);
            clight.style.scale = (0.8 + 0.5 * end).toFixed(3);
            heroes.forEach((el) => HR.glow(el, T, 0.35, 0.4));
            // the camera: a seeded micro-drift on the push (smooth, a few px)
            const [dx, dy] = drift36(T);
            const x = (50 - s * cx) * PX + dx, y = (28.125 - s * cy) * PX + dy;
            page.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) scale(${s.toFixed(4)})`;
            handoff(t);
            WOW.draw(tl, T0);
          }
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["36-reflog"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
