      <script>
        (() => {
          const DUR = 4.76, T0 = 124.58;
          const root = document.querySelector('[data-composition-id="26-timeline2"]');
          const $ = (id) => root.querySelector("#" + id);
          // louder than 13: this span's mean drum envelope over 13's (0.450, measured 63.679–68.690), capped
          let dsum = 0, dn = 0;
          for (let T = T0; T < T0 + DUR; T += 0.02) { dsum += HR.band("drums", T); dn++; }
          const K = Math.max(1, Math.min(1.25, dsum / dn / 0.450));
          const stage = HR.stage(root, { seed: 26, pulse: K * 1.2 });
          const tl = gsap.timeline({ paused: true });
          const at = (T) => T - T0;
          const BRAND = at(124.64), NEW = at(125.08), TIME = at(125.28), NO = at(128.54), GOOD = at(128.78);
          // the kicks of the held "timeline,": one commit each, written at the head as the graph steps left
          const HOLD = [125.335, 125.794, 126.269, 126.714, 127.175, 127.648, 128.093].map(at);
          const KBN = at(124.878); // the kick between "brand" and "new": the timeline's first commit
          const FF = at(128.552); // the kick under "no": the fast-forward
          const PUSH = HOLD[1]; // the terminal pushes in
          const CUT = HOLD[2]; // `git remote remove you` runs on this kick
          const E3 = HOLD[4]; // `git branch -a` runs again
          const BACK = at(127.634); // the downbeat: the terminal steps back
          const WHIP = 0.25, WHIP0 = DUR - WHIP;
          const NS = "http://www.w3.org/2000/svg";

          // ---- the cuts: whipR in from 25, folded to end at 0.05 ("brand" sings at 0.06); whipL out into 27 ----
          const cam = $("f26-cam");
          WOW.transition(tl, cam, { in: "whipR", dur: 0.11, start: -0.06 });
          WOW.transition(tl, cam, { out: "whipL", dur: WHIP, total: DUR });

          // ---- the words: each glyph in its own wrapper, the kit animates the glyph ----
          const ws = Array.from(root.querySelectorAll(".f26-w"));
          for (const w of ws) {
            const text = w.textContent; w.textContent = ""; w._hrG = [];
            for (const ch of text) {
              const wr = document.createElement("span"); wr.className = "f26-gp"; wr.setAttribute("data-layout-allow-overlap", "");
              const g = document.createElement("span"); g.className = "hr-g"; g.textContent = ch;
              wr.appendChild(g); w.appendChild(wr); w._hrG.push(g);
            }
          }
          const [brand, neu, time, no, good] = ws;
          HR.hero(tl, brand, BRAND, { spread: 20 * K, over: 1 + 0.2 * K, pre: 0.05, sharp: true, skew: false });
          HR.lead(tl, neu, NEW); neu.classList.remove("hr-clip");
          HR.hero(tl, time, TIME, { spread: 44 * K, over: 1 + 0.26 * K, pre: 0.14, sharp: true, skew: false });
          HR.lead(tl, no, NO, { from: -105 }); no.classList.remove("hr-clip");
          HR.hero(tl, good, GOOD, { spread: 34 * K, over: 1 + 0.24 * K, pre: 0.1, sharp: true, skew: false });

          // ---- the prompt: three commands typed at a human rhythm, each run on a kick; output lines arrive whole ----
          const SHOW = { 0: 0, CUT, E3, FF };
          const lines = Array.from(root.querySelectorAll(".f26-ln")).map((el) => ({ el, t: SHOW[el.dataset.at] }));
          const typing = (cmd, k0, k1, seed) => {
            const rnd = HR.rng(seed), keys = [[0, ""]];
            let acc = 0; const gaps = Array.from(cmd, () => 0.7 + rnd() * 0.6), sum = gaps.reduce((a, b) => a + b, 0);
            for (let i = 0; i < cmd.length; i++) { keys.push([k0 + ((k1 - k0) * acc) / sum, cmd.slice(0, i + 1)]); acc += gaps[i]; }
            return keys;
          };
          const prompts = [
            ["git remote remove you", at(125.44), at(126.20), CUT],
            ["git branch -a", at(126.42), at(127.04), E3],
            ["git merge --ff-only timeline", at(127.28), at(128.44), FF],
          ].map(([cmd, k0, k1, enter], i) => {
            const el = root.querySelectorAll("[data-p]")[i];
            return { keys: typing(cmd, k0, k1, 2600 + i), enter, shown: SHOW[el.dataset.at], cmd: el.querySelector(".f26-cmd"), cur: el.querySelector(".f26-cursor") };
          });

          // ---- the payoff: the terminal pushes in for the remote's removal, the listed branch is struck and drops out
          //      of the list (a fixed copy falls, motion-blurred; the row closes up), the terminal steps back on the
          //      downbeat with room under it for `Fast-forward` ----
          const tin = $("f26-tin"), SBIG = 2.1;
          tl.fromTo(tin, { scale: 1, y: 0 }, { scale: SBIG, y: 0, duration: 0.42, ease: "expo.out", immediateRender: false }, PUSH);
          tl.fromTo(tin, { scale: SBIG, y: 0 }, { scale: 1, y: -96, duration: 0.42, ease: "power3.inOut", immediateRender: false }, BACK);
          tl.set(tin, { scale: 1, y: 0 }, 0);
          const ys = $("f26-ys"), yf = $("f26-yf"), yl = $("f26-yl"), DROP = CUT + 0.17;
          tl.fromTo($("f26-strike"), { scaleX: 0 }, { scaleX: 1, duration: 0.13, ease: "expo.out", immediateRender: false }, CUT);
          tl.set($("f26-strike"), { scaleX: 0 }, 0);
          tl.set(ys, { opacity: 1 }, 0).set(ys, { opacity: 0 }, DROP);
          // the falling copy waits in place, hidden and still (its blur copies only show while it moves)
          tl.set(yf, { opacity: 0, x: 0, y: 0, rotation: 0 }, 0).set(yf, { opacity: 1 }, DROP);
          tl.fromTo(yf, { x: 0, y: 0, rotation: 0 }, { x: 60, y: 640, rotation: 9, duration: 0.5, ease: "power2.in", immediateRender: false }, DROP);
          tl.fromTo(yl, { height: "1.5em" }, { height: "0em", duration: 0.3, ease: "power2.inOut", immediateRender: false }, DROP + 0.08);
          tl.set(yl, { height: "1.5em" }, 0);
          // once it has left the frame, the row is gone from the terminal for good
          const GONE = DROP + 0.52;
          tl.set(yf, { visibility: "visible" }, 0).set(yf, { visibility: "hidden" }, GONE);
          // `Fast-forward` slams in from the right at display size: motion-blurred approach, sharp landing (it waits
          // off-frame right from the start: the blur's copies ignore opacity and sample the frames before the slam)
          const ffw = $("f26-ffw");
          tl.set(ffw, { opacity: 0, x: 1900, skewX: -14 }, 0).set(ffw, { opacity: 1 }, NO - 0.01);
          tl.fromTo(ffw, { x: 1900, skewX: -14 }, { x: 0, skewX: 0, duration: 0.22, ease: "expo.out", immediateRender: false }, NO - 0.01);

          // ---- the camera (round 2: one big move per held bar, bigger than 13's). Keyframes resolved after the fonts
          //      (they aim at layout points) and applied in render(): the cut lands close on main's lit tip; it trucks
          //      with the pen under "brand new"; the "timeline," slam pulls out to the full line; bar 1 (the 125.8
          //      downbeat, with the terminal's push-in) dollies along the line toward the head while pulling back and
          //      rolling level, so the lockup rides the line up-left, the unwritten line opens on the right where the
          //      commits land and the payoff has the bottom of the frame; bar 2 (127.634, the terminal stepping back)
          //      pushes in to a steep dutch angle; "no" (the fast-forward) snaps out to the whole line and its answer;
          //      from "goodbyes" the camera accelerates along the line into the whip. ----
          const c = stage.cam, DB1 = PUSH, DB2 = BACK;
          // [t, z, rot, aim: [layout point, screen x, screen y] | [cam x, cam y], ease of the segment ending here]
          const CAMK = [
            [0, 1.55, 0, ["tip", 860, 606]],
            [BRAND, 1.56, 0, ["tip", 852, 604], "sine.out"],
            [TIME - 0.07, 1.42, 0, ["newEnd", 1260, 560], "power2.out"],
            [TIME, 1.0, 0, [0, 0], "power2.in"],
            [TIME + 0.4, 0.985, 0, [8, -5], "elastic.out(1, 0.5)"],
            [DB1, 1.0, 0, [16, -6], "sine.inOut"],
            [DB1 + 0.6, 0.92, 6.2, ["bl", 90, 548], "expo.out"],
            [DB2, 1.0, 7.4, ["bl", 44, 540], "sine.inOut"],
            [DB2 + 0.55, 1.15, -7.6, ["mid", 960, 520], "expo.out"],
            [NO, 1.16, -10, ["mid", 948, 510], "sine.inOut"],
            [NO + 0.07, 1.0, 0, [0, 0], "power2.in"],
            [GOOD - 0.05, 1.03, 0, [60, -7], "expo.out"],
            [GOOD, 1.09, 0, [64, -7], "power2.in"],
            [WHIP0, 1.07, 0, [130, -13], "power2.in"],
            [DUR, 1.07, 0, [260, -190], "power3.in"],
          ];
          let camK = [];
          const DW = 0.8; // the world layer's depth
          const camAim = (z, rot, w, sx, sy) => {
            const s = 1 + (z - 1) * DW, r = (rot * DW * Math.PI) / 180, px = w.x - 960, py = w.y - 540;
            const qx = Math.cos(r) * px - Math.sin(r) * py, qy = Math.sin(r) * px + Math.cos(r) * py;
            return { x: (960 + s * qx - sx) / DW, y: (540 + s * qy - sy) / DW };
          };
          const camAt = (t) => {
            if (t <= camK[0].t) return camK[0];
            for (let i = 1; i < camK.length; i++) if (t < camK[i].t) {
              const a = camK[i - 1], b = camK[i], u = b.ease((t - a.t) / (b.t - a.t));
              return { z: a.z + (b.z - a.z) * u, rot: a.rot + (b.rot - a.rot) * u, x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u };
            }
            return camK[camK.length - 1];
          };
          // a punch on every commit, sized by the drums; a rumble under the "timeline," slam, the removal and the push
          [KBN, ...HOLD].forEach((k) => WOW.punch(tl, cam, k, { s: 1 + (0.014 + 0.024 * WOW.energy(T0 + k)) * K, dur: 0.32 }));
          WOW.shake(tl, cam, TIME + 0.01, { amp: 7 * K, dur: 0.3, rot: 0.2, seed: 26 });
          WOW.shake(tl, cam, CUT + 0.01, { amp: 7 * K, dur: 0.32, rot: 0.25, seed: 27 });
          WOW.shake(tl, cam, DB2 + 0.01, { amp: 6 * K, dur: 0.28, rot: 0.15, seed: 28 });
          // the kick after "goodbyes", in the acceleration into the whip
          WOW.punch(tl, cam, at(129.013), { s: 1.03, dur: 0.2 });
          tl.set({}, {}, DUR);

          // ---- the line: straight, far past both edges (the whip runs along it) ----
          const XA = -600, XB = 3600, slope = -180 / 2120, P0 = { x: XA, y: 650 - slope * (-100 - XA) };
          const P1 = { x: XB, y: P0.y + slope * (XB - XA) };
          const L = Math.hypot(P1.x - P0.x, P1.y - P0.y), UX = (P1.x - P0.x) / L, UY = (P1.y - P0.y) / L;
          const NX = -UY, NY = UX; // the normal, pointing down
          const DEG = (Math.atan2(UY, UX) * 180) / Math.PI;
          const pt = (s) => ({ x: P0.x + UX * s, y: P0.y + UY * s });
          const sAtX = (x) => (x - P0.x) / UX;
          const seg = (dy) => `M ${P0.x} ${(P0.y + dy).toFixed(2)} L ${P1.x} ${(P1.y + dy).toFixed(2)}`;
          for (const id of ["f26-guide", "f26-line", "f26-lglow", "f26-lglow2", "f26-pulse", "f26-pulseg"]) $(id).setAttribute("d", seg(0));
          $("f26-minor").setAttribute("d", seg(7.5)); $("f26-major").setAttribute("d", seg(9));
          const lit = Array.from(root.querySelectorAll(".f26-lit"));
          for (const p of lit) p.style.strokeDasharray = `${L} ${L}`;
          const PL = 260; // the light's length
          for (const id of ["f26-pulse", "f26-pulseg"]) $(id).style.strokeDasharray = `${PL} ${3 * L}`;

          // ---- the scroll: the graph steps one commit left on every held kick, lurches four on the fast-forward,
          //      and rushes into the whip (a pure function of time) ----
          const D = Math.round(262 * K), LURCH = 4 * D, RUSH = 760 * K, LAND = 0.14, RIP = 0.13; // RIP: the ripple's lift, in em
          $("f26-minor").style.strokeDasharray = `2 ${D / 6 - 2}`;
          $("f26-major").style.strokeDasharray = `3 ${D - 3}`;
          const e3 = gsap.parseEase("power3.out"), eX = gsap.parseEase("expo.out"), popE = gsap.parseEase("back.out(2.2)");
          const ramp = (t, a, d, ease) => (t <= a ? 0 : t >= a + d ? 1 : ease((t - a) / d));
          const scrollAt = (t) => {
            let s = 0;
            for (const k of HOLD) s += D * ramp(t, k, 0.32, e3);
            s += LURCH * ramp(t, FF, 0.45, eX);
            if (t > GOOD) { const u = Math.min(1, (t - GOOD) / (DUR - GOOD)); s += RUSH * u * u * u; }
            return s;
          };

          // ---- the path text and the graph: placed once the fonts are in (until then, re-measured every frame) ----
          const X0 = 125, X1 = 1815; // pad-x 5.5cqw
          let laid = false, pen = [], sH = 0, commits = [];
          const place = (w, s, down) => {
            const em = parseFloat(getComputedStyle(w).fontSize);
            w._s0 = s;
            let cx = 0, cy = 0;
            for (const g of w._hrG) {
              const wr = g.parentNode, adv = wr.offsetWidth, ctr = s + adv / 2;
              const p = pt(ctr);
              // up: the baseline rides 16 px over the line (box bottom clear of the dots); down: the box hangs 14 px under it
              const dy = down ? 14 : -16 - 0.76 * em;
              wr.style.transformOrigin = `${adv / 2}px ${-dy}px`;
              wr._bx = p.x - adv / 2; wr._by = p.y + dy; wr._ctr = ctr; wr._em = em;
              wr.style.transform = `translate(${wr._bx.toFixed(2)}px, ${wr._by.toFixed(2)}px) rotate(${DEG.toFixed(3)}deg)`;
              cx += p.x; cy += p.y + (down ? 14 + 0.4 * em : -16 - 0.36 * em);
              s += adv;
            }
            w._s1 = s;
            w._c = { x: cx / w._hrG.length, y: cy / w._hrG.length };
            return em;
          };
          const width = (w) => w._hrG.reduce((a, g) => a + g.parentNode.offsetWidth, 0);
          // the commits: main as 23's push left it (`e81b0d4` → `9c0ffee`), then this timeline's own; the
          // fast-forward's four land unlabelled (the hashes clear for "no goodbyes")
          const HOLDH = ["3a7f0c2", "e5b19d8", "71c4ae6", "0d9b3f5", "c28e6a1", "94f0d7b", "b6a3e19"];
          const dotG = $("f26-dots"), N = 3 + 1 + HOLD.length + 4;
          const marks = Array.from({ length: N }, () => {
            const g = document.createElementNS(NS, "g"); dotG.appendChild(g);
            const st = document.createElementNS(NS, "line"); st.setAttribute("stroke", "#E85D26"); st.setAttribute("stroke-width", "6");
            st.setAttribute("stroke-linecap", "round"); st.setAttribute("stroke-opacity", "0"); g.appendChild(st);
            const ci = document.createElementNS(NS, "circle"); g.appendChild(ci);
            const tx = document.createElementNS(NS, "text"); tx.setAttribute("class", "f26-hash"); tx.setAttribute("text-anchor", "middle"); g.appendChild(tx);
            return { c: ci, tx, st };
          });
          function layout() {
            const ready = document.fonts.status === "loaded";
            // top row from the left margin: brand new timeline,
            let s = sAtX(X0);
            s = place(brand, s) * 0.26 + brand._s1;
            s = place(neu, s) * 0.3 + neu._s1;
            place(time, s);
            // bottom row, right-aligned to the margin: no goodbyes
            const gap = parseFloat(getComputedStyle(no).fontSize) * 0.26;
            const s1 = sAtX(X1) - (width(no) + gap + width(good));
            place(no, s1, true); place(good, no._s1 + gap, true);
            // the head: under the comma of "timeline,"; main's tip sits on the ruler under "brand"
            sH = time._s1 - 10;
            const sE = sH - Math.round((sH - sAtX(165)) / D) * D;
            const sBN = (brand._s1 + neu._s0) / 2;
            // the pen (screen arclength): main's tip, under "brand" as it lands, under "new", across "timeline," on the
            // slam, held at the head through the hold (the graph moves, not the pen); after the fast-forward it is
            // computed from the new head (penAt)
            pen = [[0, sE], [BRAND + 0.2, brand._s1, "power2.inOut"], [KBN, sBN, "power2.out"],
              [NEW + 0.18, neu._s1, "power3.out"], [TIME - 0.02, neu._s1], [HOLD[0], sH, "expo.out"]];
            // world arclengths (screen = world − scroll); a commit shows once written: t ≥ its time and the pen past it
            commits = [
              { u: sE - 2 * D, t: -1, h: "c81d3a4 your lies" }, { u: sE - D, t: -1, h: "5f2b8e1 over" }, { u: sE, t: -1, h: "9c0ffee right" },
              { u: sBN, t: KBN, h: "d8e2b47" },
              ...HOLD.map((k, i) => ({ u: sH + i * D, t: k, h: HOLDH[i], land: true })),
              ...[1, 2, 3, 4].map((j) => ({ u: sH + (HOLD.length + j) * D, t: FF + 0.02 + 0.025 * j, h: "" })),
            ];
            // the camera's aim points (world px at zero scroll): main's tip, the end of "new", the line under "brand",
            // the line under the middle of "brand new timeline,"
            const P = { tip: pt(sE), newEnd: pt(neu._s1), bl: pt(brand._s0), mid: pt((brand._s0 + time._s1) / 2) };
            camK = CAMK.map(([t, z, rot, a, ease]) => {
              const xy = typeof a[0] === "string" ? camAim(z, rot, P[a[0]], a[1], a[2]) : { x: a[0], y: a[1] };
              return { t, z, rot, x: xy.x, y: xy.y, ease: gsap.parseEase(ease || "none") };
            });
            laid = ready;
          }
          const uHead = () => commits[commits.length - 1].u;
          const penAt = (t, sc) => {
            if (t >= FF) return sH + (uHead() - sc - sH) * eX(Math.min(1, (t - FF) / 0.2));
            if (t <= pen[0][0]) return pen[0][1];
            for (let i = 1; i < pen.length; i++) if (t < pen[i][0]) {
              const [ta, sa] = pen[i - 1], [tb, sb, ease] = pen[i];
              return sa + (sb - sa) * gsap.parseEase(ease || "none")((t - ta) / (tb - ta));
            }
            return pen[pen.length - 1][1];
          };

          // a ring on each commit at the head (placed once the head is known)
          const rings = HOLD.map((k) => WOW.shock(tl, $("f26-world"), { x: 0, y: 0, t: k, r: 230 * K, n: 2, w: 4, gap: 0.06, dur: 0.55 }));

          // ---- per-frame state: layout, scroll, pen, ruler, light, dots, the accent, the terminal, glow, camera ----
          const glow = $("f26-glow"), band = $("f26-band"), halo = $("f26-halo"), tglow = $("f26-tglow");
          const minor = $("f26-minor"), major = $("f26-major"), pulse = $("f26-pulse"), pulseg = $("f26-pulseg");
          const blink = (t, since) => t - since < 0.35 || Math.floor((t - since) * 2) % 2 === 0;
          const eIO = gsap.parseEase("power2.inOut");
          // the terminal never rises past this (term-layer px): the graph and the words are above it; under bar 2's
          // dutch angle the line's low end comes down, so the boundary drops by a row
          const topAt = (t) => 700 + 64 * ramp(t, DB2 + 0.05, 0.35, eIO);
          function render() {
            const t = tl.time(), T = T0 + t;
            if (!laid) {
              layout();
              const h = pt(sH); for (const r of rings) { r.style.left = h.x.toFixed(1) + "px"; r.style.top = h.y.toFixed(1) + "px"; }
              const m = pt(sAtX(960)); band.style.left = m.x.toFixed(1) + "px"; band.style.top = m.y.toFixed(1) + "px"; band.style.transform = `rotate(${DEG.toFixed(3)}deg)`;
            }
            const sc = scrollAt(t), p = penAt(t, sc), bass = HR.band("bass", T), kick = HR.hit("kick", T, 0.2);
            const off = (L - p).toFixed(2);
            for (const l of lit) l.style.strokeDashoffset = off;
            // the ruler scrolls with the graph; its major ticks stay on the commits
            minor.style.strokeDashoffset = (sc - sH + 1).toFixed(2);
            major.style.strokeDashoffset = (sc - sH + 1.5).toFixed(2);
            // a light runs up the lit line to the head on every held kick
            let pv = 0, ps = 0;
            for (const k of HOLD) if (t >= k && t < k + 0.42) {
              const u = (t - k) / 0.42, a = sAtX(-40);
              ps = a + (sH - a) * eIO(u); pv = 1 - u * u * u;
            }
            for (const [el, a] of [[pulse, 0.92], [pulseg, 0.38]]) {
              el.style.strokeDashoffset = (PL - ps).toFixed(2);
              el.style.strokeOpacity = (a * pv).toFixed(3);
            }
            // the commits: written dots pop, the newest is fire with a halo; the hashes ride under them and the
            // fast-forward wipes them (the hanging "no goodbyes" takes their place)
            let newest = -1;
            commits.forEach((cm, i) => { cm.s = cm.u - sc; cm.on = t >= cm.t && cm.s <= p + 1; if (cm.on) newest = i; });
            const hashA = 1 - ramp(t, FF - 0.05, 0.15, (x) => x);
            commits.forEach((cm, i) => {
              const { c: circ, tx, st } = marks[i], k = cm.on ? Math.min(1, (t - Math.max(0, cm.t)) / 0.3) : 0;
              let q = pt(cm.s), pk = cm.t < 0 ? 1 : k > 0 ? Math.max(0.05, popE(k)) : 0, fall = 0;
              // a held commit lands: it drops onto the head along the normal in the LAND s before its kick
              if (cm.land && !cm.on && t >= cm.t - LAND && t < cm.t) {
                const u = (t - (cm.t - LAND)) / LAND, off = 200 * (1 - u * u);
                q = { x: q.x - NX * off, y: q.y - NY * off }; pk = 0.8; fall = u;
              }
              st.setAttribute("x1", q.x.toFixed(1)); st.setAttribute("y1", q.y.toFixed(1));
              st.setAttribute("x2", (q.x - NX * 130).toFixed(1)); st.setAttribute("y2", (q.y - NY * 130).toFixed(1));
              st.setAttribute("stroke-opacity", (0.75 * fall).toFixed(3));
              circ.setAttribute("cx", q.x.toFixed(1)); circ.setAttribute("cy", q.y.toFixed(1));
              circ.setAttribute("r", (11 * K * pk).toFixed(2));
              circ.setAttribute("fill", i === newest ? "#E85D26" : "#F0ECE5");
              tx.textContent = cm.h;
              tx.setAttribute("class", cm.t < 0 ? "f26-hash f26-hist" : "f26-hash");
              tx.setAttribute("transform", `translate(${(q.x + NX * 40).toFixed(1)} ${(q.y + NY * 40).toFixed(1)}) rotate(${DEG.toFixed(3)})`);
              tx.setAttribute("opacity", (fall ? 0 : Math.min(1, pk) * hashA).toFixed(3));
            });
            if (newest >= 0) {
              const q = pt(commits[newest].s);
              halo.setAttribute("cx", q.x.toFixed(1)); halo.setAttribute("cy", q.y.toFixed(1));
              halo.setAttribute("r", ((26 + 36 * kick) * K).toFixed(1));
            }
            // the light: the glow follows the current hero, the band breathes along the line, the terminal's screen
            // glow comes up while it is pushed in
            const hot = t >= GOOD ? good : t >= TIME ? time : brand, prev = t >= GOOD ? time : brand;
            const since = t >= GOOD ? t - GOOD : t >= TIME ? t - TIME : 1, gk = e3(Math.min(1, since / 0.35));
            const gx = prev._c.x + (hot._c.x - prev._c.x) * gk, gy = prev._c.y + (hot._c.y - prev._c.y) * gk;
            glow.style.transform = `translate(${gx.toFixed(1)}px, ${gy.toFixed(1)}px)`;
            glow.style.opacity = Math.min(1, 0.7 + 0.3 * bass + 0.25 * kick).toFixed(3);
            band.style.opacity = Math.min(1, 0.75 + 0.35 * bass + 0.15 * kick).toFixed(3);
            const ts = gsap.getProperty(tin, "scale"), ty = gsap.getProperty(tin, "y");
            const push = Math.max(0, Math.min(1, (ts - 1) / (SBIG - 1)));
            tglow.style.opacity = Math.min(1, 0.4 + 0.6 * push + 0.25 * bass).toFixed(3);
            // the accent points at the current hero
            for (const w of [brand, time, good]) { const on = w === hot; w.classList.toggle("f26-fire", on); w.classList.toggle("hr-glowbox", on); }
            HR.glow(hot, T, 0.3, 0.45);
            // the words ride the line: each held commit's landing sends a ripple back along it, through "timeline,"
            // to "brand" (each glyph lifts off the line and swells as the wave passes under it)
            const ripple = (ctr) => {
              let v = 0;
              for (const k of HOLD.slice(1)) {
                const u = (t - k) / 0.62; if (u < 0 || u > 1) continue;
                const sw = sH + 60 - (sH + 60 - brand._s0 + 80) * u;
                v = Math.max(v, Math.exp(-(((ctr - sw) / 190) ** 2)) * (1 - 0.55 * u));
              }
              return v;
            };
            for (const w of [brand, neu, time]) for (const g of w._hrG) {
              const wr = g.parentNode, v = t < FF ? ripple(wr._ctr) : 0, o = v * RIP * wr._em;
              wr.style.transform = `translate(${(wr._bx - NX * o).toFixed(2)}px, ${(wr._by - NY * o).toFixed(2)}px) rotate(${DEG.toFixed(3)}deg) scale(${(1 + 0.07 * v).toFixed(4)})`;
            }
            // the terminal: lines appear on their kicks; from the bottom up, the ones that fit under TOP stay (the
            // last one in fades out as it rises past it)
            const room = 1040 + ty - topAt(t), shown = lines.filter((l) => t >= l.t);
            for (const l of lines) if (!shown.includes(l)) l.el.style.display = "none";
            let acc = 0;
            for (let i = shown.length - 1; i >= 0; i--) {
              const el = shown[i].el;
              if (acc >= room) { el.style.display = "none"; continue; }
              el.style.display = "block";
              const h = el.offsetHeight * ts;
              el.style.opacity = acc + h <= room ? "" : Math.max(0, (room - acc) / Math.max(1, h)).toFixed(3);
              acc += h;
            }
            const active = prompts.filter((q) => t >= q.shown).pop();
            for (const q of prompts) {
              let kk = q.keys[0]; for (const st of q.keys) if (st[0] <= t) kk = st;
              q.cmd.textContent = kk[1];
              const on = q === active && t < q.enter;
              q.cur.style.display = on ? "inline-block" : "none";
              q.cur.style.opacity = on && blink(t, Math.max(kk[0], q.shown)) ? 1 : 0;
            }
            const cs = camAt(t); c.z = cs.z; c.rot = cs.rot; c.x = cs.x; c.y = cs.y;
            stage.apply(T);
            WOW.draw(tl, T0);
          }
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["26-timeline2"] = tl;
        })();
      </script>
    </template>
