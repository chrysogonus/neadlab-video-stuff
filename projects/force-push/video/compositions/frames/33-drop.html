              const rw = t >= r.t0;
              r.h.textContent = rw ? NEWH[r.i] : r.oldH;
              r.au.textContent = rw ? "me" : "you";
              r.au.classList.toggle("f33-me", rw);
              const k = rw ? popE(Math.min(1, (t - r.t0) / 0.3)) : 1;
              const col = rw ? (lit ? "#E85D26" : "#F0ECE5") : "#505048";
              setDot(bDots[r.i], r.dot, 13 * k, rw ? col : "#0A0A0A", col);
              if (t >= r.t0) laneB = Math.max(laneB, r.x0 + x);
            }
            // the new main, drawn right over the old lane; then C's pen
            const pc = penAt(t);
            const head = t < BACK ? L0 : pc === null ? laneB : pc;
            line.style.strokeDashoffset = (LLEN - (head - L0)).toFixed(1);
            const paper = t >= PAPER, ink = paper ? "#111111" : "#F0ECE5";
            world.classList.toggle("f33-paper", paper);
            paperbg.style.opacity = paper ? 1 : 0;
            guide.setAttribute("stroke", paper ? "#CFCAC1" : "#282826");
            line.setAttribute("stroke", lit && t < WHIP + WHIP_D ? "#E85D26" : ink);
            bDots.forEach((c) => c.setAttribute("opacity", t >= BACK && t < WHIP + WHIP_D + 0.1 ? 1 : 0));
            // C: a dot per step, the newest in fire
            let newest = -1; cd.forEach(([, td], i) => { if (t >= td) newest = i; });
            cDots.forEach((c, i) => {
              const [x, td] = cd[i] || [0, 99], k = Math.max(0, Math.min(1, (t - td) / 0.3));
              setDot(c, x, 12 * (k > 0 ? Math.max(0.05, popE(k)) : 0), i === newest ? "#E85D26" : ink, i === newest ? "#E85D26" : ink);
            });
            // the hold: a glint runs the lane on every kick
            let g = -1; GLINTS.forEach((gt) => { if (t >= gt && t < gt + 0.4) g = gt; });
            if (g >= 0) {
              const u = gsap.parseEase("power2.out")((t - g) / 0.4), gx = W + u * (W + 200);
              glint.setAttribute("x1", (gx - 260).toFixed(1)); glint.setAttribute("x2", gx.toFixed(1)); glint.setAttribute("opacity", 1);
            } else glint.setAttribute("opacity", 0);
            // the accent points at the current hero in C
            const hot = t >= GOOD ? good : t >= TIME ? time : brand;
            for (const w of [brand, time, good]) { const on = w === hot; w.classList.toggle("f33-fire", on); w.classList.toggle("hr-glowbox", on); }
            HR.glow(hot, T, 0.3, 0.45); HR.glow(push2, T, 0.2, 0.3); HR.glow(lies, T, 0.2, 0.3);
            strip.classList.toggle("f33-oncream", (t >= CREAM && t < BACK) || paper);
            stage.apply(T);
          }
          tl.eventCallback("onUpdate", render);
          render();
          if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { laid = false; render(); });
          window.__timelines["33-drop"] = tl;
        })();
      </script>
    </template>
