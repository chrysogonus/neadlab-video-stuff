         stretch. The first bar (the approved poster) is kept and made the biggest of the film; after it, the overwrite
         and the clean timeline are one new set at full scale (no layout from 12, 13, 25 or 26).
         A — the cut is 32's Enter: git answers at the foot of the terminal (`To me@home:us.git`, then the forced update
         on the first kick) while FORCE comes out of the lens and lands on 169.33 at ~98 % of the frame width, a fire
         shockwave and cream rays behind it. On PUSH! (169.86, the drop's first kick and downbeat) a 0 ms cut to the
         cream register: FORCE / PUSH! stacked edge to edge, filling the page, PUSH! slamming out of the lens, fire shards
         and a ring, the heaviest shake of the film. All hits are sized by the drums (this span's mean over 10's).
         B — "right" (170.38): a hard cut back to ink, onto origin's old log as a wall: the ex's commits, every message
         one of his lies, scrolling on the kicks. "right" slams in from the left across the frame, "over" drops onto
         the line. "your" (171.16) waits mid-frame; on "lies" (171.46) a cream stroke tears across the whole frame,
         left to right, a fire pen at its tip: it wipes the lies under it, turns "your" to ink and writes "lies" at
         display scale on the page it leaves. The pen parks after "lies", blinking.
         C — "brand" (172.38): the stroke collapses to a line and the line swings into perspective — the new timeline,
         a lit lane the camera rides from the horizon under "timeline," (172.98, out of the lens, the second slam);
         one commit rushes past per kick. On "no" (174.36) git fast-forwards: the ride surges, the camera pushes;
         "goodbyes" (174.94) lands as the camera springs back, a cream flash and a ring; the push's last word,
         `(forced update)`, prints at display size on the 175.392 downbeat while the lane lights and a glint runs at the
         camera on every kick. The out is a 0.25 s whipL into 34.
         Round 2 (REFINE-2.md): C no longer holds its pose. The lane runs at double speed; the words sit on their own
         layer that takes 0.3 of the camera's move, so the camera rides the lane (banking, diving) under a lockup that
         stays framed. One big move per bar: 173.557 a lunge down the lane banking left; "no" the fast-forward swinging
         to the other bank and diving in; "goodbyes" level again on the hit; 175.392 a lunge banking right into the whip.
         The hero ("timeline," then "goodbyes") lands on every kick of the hold, harder on the downbeats. -->
