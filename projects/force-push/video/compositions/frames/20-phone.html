          // first 0.25 s more than it must ("Your" starts 0.096 s in; "own" lands 0.18 s before the cut)

          WOW.transition(tl, cam, { in: "cut", out: "glideUp", dur: OUT, total: DUR });

          // ---- L29: the lock screen's clock is the line ----
          const w = root.querySelectorAll(".f20-w");
          HR.lead(tl, w[0], at(100.14));
          HR.hero(tl, w[1], PULL, { spread: 16, over: 1.2, pre: 0.1, sharp: true });
          HR.lead(tl, w[2], at(100.42)); HR.lead(tl, w[3], at(100.746)); HR.lead(tl, w[4], at(100.94));
          HR.lead(tl, w[5], at(101.22)); HR.lead(tl, w[6], at(101.3));
          HR.hero(tl, w[7], PHONE, { spread: 22, over: 1.22, pre: 0.12, sharp: true });

          // ---- the stack: pull requests from `you`, one per hit, newest on top. Each whips in from off the screen's
          //      edge (parked there, never hidden by opacity: the motion-blur copies), lands ON its hit, and pushes the
          //      older ones down a slot ----

          const SIDE = [0, 1, -1, 1, -1, 1, -1], PARK = 46 * PX, PITCH = 7.25 * PX, APP = 0.1;

            // the older cards make room just before the new one lands

          const k1 = [[0, ""]], k2 = [[0, ""]];

          type(k2, at(102.826), at(103.04), "on"); type(k2, at(103.04), OWN, " your");
          const LINE2 = at(102.826);

          // ---- hit punches on the camera wrapper, sized by the drums ----
          ARR.slice(1).forEach((a, k) => WOW.punch(tl, cam, a, { s: 1.01 + 0.02 * drums(a) + (k === 5 ? 0.014 : 0), dur: 0.32 }));
          // "phone": the whole phone buzzes, kick-sized
          WOW.shake(tl, $("f20-phone"), PHONE, { amp: 7 + 6 * WOW.energy(T0 + PHONE), dur: 0.26, rot: 0.5, seed: 21 });
          WOW.punch(tl, cam, REVIEW, { s: 1.03, dur: 0.42 });
          // the kick under "Please" (101.908): the opened card lands with it
          const K2 = at(101.908);
          WOW.punch(tl, cam, K2, { s: 1.018 + 0.02 * drums(K2), dur: 0.3 });
          WOW.punch(tl, cam, REV, { s: 1.015 + 0.02 * drums(REV), dur: 0.32 });
          WOW.punch(tl, cam, OWN, { s: 1.05, dur: 0.4 });
          WOW.shake(tl, cam, OWN, { amp: 6 + 8 * WOW.energy(T0 + OWN), dur: 0.3, rot: 0.25, seed: 20 });
          tl.set({}, {}, DUR);

          // L29: each notification lifts the phone a step off the desk toward the viewer and pushes the camera in;
          // just before "Please" the camera dives into the screen (blurred) and the swap happens inside the blur;
          // on "honey" it pulls back down to the reply field.
          const TILT0 = 7, TILT = [0, 1, 1, 1, 1, 1, 1.5];
          const Z0 = 1.4, ZS = 0.045, FY0 = 30.5 * PX, FYS = 0.45 * PX;
          const eo = gsap.parseEase("expo.out"), el = gsap.parseEase("elastic.out(1, 0.55)"), e3 = gsap.parseEase("power3.out"),
            io3 = gsap.parseEase("power3.inOut"), in2 = gsap.parseEase("power2.in");
          const DIVE = SWAP - 0.11, Z_DIVE = 0.09, Z_LAND = 0.09;
          // camera targets (composition px of the point to centre): the ask, then the note + reply together

          function camAt(t) {
            let z = Z0, fy = FY0, tilt = TILT0;
            for (let k = 1; k < ARR.length; k++) if (t >= ARR[k]) {
              const u = eo(clamp01((t - ARR[k]) / 0.32));
              z -= ZS * u; fy += FYS * u;
              tilt -= TILT[k] * el(clamp01((t - ARR[k]) / 0.55));

            let y = (fy - 540) * z;
            let blur = 0;
            if (t >= DIVE) {
              const u = t < SWAP ? in2(clamp01((t - DIVE) / (SWAP - DIVE))) : 1;
              const v = t < SWAP ? 0 : e3(clamp01((t - SWAP) / 0.24));
              const y0 = y;
              z += Z_DIVE * u + Z_LAND * v;
              const p = 0.55 * u + 0.45 * v;
              y = y0 + ((ASK_Y - 540) * z - y0) * p;
              blur = t < SWAP ? 4.5 * u : 4.5 * (1 - e3(clamp01((t - SWAP) / 0.1)));
              // the phone tips toward the viewer as it opens, and settles
              if (t >= SWAP) { const d = t - SWAP; tilt = -5 * Math.exp(-d / 0.22) * Math.cos(d * 13); }
              else tilt *= 1 - u;
            }
            if (t >= SWAP) z += 0.02 * clamp01((t - SWAP) / (PULL_A - SWAP));
            if (t >= PULL_A) {
              const u = io3(clamp01((t - PULL_A) / PULL_D));
              const zA = z;
              z = zA + (Z_MID - zA) * u + 0.015 * clamp01((t - PULL_A - PULL_D) / (DUR - PULL_A - PULL_D));
              const yA = (ASK_Y - 540) * zA, yB = (MID_Y - 540) * Z_MID;
              y = yA + (yB - yA) * u;
            }
            return { z, y, tilt, blur };
          }

          // ---- per-frame state: the light, typing, cursors, glow, camera ----
          const light = $("f20-light"), spill = $("f20-spill"), heat = $("f20-heat"), phone = $("f20-phone"), body = $("f20-body");
          const r1 = $("f20-r1"), r2 = $("f20-r2"), c1 = $("f20-c1c"), c2 = $("f20-c2c");
          const pull = $("f20-pull"), phn = $("f20-phn"), review = $("f20-review");
          const blink = (t, since) => t - since < 0.3 || Math.floor((t - since) * 2) % 2 === 0;
          // the hero glow inside the screen (screen px from its top): the clock, the ask, the reply
          const HEAT = [[0, 17.5 * PX], [SWAP, 22 * PX], [HONEY, 41 * PX]];
          function render() {
            const t = tl.time(), T = T0 + t;
            const bass = HR.band("bass", T);
            // each notification (and the swap) lights the screen, the phone's edge and the room
            let F = 0;
            for (const a of LIGHTS) if (t >= a) F = Math.max(F, Math.exp(-(t - a) / 0.32));
            light.style.opacity = Math.min(0.17, 0.075 + 0.085 * F + 0.02 * bass).toFixed(4);
            spill.style.opacity = Math.min(1, 0.55 + 0.45 * F + 0.2 * bass).toFixed(3);
            const halo = 0.05 + 0.13 * F + 0.03 * bass;
            phone.style.boxShadow = `0 0 ${(4 + 3 * F).toFixed(2)}cqw 0.4cqw rgba(240, 236, 229, ${halo.toFixed(3)})`;
            phone.style.borderColor = `rgba(240, 236, 229, ${(0.28 + 0.35 * F).toFixed(3)})`;
            let hy = HEAT[0][1];
            for (let i = 1; i < HEAT.length; i++) if (t >= HEAT[i][0]) hy = HEAT[i - 1][1] + (HEAT[i][1] - HEAT[i - 1][1]) * e3(clamp01((t - HEAT[i][0]) / 0.3));
            heat.style.transform = `translateY(${hy.toFixed(1)}px)`;
            heat.style.opacity = Math.min(1, 0.6 + 0.4 * bass + 0.3 * HR.hit("kick", T, 0.2)).toFixed(3);
            // typing
            const [s1t, s1] = textAt(k1, t), [s2t, s2] = textAt(k2, t);
            r1.textContent = s1; r2.textContent = s2;
            c1.style.opacity = t < LINE2 && blink(t, Math.max(s1t, SWAP)) ? 1 : 0;
            c2.style.opacity = t >= LINE2 && blink(t, Math.max(s2t, t >= OWN ? OWN : 0)) ? 1 : 0;
            HR.glow(pull, T, 0.35, 0.5); HR.glow(phn, T, 0.35, 0.5); HR.glow(review, T, 0.35, 0.5); HR.glow(own, T, 0.35, 0.5);
            // the camera and the phone
            const c = camAt(t);
            stage.cam.z = c.z; stage.cam.y = c.y;
            phone.style.transform = `perspective(1700px) rotateX(${c.tilt.toFixed(3)}deg)`;
            body.style.filter = c.blur > 0.3 ? `blur(${c.blur.toFixed(2)}px)` : "";
            stage.apply(T);
            WOW.draw(tl, T0);
          }
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["20-phone"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
