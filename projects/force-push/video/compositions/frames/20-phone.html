      <script>
        (() => {
          const DUR = 3.421, T0 = 100.044;
          const root = document.querySelector('[data-composition-id="20-phone"]');
          const $ = (id) => root.querySelector("#" + id);
          const stage = HR.stage(root, { seed: 20 });
          const tl = gsap.timeline({ paused: true });
          const at = (T) => T - T0;
          const SWAP = at(101.669); // the kick under "Please": the notification opens

          // ---- L29: the lock screen's clock is the line ----
          const w = root.querySelectorAll(".f20-w");
          HR.lead(tl, w[0], at(100.14));
          HR.hero(tl, w[1], at(100.26), { spread: 16, over: 1.2, pre: 0.1, sharp: true });
          HR.lead(tl, w[2], at(100.42)); HR.lead(tl, w[3], at(100.746)); HR.lead(tl, w[4], at(100.94));
          HR.lead(tl, w[5], at(101.22)); HR.lead(tl, w[6], at(101.3));
          HR.hero(tl, w[7], at(101.4), { spread: 22, over: 1.22, pre: 0.12, sharp: true });

          // ---- the stack: pull requests from `you`, one per hit, newest on top; the screen lights each time ----
          const NOTES = [
            [0, "opened #53", "nothing on the side"],
            [at(100.266), "opened #54", "just a feature"],
            [at(100.492), "opened #55", "we'll get to it"],
            [at(100.717), "commented on #55", "lgtm"],
            [at(100.94), "opened #56", "you and me"],
            [at(101.414), "opened #57", 'Revert "force push"'],
          ];
          const stack = $("f20-stack"), PITCH = 5.7; // cqw
          const cards = NOTES.map(([, what, msg]) => {
            const c = document.createElement("div");
            c.className = "f20-card";
            c.innerHTML = `<div class="f20-t"><span><span class="f20-you">you</span> ${what}</span><i>now</i></div><div></div>`;
            c.lastChild.textContent = msg;
            stack.appendChild(c);
            return c;
          });
          const LIGHTS = NOTES.map((n) => n[0]).concat([SWAP]);

          // ---- L30: the notification opens; "please review?" is its text ----
          tl.set($("f20-lock"), { visibility: "inherit" }, 0).set($("f20-lock"), { visibility: "hidden" }, SWAP);
          tl.set($("f20-open"), { visibility: "hidden" }, 0).set($("f20-open"), { visibility: "inherit" }, SWAP);
          const v = root.querySelectorAll(".f20-v");
          HR.lead(tl, v[0], at(101.68));
          HR.hero(tl, v[1], at(102.04), { spread: 20, over: 1.2, pre: 0.1, sharp: true });
          // the PR's answer arrives whole on the snare
          tl.set($("f20-rev"), { opacity: 0 }, 0).set($("f20-rev"), { opacity: 1 }, at(102.335));
          // the reply types on the word times; "own" slams
          const own = $("f20-own");
          tl.set(own, { display: "none" }, 0).set(own, { display: "inline-block" }, at(103.285) - 0.12);
          HR.hero(tl, own, at(103.285), { spread: 18, over: 1.24, pre: 0.1, sharp: true });

          const type = (states, t0, t1, text) => {
            const base = states[states.length - 1][1];
            for (let i = 0; i < text.length; i++) states.push([t0 + ((t1 - t0) * i) / text.length, base + text.slice(0, i + 1)]);
          };
          const textAt = (states, t) => { let k = 0; for (let i = 0; i < states.length; i++) if (states[i][0] <= t) k = i; return states[k]; };
          const k1 = [[0, ""]], k2 = [[0, ""]];
          type(k1, at(102.138), at(102.487), "honey,"); type(k1, at(102.487), at(102.826), " you're");
          type(k2, at(102.826), at(103.04), "on"); type(k2, at(103.04), at(103.285), " your");
          const LINE2 = at(102.826);
          tl.set({}, {}, DUR);

          // ---- per-frame state: the stack, the screen light, typing, cursors, glow, camera ----
          const ease3 = (x) => 1 - Math.pow(1 - Math.max(0, Math.min(1, x)), 3);
          const PUNCH = [[at(100.26), 0.012], [at(101.4), 0.02], [at(102.04), 0.02], [at(103.285), 0.028]];
          const light = $("f20-light"), r1 = $("f20-r1"), r2 = $("f20-r2"), c1 = $("f20-c1"), c2 = $("f20-c2");
          const pull = $("f20-pull"), phn = $("f20-phn"), rev = $("f20-review");
          const blink = (t, since) => t - since < 0.3 || Math.floor((t - since) * 2) % 2 === 0;
          function render() {
            const t = tl.time(), T = T0 + t;
            cards.forEach((c, i) => {
              const a = NOTES[i][0];
              if (t < a) { c.style.opacity = 0; return; }
              let y = 0;
              for (let k = i + 1; k < NOTES.length; k++) if (t >= NOTES[k][0]) y += PITCH * ease3((t - NOTES[k][0]) / 0.28);
              const p = ease3((t - a) / 0.26);
              c.style.opacity = 1;
              c.style.transform = `translateY(${(y - 1.4 * (1 - p)).toFixed(3)}cqw) scale(${(0.96 + 0.04 * p).toFixed(4)})`;
            });
            let L = 0;
            for (const a of LIGHTS) if (t >= a) L = Math.max(L, 0.06 * Math.exp(-(t - a) / 0.3));
            light.style.opacity = L.toFixed(4);
            const [s1t, s1] = textAt(k1, t), [s2t, s2] = textAt(k2, t);
            r1.textContent = s1; r2.textContent = s2;
            c1.style.opacity = t < LINE2 && blink(t, Math.max(s1t, SWAP)) ? 1 : 0;
            c2.style.opacity = t >= LINE2 && blink(t, Math.max(s2t, t >= at(103.285) ? at(103.285) : 0)) ? 1 : 0;
            HR.glow(pull, T, 0.35, 0.5); HR.glow(phn, T, 0.35, 0.5); HR.glow(rev, T, 0.35, 0.5); HR.glow(own, T, 0.35, 0.5);
            // the camera: a slow push on the lock screen, a closer framing when it opens, punches on the hero words
            let z = t < SWAP ? 1 + 0.03 * Math.sin((Math.PI / 2) * (t / SWAP)) : 1.02 + 0.015 * ((t - SWAP) / (DUR - SWAP));
            for (const [tp, amp] of PUNCH) {
              const d = t - tp;
              if (d > -0.06 && d < 0) z += amp * (1 + d / 0.06);
              else if (d >= 0) z += amp * Math.exp(-d / 0.14) * Math.cos(d * 16);
            }
            stage.cam.z = z;
            stage.cam.y = t < SWAP ? 0 : 12;
            stage.apply(T);
          }
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["20-phone"] = tl;
        })();
