    <!-- Frame 2 — commit (verse 1 enters, 15.081–19.885). L3 "Three years in and you never could commit".
         Refinement round 2 (REFINE-2.md): cut onto content. The cut zooms in (paired with 01's zoom) onto vim's editor,
         already open and lit: a window with its title bar (`force push — ~/us — git commit`), git's template, the status
         bar and a display-size cursor waiting on the empty first line. 01's lockup carries through the zoom: the big
         `force push` flies into the title bar and becomes its first words (0–0.42 s). On the snare (15.531) vim enters
         `-- INSERT --` and the camera pushes in on the cursor; "three" slams onto the message line (16.86) while the
         status bar counts the days to `1,095 days`; "years in" types after it. On the kick that starts line two (18.332)
         the template drops a row and the camera pushes again, onto the new line ("and you never could" types into it).
         On "commit" (19.46) the editor quits without saving: the window is gone at once, the unsaved message is left as
         a grey ghost, the camera pulls out wide while "commit" slams in the accent (motion-blurred approach), and git
         answers `Aborting commit due to empty commit message.` full-width. On the 19.721 kick the new prompt prints and
         the terminal scrolls up into the `glideUp` cut, carrying the abort line and the prompt into 03. -->
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Barlow"; src: url("assets/fonts/barlow-800.woff2") format("woff2"); font-weight: 800; }
        @font-face { font-family: "Barlow"; src: url("assets/fonts/barlow-900.woff2") format("woff2"); font-weight: 900; }
        @font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/ibm-plex-mono-400.woff2") format("woff2"); font-weight: 400; }
        @font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/ibm-plex-mono-500.woff2") format("woff2"); font-weight: 500; }
        @font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/ibm-plex-mono-600.woff2") format("woff2"); font-weight: 600; }
        #root {
          position: absolute; inset: 0; overflow: hidden; container-type: size;
          --ink: #0A0A0A; --ink-alt: #1A1A18; --fire: #E85D26; --cream: #F0ECE5;
          --cream-muted: #888880; --cream-hint: #505048; --border: #282826;
          background: var(--ink); color: var(--cream);
        }
        #f02-cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
        #f02-strip { position: absolute; left: 5.5cqw; right: 5.5cqw; top: 3.4cqw; display: flex; justify-content: space-between;
          font: 500 0.78cqw/1.5 "IBM Plex Mono", monospace; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cream-muted);
          padding-bottom: 0.6cqw; border-bottom: 1px solid var(--border); }
        #f02-strip b { color: var(--fire); font-weight: 600; }
        /* the strip's ground: the window passes under it during the pushes */
        #f02-band { position: absolute; left: 0; right: 0; top: 0; height: 5.7cqw; background: var(--ink); }
        /* the screen below the strip: content scrolling off its top edge is clipped there, as in a terminal */
        #f02-clip { position: absolute; inset: 0; clip-path: inset(5.9cqw 0 0 0); }
        #f02-scroll { position: absolute; inset: 0; }
        /* the light: a soft fire glow that follows the cursor, breathing with the bass */
        #f02-glow { position: absolute; left: 0; top: 1.5cqw; width: 80cqw; height: 52cqw; pointer-events: none; mix-blend-mode: screen;
          background: radial-gradient(closest-side, rgba(232, 93, 38, 0.16), rgba(232, 93, 38, 0.07) 50%, rgba(232, 93, 38, 0) 100%); }
        /* the prompt and vim's window ride one wrapper: the Enter scrolls the prompt away and brings the window up */
        #f02-rise { position: absolute; inset: 0; }
        .f02-prompt { position: absolute; left: 5.5cqw; font-family: "IBM Plex Mono", monospace; font-weight: 500; line-height: 1; color: var(--cream-muted); white-space: pre; }
        .f02-prompt .f02-cmd { color: var(--cream); }
        .f02-mcur { display: inline-block; width: 0.62em; height: 1.1em; margin-left: 0.12em; background: var(--fire); vertical-align: -0.16em; }
        /* vim: a lit window, git's template, the status bar and the command line */
        #f02-win { position: absolute; left: 3.2cqw; top: 6.4cqw; width: 93.6cqw; height: 47.4cqw; overflow: hidden;
          background: var(--ink-alt); border: 1px solid var(--border); border-top-color: var(--cream-hint);
          box-shadow: 0 0 6cqw rgba(232, 93, 38, 0.08); }
        #f02-title { position: absolute; left: 0; right: 0; top: 0; height: 2.6cqw; display: flex; align-items: center; gap: 0.9cqw;
          padding-left: 1.6cqw; border-bottom: 1px solid var(--border); background: var(--ink);
          font: 500 1.25cqw/1 "IBM Plex Mono", monospace; letter-spacing: 0.06em; color: var(--cream-muted); white-space: pre; }
        #f02-title::before { content: ""; width: 0.7cqw; height: 0.7cqw; background: var(--fire); }
        #f02-tname { color: var(--cream); font-weight: 600; }
        #f02-tplbox { position: absolute; left: 0; right: 0; top: 2.6cqw; height: 38cqw; overflow: hidden; }
        #f02-tpl { position: absolute; left: 2.3cqw; top: 15.6cqw; font: 400 1.7cqw/1.6 "IBM Plex Mono", monospace; color: var(--cream-muted); white-space: pre; }
        #f02-tpl .f02-first { color: var(--cream); }
        #f02-tilde { color: var(--cream-hint); }
        #f02-c0 { position: absolute; left: 2.3cqw; top: 6cqw; width: 6.4cqw; height: 10.2cqw; background: var(--fire); }
        #f02-status { position: absolute; left: 0; right: 0; top: 40.6cqw; height: 3.4cqw; display: flex; justify-content: space-between; align-items: center;
          padding: 0 2.3cqw; background: var(--ink); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
          font: 500 1.6cqw/1 "IBM Plex Mono", monospace; color: var(--cream); white-space: pre; }
        #f02-status .f02-days { color: var(--fire); font-weight: 600; font-size: 2.3cqw; }
        #f02-status .f02-dim { color: var(--cream-muted); }
        #f02-cmdline { position: absolute; left: 2.3cqw; top: 44.6cqw; font: 600 1.6cqw/1 "IBM Plex Mono", monospace; color: var(--cream-muted); white-space: pre; }
        /* the message: the lyric is what gets written into it */
        .f02-row { position: absolute; left: 5.1cqw; white-space: nowrap; font-family: "Barlow", sans-serif; color: var(--cream); }
        #f02-r1 { top: 10.8cqw; font-weight: 900; font-size: 13cqw; line-height: 1; letter-spacing: -0.045em; }
        #f02-r2 { top: 24.8cqw; font-weight: 800; font-size: 7cqw; line-height: 1; letter-spacing: -0.035em; }
        #f02-r3 { top: 30.4cqw; left: 4.6cqw; font-weight: 900; font-size: 15cqw; line-height: 0.92; letter-spacing: -0.045em; color: var(--fire); transform-origin: 0% 80%; }
        #f02-r1 .f02-sm { font-weight: 800; font-size: 7cqw; letter-spacing: -0.035em; }
        .f02-hero { display: inline-block; }
        #f02-three { color: var(--fire); }
        .f02-cur { display: inline-block; width: 0.5em; height: 0.74em; margin-left: 0.06em; background: var(--fire); vertical-align: -0.02em; }
        /* 01's lockup, carried through the zoom into the title bar (placed in render) */
        #f02-fly { position: absolute; left: 0; top: 0; font: 900 17.5cqw/0.8 "Barlow", sans-serif; letter-spacing: -0.055em;
          color: var(--cream); white-space: nowrap; transform-origin: 0 0; opacity: 0; }
        #f02-fly span { color: var(--fire); }
        /* git's answer, full width: the joke at poster scale */
        #f02-abort { position: absolute; left: 5.5cqw; top: 45.4cqw; font: 500 3cqw/1 "IBM Plex Mono", monospace; color: var(--cream); white-space: pre; }
        #f02-p2 { top: 49.6cqw; font-size: 3cqw; }
      </style>
      <div id="root" data-composition-id="02-commit" data-width="1920" data-height="1080" data-duration="4.804">
        <div id="f02-cam">
          <div class="hr-layer" data-depth="1">
            <div id="f02-clip">
              <div id="f02-scroll">
                <div id="f02-rise">
                  <div id="f02-win">
                    <div id="f02-title"><span id="f02-tname">force push</span><span>—  ~/us (main)  —  git commit  —  vim .git/COMMIT_EDITMSG</span></div>
                    <div id="f02-tplbox" data-layout-ignore><div id="f02-tpl"><span class="f02-first"># Please enter the commit message for your changes.</span> Lines starting
# with '#' will be ignored, and an empty message aborts the commit.
#
# On branch main
# Changes to be committed:
#	modified:   us.txt
#
<span id="f02-tilde">~
~
~
~
~</span></div></div>
                    <div id="f02-c0"></div>
                    <div id="f02-status"><span id="f02-file">.git/COMMIT_EDITMSG</span><span><span class="f02-days" id="f02-days"></span><span class="f02-dim" id="f02-ruler">      1,1           All</span></span></div>
                    <div id="f02-cmdline">".git/COMMIT_EDITMSG" 8L, 205B</div>
                  </div>
                </div>
                <div id="f02-glow" data-layout-ignore></div>
                <div class="f02-row" id="f02-r1"><span class="f02-hero hr-glow" id="f02-three">three</span><span class="f02-sm"><span class="f02-t"></span><span class="f02-t"></span><span class="f02-cur" id="f02-c1"></span></span></div>
                <div class="f02-row" id="f02-r2"><span class="f02-t"></span><span class="f02-t"></span><span class="f02-t"></span><span class="f02-t"></span><span class="f02-cur" id="f02-c2"></span></div>
                <div class="f02-row" id="f02-r3" data-hf-motion-blur='{"fps": 60}'><span class="f02-hero hr-glow" id="f02-commit">commit</span></div>
                <div id="f02-fly" data-layout-allow-overlap>force <span>push</span></div>
                <div id="f02-abort">Aborting commit due to empty commit message.</div>
                <div class="f02-prompt" id="f02-p2"><span>~/us (main) $ </span><span class="f02-mcur" id="f02-mc2"></span></div>
              </div>
            </div>
          </div>
          <!-- the strip sits above the world, so the window may pass under it during the pushes -->
          <div class="hr-layer" data-depth="0.15">
            <div id="f02-band"></div>
            <div id="f02-strip"><span>~/us &nbsp;·&nbsp; main</span><span>commits by you &nbsp;<b>1,095</b></span></div>
          </div>
        </div>
      </div>
      <script src="assets/kit/env.js"></script>
      <script src="assets/kit/hr-kit.js"></script>
      <script src="assets/kit/motion-blur.js"></script>
      <script src="assets/kit/wow-kit.js"></script>
      <script>
        (() => {
          const DUR = 4.804, T0 = 15.081, PX = 19.2; // 1cqw at 1920 wide
          const root = document.querySelector('[data-composition-id="02-commit"]');
          const $ = (id) => root.querySelector("#" + id);
          const stage = HR.stage(root, { seed: 2 });
          const tl = gsap.timeline({ paused: true });
          const at = (T) => T - T0;

          // INSERT: the snare (vim's `i`) · THREE, NL, QUIT: sung · ABORT: the weak kick · PROMPT: the kick that scrolls
          const INSERT = at(15.531), THREE = at(16.86), NL = at(18.332), QUIT = at(19.46);
          const FLY = 0.42; // 01's lockup lands in the title bar
          const ABORT = at(19.514), PROMPT = at(19.721);

          // ---- the cuts: 01 → 02 zooms through the lens; 02 → 03 glides up. The out is shortened to 0.16 s so it
          // starts after "commit"'s first 0.25 s (19.46 + 0.25 = 19.71); the terminal scroll carries the rest of the move.
          const cam = $("f02-cam");
          WOW.transition(tl, cam, { in: "zoom", dur: 0.35, total: DUR });
          WOW.transition(tl, cam, { out: "glideUp", dur: 0.16, total: DUR });
          WOW.punch(tl, cam, PROMPT, { s: 1.03, dur: 0.16 }); // the kick that prints the prompt

          // ---- the editor is open from the first frame; the window quits at once on "commit" ----
          tl.set($("f02-win"), { opacity: 1 }, 0).set($("f02-win"), { opacity: 0 }, QUIT);

          // ---- the message: "three" slams onto line 1, the rest types at its word times ----
          HR.hero(tl, $("f02-three"), THREE, { spread: 24, over: 1.2, pre: 0.12, sharp: true });
          const tw = root.querySelectorAll(".f02-t");
          // [element, text, track start, track end]; a leading space types with the first letter
          const typed = [
            [tw[0], " years", 17.4, 17.86], [tw[1], " in", 17.899, 18.2],
            [tw[2], "and", 18.363, 18.52], [tw[3], " you", 18.54, 18.76], [tw[4], " never", 18.78, 19.13], [tw[5], " could", 19.22, 19.44],
          ].map(([el, s, a, b]) => ({ el, s, a: at(a), b: at(b), n: s.trim().length }));
          const keys = [INSERT, THREE, NL]; // every keystroke, for the cursor's solid-while-typing
          for (const w of typed) for (let i = 0; i < w.n; i++) keys.push(w.a + ((w.b - w.a) * i) / w.n);
          keys.sort((p, q) => p - q);
          // line 2 starts on the kick: git's template drops a row
          tl.set($("f02-tpl"), { y: 0 }, 0).set($("f02-tpl"), { y: 8 * PX }, NL);

          // ---- "commit": the editor quits unsaved, the message is left as a ghost, "commit" slams, git aborts ----
          const ghost = [$("f02-r1"), $("f02-r2")];
          tl.set(ghost, { color: "#F0ECE5" }, 0).set(ghost, { color: "#888880" }, QUIT);
          tl.set($("f02-three"), { color: "#E85D26" }, 0).set($("f02-three"), { color: "#888880" }, QUIT); // its glow goes in render()
          const r3 = $("f02-r3");
          // the slam on the row itself (its text is static, so the motion blur smears it): in from 1.9× ON "commit", lands sharp
          tl.set(r3, { opacity: 0, scale: 1, y: 0 }, 0);
          // (opacity as its own set: a fromTo's from-only property is skipped by the renderer's sequential seeks)
          tl.set(r3, { opacity: 1 }, QUIT - 0.04);
          tl.fromTo(r3, { scale: 1.9, y: -0.6 * PX * 10 }, { scale: 0.97, y: 0, duration: 0.1, ease: "power3.in", immediateRender: false }, QUIT - 0.04);
          tl.fromTo(r3, { scale: 0.97 }, { scale: 1, duration: 0.42, ease: "elastic.out(1, 0.45)", immediateRender: false }, QUIT + 0.06);
          const abort = $("f02-abort"), p2 = $("f02-p2");
          tl.set([abort, p2], { opacity: 0 }, 0).set(abort, { opacity: 1 }, ABORT).set(p2, { opacity: 1 }, PROMPT);
          // the new prompt prints on the kick and the terminal scrolls up into 03 (the glideUp continues it)
          tl.fromTo($("f02-scroll"), { y: 0 }, { y: -12 * PX, duration: DUR - PROMPT, ease: "power2.in", immediateRender: false }, PROMPT);
          tl.set($("f02-scroll"), { y: 0 }, 0);

          // ---- the light follows the cursor: the command, line 1, line 2, "commit" ----
          const glow = $("f02-glow"), G = (cx, cy) => ({ x: (cx - 40) * PX, y: (cy - 27.5) * PX });
          tl.set(glow, G(30, 22), 0);
          tl.to(glow, { ...G(22, 17.6), duration: 0.4, ease: "power3.out" }, INSERT);
          tl.to(glow, { ...G(34, 24.6), duration: 0.45, ease: "power3.out" }, NL);
          tl.to(glow, { ...G(26, 37), duration: 0.3, ease: "power3.out" }, QUIT);

          // ---- the camera (one big move per phrase): a push from the whole window onto the waiting cursor; the slam on "three";
          // a second push onto line 2 on its kick (the carriage return); a wide pull-out on "commit". The y values keep
          // the status bar either whole in frame (to 18.33, while the days count) or wholly below it, never sliced ----
          tl.fromTo(stage.cam, { z: 0.97, x: 0, y: 0 }, { z: 0.99, duration: INSERT, ease: "sine.out" }, 0);
          tl.to(stage.cam, { z: 1.09, x: -126, y: 46, duration: THREE - 0.06 - INSERT, ease: "power2.inOut" }, INSERT);
          tl.to(stage.cam, { z: 1.14, y: 42, duration: 0.06, ease: "power2.in" }, THREE - 0.06);
          tl.to(stage.cam, { z: 1.1, y: 46, duration: 0.5, ease: "elastic.out(1, 0.55)" }, THREE);
          tl.to(stage.cam, { z: 1.1, x: -92, duration: NL - 0.03 - (THREE + 0.5), ease: "none" }, THREE + 0.5);
          tl.to(stage.cam, { z: 1.21, x: -270, y: -130, duration: 0.38, ease: "power3.out" }, NL - 0.03);
          tl.to(stage.cam, { z: 1.23, x: -250, duration: QUIT - 0.06 - (NL + 0.35), ease: "none" }, NL + 0.35);
          tl.to(stage.cam, { z: 1.25, y: -132, duration: 0.06, ease: "power2.in" }, QUIT - 0.06);
          tl.to(stage.cam, { z: 1.0, x: 0, y: 0, duration: 0.45, ease: "expo.out" }, QUIT);
          tl.set({}, {}, DUR);

          // ---- per-frame state: typing, cursors, the day count, the ruler, the light, the camera ----
          const mc2 = $("f02-mc2"), c0 = $("f02-c0"), c1 = $("f02-c1"), c2 = $("f02-c2");
          const days = $("f02-days"), ruler = $("f02-ruler"), three = $("f02-three"), commit = $("f02-commit");
          const cmdline = $("f02-cmdline"), file = $("f02-file");
          // the flyer's path, measured once the fonts are in: 01's lockup (centred, top 16.6cqw, 1.15×, as wide as
          // the frame) → the title bar's `force push`, in the scroll layer's own px
          const fly = $("f02-fly"), tname = $("f02-tname"), scrollEl = $("f02-scroll");
          const posIn = (el, anc) => { let x = 0, y = 0; for (let e = el; e && e !== anc; e = e.offsetParent) { x += e.offsetLeft; y += e.offsetTop; } return { x, y }; };
          let F = null;
          function measure() {
            const w = fly.offsetWidth, h = fly.offsetHeight, k0 = 1.15, p = posIn(tname, scrollEl);
            const k1 = tname.offsetWidth / Math.max(1, w);
            F = { x0: 960 - (w * k0) / 2, y0: 16.6 * PX + (h - h * k0) / 2, k0, x1: p.x, y1: p.y + (tname.offsetHeight - h * k1) / 2, k1 };
          }
          const blink = (t, since) => t - since < 0.35 || Math.floor((t - since) * 2) % 2 === 0;
          function render() {
            const t = tl.time(), T = T0 + t;
            // 01's lockup flies into the title bar: from the lockup's place and size to the title's first words
            if (!F) fly.style.opacity = 0;
            else {
              const u = Math.min(1, t / FLY), e = 1 - Math.pow(1 - u, 3);
              const x = F.x0 + (F.x1 - F.x0) * e, y = F.y0 + (F.y1 - F.y0) * e, k = F.k0 + (F.k1 - F.k0) * e;
              fly.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) scale(${k.toFixed(4)})`;
              fly.style.opacity = u < 0.55 ? 1 : Math.max(0, 1 - (u - 0.55) / 0.4).toFixed(3);
              tname.style.opacity = u < 0.6 ? 0 : Math.min(1, (u - 0.6) / 0.35).toFixed(3);
            }
            let col1 = 6, col2 = 1; // "three " typed by the hero; columns for the ruler
            for (const w of typed) {
              const k = t < w.a ? 0 : Math.min(w.n, 1 + Math.floor(((t - w.a) / (w.b - w.a)) * w.n));
              const txt = k ? w.s.slice(0, w.s.length - w.n + k) : "";
              w.el.textContent = txt;
              if (w.a < NL) col1 += txt.length; else col2 += txt.length;
            }
            let last = 0; for (const k of keys) if (k <= t) last = k;
            const live = t < QUIT, on = blink(t, last);
            c0.style.opacity = live && t < THREE - 0.12 && on ? 1 : 0;
            c1.style.opacity = live && t >= THREE && t < NL && on ? 1 : 0;
            c2.style.opacity = live && t >= NL && on ? 1 : 0;
            cmdline.textContent = t < INSERT ? '".git/COMMIT_EDITMSG" 8L, 205B' : "-- INSERT --";
            file.textContent = t < THREE ? ".git/COMMIT_EDITMSG" : ".git/COMMIT_EDITMSG [+]";
            mc2.style.opacity = t >= PROMPT ? 1 : 0;
            // "three years": the days the message has been open, counted out across the two words
            const p = Math.max(0, Math.min(1, (t - THREE) / (at(17.899) - THREE)));
            days.textContent = t < THREE ? "" : Math.round(1095 * (1 - (1 - p) * (1 - p))).toLocaleString("en-US") + " days";
            const row = t < NL ? 1 : 2, col = t < THREE ? 1 : row === 1 ? col1 : col2;
            ruler.textContent = `      ${row},${col}`.padEnd(20, " ") + "All";
            glow.style.opacity = Math.min(1, 0.55 + 0.45 * HR.band("bass", T) + 0.3 * HR.hit("kick", T, 0.2)).toFixed(3);
            three.style.textShadow = t >= QUIT ? "none" : "";
            HR.glow(three, T); HR.glow(commit, T, 0.3, 0.5);
            stage.apply(T);
            WOW.draw(tl, T0);
          }
          tl.eventCallback("onUpdate", render);
          if (document.fonts.check('900 100px "Barlow"') && document.fonts.check('600 100px "IBM Plex Mono"')) measure();
          Promise.all([document.fonts.load('900 100px "Barlow"'), document.fonts.load('600 100px "IBM Plex Mono"')]).then(() => { measure(); render(); });
          render();
          window.__timelines["02-commit"] = tl;
        })();
      </script>
    </template>
