<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- Frame 15 — origin (chorus 1's last line, 72.435–76.090). Cream: the repository's settings, printed as a form,
         a mono label column on the left and the values on the right. The cut is the downbeat. REMOTES: the value is
         the lyric, "origin's mine", over git's own `git remote -v` printout; on "mine" (73.32) the push line prints
         and its `me` is marked. ACCESS: `Collaborators: 1` prints on the 72.894 kick, row 1 `me` on "and", row 2's number
         on the 74.279 downbeat; on "there" (74.945) row 2's hairline is drawn under nothing and the gutter pointer
         slams onto the empty row. Settles and holds the page for the hard cut into 16's stomps. -->
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Barlow"; src: url("assets/fonts/barlow-800.woff2") format("woff2"); font-weight: 800; }
        @font-face { font-family: "Barlow"; src: url("assets/fonts/barlow-900.woff2") format("woff2"); font-weight: 900; }
        @font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/ibm-plex-mono-400.woff2") format("woff2"); font-weight: 400; }
        @font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/ibm-plex-mono-500.woff2") format("woff2"); font-weight: 500; }
        @font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/ibm-plex-mono-600.woff2") format("woff2"); font-weight: 600; }
        #root {
          position: absolute; inset: 0; overflow: hidden; container-type: size;
          --ink: #0A0A0A; --fire: #E85D26; --cream: #F0ECE5; --ink-on-cream: #111111; --muted-on-cream: #5F5B54; --marker: #C8481A;
          --hr-accent-rgb: 200, 72, 26;
          background: var(--cream); color: var(--ink-on-cream);
        }
        /* header strip, cream register (07's colours) */
        #f15-strip { position: absolute; left: 5.5cqw; right: 5.5cqw; top: 3.4cqw; display: flex; justify-content: space-between;
          font: 500 0.78cqw/1.5 "IBM Plex Mono", monospace; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted-on-cream);
          padding-bottom: 0.6cqw; border-bottom: 1px solid rgba(17, 17, 17, 0.22); }
        #f15-strip b { color: #B8461C; font-weight: 600; }
        /* the finish layer's vignette darkens the corners of the cream page: the strip's small text needs a darker ink */
        #f15-strip { color: #3F3C37; } #f15-strip b { color: #7E2E12; }
        /* the form: label column at 5.5cqw, value column at 21cqw */
        .f15-lbl { position: absolute; left: 5.5cqw; font: 500 0.78cqw/1.5 "IBM Plex Mono", monospace; letter-spacing: 0.14em;
          text-transform: uppercase; color: var(--muted-on-cream); }
        #f15-lbl1 { top: 9.2cqw; }
        #f15-lbl2 { top: 31.1cqw; }
        .f15-sep { position: absolute; left: 5.5cqw; right: 5.5cqw; height: 1px; background: rgba(17, 17, 17, 0.22); transform-origin: 0% 50%; }
        #f15-sep1 { top: 29.6cqw; }
        /* REMOTES: the lyric is the value; git's printout is its detail */
        #f15-a { position: absolute; left: 20.4cqw; top: 7.4cqw; font: 900 12cqw/0.92 "Barlow", sans-serif; letter-spacing: -0.045em;
          color: var(--ink-on-cream); white-space: nowrap; }
        .f15-hw { position: relative; display: inline-block; isolation: isolate; }
        .f15-ul { position: absolute; z-index: -1; left: -0.02em; right: 0.04em; bottom: -0.01em; height: 0.07em; background: var(--marker); opacity: 0.85;
          border-radius: 0.2cqw; transform-origin: 0% 50%; transform: rotate(-0.6deg) scaleX(0); }
        #f15-remote { position: absolute; left: 21cqw; top: 20.6cqw; font: 400 1.22cqw/1.6 "IBM Plex Mono", monospace; color: var(--muted-on-cream);
          white-space: pre; }
        #f15-remote .f15-cmd { color: var(--ink-on-cream); font-weight: 500; }
        #f15-remote .f15-url { color: var(--ink-on-cream); }
        #f15-remote .f15-me { color: #B8461C; font-weight: 600; position: relative; display: inline-block; }
        #f15-remote .f15-me i { position: absolute; left: -0.1em; right: -0.1em; bottom: -0.12em; height: 0.16em; background: var(--marker);
          transform-origin: 0% 50%; }
        /* ACCESS: one collaborator, and the row where you were */
        #f15-tab { position: absolute; left: 21cqw; right: 5.5cqw; top: 30.8cqw; }
        .f15-head { height: 2.4cqw; font: 400 1.1cqw/2.4cqw "IBM Plex Mono", monospace; color: var(--muted-on-cream); }
        .f15-row { position: relative; height: 3.1cqw; display: flex; align-items: center; font: 500 1.45cqw/1 "IBM Plex Mono", monospace;
          color: var(--ink-on-cream); }
        .f15-row .f15-n { width: 3.4cqw; font-weight: 400; color: var(--muted-on-cream); }
        .f15-row .f15-addr { margin-left: 6cqw; font-weight: 400; color: var(--muted-on-cream); }
        .f15-rule { position: absolute; left: 0; right: 0; bottom: 0; height: 1px; background: rgba(17, 17, 17, 0.22); transform-origin: 0% 50%; }
        #f15-gone .f15-rule { background: rgba(17, 17, 17, 0.55); }
        #f15-ptr { position: absolute; left: -1.3cqw; top: 18%; bottom: 18%; width: 0.32cqw; background: var(--marker); opacity: 0; }
        /* the second half of the line, under the empty row */
        #f15-b { position: absolute; left: 20.6cqw; top: 40.4cqw; font: 800 8.4cqw/0.95 "Barlow", sans-serif; letter-spacing: -0.04em;
          color: var(--ink-on-cream); white-space: nowrap; }
        #f15-b .f15-hero { font-weight: 900; }
      </style>
      <div id="root" data-composition-id="15-origin" data-width="1920" data-height="1080" data-duration="3.655">
        <div class="hr-layer" data-depth="0.15">
          <div id="f15-strip"><span>~/us &nbsp;·&nbsp; settings</span><span>commits by you on origin &nbsp;<b>0</b></span></div>
        </div>
        <div class="hr-layer" data-depth="0.55">
          <div class="f15-lbl" id="f15-lbl1">remotes</div>
          <div class="f15-sep" id="f15-sep1"></div>
          <div class="f15-lbl" id="f15-lbl2">access</div>
          <div id="f15-remote"><div><span class="f15-cmd">$ git remote -v</span></div><div id="f15-r1">origin&#9;<span class="f15-url">me@home:us.git</span> (fetch)</div><div id="f15-r2">origin&#9;<span class="f15-url"><span class="f15-me">me<i></i></span>@home:us.git</span> (push)</div></div>
          <div id="f15-tab">
            <div class="f15-head" id="f15-head">Collaborators: 1</div>
            <div class="f15-row" id="f15-me"><span class="f15-n">1</span><span>me</span><span class="f15-addr">me@home</span><i class="f15-rule"></i></div>
            <div class="f15-row" id="f15-gone"><i id="f15-ptr"></i><span class="f15-n" id="f15-n2">2</span><i class="f15-rule" id="f15-rule2"></i></div>
          </div>
        </div>
        <div class="hr-layer" data-depth="0.9">
          <div id="f15-a"><span class="f15-hw"><span class="f15-w" id="f15-origin">origin's</span></span> <span class="f15-hw"><span class="f15-w" id="f15-mine">mine</span><i class="f15-ul" id="f15-ul"></i></span></div>
          <div id="f15-b"><span class="f15-w">and</span> <span class="f15-w">you're</span> <span class="f15-w">not</span> <span class="f15-w f15-hero" id="f15-there">there</span></div>
        </div>
      </div>
      <script src="assets/kit/env.js"></script>
      <script src="assets/kit/hr-kit.js"></script>
      <script>
        (() => {
          const DUR = 3.655, T0 = 72.435;
          const root = document.querySelector('[data-composition-id="15-origin"]');
          const $ = (id) => root.querySelector("#" + id);
          const stage = HR.stage(root, { seed: 15 });
          const tl = gsap.timeline({ paused: true });
          const at = (T) => T - T0;
          const ORIGIN = at(72.56), MINE = at(73.32), AND = at(73.82), THERE = at(74.945);
          const K_HEAD = at(72.894), K_AND = at(73.818), DOWN = at(74.279);

          // ---- the printout: the command and the fetch line are on the page at the cut; the push line prints on "mine" ----
          tl.set($("f15-r2"), { opacity: 0 }, 0).set($("f15-r2"), { opacity: 1 }, MINE);
          tl.fromTo(root.querySelector(".f15-me i"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power2.out" }, MINE + 0.06);
          // ACCESS prints on the kicks: the count between the heroes, my row on "and", row 2's number on the downbeat
          tl.set($("f15-head"), { opacity: 0 }, 0).set($("f15-head"), { opacity: 1 }, K_HEAD);
          tl.set($("f15-me"), { opacity: 0 }, 0).set($("f15-me"), { opacity: 1 }, K_AND);
          tl.set($("f15-n2"), { opacity: 0 }, 0).set($("f15-n2"), { opacity: 1 }, DOWN);
          // "there": the empty row gets its hairline, and the pointer slams onto it
          tl.fromTo($("f15-rule2"), { scaleX: 0 }, { scaleX: 1, duration: 0.22, ease: "power3.out" }, THERE);
          tl.set($("f15-ptr"), { opacity: 1 }, THERE);
          tl.fromTo($("f15-ptr"), { scaleY: 1.8 }, { scaleY: 1, duration: 0.45, ease: "elastic.out(1, 0.5)", immediateRender: false }, THERE);

          // ---- the sung words, each on its own start ----
          HR.hero(tl, $("f15-origin"), ORIGIN, { spread: 30, over: 1.18, pre: 0.1, sharp: true });
          HR.hero(tl, $("f15-mine"), MINE, { spread: 24, over: 1.2, pre: 0.14, sharp: true });
          tl.fromTo($("f15-ul"), { scaleX: 0 }, { scaleX: 1, duration: 0.22, ease: "power2.out" }, MINE + 0.04);
          const w = root.querySelectorAll("#f15-b .f15-w");
          HR.lead(tl, w[0], AND); HR.lead(tl, w[1], at(74.0)); HR.lead(tl, w[2], at(74.48));
          HR.hero(tl, w[3], THERE, { spread: 26, over: 1.22, pre: 0.14, sharp: true });

          // ---- the camera: punches sized by the measured drums; a slow push carries the page to the cut ----
          const punch = (T) => 0.018 + 0.03 * HR.band("drums", T0 + T + 0.03);
          const pO = punch(ORIGIN), pM = punch(MINE), pT = punch(THERE) + 0.01;
          tl.fromTo(stage.cam, { z: 1.0, y: 0, x: 0 }, { z: 1.0 + pO, y: -4, duration: 0.06, ease: "power2.in" }, ORIGIN - 0.06);
          tl.to(stage.cam, { z: 1.006, y: 0, duration: 0.5, ease: "elastic.out(1, 0.55)" }, ORIGIN);
          tl.to(stage.cam, { z: 1.012, duration: MINE - ORIGIN - 0.56, ease: "none" }, ORIGIN + 0.5);
          tl.to(stage.cam, { z: 1.012 + pM, y: -6, duration: 0.06, ease: "power2.in" }, MINE - 0.06);
          tl.to(stage.cam, { z: 1.016, y: 0, duration: 0.5, ease: "elastic.out(1, 0.55)" }, MINE);
          // "and you're not": the camera tilts down to the second half
          tl.to(stage.cam, { z: 1.022, y: 14, duration: THERE - MINE - 0.56, ease: "sine.inOut" }, MINE + 0.5);
          tl.to(stage.cam, { z: 1.022 + pT, y: 8, duration: 0.06, ease: "power2.in" }, THERE - 0.06);
          tl.to(stage.cam, { z: 1.026, y: 14, duration: 0.6, ease: "elastic.out(1, 0.5)" }, THERE);
          tl.to(stage.cam, { z: 1.036, x: -12, duration: DUR - THERE - 0.6, ease: "none" }, THERE + 0.6);
          tl.set({}, {}, DUR);

          function render() {
            stage.apply(T0 + tl.time());
          }
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["15-origin"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
