        (() => {
          const DUR = 2.899, T0 = 60.78, PX = 19.2; // 1cqw at 1920 wide
          const root = document.querySelector('[data-composition-id="12-lies"]');
          const $ = (id) => root.querySelector("#" + id);
          const stage = HR.stage(root, { seed: 12 });
          const tl = gsap.timeline({ paused: true });
          const at = (T) => T - T0;
          // the words (lyrics.json L17) and the kicks they land on (HR_ENV): FORCE 60.92, PUSH! 61.363, the downbeat 63.22
          const FORCE = at(60.84), PUSH = at(61.33), RIGHT = at(61.86), OVER = at(62.42), YOUR = at(62.72), LIES = at(62.96);
          const FL = at(60.92), PL = at(61.363), DB = at(63.22);

          // ---- the cuts: the world (strip + log) whips in from the left; FORCE is not in it, so it lands sharp.
          //      The whole camera whips out to the left into 13 over the last 0.25 s (from 63.429). ----
          const cam = $("f12-cam"), world = $("f12-world");
          WOW.transition(tl, world, { in: "whipR", out: "cut", dur: 0.25, start: -0.1, total: DUR });
          WOW.transition(tl, cam, { in: "cut", out: "whipL", dur: 0.25, total: DUR });

          // ---- the hook: two slams on their own wrappers, each landing exactly at rest (the camera carries the bounce) ----
          const force = $("f12-force"), push = $("f12-push");
          // FORCE comes out of the lens from its start − 0.04 and lands sharp on the kick
          tl.set(force, { opacity: 0 }, 0).set(force, { opacity: 1 }, FORCE - 0.04);
          // (FORCE scales out of the lens, so its blur is a zoom blur on the approach: a CSS blur, sharp on the kick)
          tl.fromTo(force, { scale: 2.1, yPercent: -10, skewX: -12, filter: "blur(16px)" }, { scale: 1, yPercent: 0, skewX: 0, filter: "blur(0px)", duration: FL - (FORCE - 0.04), ease: "power3.in", immediateRender: false }, FORCE - 0.04);
          tl.set(force, { scale: 2.1, yPercent: -10, skewX: -12, filter: "blur(16px)" }, 0);
          // PUSH! is shoved in from the right edge from its start − 0.04, onto the kick and the downbeat
          tl.set(push, { opacity: 0 }, 0).set(push, { opacity: 1 }, PUSH - 0.04);
          tl.fromTo(push, { x: 62 * PX, scale: 1.25, skewX: -18 }, { x: 0, scale: 1, skewX: 0, duration: PL - (PUSH - 0.04), ease: "power3.in", immediateRender: false }, PUSH - 0.04);
          tl.set(push, { x: 62 * PX, scale: 1.25, skewX: -18 }, 0);
          WOW.shake(tl, cam, FL + 0.01, { amp: 6, dur: 0.28, rot: 0.2, seed: 12 });
          WOW.shake(tl, cam, PL + 0.01, { amp: 9, dur: 0.34, rot: 0.3, seed: 21 });

          // ---- the pen: one fire bar strikes each row across the whole panel, the lie erased behind it, the sung
          //      word left in its place. Panel coordinates (px); the pen leaves 0.04 s before its word. ----
          const LANE = 3.4 * PX, TXT = (3.4 + 14.6) * PX, END = (89 - 2.2) * PX, LIESX = TXT + 16.6 * PX - 0.6 * PX;
          const ROWTOP = [4.4, 12.8, 21.2].map((v) => v * PX), PENY = ROWTOP.map((y) => y + 8.2 * PX - 0.35 * PX - 6.6 * PX);
          const strikes = [
            { row: 0, t: RIGHT - 0.04, a: LANE, b: END, dur: 0.3 },
            { row: 1, t: OVER - 0.04, a: LANE, b: END, dur: 0.22 },
            { row: 2, t: YOUR - 0.04, a: LANE, b: LIESX, dur: 0.17 },
            { row: 2, t: LIES - 0.04, a: LIESX, b: END, dur: 0.26 },
          ];
          const pen = $("f12-pen");
          // the pen jumps rows only while hidden, at least a shutter (1/60 s) away from either side, so it never smears
          tl.set(pen, { x: LANE, y: PENY[0] }, 0);
          tl.set(pen, { x: LANE, y: PENY[1] }, OVER - 0.08);
          tl.set(pen, { x: LANE, y: PENY[2] }, YOUR - 0.08);
          strikes.forEach((s) => tl.fromTo(pen, { x: s.a }, { x: s.b, duration: s.dur, ease: "power3.out", immediateRender: false }, s.t));
          // visible: during each strike and its park (rows 0 and 1 hide 0.02 s after the strike; the last stays, blinking)
          const penOn = (t) => (t >= strikes[0].t && t < strikes[0].t + strikes[0].dur + 0.02) || (t >= strikes[1].t && t < strikes[1].t + strikes[1].dur + 0.02) || t >= strikes[2].t;
          const rowStart = [strikes[0].t, strikes[1].t, strikes[2].t];
          const rowDone = [strikes[0].t + strikes[0].dur, strikes[1].t + strikes[1].dur, strikes[3].t + strikes[3].dur];
          const STRIKE_T = strikes.map((s) => s.t);
          // each strike hits the camera with the drums under it
          strikes.forEach((s, i) => WOW.shake(tl, cam, s.t + 0.04, { amp: 3 + 7 * HR.band("drums", T0 + s.t + 0.04), dur: 0.25, rot: 0.15, seed: 30 + i }));

          // ---- "lies": the hero lands at display scale as the pen strikes the last lie off; a ring goes out ----
          const lies = $("f12-lies");
          HR.hero(tl, lies, LIES, { spread: 22, over: 1.24, pre: 0.08, sharp: true, skew: false });
          WOW.shock(tl, $("f12-log"), { x: TXT + 25 * PX, y: ROWTOP[2] + 4.2 * PX, t: LIES + 0.01, r: 620, n: 2, w: 5 });
          // the footer lands whole, with the hat after "lies"
          tl.set($("f12-foot"), { opacity: 0 }, 0).set($("f12-foot"), { opacity: 1 }, at(62.971));

          // ---- the camera: a punch on FORCE, a bigger one on PUSH!, then it leans down the log row by row with the
          //      strikes, a punch on "lies", one on the downbeat, a drift left into the whip ----
          const c = stage.cam;
          tl.fromTo(c, { z: 1.0, x: 0, y: 0 }, { z: 1.035, x: 0, y: -4, duration: FL, ease: "power2.in" }, 0);
          tl.to(c, { z: 1.0, y: 0, duration: 0.4, ease: "elastic.out(1, 0.55)" }, FL + 0.01);
          tl.to(c, { z: 1.05, y: -8, duration: 0.06, ease: "power2.in" }, PL - 0.06);
          tl.to(c, { z: 1.01, y: 0, duration: 0.45, ease: "elastic.out(1, 0.5)" }, PL + 0.01);
          tl.to(c, { z: 1.035, y: 12, duration: 0.34, ease: "power3.out" }, RIGHT - 0.02);
          tl.to(c, { z: 1.055, y: 24, duration: 0.28, ease: "power3.out" }, OVER - 0.02);
          tl.to(c, { z: 1.07, y: 34, duration: 0.2, ease: "power3.out" }, YOUR - 0.02);
          tl.to(c, { z: 1.1, y: 42, duration: 0.05, ease: "power2.in" }, LIES - 0.05);
          tl.to(c, { z: 1.075, y: 38, x: 6, duration: DB - 0.04 - LIES, ease: "power2.out" }, LIES + 0.01);
          tl.to(c, { z: 1.095, duration: 0.04, ease: "power2.in" }, DB - 0.04);
          tl.to(c, { z: 1.08, x: -22, duration: DUR - DB, ease: "power2.out" }, DB);
          tl.set({}, {}, DUR);

          // ---- per-frame state: reveals, erasure, edges, light, rewritten gutters, the lit lane, glow, camera ----
          const rows = Array.from(root.querySelectorAll(".f12-row")).map((el, i) => ({
            el, i, dot: el.querySelector(".f12-dot"), edge: el.querySelector(".f12-edge"), wash: el.querySelector(".f12-wash"),
            txt: el.querySelector(".f12-txt"), lie: el.querySelector(".f12-lie"), neu: el.querySelector(".f12-new"),
            words: Array.from(el.querySelectorAll(".f12-w")), h: el.querySelector(".f12-h"), oldH: el.querySelector(".f12-h").textContent, au: el.querySelector(".f12-au"),
          }));
          const NEWH = ["e81b0d4", "c40f9a2", "7b1e3d8"], HEXL = "0123456789abcdef";
          const lane = $("f12-lane"), penglow = $("f12-penglow"), hglow = $("f12-hglow"), lglow = $("f12-lglow");
          const fireRGB = [232, 93, 38], hintRGB = [80, 80, 72];
          const mix = (a, b, k) => `rgb(${a.map((v, j) => Math.round(v + (b[j] - v) * k)).join(",")})`;
          const popE = gsap.parseEase("back.out(2.6)");
          let laid = false;
          function layout() {
            for (const r of rows) r.ws = r.words.map((w) => w.offsetLeft + w.offsetWidth);
            // the hook's glow sits on PUSH!'s centre
            hglow.style.left = (push.offsetLeft + push.offsetWidth / 2).toFixed(1) + "px";
            hglow.style.top = (push.offsetTop + push.offsetHeight * 0.55).toFixed(1) + "px";
            laid = document.fonts.status === "loaded";
          }
          function render() {
            const t = tl.time(), T = T0 + t;
            if (!laid) layout();
            const lit = t >= LIES, bass = HR.band("bass", T), kick = HR.hit("kick", T, 0.2);
            const px = gsap.getProperty(pen, "x"), py = gsap.getProperty(pen, "y");
            for (const r of rows) {
              const started = t >= rowStart[r.i], done = t >= rowDone[r.i];
              // the pen's tip, in this row's text column (row 2 holds at "lies" between its two strikes)
              const x = !started ? -1e4 : done ? END : px;
              const xr = x - TXT;
              r.lie.style.clipPath = done ? "inset(0 0 0 100%)" : `inset(-30% -2% -30% ${Math.max(0, xr).toFixed(1)}px)`;
              for (let j = 0; j < r.words.length; j++) {
                const right = r.ws[j] - xr;
                r.words[j].style.clipPath = right <= 0 ? "none" : `inset(-40% ${right.toFixed(1)}px -40% -30%)`;
              }
              // the edge: from the commit dot along the row, fire while it strikes, cooling to a hairline, lit again on "lies"
              const ew = started ? Math.max(0, x - LANE) : 0;
              const k = lit ? 0 : Math.max(0, Math.min(1, (t - (rowDone[r.i] + 0.05)) / 0.4));
              r.edge.style.width = ew.toFixed(1) + "px";
              r.edge.style.background = mix(fireRGB, hintRGB, k);
              // the strike's light: a wash trailing the pen, fading after it; the overwritten log glows on "lies"
              r.wash.style.width = ew.toFixed(1) + "px";
              const fade = !started ? 0 : !done ? 1 : Math.exp(-(t - rowDone[r.i]) / 0.3);
              r.wash.style.opacity = Math.max(fade, lit ? 0.45 + 0.35 * bass : 0).toFixed(3);
              // the commit is rewritten: the hash scrambles to a new one, the author is stamped `me`, the dot fills
              if (!started) { r.h.textContent = r.oldH; }
              else {
                const p = (t - rowStart[r.i]) / 0.2, tick = Math.floor(t * 30); let s = "";
                for (let i = 0; i < 7; i++) s += p >= (i + 1) / 8 ? NEWH[r.i][i] : HEXL[(r.i * 7 + tick * 5 + i * 3) % 16];
                r.h.textContent = s;
              }
              const stamped = t >= rowStart[r.i] + 0.03;
              r.au.textContent = stamped ? "me" : "you";
              r.au.classList.toggle("f12-me", stamped);
              const sk = stamped ? popE(Math.min(1, (t - rowStart[r.i] - 0.03) / 0.25)) : 1;
              r.au.style.transform = stamped ? `scale(${(1.9 - 0.9 * sk).toFixed(3)})` : "";
              const pk = started ? popE(Math.min(1, (t - rowStart[r.i]) / 0.3)) : 1;
              r.dot.style.background = started ? (lit ? "#E85D26" : "#F0ECE5") : "#121211";
              r.dot.style.borderColor = started ? (lit ? "#E85D26" : "#F0ECE5") : "#505048";
              r.dot.style.transform = `scale(${pk.toFixed(3)})`;
            }
            // the pen: on while it strikes; parked at the end after "lies", blinking at 2 Hz
            const parked = t >= rowDone[2] + 0.3;
            pen.style.opacity = penOn(t) && (!parked || Math.floor((t - rowDone[2] - 0.3) * 4) % 2 === 1) ? 1 : 0;
            // the pen's light follows its tip, brightest while it moves
            const moving = strikes.some((s) => t >= s.t && t < s.t + s.dur);
            penglow.style.left = (px + 0.5 * PX).toFixed(1) + "px";
            penglow.style.top = (py + 4.5 * PX).toFixed(1) + "px";
            penglow.style.opacity = (penOn(t) ? (moving ? 1 : 0.45 + 0.25 * bass) : 0).toFixed(3);
            // the lane lights as the new main on "lies"
            lane.style.background = lit ? "#E85D26" : "#505048";
            lane.style.boxShadow = lit ? `0 0 ${(10 + 16 * kick).toFixed(1)}px rgba(232, 93, 38, 0.6)` : "none";
            // the light: the hook's glow waits under FORCE and is full from PUSH!; the log's glow swells on "lies"
            hglow.style.opacity = Math.min(1, (t < PL ? 0.4 + 0.3 * Math.max(0, Math.min(1, (t - FORCE) / 0.3)) : 0.85) + 0.3 * bass + 0.25 * kick).toFixed(3);
            const swell = lit ? 0.45 * Math.exp(-(t - LIES) / 0.6) : 0;
            lglow.style.opacity = Math.min(1, 0.55 + 0.3 * bass + 0.2 * kick + swell).toFixed(3);
            HR.glow(push, T, 0.22, 0.35); HR.glow(lies, T, 0.3, 0.45);
            stage.apply(T);
            WOW.draw(tl, T0);
          }
          tl.eventCallback("onUpdate", render);
          render();
          if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { laid = false; render(); });
          window.__timelines["12-lies"] = tl;
        })();
      </script>
    </template>
  </body>
