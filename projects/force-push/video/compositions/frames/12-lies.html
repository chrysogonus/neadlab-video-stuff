  <head>
    <meta charset="UTF-8" />
    <!-- Frame 12 — lies (chorus 1, L17, 60.780–63.679). The hook again, staged unlike 10: FORCE PUSH! is one centred
         line across the top, and under it is origin/main's old log, the ex's three commits, whose messages are his
         lies from verse 1 (`we'll get to it`, `just a feature`, `nothing on the side`, same hashes as 10's log).
         FORCE slams on 60.84, PUSH! on 61.33. Then the rest of the line is pushed over the log one row at a time:
         on each word a graph edge runs out of the row's commit dot with an overwrite cursor at its tip. Behind the
         cursor the lie is erased and the sung word is left in its place ("right" 61.86, "over" 62.42, "your" 62.72).
         Each row's hash is rewritten and its author goes from `you` to `me`. On "lies" (62.96) the cursor finishes
         the last lie, the lane and edges light up as the new main, and `3 commits overwritten` arrives. Hard cut
         into 13. -->
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Barlow"; src: url("assets/fonts/barlow-800.woff2") format("woff2"); font-weight: 800; }
        @font-face { font-family: "Barlow"; src: url("assets/fonts/barlow-900.woff2") format("woff2"); font-weight: 900; }
        @font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/ibm-plex-mono-400.woff2") format("woff2"); font-weight: 400; }
        @font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/ibm-plex-mono-500.woff2") format("woff2"); font-weight: 500; }
        @font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/ibm-plex-mono-600.woff2") format("woff2"); font-weight: 600; }
        #root {
          position: absolute; inset: 0; overflow: hidden; container-type: size;
          --ink: #0A0A0A; --ink-alt: #1A1A18; --fire: #E85D26; --cream: #F0ECE5;
          --cream-muted: #888880; --cream-hint: #505048; --border: #282826;
          background: var(--ink); color: var(--cream);
        }
        #f12-strip { position: absolute; left: 5.5cqw; right: 5.5cqw; top: 3.4cqw; display: flex; justify-content: space-between;
          font: 500 0.78cqw/1.5 "IBM Plex Mono", monospace; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cream-muted);
          padding-bottom: 0.6cqw; border-bottom: 1px solid var(--border); }
        #f12-strip b { color: var(--fire); font-weight: 600; }
        /* the hook: one centred line, the film's one all-caps slam */
        #f12-hook { position: absolute; left: 0; right: 0; top: 7.2cqw; text-align: center; white-space: nowrap;
          font: 900 14.2cqw/0.87 "Barlow", sans-serif; letter-spacing: -0.04em; color: var(--cream); }
        #f12-hook > span { display: inline-block; }
        #f12-hook .f12-push { color: var(--fire); }
        /* origin/main's old log: three of your commits, their messages your lies */
        #f12-log { position: absolute; left: 20.5cqw; top: 22.4cqw; width: 59cqw; height: 31cqw; }
        #f12-head { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between;
          font: 500 0.78cqw/1.5 "IBM Plex Mono", monospace; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cream-muted);
          padding-bottom: 0.6cqw; border-bottom: 1px solid var(--border); }
        #f12-head b { color: var(--cream); font-weight: 600; }
        #f12-head i { font-style: normal; text-transform: none; letter-spacing: 0.04em; }
        #f12-lane { position: absolute; left: 0; top: 2.6cqw; width: 2px; margin-left: -1px; height: 27.6cqw; background: var(--cream-hint); }
        .f12-row { position: absolute; left: 0; width: 59cqw; height: 6.6cqw; }
        .f12-dot { position: absolute; left: -0.75cqw; bottom: -1.65cqw; width: 1.5cqw; height: 1.5cqw; border-radius: 50%; box-sizing: border-box;
          border: 3px solid var(--cream-hint); background: var(--ink); }
        .f12-edge { position: absolute; left: 0; bottom: -0.98cqw; height: 3px; width: 0; background: var(--fire); }
        .f12-gut { position: absolute; left: 1.9cqw; bottom: 0.7cqw; font: 400 1.15cqw/1 "IBM Plex Mono", monospace; color: var(--cream-muted); white-space: pre; }
        .f12-gut .f12-au { color: var(--fire); font-weight: 600; }
        .f12-gut .f12-au.f12-me { color: var(--cream); font-weight: 500; }
        .f12-txt { position: absolute; left: 12.5cqw; bottom: 0; width: 46cqw; height: 6.6cqw; }
        .f12-lie { position: absolute; left: 0; bottom: 0.55cqw; font: 400 3.9cqw/1 "IBM Plex Mono", monospace; letter-spacing: -0.02em; color: var(--cream-muted); white-space: pre; }
        .f12-new { position: absolute; left: 0; bottom: 0; font: 800 6.4cqw/1 "Barlow", sans-serif; letter-spacing: -0.035em; color: var(--cream); white-space: pre; }
        .f12-new > span { display: inline-block; }
        .f12-new .f12-hero { font-weight: 900; font-size: 1.2em; letter-spacing: -0.04em; color: var(--fire); }
        .f12-cur { position: absolute; left: 0; bottom: 0.45cqw; width: 0.95cqw; height: 5cqw; background: var(--fire); }
        #f12-foot { opacity: 0; position: absolute; left: 12.5cqw; top: 30.2cqw; font: 500 1.15cqw/1 "IBM Plex Mono", monospace; color: var(--cream-muted); white-space: pre; }
        #f12-foot b { color: var(--fire); font-weight: 600; }
      </style>
      <div id="root" data-composition-id="12-lies" data-width="1920" data-height="1080" data-duration="2.899">
        <div class="hr-layer" data-depth="0.15">
          <div id="f12-strip"><span>~/us &nbsp;·&nbsp; main</span><span>commits by you on origin &nbsp;<b>0</b></span></div>
        </div>

        <div class="hr-layer" data-depth="0.6">
          <div id="f12-log">
            <div id="f12-head"><span>origin/main &nbsp;·&nbsp; <i>3f2a1c9...e81b0d4</i></span><b>git log</b></div>
            <div id="f12-lane"></div>
            <div class="f12-row" style="top: 3.9cqw">
              <i class="f12-edge"></i><i class="f12-dot"></i>
              <div class="f12-gut"><span class="f12-h">a7c21f0</span>  <span class="f12-au">you</span></div>
              <div class="f12-txt">
                <span class="f12-lie" data-layout-allow-overlap>we'll get to it</span>
                <span class="f12-new" data-layout-allow-overlap><span class="f12-w">right</span></span>
                <i class="f12-cur"></i>
              </div>
            </div>
            <div class="f12-row" style="top: 12.1cqw">
              <i class="f12-edge"></i><i class="f12-dot"></i>
              <div class="f12-gut"><span class="f12-h">4c9d7a1</span>  <span class="f12-au">you</span></div>
              <div class="f12-txt">
                <span class="f12-lie" data-layout-allow-overlap>just a feature</span>
                <span class="f12-new" data-layout-allow-overlap><span class="f12-w">over</span></span>
                <i class="f12-cur"></i>
              </div>
            </div>
            <div class="f12-row" style="top: 21.2cqw">
              <i class="f12-edge"></i><i class="f12-dot"></i>
              <div class="f12-gut"><span class="f12-h">0b5f6e2</span>  <span class="f12-au">you</span></div>
              <div class="f12-txt">
                <span class="f12-lie" data-layout-allow-overlap>nothing on the side</span>
                <span class="f12-new" data-layout-allow-overlap><span class="f12-w">your</span> <span class="f12-hero hr-glow" id="f12-lies">lies</span></span>
                <i class="f12-cur"></i>
              </div>
            </div>
            <div id="f12-foot"><b>3</b> commits overwritten</div>
          </div>
        </div>

        <div class="hr-layer" data-depth="1">
          <div id="f12-hook"><span id="f12-force">FORCE</span> <span class="f12-push hr-glow" id="f12-push">PUSH!</span></div>
        </div>
      </div>
      <script src="assets/kit/env.js"></script>
      <script src="assets/kit/hr-kit.js"></script>
      <script>
        (() => {
          const DUR = 2.899, T0 = 60.78;
          const root = document.querySelector('[data-composition-id="12-lies"]');
          const $ = (id) => root.querySelector("#" + id);
          const stage = HR.stage(root, { seed: 12 });
          const tl = gsap.timeline({ paused: true });
          const at = (T) => T - T0;
          const FORCE = at(60.84), PUSH = at(61.33), RIGHT = at(61.86), OVER = at(62.42), YOUR = at(62.72), LIES = at(62.96);

          // ---- the hook: FORCE slams on the cut, PUSH! with the kick on the downbeat ----
          HR.hero(tl, $("f12-force"), FORCE, { spread: 30, over: 1.18, pre: 0.05, sharp: true });
          HR.hero(tl, $("f12-push"), PUSH, { spread: 36, over: 1.24, pre: 0.14, sharp: true });

          // ---- the rows: a pen per row (p 0..1; the last row 0..2: "your", then "lies") ----
          const rows = Array.from(root.querySelectorAll(".f12-row")).map((el, i) => ({
            el, i, pen: { p: 0 },
            dot: el.querySelector(".f12-dot"), edge: el.querySelector(".f12-edge"), cur: el.querySelector(".f12-cur"),
            txt: el.querySelector(".f12-txt"), lie: el.querySelector(".f12-lie"), neu: el.querySelector(".f12-new"),
            words: Array.from(el.querySelectorAll(".f12-w")), h: el.querySelector(".f12-h"), oldH: el.querySelector(".f12-h").textContent, au: el.querySelector(".f12-au"),
          }));
          const NEWH = ["e81b0d4", "c40f9a2", "7b1e3d8"];
          // each row is overwritten on its word: the pen leaves 0.04 s early and is past the word within a few frames
          const starts = [RIGHT, OVER, YOUR];
          rows.forEach((r, i) => {
            r.t0 = starts[i] - 0.04;
            tl.fromTo(r.pen, { p: 0 }, { p: 1, duration: i === 2 ? 0.2 : 0.34, ease: "power3.out", immediateRender: false }, r.t0);
          });
          // "lies": the pen finishes the last lie as the hero lands
          tl.to(rows[2].pen, { p: 2, duration: 0.13, ease: "power2.out" }, LIES - 0.04);
          HR.hero(tl, $("f12-lies"), LIES, { spread: 18, over: 1.26, pre: 0.08, sharp: true, skew: false });
          // the footer lands whole, with the hat after "lies"
          tl.set($("f12-foot"), { opacity: 1 }, at(62.971));

          // ---- the camera: a punch on FORCE, a bigger one on PUSH!, a lean down the log, a punch on "lies" ----
          tl.fromTo(stage.cam, { z: 1.0, y: 0 }, { z: 1.04, y: -5, duration: 0.05, ease: "power2.in" }, FORCE - 0.05);
          tl.to(stage.cam, { z: 1.0, y: 0, duration: 0.45, ease: "elastic.out(1, 0.55)" }, FORCE);
          tl.to(stage.cam, { z: 1.06, y: -9, duration: 0.07, ease: "power2.in" }, PUSH - 0.07);
          tl.to(stage.cam, { z: 1.012, y: 0, duration: 0.5, ease: "elastic.out(1, 0.5)" }, PUSH);
          tl.to(stage.cam, { z: 1.03, y: 14, duration: LIES - 0.06 - (PUSH + 0.5), ease: "sine.inOut" }, PUSH + 0.5);
          tl.to(stage.cam, { z: 1.065, y: 22, duration: 0.06, ease: "power2.in" }, LIES - 0.06);
          tl.to(stage.cam, { z: 1.04, y: 18, x: 10, duration: DUR - LIES, ease: "power2.out" }, LIES);
          tl.set({}, {}, DUR);

          // ---- per-frame state: pens, erasure, cursors, edges, rewritten gutters, the lit lane, glow, camera ----
          const lane = $("f12-lane"), push = $("f12-push"), lies = $("f12-lies");
          const fireRGB = [232, 93, 38], hintRGB = [80, 80, 72];
          const mix = (a, b, k) => `rgb(${a.map((v, j) => Math.round(v + (b[j] - v) * k)).join(",")})`;
          const popE = gsap.parseEase("back.out(2.4)");
          // geometry, measured until the fonts are in, then fixed
          let laid = false;
          function layout() {
            const ready = document.fonts.status === "loaded";
            for (const r of rows) {
              r.txtX = r.txt.offsetLeft;
              r.end = Math.max(r.lie.offsetWidth, r.neu.offsetWidth) + 12;
              r.ws = r.words.map((w) => w.offsetLeft + w.offsetWidth);
            }
            rows[2].xs = lies.offsetLeft - 6;
            laid = ready;
          }
          function render() {
            const t = tl.time(), T = T0 + t;
            if (!laid) layout();
            const lit = t >= LIES;
            for (const r of rows) {
              const txtX = r.txtX, end = r.end;
              let x;
              if (r.i === 2) {
                const xs = r.xs;
                x = r.pen.p <= 1 ? r.pen.p * xs : xs + (r.pen.p - 1) * (end - xs);
              } else x = r.pen.p * end;
              const done = r.pen.p >= (r.i === 2 ? 2 : 1);
              // the lie is erased behind the pen, the sung word left in its place
              r.lie.style.clipPath = done ? "inset(0 0 0 100%)" : `inset(-30% -2% -30% ${x.toFixed(1)}px)`;
              for (let j = 0; j < r.words.length; j++) {
                const w = r.words[j], right = r.ws[j] - x;
                w.style.clipPath = right <= 0 ? "none" : `inset(-40% ${right.toFixed(1)}px -40% -30%)`;
              }
              // the cursor rides the pen tip while it writes, then goes
              const on = t >= r.t0 && (r.i === 2 ? t < LIES + 0.2 : t < r.t0 + 0.42);
              r.cur.style.opacity = on ? 1 : 0;
              r.cur.style.transform = `translateX(${x.toFixed(1)}px)`;
              // the edge: from the commit dot along the row, fire while it writes, cooling to a hairline, lit again on "lies"
              const k = lit ? 0 : Math.max(0, Math.min(1, (t - (r.t0 + 0.34)) / 0.4));
              r.edge.style.width = t >= r.t0 ? `${(txtX + x).toFixed(1)}px` : "0px";
              r.edge.style.background = mix(fireRGB, hintRGB, k);
              // the commit is rewritten: a new hash, author me, a filled dot that pops in
              const rw = t >= r.t0;
              r.h.textContent = rw ? NEWH[r.i] : r.oldH;
              r.au.textContent = rw ? "me" : "you";
              r.au.classList.toggle("f12-me", rw);
              const pk = rw ? popE(Math.min(1, (t - r.t0) / 0.3)) : 1;
              r.dot.style.background = rw ? (lit ? "#E85D26" : "#F0ECE5") : "#0A0A0A";
              r.dot.style.borderColor = rw ? (lit ? "#E85D26" : "#F0ECE5") : "#505048";
              r.dot.style.transform = `scale(${pk.toFixed(3)})`;
            }
            lane.style.background = lit ? "#E85D26" : "#505048";
            HR.glow(push, T, 0.22, 0.35); HR.glow(lies, T, 0.14, 0.24);
            stage.apply(T);
          }
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["12-lies"] = tl;
        })();
      </script>
    </template>
  </body>
