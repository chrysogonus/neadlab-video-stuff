         Refinement round 1 (REFINE-1.md): the cut glides up (paired with 05) onto `git blame us.txt` already run, the

         single `you` pops as it passes; on "your name" it pulls out wide (37.06 → 37.335): the whole blame, every author

  <body>
    <template>
      <style>
        @font-face { font-family: "Barlow"; src: url("assets/fonts/barlow-800.woff2") format("woff2"); font-weight: 800; }

        #root {
          position: absolute; inset: 0; overflow: hidden; container-type: size;
          --ink: #0A0A0A; --ink-alt: #1A1A18; --fire: #E85D26; --cream: #F0ECE5;

        #f06-out, #f06-cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
        #f06-strip { position: absolute; left: 5.5cqw; right: 5.5cqw; top: 3.4cqw; display: flex; justify-content: space-between;

          padding-bottom: 0.6cqw; border-bottom: 1px solid var(--border); }
        #f06-strip b { color: var(--fire); font-weight: 600; }
        /* the light: a soft fire glow on the author column, breathing with the bass (moved in render()) */
        #f06-glow { position: absolute; left: 0; top: 0; width: 1800px; height: 1300px; margin: -650px 0 0 -900px; pointer-events: none;
          background: radial-gradient(closest-side, rgba(232, 93, 38, 0.18), rgba(232, 93, 38, 0.1) 50%, rgba(232, 93, 38, 0.05) 80%, rgba(232, 93, 38, 0) 100%); }
        /* the terminal below the strip: what scrolls past its top edge is clipped there */
        #f06-clip { position: absolute; inset: 0; clip-path: inset(5.9cqw 0 0 0); }
        /* the world: the terminal at its wide pose, in px; the camera scales it about its top-left corner */
        #f06-world { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
        #f06-prompt { position: absolute; left: 106px; top: 118px; font: 500 26px/1.2 "IBM Plex Mono", monospace; color: var(--cream-muted); white-space: pre; }
        #f06-prompt b { color: var(--cream); font-weight: 500; }
        /* git blame: hash · (author date time tz lineno) · the line; the verse is the file being blamed */
        #f06-rows { position: absolute; left: 106px; top: 176px; width: 1400px; height: 320px; font: 400 24px/40px "IBM Plex Mono", monospace; }
        #f06-bar { position: absolute; left: -12px; top: 0; width: 1324px; height: 40px; background: var(--cream); }
        .f06-row { position: relative; height: 40px; color: var(--cream-hint); white-space: pre; }
        .f06-row .f06-h { display: inline-block; width: 8ch; }

        .f06-row .f06-src { color: var(--cream-muted); }
        /* the line under the highlight: lit like a selection */

        /* the tally: the joke at poster scale */
        .f06-tally { position: absolute; top: 522px; font: 500 88px/1 "IBM Plex Mono", monospace; color: var(--cream); white-space: pre; transform-origin: 0% 60%; }
        #f06-t1 { left: 106px; }
        #f06-t2 { left: 898px; }
        .f06-tally .f06-f { color: var(--fire); font-weight: 600; }
        .f06-tally .f06-d { color: var(--cream-muted); }
        /* the sung lines, beside the gutter (screen space, outside the camera) */
        .f06-lyric { position: absolute; left: 820px; font-family: "Barlow", sans-serif; color: var(--cream); transform-origin: 0 0; }
        .f06-lyric .f06-ln { font-weight: 800; font-size: 5.6cqw; line-height: 1.04; letter-spacing: -0.035em; white-space: nowrap; }
        .f06-lyric .f06-big { font-weight: 900; font-size: 12.5cqw; line-height: 0.86; letter-spacing: -0.045em; color: var(--fire); white-space: nowrap; margin: 0.4cqw 0 0.9cqw -0.4cqw; }
        .f06-lyric .f06-fire { color: var(--fire); }
        #f06-l7 { top: 300px; }
        #f06-l8 { top: 380px; }
      </style>
      <div id="root" data-composition-id="06-blame" data-width="1920" data-height="1080" data-duration="7.584">
        <div id="f06-out">
          <div id="f06-cam">
            <div id="f06-glow" data-layout-ignore></div>
            <div class="hr-layer" data-depth="0.45">
              <div id="f06-clip">
                <div id="f06-world">
                  <div id="f06-prompt" data-layout-ignore><span>~/us (main) $ </span><b>git blame us.txt</b></div>
                  <div id="f06-rows" data-layout-ignore>
                    <div id="f06-bar"></div>
                    <div class="f06-row"><span class="f06-h">^5d0a8c4</span> (<span class="f06-who hr-glow">you</span> 2023-04-02 21:14:07 +0200  1) <span class="f06-src">three years in and you never could commit</span></div>
                    <div class="f06-row"><span class="f06-h">a7c21f0</span> (<span class="f06-who hr-glow">you</span> 2023-11-19 23:51:40 +0100  2) <span class="f06-src">hid me in your stash, said we'd get to it</span></div>
                    <div class="f06-row"><span class="f06-h">4c9d7a1</span> (<span class="f06-who hr-glow">you</span> 2024-06-08 02:03:12 +0200  3) <span class="f06-src">said it's just a feature, nothing on the side</span></div>
                    <div class="f06-row"><span class="f06-h">0b5f6e2</span> (<span class="f06-who hr-glow">you</span> 2024-06-08 02:09:55 +0200  4) <span class="f06-src">then i found the other branch you tried to hide</span></div>
                    <div class="f06-row"><span class="f06-h">3f2a1c9</span> (<span class="f06-who hr-glow">you</span> 2025-02-14 19:30:00 +0100  5) <span class="f06-src">so i ran the blame on every broken line</span></div>
                    <div class="f06-row"><span class="f06-h">3f2a1c9</span> (<span class="f06-who hr-glow">you</span> 2025-02-14 19:30:00 +0100  6) <span class="f06-src">every single one had your name, not mine</span></div>
                    <div class="f06-row"><span class="f06-h">e19f4b2</span> (<span class="f06-who hr-glow">you</span> 2025-09-30 03:12:44 +0200  7) <span class="f06-src">you said we could merge, work the conflicts through</span></div>
                    <div class="f06-row"><span class="f06-h">e19f4b2</span> (<span class="f06-who hr-glow">you</span> 2025-09-30 03:12:44 +0200  8) <span class="f06-src">but every conflict, baby, started with you</span></div>
                  </div>
                  <div class="f06-tally" id="f06-t1" data-hf-motion-blur='{"fps": 60}'>lines by <span class="f06-f">you</span> <span class="f06-f">8</span></div>
                  <div class="f06-tally" id="f06-t2" data-hf-motion-blur='{"fps": 60}'><span class="f06-d">·</span> lines by me <span class="f06-f">0</span></div>
                </div>
              </div>
            </div>
            <!-- the strip sits above the terminal, so the rows pass under it -->
            <div class="hr-layer" data-depth="0.15">
              <div id="f06-strip"><span>~/us &nbsp;·&nbsp; main</span><span>commits by you <b>1,095</b></span></div>
            </div>
          </div>

          <!-- the sung lines sit outside the glide-in, so "so" (0.06 s in) is never blurred by the cut -->
          <div class="hr-layer" data-depth="0.85">
            <div class="f06-lyric" id="f06-l7">
              <div class="f06-ln"><span class="f06-w">so</span> <span class="f06-w">i</span> <span class="f06-w">ran</span> <span class="f06-w">the</span></div>
              <div class="f06-big"><span class="f06-w hr-glowbox">blame</span></div>
              <div class="f06-ln"><span class="f06-w">on</span> <span class="f06-w">every</span> <span class="f06-w">broken</span> <span class="f06-w">line</span></div>
            </div>
            <div class="f06-lyric" id="f06-l8">
              <div class="f06-ln"><span class="f06-w">every</span> <span class="f06-w">single</span> <span class="f06-w">one</span> <span class="f06-w">had</span></div>
              <div class="f06-ln"><span class="f06-w f06-fire hr-glowbox">your</span> <span class="f06-w f06-fire hr-glowbox">name,</span> <span class="f06-w">not</span> <span class="f06-w">mine</span></div>

          </div>

      <script src="assets/kit/env.js"></script>
      <script src="assets/kit/hr-kit.js"></script>
      <script src="assets/kit/motion-blur.js"></script>
      <script src="assets/kit/wow-kit.js"></script>
      <script>
        (() => {
          const DUR = 7.584, T0 = 31.139;
          const root = document.querySelector('[data-composition-id="06-blame"]');
          const $ = (id) => root.querySelector("#" + id);
          const stage = HR.stage(root, { seed: 6 });
          const tl = gsap.timeline({ paused: true });
          const at = (T) => T - T0;
          const BLAME = at(32.66), L8 = at(35.14), YOUR = at(37.081), NAME = at(37.32), NOT = at(37.84), MINE = at(38.24);
          const KICKS = [31.774, 32.259, 32.702, 33.175, 33.63, 34.116, 34.557, 35.02].map(at); // one per row
          const PULL0 = at(37.06), PULL1 = at(37.335); // the pull-out lands on the downbeat under "name"

          // ---- the cuts: 05 → 06 glides up (the terminal scrolls in; the lyric layer stays out of it, "so" is 0.06 s in);
          // 06 → 07 rises, shortened to 0.22 s so it starts after "mine"'s first 0.25 s (38.24 + 0.25 = 38.49) ----
          const out = $("f06-out"), cam = $("f06-cam");
          WOW.transition(tl, cam, { in: "glideUp", dur: 0.42, total: DUR });
          WOW.transition(tl, out, { out: "rise", dur: 0.22, total: DUR });

          // ---- the camera on the terminal: world px → screen = Q + (world − P) · s, P the author cell of the focused row ----
          const world = $("f06-world"), S = 3.2, PX_ = 106 + 11.5 * 14.4;
          const PY = (f) => 176 + f * 40 + 20, QX = 570, QY = (f) => 380 + f * 44;
          const pose = (f, s = S) => ({ x: QX - PX_ * s, y: QY(f) - PY(f) * s, scale: s });
          let last = pose(0, 2.85);
          const move = (to, t, dur, ease) => { tl.fromTo(world, { ...last }, { ...to, duration: dur, ease, immediateRender: false }, t); last = to; };
          gsap.set(world, last);
          tl.set(world, last, 0);
          move(pose(0), 0, 0.62, "sine.inOut"); // the cut lands tight and keeps pushing in
          // L7: the highlight steps down a row per kick and the camera trucks with it
          for (let i = 1; i < 8; i++) move(pose(i), KICKS[i] - 0.02, i < 7 ? 0.3 : 0.13, "power3.out");
          // L8: back up the column, every single `you` popping as it passes; a lean in on "had"
          const UP0 = L8, UP1 = at(36.75);
          move(pose(0), UP0, UP1 - UP0, "sine.inOut");
          move(pose(0, 3.36), UP1, PULL0 - UP1, "sine.inOut");
          // "your name": the pull-out to the whole blame
          move({ x: 0, y: 0, scale: 1 }, PULL0, PULL1 - PULL0, "power3.inOut");
          move({ x: -0.03 * 960, y: -0.03 * 540, scale: 1.03 }, PULL1, DUR - PULL1, "sine.out");
          // the pull's mask, glow and blur ride one value (0 tight → 1 wide)
          const V = { w: 0 };
          tl.fromTo(V, { w: 0 }, { w: 1, duration: PULL1 - PULL0, ease: "power3.inOut", immediateRender: false }, PULL0);
          // where the camera's focus row is, for the glow (tight phase)
          const F = { f: 0 };
          tl.set(F, { f: 0 }, 0);
          for (let i = 1; i < 8; i++) tl.fromTo(F, { f: i - 1 }, { f: i, duration: i < 7 ? 0.3 : 0.13, ease: "power3.out", immediateRender: false }, KICKS[i] - 0.02);
          tl.fromTo(F, { f: 7 }, { f: 0, duration: UP1 - UP0, ease: "sine.inOut", immediateRender: false }, UP0);
          // the time the up-truck passes row i (sine.inOut inverted)
          const passUp = (i) => UP0 + (Math.acos(1 - (2 * (7 - i)) / 7) / Math.PI) * (UP1 - UP0);

          // ---- the author column: each `you` stamps on its kick; pops on the way back up; all flare on "name" ----
          const rows = root.querySelectorAll(".f06-row"), who = root.querySelectorAll(".f06-who");
          who.forEach((el, i) => {
            tl.fromTo(el, { scale: 1.9 }, { scale: 1, duration: 0.34, ease: "back.out(2.2)", immediateRender: false }, KICKS[i]);
            tl.fromTo(el, { scale: 1.55 }, { scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, passUp(i));
          });
          tl.fromTo(who, { scale: 1.45 }, { scale: 1, duration: 0.5, ease: "elastic.out(1, 0.5)", stagger: 0.012, immediateRender: false }, NAME);

          // ---- the lyric: L7 beside the gutter, then L8 in its place (a 0 ms swap on 35.14); L8 follows the pull-out ----
          const w7 = $("f06-l7").querySelectorAll(".f06-w");
          [31.199, 31.68, 32.02, 32.46].forEach((T, i) => HR.lead(tl, w7[i], at(T)));
          HR.hero(tl, w7[4], BLAME, { spread: 40, over: 1.25, pre: 0.14, sharp: true });
          [33.02, 33.26, 33.703, 34.5].forEach((T, i) => HR.lead(tl, w7[5 + i], at(T)));
          tl.set($("f06-l7"), { opacity: 1 }, 0).set($("f06-l7"), { opacity: 0 }, L8 - 0.03);
          const l8 = $("f06-l8"), w8 = l8.querySelectorAll(".f06-w");
          [35.14, 35.474, 36.437, 36.796, 37.081].forEach((T, i) => HR.lead(tl, w8[i], at(T)));
          w8[4].classList.remove("hr-clip"); // "your" glows: its drop-shadow must not be cut at the baseline
          HR.hero(tl, w8[5], NAME, { spread: 22, over: 1.22, pre: 0.14, sharp: true });
          HR.lead(tl, w8[6], NOT);
          HR.hero(tl, w8[7], MINE, { spread: 18, over: 1.16, pre: 0.12, sharp: true });
          tl.fromTo(l8, { x: 0, y: 0, scale: 1 }, { x: 106 - 820, y: 668 - 380, scale: 1.25, duration: PULL1 - PULL0, ease: "power3.inOut", immediateRender: false }, PULL0);

          // ---- not mine: the tally slams in under the gutter, `you 8` on "not", `me 0` on "mine" (blurred approach, sharp landing) ----
          const t1 = $("f06-t1"), t2 = $("f06-t2");
          gsap.set([t1, t2], { opacity: 0 });
          for (const [el, t] of [[t1, NOT], [t2, MINE]]) {
            tl.set(el, { opacity: 0 }, 0).set(el, { opacity: 1 }, t - 0.04);
            tl.fromTo(el, { scale: 1.7, y: -70 }, { scale: 1, y: 0, duration: 0.12, ease: "power3.in", immediateRender: false }, t - 0.04);
          }

          // ---- punches on the hits that carry words ----
          WOW.punch(tl, out, BLAME, { s: 1.07, dur: 0.45 });
          WOW.punch(tl, out, at(35.479), { s: 1.035, dur: 0.35 }); // the downbeat under "single"
          WOW.punch(tl, out, PULL1, { s: 1.04, dur: 0.4 });
          WOW.punch(tl, out, NOT - 0.04, { s: 1.03, dur: 0.35 });
          WOW.punch(tl, out, MINE - 0.02, { s: 1.05, dur: 0.4 });
          tl.set({}, {}, DUR);

          // ---- per-frame state: highlight, author colours and light, mask, glow, camera ----
          const bar = $("f06-bar"), rowsBox = $("f06-rows"), glow = $("f06-glow");
          const heroes = root.querySelectorAll(".f06-lyric .hr-glowbox");
          const ease3 = (x) => 1 - Math.pow(1 - x, 3);
          const lerp = (a, b, u) => a + (b - a) * u;
          function render() {
            const t = tl.time(), T = T0 + t, bass = HR.band("bass", T);
            // the highlight: on row 0 at the cut, a row per kick through L7; off for the run back up; on line 6 from "name"
            let on = 0, from = 0, p = 1;
            if (t < L8) {
              let k = 0; for (let i = 1; i < 8; i++) if (KICKS[i] <= t) k = i;
              on = k; from = Math.max(0, k - 1); p = k === 0 ? 1 : ease3(Math.min(1, (t - KICKS[k]) / 0.14));
            } else on = from = 5;
            const barOn = t < L8 || t >= NAME;
            bar.style.opacity = barOn ? 1 : 0;
            bar.style.transform = `translateY(${(lerp(from, on, p) * 40).toFixed(2)}px)`;
            rows.forEach((r, i) => r.classList.toggle("f06-on", barOn && i === on));
            who.forEach((el, i) => {
              const ts = KICKS[i], lit = t >= ts, sel = barOn && i === on;
              el.style.color = sel ? (lit ? "#B8461C" : "#5F5B54") : lit ? "#E85D26" : "";
              el.style.fontWeight = lit ? "600" : "";
              let g = 0;
              if (lit && !sel) {
                g = 0.22 + 0.25 * bass + 0.9 * Math.exp(-(t - ts) / 0.3);
                const tp = passUp(i); if (t >= tp) g += 0.7 * Math.exp(-(t - tp) / 0.25);
                if (t >= NAME) g += 0.25 + 1.1 * Math.exp(-(t - NAME) / 0.35);
              }
              el.style.setProperty("--hr-glow", g.toFixed(3));
            });
            // tight: the date fades out right after the author (world px); wide: no mask
            const a = 190 + V.w * 3000, b = 224 + V.w * 3000; // rows-box px (the box starts at world x 106)
            rowsBox.style.maskImage = rowsBox.style.webkitMaskImage = `linear-gradient(90deg, #000 ${a.toFixed(1)}px, transparent ${b.toFixed(1)}px)`;
            // the pull-out's speed blur on the terminal (the lyric is not in it)
            const u = t > PULL0 && t < PULL1 ? (t - PULL0) / (PULL1 - PULL0) : 0;
            world.style.filter = u > 0 ? `blur(${(6 * Math.sin(Math.PI * u)).toFixed(2)}px)` : "";
            // the light follows the author column, then sits behind the whole blame
            const gx = lerp(QX, 860, V.w), gy = lerp(QY(F.f), 430, V.w);
            glow.style.transform = `translate(${gx.toFixed(1)}px, ${gy.toFixed(1)}px)`;
            glow.style.opacity = Math.min(1, 0.72 + 0.4 * bass + 0.25 * HR.hit("kick", T, 0.18)).toFixed(3);
            heroes.forEach((el) => HR.glow(el, T, 0.3, 0.45));
            stage.apply(T);
            WOW.draw(tl, T0);
          }
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["06-blame"] = tl;
        })();
      </script>
    </template>
