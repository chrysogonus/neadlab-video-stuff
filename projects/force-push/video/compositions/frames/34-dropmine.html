        (() => {
          const DUR = 7.38, T0 = 177.15;
          const root = document.querySelector('[data-composition-id="34-dropmine"]');

          const at = (T) => T - T0;
          // the drop: punches scale with this span's mean drum envelope over 10's (0.409), capped
          let sum = 0, n = 0;
          for (let T = T0; T < T0 + DUR; T += 0.02) { sum += HR.band("drums", T); n++; }
          const K = Math.max(1, Math.min(1.35, sum / n / 0.409));
          const pk = (T) => (0.022 + 0.04 * HR.band("drums", T0 + T + 0.03)) * K; // a camera punch sized by the drums at local T
          const stage = HR.stage(root, { seed: 34, pulse: K });
          const tl = gsap.timeline({ paused: true });

          const LOCAL = at(177.76), CARE = at(179.7), CUT = at(180.16), MINE = at(181.78), THERE = at(183.38);
          const C_ENT = at(178.141), C_OUT = [at(178.141), at(178.608), at(179.063), at(179.512)];
          const ENTER = at(180.897), E2 = at(181.362), PROMPT = at(182.264);

          // ---- the hard cut on "Origin's": set A leaves, set B is there (one frame early, so the slam lands on 180.16) ----
          const A = [$("f34-a1"), $("f34-a2"), $("f34-a3"), $("f34-a4"), $("f34-clone")];
          const B = [$("f34-term"), $("f34-origin"), $("f34-b2")];
          tl.set(B, { opacity: 0 }, 0).set(B, { opacity: 1 }, CUT - 0.034);
          tl.set(A, { opacity: 1 }, 0).set(A, { opacity: 0 }, CUT - 0.034);

          // ---- A: the lyric, every word on its own start ----
          const w = root.querySelectorAll(".f34-w");
          HR.lead(tl, w[0], at(177.18)); HR.lead(tl, w[1], at(177.46));
          HR.hero(tl, w[2], LOCAL, { spread: 34 * K, over: 1 + 0.22 * K, pre: 0.14, sharp: true });
          HR.lead(tl, w[3], at(178.1));
          HR.lead(tl, w[4], at(178.839)); HR.lead(tl, w[5], at(179.26));
          HR.hero(tl, w[6], CARE, { spread: 40 * K, over: 1 + 0.26 * K, pre: 0.16, sharp: true });
          // the accent is a pointer: it leaves "local" for "care"
          tl.fromTo($("f34-local"), { color: "#E85D26" }, { color: "#F0ECE5", duration: 0.22, ease: "power2.out", immediateRender: false }, CARE);

          // ---- A: the ex's clone opens on "local", git answers on the kicks, and on "care" it folds into its corner ----
          const clone = $("f34-clone");
          tl.set(clone, { visibility: "hidden" }, 0).set(clone, { visibility: "visible" }, LOCAL - 0.02);
          tl.fromTo(clone, { scale: 0.88, y: 18 }, { scale: 1, y: 0, duration: 0.32, ease: "expo.out", immediateRender: false }, LOCAL - 0.02);
          ["f34-co1", "f34-co2", "f34-co3", "f34-co4"].forEach((id, i) => tl.set($(id), { opacity: 0 }, 0).set($(id), { opacity: 1 }, C_OUT[i]));
          tl.fromTo(clone, { scale: 1, opacity: 1 }, { scale: 0.04, opacity: 0.4, duration: 0.26, ease: "power3.in", immediateRender: false }, CARE);
          tl.set(clone, { visibility: "hidden" }, CARE + 0.26);
          const ckeys = [[0, ""]], CC = "git status";
          for (let i = 0; i < CC.length; i++) ckeys.push([LOCAL + 0.05 + (0.3 * i) / CC.length, CC.slice(0, i + 1)]);

          // ---- B: the terminal. `git stash pop` types through the held "Origin's"; Enter on the downbeat; output on the kicks ----
          const keys = [[0, ""]], CMD = "git stash pop", TA = CUT + 0.16, TB = ENTER - 0.1;
          for (let i = 0; i < CMD.length; i++) keys.push([TA + ((TB - TA) * i) / CMD.length, CMD.slice(0, i + 1)]);
          const show = (sel, t) => { const els = root.querySelectorAll(sel); tl.set(els, { opacity: 0 }, 0).set(els, { opacity: 1 }, t); };
          show(".f34-o1", ENTER); show(".f34-o2", E2); show(".f34-o3", MINE); show(".f34-o4", PROMPT);
          // the pop, on "mine": the stash row is struck, and its `me` comes out of it, down into the working tree

          tl.fromTo($("f34-row").querySelector(".f34-ref"), { color: "#F0ECE5" }, { color: "#888880", duration: 0.2, immediateRender: false }, MINE + 0.1);
          const PX = 1920 / 100 * 1.05, CH = 0.6 * PX, LH = 1.42 * PX; // the terminal's cell, in px at 1920
          tl.fromTo($("f34-newme"), { x: 10 * CH, y: -7 * LH, scale: 1.6 }, { x: 0, y: 0, scale: 1, duration: 0.34, ease: "expo.out", immediateRender: false }, MINE);

          tl.set($("f34-mine"), { opacity: 0 }, 0).set($("f34-mine"), { opacity: 1 }, MINE - 0.165);
          WOW.explode(tl, $("f34-mine"), MINE, { fx: false, from: "bottom", pre: 0.16, seed: 34 });
          WOW.shake(tl, $("f34-shk"), MINE, { amp: 9 * K * HR.band("drums", 181.8) + 4, dur: 0.42, seed: 34 });
          const tw = root.querySelectorAll(".f34-t");
          HR.lead(tl, tw[0], at(182.2)); HR.lead(tl, tw[1], at(182.5)); HR.lead(tl, tw[2], at(182.94));
          HR.hero(tl, tw[3], THERE, { spread: 14 * K, over: 1.14, pre: 0.1, sharp: true });

          // ---- the camera: punches on the heroes sized by the drums; a carrier move through every phrase ----
          const cam = stage.cam;
          tl.fromTo(cam, { z: 1.0, x: 0, y: 0 }, { z: 1.012, x: 8, duration: LOCAL - 0.06, ease: "none" }, 0);
          tl.to(cam, { z: 1.012 + pk(LOCAL), y: -7, duration: 0.06, ease: "power2.in" }, LOCAL - 0.06);
          tl.to(cam, { z: 1.016, y: 0, duration: 0.5, ease: "elastic.out(1, 0.5)" }, LOCAL + 0.01);
          tl.to(cam, { z: 1.03, x: 20, duration: CARE - 0.06 - (LOCAL + 0.51), ease: "none" }, LOCAL + 0.51);
          tl.to(cam, { z: 1.03 + pk(CARE) * 1.2, y: -10, duration: 0.06, ease: "power2.in" }, CARE - 0.06);
          tl.to(cam, { z: 1.036, y: 0, duration: 0.42, ease: "elastic.out(1, 0.5)" }, CARE + 0.01);
          // B: a new shot, punched in on the cut; it settles and pushes slowly through the held "Origin's"
          tl.set(cam, { z: 1.0 + pk(CUT) * 1.3, x: 0, y: -8 }, CUT - 0.034);
          tl.to(cam, { z: 1.0, y: 0, duration: 0.55, ease: "elastic.out(1, 0.5)" }, CUT);
          tl.to(cam, { z: 1.022, x: 10, duration: ENTER - 0.05 - (CUT + 0.55), ease: "none" }, CUT + 0.55);
          tl.to(cam, { z: 1.022 + pk(ENTER) * 0.6, duration: 0.05, ease: "power2.in" }, ENTER - 0.05);
          tl.to(cam, { z: 1.03, x: 16, duration: MINE - 0.07 - ENTER, ease: "power1.out" }, ENTER);
          // "mine": the biggest punch of the frame
          tl.to(cam, { z: 1.03 + pk(MINE) * 1.6, y: -14, duration: 0.07, ease: "power2.in" }, MINE - 0.07);
          tl.to(cam, { z: 1.02, y: 0, duration: 0.65, ease: "elastic.out(1, 0.45)" }, MINE);
          tl.to(cam, { z: 1.034, x: 4, duration: THERE - 0.06 - (MINE + 0.65), ease: "none" }, MINE + 0.65);
          tl.to(cam, { z: 1.034 + pk(THERE) * 0.7, y: -6, duration: 0.06, ease: "power2.in" }, THERE - 0.06);
          tl.to(cam, { z: 1.04, y: 0, duration: 0.5, ease: "elastic.out(1, 0.5)" }, THERE);

          const ccmd = $("f34-ccmd"), ccur1 = $("f34-ccur1"), ccur2 = $("f34-ccur2");
          const local = $("f34-local"), care = $("f34-care"), mine = $("f34-mine");
          const blink = (t, since) => t - since < 0.35 || Math.floor((t - since) * 2) % 2 === 0;
          const typed = (ks, t) => { let k = ks[0]; for (const s of ks) if (s[0] <= t) k = s; return k; };
          function render() {
            const t = tl.time(), T = T0 + t;
            const ck = typed(ckeys, t); ccmd.textContent = ck[1];
            ccur1.style.opacity = t < C_ENT && blink(t, Math.max(ck[0], LOCAL)) ? 1 : 0;
            ccur2.style.opacity = t >= C_OUT[3] && blink(t, C_OUT[3]) ? 1 : 0;

            HR.glow(care, T, 0.3, 0.5 * K); HR.glow(mine, T, 0.35, 0.55 * K);
            WOW.draw(tl, T0);
            stage.apply(T);
          }

          render();
