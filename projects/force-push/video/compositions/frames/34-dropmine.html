          tl.fromTo(c, { rot: 2.4 }, { rot: 0, duration: 0.45, ease: "expo.out" }, 0);
          tl.to(c, { z: 1.02 + pk(LOCAL) * 1.3, y: -8, duration: 0.06, ease: "power2.in" }, LOCAL - 0.06);
          tl.to(c, { z: 1.03, y: 0, duration: 0.5, ease: "elastic.out(1, 0.5)" }, LOCAL + 0.01);
          tl.to(c, { z: 1.07, x: 22, duration: CARE - 0.06 - (LOCAL + 0.51), ease: "none" }, LOCAL + 0.51);
          tl.to(c, { z: 1.07 + pk(CARE) * 1.4, y: -10, duration: 0.06, ease: "power2.in" }, CARE - 0.06);
          tl.to(c, { z: 1.08, y: 0, x: 26, duration: 0.42, ease: "elastic.out(1, 0.5)" }, CARE + 0.01);
          // B: a new shot, punched in on the cut; it settles and pushes through the held "origin's"
          tl.set(c, { z: 1.0 + pk(CUT) * 1.4, x: 0, y: -8 }, CUT - 0.034);
          tl.to(c, { z: 1.0, y: 0, duration: 0.5, ease: "elastic.out(1, 0.5)" }, CUT);
          tl.to(c, { z: 1.04, x: 14, duration: ENTER - 0.05 - (CUT + 0.5), ease: "none" }, CUT + 0.5);
          tl.to(c, { z: 1.04 + pk(ENTER) * 0.7, duration: 0.05, ease: "power2.in" }, ENTER - 0.05);
          tl.to(c, { z: 1.05, x: 18, duration: MINE - 0.07 - ENTER, ease: "power1.out" }, ENTER);
          // "mine": the biggest punch of the frame, then a long push through the hold
          tl.to(c, { z: 1.05 + pk(MINE) * 1.8, y: -14, duration: 0.07, ease: "power2.in" }, MINE - 0.07);
          tl.to(c, { z: 1.02, y: 0, x: 0, duration: 0.6, ease: "elastic.out(1, 0.45)" }, MINE);
          tl.to(c, { z: 1.06, x: -8, duration: THERE - 0.06 - (MINE + 0.6), ease: "none" }, MINE + 0.6);
          tl.to(c, { z: 1.06 + pk(THERE) * 0.8, y: -6, duration: 0.06, ease: "power2.in" }, THERE - 0.06);
          tl.to(c, { z: 1.07, y: 0, duration: 0.45, ease: "elastic.out(1, 0.5)" }, THERE);
          tl.to(c, { z: 1.1, x: -16, duration: DUR - (THERE + 0.45), ease: "none" }, THERE + 0.45);
          WOW.punch(tl, cam, PROMPT, { s: 1.02, dur: 0.3 });
          tl.set({}, {}, DUR);

          // ---- layout, measured once the fonts are in: the flight's start (the row's `me`) and the split ----
          const fly = $("f34-fly"), mine = $("f34-mine"), gm = $("f34-gm"), ge = $("f34-ge"), oldme = $("f34-oldme");
          const pos = (el) => { let x = 0, y = 0; for (let e = el; e && e !== root; e = e.offsetParent) { x += e.offsetLeft; y += e.offsetTop; } return [x, y]; };
          let M = null;
          function measure() {
            const inW = gin.offsetWidth, W = mine.offsetWidth, H = mine.offsetHeight;
            const [mx, my] = pos(mine), [ox, oy] = pos(oldme);
            const cx = mx + W / 2, cy = my + H / 2;
            M = { half: inW / 2, dx: ox + oldme.offsetWidth / 2 - cx, dy: oy + oldme.offsetHeight / 2 - cy,
              s0: oldme.offsetWidth / Math.max(1, W - inW), cx, cy };
            fx.style.left = cx + "px"; fx.style.top = cy + "px";
          }
          const fontsIn = () => document.fonts.check('900 100px "Barlow"') && document.fonts.check('500 20px "IBM Plex Mono"');
          if (fontsIn()) measure();
          Promise.all([document.fonts.load('900 100px "Barlow"'), document.fonts.load('500 20px "IBM Plex Mono"')]).then(() => { measure(); render(); });

          // ---- per-frame state: typing, the terminal window, cursors, the flight, glow, shake, the camera ----
          const cmd = $("f34-cmd"), cur1 = $("f34-cur1"), cur2 = $("f34-cur2"), rcur = $("f34-rcur");
          const local = $("f34-local"), care = $("f34-care");
          const blink = (t, since) => t - since < 0.35 || Math.floor((t - since) * 2) % 2 === 0;
          function render() {
            const t = tl.time(), T = T0 + t;
            // A: the remote list's prompt
            rcur.style.opacity = t >= at(177.237) && blink(t, at(177.237)) ? 1 : 0;
            // B: typing and the terminal window (the last four printed lines)
            let k = keys[0]; for (const s of keys) if (s[0] <= t) k = s;
            cmd.textContent = k[1];
            cur1.style.opacity = t < ENTER && blink(t, Math.max(k[0], CUT)) ? 1 : 0;
            cur2.style.opacity = t >= PROMPT && blink(t, PROMPT) ? 1 : 0;
            let shown = 0; LT.forEach((x, i) => { if (t >= x) shown = i + 1; });
            lines.forEach((el, i) => { el.style.display = i < shown && i >= shown - NWIN ? "" : "none"; });
            // B: the flight of `me` and the split into "mine"
            if (M) {
              const p = F.p, vis = t >= LIFT;
              fly.style.opacity = vis ? 1 : 0;
              const s = M.s0 + (1 - M.s0) * p, arc = Math.sin(Math.PI * p) * 3 * PX;
              fly.style.transform = `translate(${(M.dx * (1 - p)).toFixed(2)}px, ${(M.dy * (1 - p) - arc).toFixed(2)}px) rotate(${(-7 * Math.sin(Math.PI * p)).toFixed(2)}deg) scale(${s.toFixed(4)})`;
              fly.style.filter = vis && p > 0.02 && p < 0.98 ? `blur(${(7 * Math.sin(Math.PI * p) * p).toFixed(1)}px)` : "";
              const off = M.half * (1 - S.p);
              gm.style.translate = `${off.toFixed(2)}px 0px`; ge.style.translate = `${(-off).toFixed(2)}px 0px`;
            }
            // the light
            if (t < CARE) HR.glow(local, T, 0.3, 0.45 * K); else local.style.setProperty("--hr-glow", Math.max(0, 0.6 - (t - CARE) * 3).toFixed(3));
            HR.glow(care, T, 0.3, 0.5 * K); HR.glow(mine, T, 0.4, 0.6 * K); HR.glow(oldme, T, 0.35, 0.6);
            glow.style.opacity = Math.min(1, 0.7 + 0.9 * HR.band("bass", T) + 0.25 * HR.hit("kick", T, 0.22)).toFixed(3);
            stage.apply(T);
            WOW.draw(tl, T0);
          }
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["34-dropmine"] = tl;
        })();
      </script>
    </template>
  </body>
