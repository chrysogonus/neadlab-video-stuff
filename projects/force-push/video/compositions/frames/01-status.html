          const gwrap = $("f01-gwrap"), big = $("f01-big");
          tl.set([gwrap, big], { opacity: 0 }, 0).set([gwrap, big], { opacity: 1 }, PAD);
          const ME0 = 9.96, ME1 = 13.69, YOU0 = 10.42, YOU1 = 13.215; // you merges back on the downbeat; HEAD on the 13.69 kick
          tl.fromTo($("f01-lane-me"), { strokeDasharray: "100 100", strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: ME1 - ME0, ease: "none" }, ME0);
          tl.fromTo($("f01-lane-you"), { strokeDasharray: "100 100", strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: YOU1 - YOU0, ease: "none" }, YOU0);
          // commits: [x, lane y, who, label, label below?, anchor]; each pops when its lane's pen reaches it
          const dots = $("f01-dots"), NS = "http://www.w3.org/2000/svg";
          const commits = [
            [10, 120, "me", "initial commit"], [330, 330, "you", "nothing on the side", 1], [470, 120, "me", "moved in"],
            [720, 330, "you", "just a feature", 1], [980, 330, "you", "we'll get to it", 1], [1150, 330, "you", "", 1],
            [1300, 330, "you", "you and me", 1], [1500, 120, "me", "merge branch 'you'", 0, "end"], [1690, 120, "me", "HEAD -> main", 0, "end"],
          ];
          const whenMe = (x) => ME0 + ((ME1 - ME0) * (x - 10)) / 1680;
          const whenYou = (x) => YOU0 + ((YOU1 - YOU0) * (x - 150)) / (1500 - 150); // ponytail: linear along x; the bends are short
          for (const [x, y, who, label, below, anchor] of commits) {
            const t = who === "you" ? whenYou(x) : x === 1500 ? YOU1 : whenMe(x);
            const g = document.createElementNS(NS, "g");
            const c = document.createElementNS(NS, "circle");
            c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", who === "you" ? 12 : 13);
            c.setAttribute("fill", who === "you" ? "#0A0A0A" : "#F0ECE5");
            if (who === "you") { c.setAttribute("stroke", "#E85D26"); c.setAttribute("stroke-width", "5"); }
            g.appendChild(c);
            if (label) {
              const tx = document.createElementNS(NS, "text");
              tx.setAttribute("x", anchor === "end" ? (x === 1500 ? x - 20 : x + 10) : x - 10); tx.setAttribute("y", below ? y + 58 : y - 36);
              if (anchor) tx.setAttribute("text-anchor", anchor);
              tx.setAttribute("fill", who === "you" ? "#F0ECE5" : "#888880"); tx.setAttribute("font-size", "28");
              tx.textContent = label; g.appendChild(tx);
            }
            dots.appendChild(g);
            tl.fromTo(g, { opacity: 0, scale: 0.2, svgOrigin: `${x} ${y}` }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(2.2)" }, t);
          }
          // the pad's camera: in close on the pen, tracking it right through three years; the merge pulls out to all of it
          tl.fromTo(gwrap, { scale: 1.3, x: 0 }, { scale: 1.36, duration: YOU1 - PAD, ease: "none" }, PAD);
          tl.fromTo(gwrap, { x: 0 }, { x: -480, duration: 13.1 - 10.9, ease: "sine.inOut", immediateRender: false }, 10.9);
          tl.to(gwrap, { scale: 1, x: 0, duration: 0.55, ease: "expo.out" }, YOU1);
          WOW.punch(tl, $("f01-bign"), YOU1, { s: 1.16, dur: 0.5 });

          // ---- the lockup: force push / NEAD slams in over the graph on the 13.69 kick, NEAD spells out on the next ----
          const LOCK = 13.69, lock = $("f01-lock");
          tl.set(lock, { opacity: 0 }, 0);
          tl.set(lock, { opacity: 1 }, LOCK - 0.2);
          tl.fromTo($("f01-lockt"), { opacity: 0, scale: 2.6 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power4.in", immediateRender: false }, LOCK - 0.2);
          tl.fromTo(gwrap, { opacity: 1 }, { opacity: 0.3, duration: 0.25, ease: "power2.out", immediateRender: false }, LOCK);
          tl.fromTo($("f01-p2"), { opacity: 1 }, { opacity: 0.35, duration: 0.25, ease: "power2.out", immediateRender: false }, LOCK);
          const ln = root.querySelectorAll(".f01-ln");
          tl.set(ln, { opacity: 0 }, 0);
          ln.forEach((el, i) => tl.set(el, { opacity: 1 }, 14.14 + i * 0.058));

          // ---- the camera: the poster breathes; a push on the prompt; the scroll; a drift to the reply; the pad holds ----
          tl.fromTo(stage.cam, { z: 1.0 }, { z: 1.025, duration: 1.2, ease: "sine.inOut" }, 0);
          tl.to(stage.cam, { z: 1.0, duration: 0.5, ease: "power2.out" }, 1.2);
          tl.fromTo(stage.cam, { z: 1.0, x: 0, y: 0 }, { z: 1.1, x: -60, y: -40, duration: SCROLL - 1.7, ease: "sine.inOut", immediateRender: false }, 1.7);
          tl.to(stage.cam, { z: 1.0, x: 0, y: 0, duration: 0.36, ease: "power3.inOut" }, SCROLL);
          tl.to(stage.cam, { z: 1.03, duration: 7.2 - 4.84, ease: "sine.inOut" }, 4.84);
          tl.to(stage.cam, { z: 1.06, x: 0, y: 200, duration: CLEAR - 7.2, ease: "sine.inOut" }, 7.2);
          tl.to(stage.cam, { z: 1.0, x: 0, y: 0, duration: PAD - CLEAR, ease: "power3.inOut" }, CLEAR);
          tl.to(stage.cam, { x: 30, duration: DUR - PAD, ease: "none" }, PAD);
          // punches on the hits (downbeats the old cut left unseen) and the heroes
          for (const [t, s] of [[2.065, 1.025], [COMMIT, 1.06], [CLEAN, 1.03], [7.65, 1.025], [11.36, 1.03], [YOU1, 1.045], [LOCK, 1.07], [14.59, 1.04]]) WOW.punch(tl, cam, t, { s, dur: 0.42 });
          // the cut into 02: push through the lockup
          WOW.transition(tl, cam, { in: "cut", out: "zoom", dur: 0.35, total: DUR });
          tl.set({}, {}, DUR);

          // ---- per-frame state: typing, cursors, counters, pen tips, light, the camera ----
          const cmd1 = $("f01-cmd1"), cmd2 = $("f01-cmd2"), cur1 = $("f01-cur1"), cur2 = $("f01-cur2"), n = $("f01-n"), bign = $("f01-bign");
          const laneMe = $("f01-lane-me"), laneYou = $("f01-lane-you"), tipMe = $("f01-tip-me"), tipYou = $("f01-tip-you");
          const lenMe = laneMe.getTotalLength(), lenYou = laneYou.getTotalLength();
          const blink = (t, since) => t - since < 0.35 || Math.floor((t - since) * 2) % 2 === 0;
          const clamp01 = (x) => Math.max(0, Math.min(1, x));
          const tip = (el, path, len, p) => {
            if (p <= 0 || p >= 1) { el.setAttribute("opacity", 0); return; }
            const q = path.getPointAtLength(len * p);
            el.setAttribute("cx", q.x.toFixed(1)); el.setAttribute("cy", q.y.toFixed(1)); el.setAttribute("opacity", 1);
          };
          function render() {
            const t = tl.time(), T = T0 + t;
            const [k1, s1] = f01text(keys1, t), [k2, s2] = f01text(keys2, t);
            cmd1.textContent = s1; cmd2.textContent = s2;
            cur1.style.opacity = t < ENTER1 && blink(t, k1) ? 1 : 0;
            cur2.style.opacity = t >= 9.3 && blink(t, Math.max(k2, 9.3)) ? 1 : 0;
            const p = clamp01((t - YOU0) / (YOU1 - YOU0));
            const count = Math.round(1095 * p).toLocaleString("en-US");
            n.textContent = count; bign.textContent = count;
            tip(tipMe, laneMe, lenMe, (t - ME0) / (ME1 - ME0));
            tip(tipYou, laneYou, lenYou, (t - YOU0) / (YOU1 - YOU0));
            // the screen glow and the accent glow breathe with the mix (the bass is silent in the intro) and the kicks
            const rms = (HR.band("rms", T - 0.12) + HR.band("rms", T) + HR.band("rms", T + 0.12)) / 3;
            screen.style.opacity = (light.screen * (0.06 + 0.035 * rms)).toFixed(4);
            glow.style.opacity = (light.glow * Math.min(0.15, 0.075 + 0.1 * rms + 0.04 * HR.hit("kick", T, 0.22))).toFixed(4);
            HR.draw(tl);
            HR.glow(root.querySelector(".f01-hero"), T);
            stage.apply(T);
            WOW.draw(tl, T0);
          }
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["01-status"] = tl;
        })();
      </script>
    </template>
  </body>
