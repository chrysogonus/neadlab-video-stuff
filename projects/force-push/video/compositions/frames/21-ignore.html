        (() => {

          const root = document.querySelector('[data-composition-id="21-ignore"]');
          const $ = (id) => root.querySelector("#" + id);
          const stage = HR.stage(root, { seed: 21 });
          const tl = gsap.timeline({ paused: true });
          const at = (T) => T - T0;
          const CUT = at(105.46); // L32 starts: hard cut to the wide view

          // ---- the two views ----
          tl.set($("f21-a"), { autoAlpha: 0 }, CUT);
          tl.set($("f21-b"), { autoAlpha: 1 }, CUT);

          // ---- L31: lines open at the top of the file; the old file is shoved down one line at a time ----
          // [insert time, row top (cqw), row height (cqw)]
          // line 1 (empty, the cursor waiting) and line 2 open together on "wrote"; `you` lands on line 1 on "name"
          const ins = [[at(103.525), 9.2, 8.6], [at(103.525), 17.8, 6.82], [at(103.98), 24.62, 6.82], [at(104.62), 31.44, 13.4]];
          const rows = [$("f21-r4"), $("f21-r1"), $("f21-r2"), $("f21-r3")];
          let oldTop = 9.2;
          ins.forEach(([t], i) => tl.set(rows[i], { opacity: 1 }, t));
          // the old file is shoved down once per insert time (lines 1 and 2 open together)
          [[ins[0][0], 24.62], [ins[2][0], 31.44], [ins[3][0], 44.84]].forEach(([t, next]) => {
            tl.fromTo($("f21-old"), { y: (oldTop - 9.2) * PX }, { y: (next - 9.2) * PX, duration: 0.26, ease: "expo.out", immediateRender: false }, t - 0.02);
            oldTop = next;
          });
          // the active-line band follows the cursor: old line 1 → line 1 (waiting for the name) → line 3 → line 4
          [[ins[0][0], 0, 8.6, 3.2], [ins[2][0], 2, 6.82, 8.6], [ins[3][0], 3, 13.4, 6.82]].forEach(([t, k, h, h0], j, arr) => {
            const y0 = j ? ins[arr[j - 1][1]][1] - 9.2 : 0;
            tl.fromTo($("f21-band"), { y: y0 * PX, height: h0 * PX }, { y: (ins[k][1] - 9.2) * PX, height: h * PX, duration: 0.2, ease: "expo.out", immediateRender: false }, t - 0.02);
          });
          tl.set($("f21-dotA"), { opacity: 1 }, ins[0][0]);
          tl.set($("f21-dotA"), { opacity: 0 }, at(105.331)); // saved on the kick
          // the sung words
          const w = root.querySelectorAll(".f21-w");

          HR.lead(tl, w[2], at(103.72));

          [103.98, 104.06, 104.16, 104.32, 104.4].forEach((T, i) => HR.lead(tl, w[3 + i], at(T)));
          HR.hero(tl, w[8], at(104.62), { spread: 30, over: 1.22, pre: 0.14, sharp: true });
          
          // ---- L32: files from you land in you/ and grey out as they land; git status sees nothing ----

          HR.lead(tl, v[3], at(106.28)); HR.lead(tl, v[4], at(106.34)); HR.lead(tl, v[5], at(106.438)); HR.lead(tl, v[6], at(106.64));
          HR.hero(tl, v[7], at(106.717), { spread: 26, over: 1.22, pre: 0.14, sharp: true });
          const land = [105.588, 105.919, 106.017, 106.28, 106.438, 106.64]; // the downbeat kick, then the words and the snare

          const CMD = "git status you/", TA = at(105.62), TB = at(106.3), ENTER = at(106.69);
          const keys = [[0, ""]];
          for (let i = 0; i < CMD.length; i++) keys.push([TA + ((TB - TA) * i) / CMD.length, CMD.slice(0, i + 1)]);
          tl.set([$("f21-o1"), $("f21-o2")], { opacity: 1 }, at(106.717));
          tl.set($("f21-p2"), { opacity: 1 }, at(106.86));

          tl.fromTo(cam, { z: 1.0, x: 0 }, { z: 1.012, x: -8, duration: N - 0.06, ease: "none" }, 0);
          tl.fromTo(cam, { z: 1.012 }, { z: 1.045, duration: 0.06, ease: "power2.in", immediateRender: false }, N - 0.06);
          tl.fromTo(cam, { z: 1.045 }, { z: 1.02, duration: 0.45, ease: "elastic.out(1, 0.55)", immediateRender: false }, N);
          tl.fromTo(cam, { z: 1.02, x: -8 }, { z: 1.03, x: -16, duration: G - N - 0.51, ease: "none", immediateRender: false }, N + 0.45);
          tl.fromTo(cam, { z: 1.03 }, { z: 1.065, duration: 0.06, ease: "power2.in", immediateRender: false }, G - 0.06);
          tl.fromTo(cam, { z: 1.065 }, { z: 1.035, duration: 0.55, ease: "elastic.out(1, 0.5)", immediateRender: false }, G);
          tl.fromTo(cam, { z: 1.035, x: -16 }, { z: 1.045, x: -26, duration: CUT - G - 0.55, ease: "none", immediateRender: false }, G + 0.55);
          tl.fromTo(cam, { z: 1.0, x: 0 }, { z: 1.02, x: 22, duration: A - 0.06 - CUT, ease: "none", immediateRender: false }, CUT);
          tl.fromTo(cam, { z: 1.02 }, { z: 1.055, duration: 0.06, ease: "power2.in", immediateRender: false }, A - 0.06);
          tl.fromTo(cam, { z: 1.055, x: 22 }, { z: 1.03, x: 30, duration: DUR - A, ease: "elastic.out(1, 0.5)", immediateRender: false }, A);
          tl.set({}, {}, DUR);

          const olds = root.querySelectorAll(".f21-on0"), cmd = $("f21-cmd");
          const cur0 = $("f21-cur0"), cur4 = $("f21-cur4"), cur5 = $("f21-cur5"), cur6 = $("f21-cur6");
          const heroes = [$("f21-youtxt"), $("f21-gi"), $("f21-any")];
