            tl.fromTo(row, { color: "#E85D26" }, { color: "#888880", duration: 0.32, ease: "power1.in", immediateRender: false }, LAND[i] + 0.1);
          });
          // on "anymore" the folder itself greys and its selection goes out
          tl.fromTo($("f21-youdir"), { color: "#E85D26" }, { color: "#888880", duration: 0.4, ease: "power1.in", immediateRender: false }, ANY + 0.05);
          const CMD = "git status you/", TA = at(105.62), TB = at(106.3), ENTER = at(106.69);
          const keys = [[0, ""]];
          for (let i = 0; i < CMD.length; i++) keys.push([TA + ((TB - TA) * i) / CMD.length, CMD.slice(0, i + 1)]);
          tl.set([$("f21-o1"), $("f21-o2")], { opacity: 0 }, 0).set([$("f21-o1"), $("f21-o2")], { opacity: 1 }, ANY);
          tl.set($("f21-p2"), { opacity: 0 }, 0).set($("f21-p2"), { opacity: 1 }, at(106.86));
          tl.fromTo($("f21-o2"), { scale: 1.12, transformOrigin: "0% 50%" }, { scale: 1, transformOrigin: "0% 50%", duration: 0.32, ease: "expo.out", immediateRender: false }, ANY);

          // ---- hits on the camera wrapper, sized by the music ----
          WOW.punch(tl, cam, NAME, { s: 1.06, dur: 0.42 });
          WOW.shake(tl, cam, NAME, { amp: 8 + 8 * WOW.energy(T0 + NAME), dur: 0.32, rot: 0.3, seed: 21 });
          WOW.shake(tl, cam, GIT, { amp: 5, dur: 0.28, rot: 0.2, seed: 22 });
          WOW.punch(tl, cam, SAVE, { s: 1.018, dur: 0.26 });
          WOW.punch(tl, cam, KICK, { s: 1.035, dur: 0.36 });
          WOW.shake(tl, cam, KICK, { amp: 7 + 8 * WOW.energy(T0 + KICK), dur: 0.3, rot: 0.25, seed: 23 });
          LAND.forEach((t, i) => WOW.punch(tl, cam, t, { s: 1.008 + 0.004 * i, dur: 0.22 }));
          WOW.punch(tl, cam, ANY, { s: 1.05, dur: 0.42 });
          tl.set({}, {}, DUR);

          // ---- the camera, a pure function of time: aim (world px) + zoom, and the whip's scroll ----
          // L31: close on the file's top, a push into the slam on "name", a truck down the file with the cursor, an
          // anticipation push and a pull-out wide on "git-ignore". L32: the whip down to the panes, landing on the kick,
          // then a slow push toward the tree.
          const eIn2 = gsap.parseEase("power2.in"), eOut = gsap.parseEase("expo.out"), eSine = gsap.parseEase("sine.inOut"),
            eIO3 = gsap.parseEase("power3.inOut");
          const seg = (t, t0, t1, a, b, e) => a + (b - a) * e(clamp01((t - t0) / (t1 - t0)));
          function camAt(t) {
            let z = seg(t, 0, NAME - 0.02, 1.16, 1.19, eIn2), ax = 900, ay = seg(t, 0, NAME, 400, 430, eSine), scroll = 0;
            if (t >= NAME) z = seg(t, NAME, NAME + 0.35, 1.19, 1.15, eOut);
            if (t >= AT - 0.05) { ay = seg(t, AT - 0.05, GIT - 0.08, 430, 620, eSine); ax = seg(t, AT - 0.05, GIT - 0.08, 900, 930, eSine); }
            if (t >= GIT - 0.08) z = seg(t, GIT - 0.08, GIT, 1.15, 1.22, eIn2);
            if (t >= GIT) { const u = eOut(clamp01((t - GIT) / 0.55)); z = 1.22 - 0.22 * u; ay = 620 - 60 * u; ax = 930 + 30 * u; }
            if (t >= GIT + 0.55) z = seg(t, GIT + 0.55, W0, 1.0, 1.03, eSine);
            if (t >= W0) { const u = eIO3(clamp01((t - W0) / (W1 - W0))); scroll = SCROLL * u; z = 1.03 - 0.03 * u; ay = 560 - 20 * u; ax = 960; }
            if (t >= W1) { z = seg(t, W1, ANY - 0.04, 1.0, 1.045, eSine); ax = seg(t, W1, ANY, 960, 912, eSine); }
            if (t >= ANY) z = 1.045 + 0.03 * eOut(clamp01((t - ANY) / 0.4));
            return { z, ax, ay, scroll };
          }

          // ---- per-frame state: line numbers, typing, cursors, light, glow, camera ----
          const olds = root.querySelectorAll(".f21-on0"), cmd = $("f21-cmd"), world = $("f21-world");
          const cur0 = $("f21-cur0"), cur4 = $("f21-cur4"), cur5 = $("f21-cur5"), cur6 = $("f21-cur6");
          const glowYou = $("f21-glowYou"), glowGi = $("f21-glowGi"), glowTree = $("f21-glowTree"), glowAny = $("f21-glowAny");
          const sel = $("f21-sel"), ign = $("f21-ign"), ed = $("f21-ed"), treew = $("f21-treew"), termw = $("f21-termw");
          const heroes = [you, $("f21-gi"), $("f21-any")];
          const blink = (t, since) => t - since < 0.35 || Math.floor((t - since) * 2) % 2 === 0;
          const last = (states, t) => { let s = states[0]; for (const st of states) if (st[0] <= t) s = st; return s; };
          const decay = (t, a, tau) => (t >= a ? Math.exp(-(t - a) / tau) : 0);
          function render() {
            const t = tl.time(), T = T0 + t;
            const bass = HR.band("bass", T), kick = HR.hit("kick", T, 0.2);
            // L31 state
            const n = ins.filter(([ti]) => ti <= t).length;
            olds.forEach((el, i) => { el.textContent = String(1 + n + i); });
            cur0.style.display = n ? "none" : "inline-block";
            cur0.style.opacity = blink(t, 0) ? 1 : 0;
            cur4.style.marginLeft = t < NAME ? "-1.66em" : "0.08em"; // line 1 is empty until the name: the cursor sits at column 1
            cur4.style.opacity = t < AT && blink(t, t < NAME ? WROTE : NAME) ? 1 : 0; // on line 1 until line 3 opens
            // L32 state
            const k = last(keys, t); cmd.textContent = k[1];
            cur5.style.opacity = t < ENTER && blink(t, Math.max(k[0], CUT)) ? 1 : 0;
            cur6.style.opacity = blink(t, at(106.86)) ? 1 : 0;
            const landed = LAND.filter((a) => a <= t).length;
            ign.textContent = String(landed);
            // light: fire behind `you` (flares on the slam), behind git-ignore, behind you/ (flares on each landing), behind anymore
            glowYou.style.opacity = (t < WROTE ? 0 : Math.min(1, 0.45 + 0.35 * bass + 0.25 * kick + 0.9 * decay(t, NAME, 0.3) * (t >= NAME ? 1 : 0))).toFixed(3);
            glowGi.style.opacity = (t < GIT ? 0 : Math.min(1, 0.5 + 0.3 * bass + 0.7 * decay(t, GIT, 0.35))).toFixed(3);
            let F = decay(t, KICK, 0.3);
            for (const a of LAND) F = Math.max(F, decay(t, a, 0.25));
            const out = clamp01((t - ANY - 0.05) / 0.4);
            glowTree.style.opacity = Math.min(1, (0.5 + 0.3 * bass + 0.6 * F) * (1 - 0.6 * out)).toFixed(3);
            sel.style.opacity = ((0.16 + 0.1 * F) * (1 - out)).toFixed(3);
            glowAny.style.opacity = (t < ANY ? 0 : Math.min(1, 0.55 + 0.35 * bass + 0.8 * decay(t, ANY, 0.35))).toFixed(3);
            // the windows' lit edges breathe with the bass
            const halo = (0.05 + 0.04 * bass + 0.05 * kick).toFixed(3);
            for (const wdw of [ed, treew, termw]) wdw.style.boxShadow = `0 0 3.5cqw 0.3cqw rgba(240, 236, 229, ${halo})`;
            heroes.forEach((el) => HR.glow(el, T, 0.3, 0.5));
            // the camera; the whip scrolls the world and blurs it by its speed
            const c = camAt(t), c0 = camAt(Math.max(0, t - 1 / 60));
            world.style.transform = `translateY(${(-c.scroll).toFixed(2)}px)`;
            const vb = Math.abs(c.scroll - c0.scroll);
            world.style.filter = vb > 2 ? `blur(${Math.min(16, vb * 0.08).toFixed(1)}px)` : "";
            stage.cam.z = c.z; stage.cam.x = (c.ax - 960) * c.z; stage.cam.y = (c.ay - 540) * c.z;
            stage.apply(T);
            WOW.draw(tl, T0);
          }
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["21-ignore"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
