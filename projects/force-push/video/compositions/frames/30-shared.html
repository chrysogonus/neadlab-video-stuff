         the WARNING box in the soft voice (Instrument Serif Italic), then `--force-with-lease`. Refinement round 1: the
         breath is calm, never frozen. The cut pulls out of 29's blame (`pullOut`, shortened to 0.40 s: "they" starts
         0.41 s in) onto the page already printed. Phrase 1: the camera drifts down the man page and pushes into the box
         (1.0 → 1.13); `--force-with-lease` and its text print as one block on the 146.011 downbeat. On the 147.863
         downbeat L47 greys and the box's text scrolls up a line pair like a pager; L48 rises into its place. Phrase 2:
         the camera eases back and reads on down to the lease entry, whose own words are the deadpan: "If somebody else
         built on top of your original history … blindly pushing with --force will lose their work." — its "somebody"
         inks on "somebody", its "lose their work" is underlined on "lose". The accent is a pointer: a marker stroke
         under the sung hero word that slides from "never" to "shared" to "lose" (growing over "it all,") to "chance".
         The marker writes (shared with whom?) while "shared" is held. The lamp's pool breathes with the pads, one swell

      <style>
        @font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/ibm-plex-mono-400.woff2") format("woff2"); font-weight: 400; }
        @font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/ibm-plex-mono-500.woff2") format("woff2"); font-weight: 500; }

        #root {

        #f30-band { position: absolute; left: 0; right: 0; top: 0; height: 6.4cqw; background: var(--desk);

        #f30-sec1 { top: 6.8cqw; }
        #f30-opt1 { top: 9.5cqw; }
        #f30-p1 { top: 13cqw; }
        #f30-opt2 { top: 45.6cqw; }

        #f30-ul { position: absolute; left: -0.2cqw; right: -0.2cqw; bottom: -0.2cqw; height: 0.36cqw; background: var(--marker);
          transform-origin: 0% 50%; transform: rotate(-0.5deg) scaleX(0); }
        /* the warning boxes: hairline frame, the accent bar at the left, the label, the soft voice inside */
        .f30-box { position: absolute; left: 5.5cqw; right: 5.5cqw; height: 21cqw; box-sizing: border-box;

        #f30-box1 { top: 21.4cqw; }
        /* the box's text window: the lines scroll up through it like a pager; the pointer rides with them */
        #f30-clip { position: absolute; left: 0; right: 0; top: 3.4cqw; bottom: 0.4cqw; overflow: hidden; }
        #f30-scroll { position: absolute; left: 0; right: 0; top: 0; height: 40cqw; }

          transform: rotate(-0.6deg); opacity: 0; }

      <div id="root" data-composition-id="30-shared" data-width="1920" data-height="1080" data-duration="7.511">

              <div class="f30-opt" id="f30-opt1">-f, --force</div>

                    <div class="f30-q" id="f30-q48" data-layout-allow-overlap><span class="f30-w">somebody</span> <span class="f30-w">could</span> <span class="f30-w f30-hero">lose</span> <span class="f30-w f30-hero">it</span> <span class="f30-w f30-hero">all,</span><br /><span class="f30-w">no</span> <span class="f30-w">second</span> <span class="f30-w">chance</span></div>

          <div id="f30-warm" data-layout-ignore></div>
          <div id="f30-band">

      <script src="assets/kit/wow-kit.js"></script>
      <script>
        (() => {
          const DUR = 7.511, T0 = 144.169;
          const root = document.querySelector('[data-composition-id="30-shared"]');
          const $ = (id) => root.querySelector("#" + id);
          const tl = gsap.timeline({ paused: true });
          const at = (T) => T - T0;
          const cam = $("f30-cam"), drift = $("f30-drift");

          const W47 = Array.from($("f30-q47").querySelectorAll(".f30-w"));
          const W48 = Array.from($("f30-q48").querySelectorAll(".f30-w"));
          const T47 = [144.58, 144.751, 145.08, 145.41, 145.853, 146.198, 146.48, 146.577, 147.32];
          const T48 = [147.959, 148.453, 148.76, 149.12, 149.36, 149.92, 150.254, 151.002];
          const NEVER = at(145.08), SHARED = at(146.577), SOME = at(147.959), LOSE = at(148.76), IT = at(149.12), ALL = at(149.36);
          const CHANCE = at(151.002);
          const DOWN2 = at(146.011), DOWN3 = at(147.863);

          // ---- the cuts: 29's pullOut carries through (shortened: "they" starts 0.41 s in); glideUp into 31's page ----
          WOW.transition(tl, cam, { in: "pullOut", dur: 0.4, total: DUR });
          WOW.transition(tl, cam, { out: "glideUp", dur: 0.42, total: DUR });

          // ---- the man page is printed from the first frame; the safe flag and its text print on the downbeat, a
          //      line at a time (the pager) ----
          const P2 = [$("f30-opt2"), $("f30-p2a"), $("f30-p2b"), $("f30-p2c")];
          tl.set(P2, { opacity: 0 }, 0);
          tl.set(P2, { opacity: 1 }, DOWN2);
          // the page's own words: its "somebody" inks on "somebody"; on "lose" its "lose their work" inks and is underlined
          tl.set([$("f30-some"), $("f30-lose")], { color: "#4A4741" }, 0);
          tl.to($("f30-some"), { color: "#111111", duration: 0.5, ease: "power2.out" }, SOME);
          tl.to($("f30-lose"), { color: "#111111", duration: 0.4, ease: "power2.out" }, LOSE);
          tl.fromTo($("f30-ul"), { scaleX: 0, rotation: -0.5 }, { scaleX: 1, rotation: -0.5, duration: 0.55, ease: "power2.inOut", immediateRender: false }, LOSE + 0.04);

          // ---- the soft voice: every word rises in slowly on its start; heroes arrive a touch large and settle ----
          const soft = (w, T, hero) => {
            const n = w.textContent.length;
            HR.lead(tl, w, at(T), { from: hero ? 40 : 32, dur: hero ? 0.7 : 0.6, stagger: Math.min(0.03, 0.12 / n) });
            w.classList.remove("hr-clip"); // the serif's descenders hang below the word box: no clip
          };
          W47.forEach((w, i) => soft(w, T47[i], i === 2 || i === 7));
          W48.forEach((w, i) => soft(w, T48[i], i === 2 || i === 7));
          const swell = (w, t) => tl.fromTo(w, { scale: 1.1 }, { scale: 1, duration: 1.4, ease: "power2.out", immediateRender: false }, t - 0.03);
          tl.set([...W47, ...W48], { scale: 1 }, 0);
          swell(W47[2], NEVER); swell(W47[7], SHARED); swell(W48[2], LOSE); swell(W48[7], CHANCE);
          // L47 is read: on the downbeat before L48 it greys and the box's text scrolls up a line pair, like a pager; L48
          // rises into the place it leaves (L47 is still on screen at "somebody")
          tl.to(W47, { color: "#5F5B54", duration: 0.5, ease: "power2.inOut" }, DOWN3);
          tl.set($("f30-scroll"), { y: 0 }, 0);
          tl.fromTo($("f30-scroll"), { y: 0 }, { y: -17.2 * 19.2, duration: 0.8, ease: "power2.inOut", immediateRender: false }, DOWN3);
          // the accent bars of the boxes draw down as each box is first read
          tl.fromTo(root.querySelector(".f30-bar"), { scaleY: 0.2 }, { scaleY: 1, duration: 1.1, ease: "power3.out" }, 0);

          // ---- the marker's aside, written while "shared" is held ----
          const nt = { p: 0 };
          tl.fromTo(nt, { p: 0 }, { p: 1, duration: 0.85, ease: "power1.inOut", immediateRender: false }, SHARED + 0.3);
          tl.set({}, {}, DUR);

          // ---- the camera: one continuous read down the page. Keys: page point (cx, cy) in cqw at the view's centre,
          //      zoom s. Phrase 1 drifts down and pushes into the WARNING box; phrase 2 pulls back a little and reads on down
          //      to the lease entry (its "lose their work" on "lose"), then leans in again for "chance". A monotone cubic through the keys: the speed never jumps, never stops ----
          const KEYS = [
            [0, 50, 25.4, 1.0], [0.41, 49.6, 26.0, 1.012], [NEVER, 48.8, 27.0, 1.035], [DOWN2, 47.6, 28.8, 1.075],
            [SHARED, 46.8, 30.0, 1.1], [at(147.32), 46.2, 31.4, 1.122], [SOME, 45.8, 32.6, 1.13], [LOSE, 45.6, 36.4, 1.1],
            [at(149.92), 45.6, 37.9, 1.07], [CHANCE, 45.6, 39.0, 1.08], [DUR, 45.6, 39.8, 1.1],
          ];
          const spline = (ch) => {
            const xs = KEYS.map((k) => k[0]), ys = KEYS.map((k) => k[ch]), n = xs.length, d = [], m = [];
            for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
            for (let i = 0; i < n; i++) {
              if (i === 0) m.push(d[0]); else if (i === n - 1) m.push(d[n - 2]);
              else m.push(d[i - 1] * d[i] <= 0 ? 0 : (2 * d[i - 1] * d[i]) / (d[i - 1] + d[i])); // Fritsch–Carlson (harmonic)
            }
            return (x) => {
              if (x <= xs[0]) return ys[0]; if (x >= xs[n - 1]) return ys[n - 1];
              let i = 0; while (x > xs[i + 1]) i++;
              const h = xs[i + 1] - xs[i], u = (x - xs[i]) / h, u2 = u * u, u3 = u2 * u;
              return (2 * u3 - 3 * u2 + 1) * ys[i] + (u3 - 2 * u2 + u) * h * m[i] + (-2 * u3 + 3 * u2) * ys[i + 1] + (u3 - u2) * h * m[i + 1];
            };
          };
          const CX = spline(1), CY = spline(2), CS = spline(3);

          // ---- the pointer: page-px rects of the hero words, taken once the serif has loaded ----
          const ptr = $("f30-ptr"), note = $("f30-note"), shade = $("f30-shade"), warm = $("f30-warm");
          const scrollEl = $("f30-scroll");
          const pageOff = (el) => { let x = 0, y = 0; while (el && el !== scrollEl) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; } return [x, y]; };
          let R = null;
          const measure = () => {
            const fs = parseFloat(getComputedStyle($("f30-q47")).fontSize);
            const rect = (a, b) => { const [x, y] = pageOff(a), [x2] = pageOff(b || a); return { x: x - 0.04 * fs, y: y + 0.9 * fs, w: x2 + (b || a).offsetWidth - x + 0.06 * fs }; };
            R = { never: rect(W47[2]), shared: rect(W47[7]), lose: rect(W48[2]), loseIt: rect(W48[2], W48[3]), loseAll: rect(W48[2], W48[4]), chance: rect(W48[7]) };
          };
          const sine = (u) => 0.5 - 0.5 * Math.cos(Math.PI * Math.max(0, Math.min(1, u)));
          const lerp = (a, b, u) => ({ x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u, w: a.w + (b.w - a.w) * u });
          // [start, end, from, to]: the pointer leads the eye to where the hero word lands, arriving on its start; it rides
          // the box's scroll, so "shared" → "lose" is one line down
          const MOVES = [[SHARED - 0.36, SHARED + 0.04, "never", "shared"], [LOSE - 0.36, LOSE + 0.04, "shared", "lose"],
            [IT - 0.02, IT + 0.24, "lose", "loseIt"], [ALL - 0.02, ALL + 0.26, "loseIt", "loseAll"], [CHANCE - 0.36, CHANCE + 0.04, "loseAll", "chance"]];
          const pointer = (t) => {
            let r = R.never;
            for (const [a, b, f, g] of MOVES) { if (t >= a) r = lerp(R[f], R[g], sine((t - a) / (b - a))); }
            return { x: r.x, y: r.y, w: r.w * sine((t - NEVER) / 0.36) };
          };

          // the pads swell once a bar (half time): a slow breath peaking just after each downbeat, sized by the loudness
          const DOWNS = window.HR_ENV.downbeats.filter((x) => x > T0 - 2.5 && x < T0 + DUR + 2.5);
          const breath = (T) => {
            let d = DOWNS[0]; for (const x of DOWNS) if (x <= T) d = x;
            const u = (T - d) / 1.846, b = Math.pow(Math.sin(Math.PI * Math.min(1, Math.max(0, (u + 0.08) / 1.08))), 2);
            return Math.min(1, 0.55 * b + 0.45 * WOW.energy(T) + 0.1);
          };

          function render() {
            const t = tl.time(), T = T0 + t, PX = 19.2, VW = 100, VH = 56.25 - 6.4;
            const s = CS(t), cx = CX(t), cy = CY(t);
            drift.style.transform = `translate(${((VW / 2 - cx * s) * PX).toFixed(2)}px, ${((VH / 2 - cy * s) * PX).toFixed(2)}px) scale(${s.toFixed(4)})`;
            // the lamp follows the reading and breathes
            const b = breath(T);
            shade.style.opacity = (1 - 0.4 * b).toFixed(3);
            warm.style.opacity = (0.45 + 0.55 * b).toFixed(3);
            const ly = (44 + 6 * Math.sin((t / DUR) * Math.PI)).toFixed(2) + "%";
            shade.style.setProperty("--ly", ly); warm.style.setProperty("--ly", ly);
            // the pointer: drawn on under "never", then it travels
            if (R && t >= NEVER) {
              const r = pointer(t);
              ptr.style.opacity = r.w > 0.5 ? 1 : 0;
              ptr.style.left = r.x.toFixed(2) + "px"; ptr.style.top = r.y.toFixed(2) + "px"; ptr.style.width = Math.max(0, r.w).toFixed(2) + "px";
            } else ptr.style.opacity = 0;
            // the marker note writes on left to right
            note.style.opacity = nt.p > 0 ? 1 : 0;
            note.style.clipPath = `inset(-30% ${((1 - nt.p) * 104).toFixed(2)}% -30% -6%)`;
            WOW.draw(tl, T0);
          }
          tl.eventCallback("onUpdate", render);
          render();
          document.fonts.load('italic 400 100px "Instrument Serif"').then(() => { measure(); render(); });
          // the page scrolls under the band's lip once it is read (deliberate)
          root.querySelectorAll("#f30-head, #f30-head *, .f30-sec, .f30-opt, .f30-p, .f30-p *, .f30-box, .f30-box *")
            .forEach((el) => el.setAttribute("data-layout-allow-occlusion", ""));
          window.__timelines["30-shared"] = tl;
        })();
      </script>
    </template>
