    <!-- Frame 28 — origin2 (chorus 2's last line, 133.152–136.790). Forks 15-origin: the same cream settings page, a
         mono label column on the left and the values on the right, with the world moved on. REMOTES: "origin's mine"
         over `git remote -v`; since 26's `git remote remove you`, a bare `git remote` beside it lists one name,
         `origin`. On "mine" (134.04) the push line prints and its `me` is marked. ACCESS: `Collaborators: 1` and the
         `me` row print on the kicks, and there is no row 2 at all: "and you're not" builds low, under an empty band
         where 15's row 2 stood. On "there" (135.64) the space closes up: the whole line slams up under `me`, the
         count gets the marker and the gutter pointer. Settles and holds the page for the hard cut into 29's chant. -->
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Barlow"; src: url("assets/fonts/barlow-800.woff2") format("woff2"); font-weight: 800; }
        @font-face { font-family: "Barlow"; src: url("assets/fonts/barlow-900.woff2") format("woff2"); font-weight: 900; }

        #root {
          position: absolute; inset: 0; overflow: hidden; container-type: size;
          --ink: #0A0A0A; --fire: #E85D26; --cream: #F0ECE5; --ink-on-cream: #111111; --muted-on-cream: #5F5B54; --marker: #C8481A;
          --hr-accent-rgb: 200, 72, 26;

        }
        /* header strip, cream register (07's colours) */
        #f28-strip { position: absolute; left: 5.5cqw; right: 5.5cqw; top: 3.4cqw; display: flex; justify-content: space-between;
          font: 500 0.78cqw/1.5 "IBM Plex Mono", monospace; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted-on-cream);
          padding-bottom: 0.6cqw; border-bottom: 1px solid rgba(17, 17, 17, 0.22); }
        #f28-strip b { color: #B8461C; font-weight: 600; }
        /* the finish layer's vignette darkens the corners of the cream page: the strip's small text needs a darker ink */
        #f28-strip { color: #3F3C37; } #f28-strip b { color: #7E2E12; }
        /* the form: label column at 5.5cqw, value column at 21cqw */
        .f28-lbl { position: absolute; left: 5.5cqw; font: 500 0.78cqw/1.5 "IBM Plex Mono", monospace; letter-spacing: 0.14em;

        #f28-lbl1 { top: 9.2cqw; }
        #f28-lbl2 { top: 31.1cqw; }
        .f28-sep { position: absolute; left: 5.5cqw; right: 5.5cqw; height: 1px; background: rgba(17, 17, 17, 0.22); transform-origin: 0% 50%; }
        #f28-sep1 { top: 29.6cqw; }
        /* REMOTES: the lyric is the value; git's printouts are its detail */
        #f28-a { position: absolute; left: 20.4cqw; top: 7.4cqw; font: 900 12cqw/0.92 "Barlow", sans-serif; letter-spacing: -0.045em;
          color: var(--ink-on-cream); white-space: nowrap; }
        .f28-hw { position: relative; display: inline-block; isolation: isolate; }
        .f28-ul { position: absolute; z-index: -1; left: -0.02em; right: 0.04em; bottom: -0.01em; height: 0.07em; background: var(--marker); opacity: 0.85;
          border-radius: 0.2cqw; transform-origin: 0% 50%; transform: rotate(-0.6deg) scaleX(0); }
        .f28-print { position: absolute; top: 20.6cqw; font: 400 1.22cqw/1.6 "IBM Plex Mono", monospace; color: var(--muted-on-cream);
          white-space: pre; }
        #f28-remote { left: 21cqw; }
        #f28-names { left: 52cqw; }
        .f28-print .f28-cmd { color: var(--ink-on-cream); font-weight: 500; }
        .f28-print .f28-url { color: var(--ink-on-cream); }
        #f28-remote .f28-me { color: #B8461C; font-weight: 600; position: relative; display: inline-block; }
        #f28-remote .f28-me i { position: absolute; left: -0.1em; right: -0.1em; bottom: -0.12em; height: 0.16em; background: var(--marker);
          transform-origin: 0% 50%; }
        /* ACCESS: one collaborator, and no row where you were */
        #f28-tab { position: absolute; left: 21cqw; right: 5.5cqw; top: 30.8cqw; }
        .f28-head { position: relative; display: inline-block; height: 2.4cqw; font: 400 1.1cqw/2.4cqw "IBM Plex Mono", monospace;
          color: var(--muted-on-cream); isolation: isolate; }
        .f28-head b { color: var(--ink-on-cream); font-weight: 600; }
        #f28-hm { position: absolute; left: -0.15em; right: -0.25em; bottom: 0.2em; height: 0.3em; z-index: -1; background: var(--marker);
          border-radius: 0.1cqw; transform-origin: 0% 50%; transform: rotate(-0.6deg) scaleX(0); }
        #f28-ptr { position: absolute; left: -1.3cqw; top: 22%; bottom: 22%; width: 0.32cqw; background: var(--marker); opacity: 0; }
        .f28-row { position: relative; height: 3.1cqw; display: flex; align-items: center; font: 500 1.45cqw/1 "IBM Plex Mono", monospace;
          color: var(--ink-on-cream); }
        .f28-row .f28-n { width: 3.4cqw; font-weight: 400; color: var(--muted-on-cream); }
        .f28-row .f28-addr { margin-left: 6cqw; font-weight: 400; color: var(--muted-on-cream); }
        .f28-rule { position: absolute; left: 0; right: 0; bottom: 0; height: 1px; background: rgba(17, 17, 17, 0.22); transform-origin: 0% 50%; }
        /* the second half of the line: it builds low, under the empty band where 15's row 2 stood, and closes up on "there" */
        #f28-b { position: absolute; left: 20.6cqw; top: 43.6cqw; font: 800 8.4cqw/0.95 "Barlow", sans-serif; letter-spacing: -0.04em;
          color: var(--ink-on-cream); white-space: nowrap; }
        #f28-b .f28-hero { font-weight: 900; }
      </style>
      <div id="root" data-composition-id="28-origin2" data-width="1920" data-height="1080" data-duration="3.638">
        <div class="hr-layer" data-depth="0.15">
          <div id="f28-strip"><span>~/us &nbsp;·&nbsp; settings</span><span>commits by you on origin &nbsp;<b>0</b></span></div>
        </div>
        <div class="hr-layer" data-depth="0.55">
          <div class="f28-lbl" id="f28-lbl1">remotes</div>
          <div class="f28-sep" id="f28-sep1"></div>
          <div class="f28-lbl" id="f28-lbl2">access</div>
          <div class="f28-print" id="f28-remote"><div><span class="f28-cmd">$ git remote -v</span></div><div id="f28-r1">origin&#9;<span class="f28-url">me@home:us.git</span> (fetch)</div><div id="f28-r2">origin&#9;<span class="f28-url"><span class="f28-me">me<i></i></span>@home:us.git</span> (push)</div></div>
          <div class="f28-print" id="f28-names"><div><span class="f28-cmd">$ git remote</span></div><div id="f28-n1">origin</div></div>
          <div id="f28-tab">
            <div><span class="f28-head" id="f28-head"><i id="f28-hm"></i><i id="f28-ptr"></i>Collaborators: <b>1</b></span></div>
            <div class="f28-row" id="f28-me"><span class="f28-n">1</span><span>me</span><span class="f28-addr">me@home</span><i class="f28-rule" id="f28-rule1"></i></div>
          </div>
        </div>
        <div class="hr-layer" data-depth="0.9">
          <div id="f28-a"><span class="f28-hw"><span class="f28-w" id="f28-origin">origin's</span></span> <span class="f28-hw"><span class="f28-w" id="f28-mine">mine</span><i class="f28-ul" id="f28-ul"></i></span></div>
          <div id="f28-b"><span class="f28-w">and</span> <span class="f28-w">you're</span> <span class="f28-w">not</span> <span class="f28-w f28-hero" id="f28-there">there</span></div>
        </div>
      </div>
      <script src="assets/kit/env.js"></script>
      <script src="assets/kit/hr-kit.js"></script>
      <script>
        (() => {
          const DUR = 3.638, T0 = 133.152;
          const root = document.querySelector('[data-composition-id="28-origin2"]');
          const $ = (id) => root.querySelector("#" + id);
          const stage = HR.stage(root, { seed: 28 });
          const tl = gsap.timeline({ paused: true });
          const at = (T) => T - T0;
          // L42's word starts (lyrics.json) and the kicks around them (HR_ENV)
          const ORIGIN = at(133.28), MINE = at(134.04), AND = at(134.66), YOURE = at(134.76), NOT = at(135.2), THERE = at(135.64);
          const K_NAMES = at(133.602), K_ROW = at(134.512);

          // ---- the printouts: both commands and the fetch line are on the page at the cut ----
          // `git remote` lists one name now (26 removed `you`); it prints on the first kick with the collaborator count
          tl.set($("f28-n1"), { opacity: 0 }, 0).set($("f28-n1"), { opacity: 1 }, K_NAMES);
          tl.set($("f28-head"), { opacity: 0 }, 0).set($("f28-head"), { opacity: 1 }, K_NAMES);
          // the push line prints on "mine"
          tl.set($("f28-r2"), { opacity: 0 }, 0).set($("f28-r2"), { opacity: 1 }, MINE);
          tl.fromTo(root.querySelector(".f28-me i"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power2.out" }, MINE + 0.06);
          // my row prints on the snare-kick before "and"; there is no row after it
          tl.set($("f28-me"), { opacity: 0 }, 0).set($("f28-me"), { opacity: 1 }, K_ROW);

          // ---- the sung words, each on its own start ----
          HR.hero(tl, $("f28-origin"), ORIGIN, { spread: 32, over: 1.2, pre: 0.1, sharp: true });
          HR.hero(tl, $("f28-mine"), MINE, { spread: 26, over: 1.22, pre: 0.14, sharp: true });
          tl.fromTo($("f28-ul"), { scaleX: 0 }, { scaleX: 1, duration: 0.22, ease: "power2.out" }, MINE + 0.04);
          const w = root.querySelectorAll("#f28-b .f28-w");
          HR.lead(tl, w[0], AND); HR.lead(tl, w[1], YOURE); HR.lead(tl, w[2], NOT);
          HR.hero(tl, w[3], THERE, { spread: 28, over: 1.24, pre: 0.14, sharp: true });

          // ---- "there": the space where you were closes up ----
          // the whole line slams up into the empty band, landing under my row on the word
          tl.fromTo($("f28-b"), { yPercent: 0 }, { yPercent: -79, duration: 0.16, ease: "power4.out" }, THERE - 0.04);
          // the count gets the marker, and the gutter pointer slams onto it
          tl.fromTo($("f28-hm"), { scaleX: 0 }, { scaleX: 1, duration: 0.2, ease: "power2.out" }, THERE + 0.06);
          tl.set($("f28-ptr"), { opacity: 1 }, THERE);
          tl.fromTo($("f28-ptr"), { scaleY: 1.8 }, { scaleY: 1, duration: 0.45, ease: "elastic.out(1, 0.5)", immediateRender: false }, THERE);

          // ---- the camera: chorus 2 runs louder, punches sized by the measured drums; a slow push carries the page ----
          const punch = (T) => 0.022 + 0.034 * HR.band("drums", T0 + T + 0.03);
          const pO = punch(ORIGIN), pM = punch(MINE), pT = punch(THERE) + 0.012;
          tl.fromTo(stage.cam, { z: 1.0, y: 0, x: 0 }, { z: 1.0 + pO, y: -4, duration: 0.06, ease: "power2.in" }, ORIGIN - 0.06);
          tl.to(stage.cam, { z: 1.006, y: 0, duration: 0.5, ease: "elastic.out(1, 0.55)" }, ORIGIN);
          tl.to(stage.cam, { z: 1.012, duration: MINE - ORIGIN - 0.56, ease: "none" }, ORIGIN + 0.5);
          tl.to(stage.cam, { z: 1.012 + pM, y: -6, duration: 0.06, ease: "power2.in" }, MINE - 0.06);
          tl.to(stage.cam, { z: 1.016, y: 0, duration: 0.5, ease: "elastic.out(1, 0.55)" }, MINE);
          // "and you're not": the camera tilts down to the low line
          tl.to(stage.cam, { z: 1.022, y: 16, duration: THERE - MINE - 0.56, ease: "sine.inOut" }, MINE + 0.5);
          // "there": the punch rides up with the line, then the page settles and drifts to the cut
          tl.to(stage.cam, { z: 1.022 + pT, y: 4, duration: 0.06, ease: "power2.in" }, THERE - 0.06);
          tl.to(stage.cam, { z: 1.026, y: 6, duration: 0.6, ease: "elastic.out(1, 0.5)" }, THERE);
          tl.to(stage.cam, { z: 1.036, x: -12, duration: DUR - THERE - 0.6, ease: "none" }, THERE + 0.6);
          tl.set({}, {}, DUR);

          function render() {
            stage.apply(T0 + tl.time());
          }
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["28-origin2"] = tl;
        })();
      </script>
    </template>
