        #f28-close { position: absolute; left: -2.4cqw; right: -0.6cqw; top: 25.6cqw; height: 0.3cqw; margin-top: -0.15cqw; background: var(--ink-on-cream); }

      <script>
        (() => {
          const DUR = 3.638, T0 = 133.152, PX = 19.2; // px per cqw at 1920 wide
          const root = document.querySelector('[data-composition-id="28-origin2"]');
          const $ = (id) => root.querySelector("#" + id);
          const tl = gsap.timeline({ paused: true });
          const at = (T) => T - T0;
          // L42's word starts (lyrics.json) and the kicks of this span (HR_ENV)
          const ORIGIN = at(133.28), MINE = at(134.04), AND = at(134.66), YOURE = at(134.76), NOT = at(135.2), THERE = at(135.64);
          const K_NAMES = at(133.602), K_SEARCH = at(134.995), OUT = 0.35;
          const cam = $("f28-cam"), drift = $("f28-drift"), jolt = $("f28-jolt");
          const drums = (t) => HR.band("drums", T0 + t + 0.03);
          // chorus 2 is louder: size every move by this span's drums over 15's (chorus 1's same line)
          const mean = (a, b) => { let s = 0, n = 0; for (let T = a; T < b; T += 0.02) { s += HR.band("drums", T); n++; } return s / n; };
          const K = Math.max(1, Math.min(1.25, mean(T0, T0 + DUR) / Math.max(0.05, mean(72.435, 76.09))));

          // ---- the cut: 27's `rise` carries on (the content keeps travelling up), shortened to a short settle because
          //      "origin's" starts 0.128 s in: the page is on screen from the first frame and in place by the word ----
          tl.fromTo($("f28-in"), { y: 300 }, { y: 0, duration: 0.2, ease: "expo.out" }, 0);
          WOW.transition(tl, cam, { out: "zoom", dur: OUT, total: DUR });

          // ---- REMOTES: `git remote` lists one name (26 removed `you`), on the first kick; the push line prints on "mine" ----
          tl.set($("f28-n1"), { opacity: 0 }, 0).set($("f28-n1"), { opacity: 1 }, K_NAMES);
          tl.set($("f28-push"), { opacity: 0 }, 0).set($("f28-push"), { opacity: 1 }, MINE);
          tl.fromTo(root.querySelector(".f28-me i"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power2.out" }, MINE + 0.06);

          // ---- the sung words, each on its own start ----
          HR.hero(tl, $("f28-origin"), ORIGIN, { spread: 32, over: 1.2, pre: 0.1, sharp: true });
          HR.hero(tl, $("f28-mine"), MINE, { spread: 26, over: 1.22, pre: 0.14, sharp: true });
          tl.fromTo($("f28-ul"), { scaleX: 0, rotation: -0.8 }, { scaleX: 1, rotation: -0.8, duration: 0.22, ease: "power2.out" }, MINE + 0.04);
          const w = root.querySelectorAll("#f28-b .f28-w");
          HR.lead(tl, w[0], AND); HR.lead(tl, w[1], YOURE); HR.lead(tl, w[2], NOT);
          HR.hero(tl, w[3], THERE, { spread: 28, over: 1.26, pre: 0.14, sharp: true });

          // ---- ACCESS: the hover goes looking for you — off `me` on "you're", the next empty slot on the kick, the last
          //      on "not" (fixed content moved by tweens: it blurs on each drop and lands sharp) ----
          const ROW = 6.4 * PX, hover = $("f28-hover");
          tl.set(hover, { y: 0, scaleY: 1 }, 0);
          [[YOURE, 1], [K_SEARCH, 2], [NOT, 3]].forEach(([t, k]) =>
            tl.fromTo(hover, { y: (k - 1) * ROW, scaleY: 1 }, { y: k * ROW, scaleY: 1, duration: 0.08, ease: "power3.in", immediateRender: false }, t - 0.06));
          // ---- "there": the panel closes up — its closing rule slams up onto row 1 (blurred), the hover is crushed into
          //      the seam, the seam lands in the accent, the count stamps large under it ----
          const SHUT = 0.1, T_SHUT = THERE - SHUT + 0.02, GAP = 3 * ROW;
          tl.set($("f28-close"), { y: 0 }, 0);
          tl.fromTo($("f28-close"), { y: 0 }, { y: -GAP, duration: SHUT, ease: "power3.in", immediateRender: false }, T_SHUT);
          tl.fromTo($("f28-box"), { height: 4 * ROW }, { height: ROW, duration: SHUT, ease: "power3.in", immediateRender: false }, T_SHUT);
          tl.fromTo(hover, { y: 3 * ROW, scaleY: 1 }, { y: ROW, scaleY: 0, duration: SHUT, ease: "power3.in", immediateRender: false }, T_SHUT);
          tl.set($("f28-seam"), { scaleX: 0, scaleY: 1 }, 0);
          tl.fromTo($("f28-seam"), { scaleX: 0.35, scaleY: 2.6 }, { scaleX: 1, scaleY: 1, duration: 0.3, ease: "expo.out", immediateRender: false }, THERE + 0.02);
          const foot = $("f28-foot");
          tl.set(foot, { opacity: 0, scale: 1 }, 0);
          tl.set(foot, { opacity: 1 }, THERE + 0.02);
          tl.fromTo(foot, { scale: 1.3, y: -0.6 * PX }, { scale: 1, y: 0, duration: 0.4, ease: "elastic.out(1, 0.55)", immediateRender: false }, THERE + 0.02);
          WOW.shake(tl, jolt, THERE + 0.02, { amp: (8 + 6 * drums(THERE)) * K, dur: 0.4, rot: 0.35, seed: 28 });

          // ---- the camera: punches sized by the measured drums × K; one big move for the phrase — on "and" it trucks
          //      ~30 cqw down and pushes in (1.05 → 1.2) into the empty panel, on "there" it rides the slam up onto the
          //      seam, then keeps pushing into it ----
          // a framing: drift point (cx, cy) in cqw shown at view point (sx, sy) at zoom s
          const frame = (cx, cy, sx, sy, s) => ({ x: (sx - cx * s) * PX, y: (sy - cy * s) * PX, scale: s });
          const z = (s) => 1 + (s - 1) * K;
          tl.fromTo(drift, { ...frame(52, 12, 52, 12, 1.0) }, { ...frame(52, 12, 52, 12, z(1.05)), duration: AND, ease: "none" }, 0);
          tl.to(drift, { ...frame(56, 42.8, 50, 25, z(1.18)), duration: 0.55, ease: "power3.inOut" }, AND);
          tl.to(drift, { ...frame(56, 42.8, 50, 25, z(1.2)), duration: T_SHUT - AND - 0.55, ease: "none" }, AND + 0.55);
          tl.to(drift, { ...frame(56, 38.6, 50, 29.5, z(1.22)), duration: 0.4, ease: "power3.out" }, T_SHUT);
          tl.to(drift, { ...frame(56, 38.6, 50, 29.5, z(1.25)), duration: DUR - T_SHUT - 0.4, ease: "sine.in" }, T_SHUT + 0.4);
          const pk = (t, base, amt) => ({ s: 1 + (base + amt * drums(t)) * K, dur: 0.45 });
          WOW.punch(tl, cam, ORIGIN, pk(ORIGIN, 0.02, 0.03));
          WOW.punch(tl, cam, MINE, pk(MINE, 0.02, 0.03));
          WOW.punch(tl, cam, K_SEARCH, { s: 1 + 0.012 * K, dur: 0.3 });
          WOW.punch(tl, cam, THERE, { ...pk(THERE, 0.04, 0.04), dur: 0.5 });
          WOW.pulse(tl, cam, { kind: "kick", amt: 0.006 * K });
          tl.set({}, {}, DUR);
          // the remotes block scrolls under the band's lip once its line is done (deliberate)
          root.querySelectorAll("#f28-a, #f28-a *, #f28-remote, #f28-remote *, #f28-names, #f28-names *, #f28-lbl1")
            .forEach((el) => el.setAttribute("data-layout-allow-occlusion", ""));

          // ---- per-frame state: the lamp, the seam on the kicks, the camera ----
          const lamp = $("f28-lamp"), seam = $("f28-seam");
          const ease = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
          function render() {
            const t = tl.time(), T = T0 + t;
            const after = t >= THERE;
            const p = ease(Math.max(0, Math.min(1, (t - AND) / 0.55)));
            const q = ease(Math.max(0, Math.min(1, (t - THERE) / 0.4)));
            lamp.style.setProperty("--lx", (46 + 4 * p).toFixed(2) + "%");
            lamp.style.setProperty("--ly", (30 + 34 * p - 6 * q).toFixed(2) + "%");
            lamp.style.opacity = Math.max(0.45, 1 - 0.4 * HR.band("bass", T) - 0.25 * HR.hit("kick", T, 0.22)).toFixed(3);
            seam.style.opacity = after ? (0.85 + 0.15 * HR.hit("kick", T, 0.2)).toFixed(3) : "";
            WOW.draw(tl, T0);
          }
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["28-origin2"] = tl;
        })();
      </script>
