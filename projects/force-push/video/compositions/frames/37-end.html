        (() => {
          const DUR = 12.209, T0 = 197.431;
          const root = document.querySelector('[data-composition-id="37-end"]');
          const $ = (id) => root.querySelector("#" + id);
          const at = (T) => T - T0;
          const tl = gsap.timeline({ paused: true });
          const stA = HR.stage($("f37-A"), { seed: 37 });
          const stC = HR.stage($("f37-C"), { seed: 11 }); // 01's seed: at t = DUR it is posed exactly as 01 at t = 0

          // ---- the run's hits: every kick and hat from the downbeat to the last kick, one day each ----
          const LAST_KICK = 204.6;
          const ev = HR.onsetsIn("kick", T0 - 0.01, LAST_KICK).map((T) => [T, 1])
            .concat(HR.onsetsIn("hat", T0 - 0.01, LAST_KICK).map((T) => [T, 0.45]))
            .sort((a, b) => a[0] - b[0]);
          const dayAt = (i) => Math.round(30 - (30 * i) / (ev.length - 1)); // 31 hits → 30 … 0
          const ZERO = at(ev[ev.length - 1][0]);                            // 204.503
          const ENTER = at(204.764);                                         // downbeat, the drums' last hit
          const CUT = at(206.597);                                           // downbeat: the bookend
          const HIT = at(208.44);                                            // the tail's last onset: the final hit

          // ---- keystrokes (01's pattern) ----
          const typeInto = (states, t0, t1, text) => {
            const base = states[states.length - 1][1];
            for (let i = 0; i < text.length; i++) states.push([t0 + ((t1 - t0) * i) / text.length, base + text.slice(0, i + 1)]);
          };
          const textAt = (states, t) => { let k = states[0]; for (const s of states) if (s[0] <= t) k = s; return k; };
          const keysGc = [[0, ""]]; typeInto(keysGc, at(203.6), at(204.5), "git gc --prune=now");
          const keysPush = [[0, ""]]; typeInto(keysPush, at(206.72), at(207.5), "git push --force");

          // ---- B: Enter. The unreachable rows are struck (0 ms) and collapse; the counter is relabelled ----
          const gone = root.querySelectorAll(".f37-gone");
          tl.fromTo(root.querySelectorAll(".f37-x"), { scaleX: 0 }, { scaleX: 1, duration: 0.001 }, ENTER);
          tl.fromTo(gone, { height: (i) => (i === 0 ? 3.9 : 2.3) * 19.2, opacity: 1 }, // 1cqw = 19.2 px
            { height: 0, paddingTop: 0, opacity: 0, duration: 0.34, ease: "power3.inOut", stagger: 0.02, immediateRender: false }, ENTER + 0.12);
          tl.set($("f37-note"), { opacity: 0 }, ENTER).set($("f37-unit"), { opacity: 0 }, ENTER);
          tl.fromTo($("f37-n"), { yPercent: 0 }, { yPercent: 6, duration: 0.5, ease: "power3.out", immediateRender: false }, ENTER);

          // git gc's own output, line by line on the tail's ticks; progress counters run in render()
          const OUT = [
            { T: 204.764, f: (p) => p < 1 ? `Enumerating objects: ${Math.round(1203 * p)}` : "Enumerating objects: 1203, done.", d: [204.764, 205.16] },
            { T: 205.22, f: (p) => prog("Counting objects", p, 1203), d: [205.22, 205.42] },
            { T: 205.44, f: () => "Delta compression using up to 16 threads" },
            { T: 205.44, f: (p) => prog("Compressing objects", p, 612), d: [205.46, 205.66] },
            { T: 205.68, f: (p) => prog("Writing objects", p, 1203), d: [205.68, 206.1] },
            { T: 206.14, f: () => "Total 1203 (delta 401), reused 1203 (delta 401), pack-reused 0" },
            { T: 206.37, f: (p) => prog("Computing commit graph generation numbers", p, 6), d: [206.37, 206.42] },
          ];
          function prog(label, p, n) {
            const k = Math.round(n * p), pc = Math.floor(100 * p);
            return p < 1 ? `${label}: ${String(pc).padStart(3)}% (${k}/${n})` : `${label}: 100% (${n}/${n}), done.`;
          }
          const outs = root.querySelectorAll(".f37-out");
          OUT.forEach((o, i) => tl.set(outs[i], { opacity: 1 }, at(o.T)));
          tl.set($("f37-p3"), { opacity: 1 }, at(206.45));

          // ---- C: the hard cut to the poster; the log builds on the ticks; `push` is the final hit ----
          tl.set($("f37-A"), { opacity: 0 }, CUT).set($("f37-C"), { opacity: 1 }, CUT);
          tl.fromTo($("f37-force"), { scale: 1.035 }, { scale: 1, duration: 0.5, ease: "power3.out", immediateRender: false }, CUT);
          const TICKS = [207.06, 207.29, 207.52, 207.75, 207.98, 208.21].map(at);
          const lrows = root.querySelectorAll(".f37-lrow"), dots = $("f37-dots"), NS = "http://www.w3.org/2000/svg";
          tl.set(lrows, { opacity: 0 }, 0);
          tl.fromTo($("f37-lane"), { strokeDasharray: "100 100", strokeDashoffset: 100 },
            { strokeDashoffset: 0, duration: TICKS[5] - TICKS[0], ease: "none" }, TICKS[0]);
          TICKS.forEach((t, i) => {
            const y = 6 + 75 * i, c = document.createElementNS(NS, "circle");
            c.setAttribute("cx", 12); c.setAttribute("cy", y); c.setAttribute("r", 6); dots.appendChild(c);
            tl.fromTo(lrows[i], { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.26, ease: "power3.out", immediateRender: false }, t - 0.02);
            tl.fromTo(c, { opacity: 0, scale: 0.2, svgOrigin: `12 ${y}` }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)" }, t);
          });
          tl.set($("f37-push"), { opacity: 0 }, 0).set($("f37-push"), { opacity: 1 }, HIT);
          tl.fromTo($("f37-push"), { scale: 1.12, skewX: -6 }, { scale: 1, skewX: 0, duration: 0.42, ease: "expo.out", immediateRender: false }, HIT);

          // ---- the cameras: a slow push through the countdown, a nudge on Enter; the poster breathes and settles ----
          tl.fromTo(stA.cam, { z: 1.0 }, { z: 1.045, duration: ENTER, ease: "sine.inOut" }, 0);
          tl.fromTo(stA.cam, { z: 1.065 }, { z: 1.035, duration: 0.6, ease: "elastic.out(1, 0.5)", immediateRender: false }, ENTER);
          tl.fromTo(stC.cam, { z: 1.02 }, { z: 1.0, duration: HIT - CUT, ease: "sine.out", immediateRender: false }, CUT);
          tl.fromTo(stC.cam, { z: 1.03 }, { z: 1.0, duration: 0.7, ease: "elastic.out(1, 0.5)", immediateRender: false }, HIT);
          tl.set({}, {}, DUR);

          // ---- per-frame: the count, the punches, typing, cursors, progress, the camera ----
          const n = $("f37-n"), unit = $("f37-unit"), lab = $("f37-lab"), num = $("f37-num"), sv = $("f37-sv"), sr = $("f37-stripr");
          const cmd = $("f37-cmd"), cur = $("f37-cur"), cur3 = $("f37-cur3"), cmd1 = $("f37-cmd1"), cur1 = $("f37-cur1");
          const blink = (t, since) => t - since < 0.35 || Math.floor((t - since) * 2) % 2 === 0;
          function render() {
            const t = tl.time(), T = T0 + t;
            // the count: the day of the last hit at or before t, and a punch sized by that hit
            let k = 0; for (let i = 0; i < ev.length; i++) if (ev[i][0] <= T + 1e-4) k = i;
            const d = dayAt(k), dt = T - ev[k][0];
            n.textContent = String(d);
            const zero = d === 0;
            n.classList.toggle("f37-zero", zero); n.classList.toggle("hr-glowbox", zero);
            if (zero) HR.glow(n, T, 0.4, 0.5);
            unit.textContent = d === 1 ? "day" : "days";
            const pun = t < ENTER ? ev[k][1] * (0.045 + 0.05 * (d <= 3)) * Math.exp(-Math.max(0, dt) / 0.09) : 0;
            num.style.transform = `scale(${(1 + pun).toFixed(4)})`;
            const after = t >= ENTER;
            lab.textContent = after ? "commits by you" : "reflog expires in";
            if (after) sr.innerHTML = 'commits by you &nbsp;<span class="f37-v">0</span>';
            else { sr.innerHTML = 'reflog expires in &nbsp;<span class="f37-v" id="f37-sv">' + d + (d === 1 ? " day" : " days") + "</span>"; }
            // the unreachable rows fade with the days
            const fade = 1 - 0.5 * (30 - d) / 30;
            gone.forEach((g) => { g.style.color = ""; g.firstElementChild.style.opacity = after ? 1 : fade.toFixed(3); });
            // typing and cursors
            const [kg, sg] = textAt(keysGc, t); cmd.textContent = sg;
            cur.style.opacity = t < ENTER && blink(t, kg) ? 1 : 0;
            cur3.style.opacity = blink(t, at(206.45)) ? 1 : 0;
            const [, sp] = textAt(keysPush, t); cmd1.textContent = sp;
            cur1.style.opacity = t < at(207.5) || Math.floor((DUR - t) * 2) % 2 === 0 ? 1 : 0; // ends lit, as 01 begins
            // gc's progress lines
            OUT.forEach((o, i) => {
              const p = o.d ? Math.max(0, Math.min(1, (T - o.d[0]) / (o.d[1] - o.d[0]))) : 1;
              outs[i].textContent = o.f(p);
            });
            if (t < CUT) stA.apply(T); else stC.apply(t - DUR);
          }
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["37-end"] = tl;
        })();
