          tl.set(push, { opacity: 0, x: -1500 }, 0).set(push, { opacity: 1 }, SLAM - 0.12);
          tl.fromTo(push, { x: -1500 }, { x: 0, duration: 0.12, ease: "power3.in", immediateRender: false }, SLAM - 0.12);
          tl.fromTo(push, { scaleX: 1.06, scaleY: 0.88 }, { scaleX: 1, scaleY: 1, duration: 0.5, ease: "elastic.out(1, 0.45)", immediateRender: false }, SLAM);
          const TICKS = [203.607, 203.831, 204.064, 204.292, 204.503, 204.764].map(at);
          const lrows = root.querySelectorAll(".f37-lrow"), dots = $("f37-dots"), NS = "http://www.w3.org/2000/svg";
          tl.fromTo($("f37-lane"), { strokeDasharray: "100 100", strokeDashoffset: 100 },
            { strokeDasharray: "100 100", strokeDashoffset: 0, duration: TICKS[5] - TICKS[0], ease: "none", immediateRender: true }, TICKS[0]);
          TICKS.forEach((t, i) => {
            const y = 6 + 75 * i, c = document.createElementNS(NS, "circle");
            c.setAttribute("cx", 12); c.setAttribute("cy", y); c.setAttribute("r", 6); dots.appendChild(c);
            tl.fromTo(lrows[i], { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.26, ease: "power3.out", immediateRender: false }, t - 0.02);
            tl.set(c, { opacity: 0 }, 0);
            tl.fromTo(c, { opacity: 0, scale: 0.2, svgOrigin: `12 ${y}` }, { opacity: 1, scale: 1, svgOrigin: `12 ${y}`, duration: 0.3, ease: "back.out(2.2)", immediateRender: false }, t);
          });
          // `push`'s glow flares on the final hit and settles to 01's
          const pg = { v: 0.35 };
          tl.fromTo(pg, { v: 0.35 }, { v: 0.85, duration: 0.05, ease: "none", immediateRender: false }, HIT);
          tl.fromTo(pg, { v: 0.85 }, { v: 0.35, duration: 1.4, ease: "power2.out", immediateRender: false }, HIT + 0.05);

          // ---- C's camera: 01's stage (seed 11); a slow, continuous pull back that ends on 01's t = 0 pose ----
          const stC = HR.stage(C, { seed: 11 });
          tl.fromTo(stC.cam, { z: 1.1, x: -48, y: 18 }, { z: 1.0, x: 0, y: 0, duration: DUR - CUT, ease: "none", immediateRender: false }, CUT);
          // punches: the cut, the slam, the final hit
          const cam = $("f37-cam");
          for (const [t, s, d] of [[CUT, 1.035, 0.4], [SLAM, 1.03, 0.4], [HIT, 1.055, 0.7]]) WOW.punch(tl, cam, t, { s, dur: d });
          // the card breathes on the last kicks and the tail's soft ticks (the kicks fading out, the hats, the two downbeats): small, never still for 2 s
          for (const [T, s, d] of [[203.831, 1.015, 0.22], [204.292, 1.015, 0.2], [204.503, 1.02, 0.25], [205.23, 1.02, 0.5], [205.679, 1.016, 0.45], [206.141, 1.02, 0.45], [206.597, 1.03, 0.6],
            [207.055, 1.02, 0.45], [207.516, 1.02, 0.45], [207.975, 1.016, 0.4], [208.351, 1.03, 0.7]]) WOW.punch(tl, cam, at(T), { s, dur: d });
          WOW.transition(tl, cam, { in: "cut", out: "cut", dur: 0, total: DUR }); // both sides hard (REFINE-1 table)
          tl.set({}, {}, DUR);

          // ---- per frame: the count, the flips, the rows' age, typing, cursors, light, the cameras ----
          const nclip = $("f37-nclip"), n = $("f37-n"), nold = $("f37-nold"), num = $("f37-num"), lab = $("f37-lab"), unit = $("f37-unit"), sr = $("f37-stripr");
          const page = $("f37-page"), cmd = $("f37-cmd"), cur = $("f37-cur"), cmd1 = $("f37-cmd1"), cur1 = $("f37-cur1");
          const glowA = $("f37-glowA"), screenA = $("f37-screenA"), glowC = $("f37-glowC"), screenC = $("f37-screenC");
          gsap.set(screenA, { x: 960, y: 560 }); gsap.set(glowA, { left: 78 * PX, top: 24 * PX });
          gsap.set(screenC, { x: 960, y: 540 }); gsap.set(glowC, { x: 520, y: 640 });
          const blink = (t, since) => t - since < 0.35 || Math.floor((t - since) * 2) % 2 === 0;
          const smooth = (name, T) => (HR.band(name, T - 0.08) + HR.band(name, T) + HR.band(name, T + 0.08)) / 3;
          let lastD = -1;
          function render() {
            const t = tl.time(), T = T0 + t;
            // the count
            let k = 0; for (let i = 0; i < EV.length; i++) if (EV[i] <= T + 1e-4) k = i;
            const d = 30 - k, dt = T - EV[k], zero = d === 0;
            if (d !== lastD) {
              n.textContent = String(d); nold.textContent = String(d + 1);
              n.classList.toggle("f37-zero", zero); n.classList.toggle("hr-glowbox", zero);
              unit.textContent = d === 1 ? "day" : "days";
              lab.innerHTML = zero ? "commits by <i>you</i>" : "reflog expires in";
              sr.innerHTML = zero ? 'commits by you &nbsp;<span class="f37-v">0</span>'
                : 'reflog expires in &nbsp;<span class="f37-v">' + d + (d === 1 ? " day" : " days") + "</span>";
              segs.forEach((s, i) => { s.className = i < d ? "f37-on" : ""; });
              lastD = d;
            }
            // the flip: the old day slides up and out, the new one rises in (shorter in the sixteenth roll)
            const fd = k >= 8 && k < 24 ? 0.07 : 0.11, u = k === 0 ? 1 : clamp01(dt / fd), e = 1 - Math.pow(1 - u, 3);
            n.style.transform = `translateY(${((1 - e) * 46).toFixed(2)}%)`;
            n.style.filter = e < 1 ? `blur(${((1 - e) * 7).toFixed(2)}px)` : "";
            nold.style.transform = `translateY(${(-e * 60).toFixed(2)}%)`;
            nold.style.opacity = (1 - e).toFixed(3);
            nold.style.filter = e > 0 && e < 1 ? `blur(${(e * 7).toFixed(2)}px)` : "";
            nclip.style.clipPath = u < 1 ? "inset(0)" : "inset(-8cqw)"; // clipped only while a leaf flips, so the 0's glow is whole
            if (k > 0 && k < 30 && dt < 0.06) segs[d].className = "f37-now"; // the day being spent flashes as it goes dark
            if (zero) HR.glow(n, T, 0.55, 0.6);
            // a punch per tick, harder on kicks and over the last days; the 0 the hardest
            const amp = zero ? 0.14 : (STRONG[k] ? 0.05 : 0.03) + (d <= 3 ? 0.04 : 0) + (k === 0 ? 0.06 : 0);
            num.style.transform = `scale(${(1 + amp * Math.exp(-Math.max(0, dt) / (zero ? 0.16 : 0.08))).toFixed(4)})`;
            // the unreachable rows dim with age, the oldest first
            ages.forEach((r, i) => { if (!zero) r.style.opacity = Math.max(0.16, 1 - ((30 - d) / 30) * (0.45 + 0.1 * i)).toFixed(3); });
            // typing and the cursor (hidden while gc runs)
            const [kg, sg] = textAt(keysGc, t); cmd.textContent = sg;
            cur.style.opacity = t < ZERO && blink(t, kg) ? 1 : 0;
            const [kp, sp] = textAt(keysPush, t); cmd1.textContent = sp;
            cur1.style.opacity = t < at(203.8) || Math.floor((DUR - t) * 2) % 2 === 0 ? 1 : 0; // ends lit, as 01 begins
            // light: A — the screen glow and the accent glow behind the counter, on the bass; the 0 flares it
            const bass = smooth("bass", T), flare = t >= ZERO ? Math.exp(-(t - ZERO) / 0.25) : 0;
            screenA.style.opacity = (0.055 + 0.02 * smooth("rms", T)).toFixed(4);
            glowA.style.opacity = Math.min(0.3, 0.075 + 0.07 * bass + 0.2 * flare).toFixed(4);
            // C — the accent glow under `push` breathes on the tail and goes out with the last note (01's t = 0 is unlit)
            const on = clamp01((t - CUT) / 0.3) * (1 - clamp01((T - 208.75) / 0.7)), rms = smooth("rms", T);
            const breath = 0.5 + 0.5 * Math.sin((T - 204.764) * 2.4);
            screenC.style.opacity = (on * (0.05 + 0.02 * rms)).toFixed(4);
            glowC.style.opacity = (on * Math.min(0.16, 0.06 + 0.035 * breath + 0.05 * rms + 0.08 * HR.hit("kick", T, 0.25) + 0.06 * HR.hit("hat", T, 0.3) + 0.08 * (pg.v - 0.35))).toFixed(4);
            push.style.setProperty("--f37-pg", pg.v.toFixed(3));
            // the cameras: A's page (36's coordinates, a seeded micro-drift on top); C on 01's stage
            const dx = Math.sin(T * 0.41 + 37) * 4 + Math.sin(T * 0.13 + 74) * 3, dy = Math.sin(T * 0.33 + 111) * 3;
            const x = (50 - camA.s * camA.cx) * PX + dx, y = (28.125 - camA.s * camA.cy) * PX + dy;
            page.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) scale(${camA.s.toFixed(4)})`;
            stC.apply(t - DUR);
            WOW.draw(tl, T0);
          }
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["37-end"] = tl;
        })();
      </script>
    </template>
  </body>
