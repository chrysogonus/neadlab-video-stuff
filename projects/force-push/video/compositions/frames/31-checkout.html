          tl.set($("f31-pageA"), { autoAlpha: 1 }, 0).set($("f31-pageA"), { autoAlpha: 0 }, TURN + TURN_D);
          tl.set($("f31-pageB"), { yPercent: 100, autoAlpha: 0 }, 0).set($("f31-pageB"), { autoAlpha: 1 }, TURN);
          tl.fromTo($("f31-pageB"), { yPercent: 100 }, { yPercent: 0, duration: TURN_D, ease: "power2.inOut", immediateRender: false }, TURN);
          // L50 rises: the camera lands close on the printed command (the strike reads at display size), creeps in
          // through "lease" and "warning", then pulls back faster and faster to the whole page on "go"
          tl.to(pcam, { ...fr(30, 20, 30, 20, 1.12), duration: TURN_D, ease: "power2.inOut" }, TURN);
          tl.to(pcam, { ...fr(30, 20, 30, 20, 1.145), duration: WARN - (TURN + TURN_D), ease: "none" }, TURN + TURN_D);
          tl.to(pcam, { ...fr(30, 20, 30, 20, 1.0), duration: HERE - 0.06 - (WARN + 0.2), ease: "power2.inOut" }, WARN + 0.2);
          // "here I go": the last push gathers speed into the flip
          tl.to(pcam, { ...fr(26, 44, 26, 44, 1.035), duration: GO - (HERE - 0.06), ease: "power2.in" }, HERE - 0.06);

          // ---- L50: no lease, no warning ----
          const wb = root.querySelectorAll("#f31-pageB .f31-v");
          HR.lead(tl, wb[0], SO); HR.lead(tl, wb[1], NO1);
          HR.hero(tl, wb[2], LEASE, { spread: 22, over: 1.16, pre: 0.12, sharp: true });
          // "lease": the marker slashes through `-with-lease` (a fixed bar scaled by a tween: blurred approach, lands sharp)
          tl.fromTo($("f31-strike"), { scaleX: 0, rotation: -1.4 }, { scaleX: 1, rotation: -1.4, duration: 0.14, ease: "power3.out", immediateRender: false }, LEASE + 0.02);
          tl.fromTo($("f31-wl"), { color: "#111111" }, { color: "#5F5B54", duration: 0.3, ease: "power2.out", immediateRender: false }, LEASE + 0.12);
          HR.lead(tl, wb[3], NO2);
          HR.hero(tl, wb[4], WARN, { spread: 24, over: 1.18, pre: 0.12, sharp: true });
          // "warning": no warning — the struck piece is ripped off the page (the fixed-content chip, parked off-frame
          // until then, takes its place and flies; blurred), and the paper jolts
          const chip = $("f31-chip");
          tl.set(chip, { x: 2400, y: 0, rotation: 0 }, 0);
          tl.set($("f31-wl"), { visibility: "visible" }, 0).set($("f31-wl"), { visibility: "hidden" }, WARN);
          tl.set(chip, { x: 0, y: 0, rotation: 0 }, WARN);
          tl.fromTo(chip, { x: 0, y: 0, rotation: 0 }, { x: 1500, y: 760, rotation: 26, duration: 0.42, ease: "power2.in", immediateRender: false }, WARN);
          tl.set(chip, { x: 2400, y: 0, rotation: 0 }, WARN + 0.44);
          WOW.shake(tl, pcam, WARN, { amp: 9, dur: 0.32, rot: 0.3, seed: 31 });
          // the 153.372 downbeat under "long,": a soft breath of the whole sheet
          WOW.punch(tl, cam, at(153.372), { s: 1.015, dur: 0.5 });

          // ---- here I go ----
          HR.lead(tl, wb[5], HERE); HR.lead(tl, wb[6], I);
          HR.hero(tl, wb[7], GO, { spread: 30, over: 1.26, pre: 0.14, sharp: true });
          // the same line on the terminal under the paper: "go" slams there on its own start too
          tl.set(term, { visibility: "hidden" }, 0).set(term, { visibility: "visible" }, GO - 0.02);
          HR.hero(tl, $("f31-tgo"), GO, { spread: 30, over: 1.26, pre: 0.14, sharp: true });

          // ---- the flip: on "go" the sheet peels off from its bottom edge, then whips up and over, onto the drums ----
          const flip = { p: 0 };
          tl.fromTo(flip, { p: 0 }, { p: 1, duration: DRUM - GO - 0.02, ease: "power3.in", immediateRender: false }, GO + 0.02);
          tl.set(sheet, { visibility: "visible" }, 0).set(sheet, { visibility: "hidden" }, DRUM);

          // ---- the terminal: the drum fill punches on every hit while the camera pushes in on the prompt ----
          const fill = [...HR.onsetsIn("kick", T0 + DRUM, T0 + DUR), ...HR.onsetsIn("snare", T0 + DRUM, T0 + DUR)]
            .sort((p, q) => p - q).filter((t, i, a) => i === 0 || t - a[i - 1] > 0.02);
          const strength = (T) => Math.max(HR.hit("kick", T + 0.001, 0.05), HR.hit("snare", T + 0.001, 0.05));
          // the punches stop before the last two hits, so the cut frame is exactly 32's first (no punch left on it)
          fill.filter((T) => T < 160.5).forEach((T, i) => WOW.punch(tl, cam, at(T), { s: 1 + (i === 0 ? 0.04 : 0.012 + 0.014 * strength(T)), dur: i === 0 ? 0.42 : 0.24 }));
          WOW.shake(tl, tcam, DRUM, { amp: 6 + 10 * HR.band("drums", T0 + DRUM + 0.1), dur: 0.42, rot: 0.25, seed: 7 });
          // Round 2: the fill's hits carry the camera. On the drums' entry it slams in on "go"; the next hits walk it back
          // across "here", then up onto the unsent command, reading it a word per hit (`~/us (main) $`, git, push,
          // --force, the cursor); the last kick pulls it back to the whole terminal, landing ON the cut (32's first frame,
          // the prompt at 5.5/28.2cqw, 4.2cqw, unscaled). Each step is a fast eased glide (0.13 s, then sharp until the next hit), blurred by its own speed.
          const CAM_STEPS = [
            [at(158.875), "go", 1.75, 0.58, 0.56], [at(159.104), "here", 1.75, 0.42, 0.56],
            [at(159.332), "pfx", 2.15, 0.5, 0.46], [at(159.561), "git", 2.15, 0.5, 0.46], [at(159.791), "push", 2.2, 0.5, 0.46],
            [at(160.022), "force", 2.3, 0.5, 0.46], [at(160.252), "block", 2.65, 0.5, 0.46], [at(160.531), null, 1, 0, 0],
          ];
          tl.set({}, {}, DUR);
          // deliberate: a hero's gathering glyphs and the sheet folded edge-on overlap their own neighbours for a few frames
          root.querySelectorAll("#f31-pageB .f31-bl, #f31-pageB .f31-bl *, #f31-b3, #f31-b3 *, #f31-flag, #f31-flag *, #f31-cmd1, #f31-cmd1 *")
            .forEach((el) => el.setAttribute("data-layout-allow-overlap", ""));

          // ---- per-frame state: the reading pointer, the lamp, the glows, the turn's blur, the flip, the cursor ----
          const rows = Array.from(root.querySelectorAll(".f31-row")), lamp = $("f31-lamp"), aglow = $("f31-aglow");
          const shade = $("f31-shade"), tglow = $("f31-tglow"), block = $("f31-block"), tgo = $("f31-tgo");
          const pageA = $("f31-pageA"), pageB = $("f31-pageB");
          // the camera's targets on the terminal (tcam px, measured after the fonts: a point's centre)
          const promptEl = $("f31-prompt"), t3 = $("f31-t3");
          const TGT = { go: [t3, tgo], here: [t3, $("f31-there")], pfx: [promptEl, $("f31-tpfx")], git: [promptEl, $("f31-pgit")],
            push: [promptEl, $("f31-ppush")], force: [promptEl, $("f31-pforce")], block: [promptEl, block] };
          // fixed layout (only transforms move these), so the measure is cached once the fonts are in
          const cache = {};
          const centre = (k) => {
            if (cache[k]) return cache[k];
            const [box, el] = TGT[k], c = [box.offsetLeft + el.offsetLeft + el.offsetWidth / 2, box.offsetTop + el.offsetTop + el.offsetHeight / 2];
            if (!document.fonts || document.fonts.status === "loaded") cache[k] = c;
            return c;
          };
          const e3o = gsap.parseEase("power3.out");
          // a framing: [x, y, z] = tcam translate (px) and scale with origin 0 0; neutral = [0, 0, 1]
          const frameOf = (st) => { if (!st[1]) return [0, 0, 1]; const [cx, cy] = centre(st[1]), z = st[2]; return [st[3] * 1920 - cx * z, st[4] * 1080 - cy * z, z]; };
          function tcamAt(t) {
            let cur = [0, 0, 1];
            for (let i = 0; i < CAM_STEPS.length; i++) {
              const st = CAM_STEPS[i]; if (t < st[0]) break;
              const next = i + 1 < CAM_STEPS.length ? CAM_STEPS[i + 1][0] : DUR;
              const d = Math.min(0.13, next - st[0]), u = i === CAM_STEPS.length - 1 ? e3o(Math.min(1, (t - st[0]) / (DUR - st[0]))) : e3o(Math.min(1, (t - st[0]) / d));
              const to = frameOf(st);
              cur = [cur[0] + (to[0] - cur[0]) * u, cur[1] + (to[1] - cur[1]) * u, cur[2] + (to[2] - cur[2]) * u];
            }
            return cur;
          }
          const lerp = (a, b, u) => a + (b - a) * Math.max(0, Math.min(1, u));
          let lastTurn = 0, lastFlip = 0, lastT = -1;
          function render() {
            const t = tl.time(), T = T0 + t;
            // the row under the pointer reads in ink (the target stays lit once found)
            const y = gsap.getProperty(list, "y") || 0;
            rows.forEach((r, i) => r.classList.toggle("f31-on", Math.abs(i * ROW + y - SLOT * ROW) < ROW * 0.5 || (r === tgt && t >= AGO)));
            // the lamp breathes with the pads (no bass here) and follows what is read
            const pad = HR.band("rms", T), voc = HR.band("vocal", T);
            const ph2 = t >= TURN;
            lamp.style.setProperty("--lx", (ph2 ? 40 : 58).toFixed(1) + "%");
            lamp.style.setProperty("--ly", (ph2 ? 58 : 50).toFixed(1) + "%");
            lamp.style.opacity = (1.05 - 0.4 * pad).toFixed(3);
            // the accent light behind the object: the lyric and the reflog's pointer, then the struck flag
            const gx = ph2 ? 47 : lerp(66, 30, (t - CHECKED) / (AGO - CHECKED)), gy = ph2 ? 34 : lerp(20, 44, (t - CHECKED) / (AGO - CHECKED));
            aglow.style.left = gx.toFixed(2) + "cqw"; aglow.style.top = gy.toFixed(2) + "cqw";
            const leaseGlow = t >= LEASE ? Math.exp(-(t - LEASE) / 0.7) * 0.06 : 0;
            aglow.style.opacity = (0.06 + 0.05 * voc + leaseGlow).toFixed(3);
            // the turn: the pages blur with their speed (approach blurred, landing sharp)
            const sp = t >= TURN && t <= TURN + TURN_D ? Math.sin(Math.PI * (t - TURN) / TURN_D) : 0;
            pageA.style.filter = sp > 0.05 ? `blur(${(7 * sp).toFixed(1)}px)` : "";
            pageB.style.filter = sp > 0.05 && t < SO + 0.06 ? `blur(${(5 * sp).toFixed(1)}px)` : "";
            // the flip: hinge at the top, the bottom edge leaves into the desk's depth and the sheet flies up and away
            const p = flip.p, th = 104 * p;
            const vel = lastT >= 0 && t > lastT && t - lastT < 0.1 ? (p - lastFlip) / (t - lastT) : 0;
            if (p > 0 && t < DRUM) {
              sheet.style.transform = `translateY(${(-p * p * 14 * PX).toFixed(1)}px) rotateX(${(-th).toFixed(2)}deg) rotateZ(${(-2.2 * p).toFixed(2)}deg)`;
              sheet.style.filter = vel > 1.2 ? `blur(${Math.min(9, (vel - 1.2) * 1.6).toFixed(1)}px)` : "";
              shade.style.opacity = Math.min(1, Math.sin((th * Math.PI) / 180) * 0.75).toFixed(3);
            } else { sheet.style.transform = ""; sheet.style.filter = ""; shade.style.opacity = 0; }
            lastFlip = p; lastT = t;
            // the terminal: a fire glow behind "go", breathing with the drums; the cursor flickers with the fill's hits
            const dr = HR.band("drums", T), hit = Math.max(HR.hit("kick", T, 0.12), HR.hit("snare", T, 0.12));
            tglow.style.opacity = t >= GO ? (0.07 + 0.05 * dr + 0.05 * hit).toFixed(3) : 0;
            tgo.classList.toggle("hr-glowbox", t >= GO);
            tgo.style.setProperty("--hr-glow", (0.35 + 0.35 * dr + 0.4 * hit).toFixed(3));
            block.style.opacity = t < DRUM ? 1 : (t - DRUM < 0.3 || hit > 0.35 ? 1 : 0.15);
            // the hit-carried camera on the terminal, blurred by its own speed (render-driven: a plain CSS blur)
            const [tx, ty, tz] = tcamAt(t), [px, py, pz] = tcamAt(Math.max(0, t - 1 / 60));
            const neutral = Math.abs(tz - 1) < 1e-4 && Math.abs(tx) < 0.05 && Math.abs(ty) < 0.05;
            tcam.style.transform = t >= DRUM - 0.001 && !neutral ? `translate(${tx.toFixed(2)}px, ${ty.toFixed(2)}px) scale(${tz.toFixed(4)})` : "";
            const csp = Math.hypot(tx - px, ty - py) + 900 * Math.abs(tz - pz);
            tcam.style.filter = t >= DRUM && csp > 20 ? `blur(${Math.min(6, (csp - 20) / 12).toFixed(1)}px)` : "";
            WOW.draw(tl, T0);
          }
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["31-checkout"] = tl;
        })();
      </script>
    </template>
  </body>
