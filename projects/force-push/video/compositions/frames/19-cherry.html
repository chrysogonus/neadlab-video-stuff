          const WAVES = [REST, at(97.293), at(97.768), at(98.229), at(98.668)]; // the rest falls on the kicks

            tl.fromTo(p, { k: 0 }, { k: 1, duration: 0.42, ease: "power3.inOut" }, SLIDE + i * 0.03);
            tl.fromTo(p, { sc: 1.35 }, { sc: 1.6, duration: 0.5, ease: "elastic.out(1, 0.5)", immediateRender: false }, TREE + 0.06 + i * 0.09);

          const keys1 = [[0, "git cherry-pick"]];

          const keys2 = [[0, ""]];

          const ROW2 = at(94.62), ENTER1 = PICK_K[0], ENTER2 = REST;
          tl.set($("f19-row2"), { opacity: 0 }, 0).set($("f19-row2"), { opacity: 1 }, ROW2);

          tl.fromTo($("f19-rows"), { y: 0 }, { y: -1.65 * 19.2, duration: 0.12, ease: "power2.out" }, DONE);

          HR.hero(tl, $("f19-cherry"), CHERRY, { spread: 30, over: 1.2, pre: 0.06, sharp: true });
          HR.hero(tl, $("f19-picked"), CHERRY + 0.02, { spread: 18, over: 1.14, pre: 0.06, sharp: true, skew: false });
          const a = root.querySelectorAll(".f19-a");
          [THE, GOOD, DAYS, THERE, WERE].forEach((t, i) => HR.lead(tl, a[i], t));
          HR.hero(tl, $("f19-three"), THREE, { spread: 22, over: 1.24, pre: 0.1, sharp: true });
          HR.exit(tl, $("f19-l1"), REB - 0.19, { dir: -1, dur: 0.14, stagger: 0.003 });
          HR.hero(tl, $("f19-rebased"), REB, { spread: 30, over: 1.2, pre: 0.1, sharp: true });
          const b = root.querySelectorAll(".f19-b");
          [THE2, REST, RIGHT, OUT, OF, MY].forEach((t, i) => HR.lead(tl, b[i], t));
          HR.hero(tl, $("f19-tree"), TREE, { spread: 20, over: 1.24, pre: 0.1, sharp: true });

          // the calendar's frame goes with the days it framed; the caption `3 good days` stays

          const n = $("f19-n");

          tl.fromTo(cam, { z: 1.0, y: 0, x: 0 }, { z: 1.004, duration: CHERRY - 0.05, ease: "none" }, 0);
          tl.to(cam, { z: 1.004 + punch(DRUMS), y: -4, duration: 0.05, ease: "power2.in" }, CHERRY - 0.05);
          tl.to(cam, { z: 1.01, y: 0, duration: 0.6, ease: "elastic.out(1, 0.5)" }, CHERRY);

          tl.to(cam, { z: 1.04 + punch(TREE), duration: 0.05, ease: "power2.in" }, TREE - 0.05);
          tl.to(cam, { z: 1.042, duration: 0.55, ease: "elastic.out(1, 0.5)" }, TREE);
          tl.to(cam, { z: 1.05, y: 4, duration: DUR - TREE - 0.55, ease: "none" }, TREE + 0.55);

          const cv = $("f19-cv"), dpr = Math.min(2, window.devicePixelRatio || 1);

          };

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, 1920, 1080);

            for (const q of days) {
              if (q.picked >= 0) continue;
              // the days light up with the drums, left to right
              let lv = t >= WAKE + (q.col / 52) * 0.3 ? q.lv : 0;
              if (q.b === scanB && Math.abs(q.col - scanC) < 2.2) lv = Math.max(lv, 2);
              if (t >= REB) lv = Math.min(lv, 1);              // "the rest" dims on "rebased"
              let x = q.x + S / 2, y = q.y + S / 2, rot = 0;
              if (t >= q.rel) {
                const dt = t - q.rel;
                x += q.vx * dt; y += q.vy * dt + 0.5 * G * dt * dt; rot = q.w * dt;
                if (y > 1110) continue;
              } else if (shiver) {                               // smooth ~11 Hz tremble before the fall, never random per frame
                x += Math.sin(t * 69 + q.ph) * 1.4 * shiver; y += Math.sin(t * 61 + q.ph2) * 1.4 * shiver;
              }
              if (rot) { ctx.save(); ctx.translate(x, y); ctx.rotate(rot); sq(0, 0, S, LV[lv], lv ? null : "#282826"); ctx.restore(); }
              else sq(x, y, S, LV[lv], lv ? null : "#282826");
            }
            // the trunk: a fire lane through the three picks
            const pos = pk.map((p) => {
              const x0 = p.q.x + S / 2, y0 = p.q.y + S / 2;
              return [x0 + (TX - x0) * p.k, y0 + (TY[pk.indexOf(p)] - y0) * p.k];
            });
            if (lane.p > 0) {
              ctx.strokeStyle = "#E85D26"; ctx.lineWidth = 3;
              ctx.beginPath(); ctx.moveTo(TX, TY[0]); ctx.lineTo(TX, TY[0] + (TY[2] - TY[0]) * lane.p); ctx.stroke();
            }
            // the picks
            const glow = 0.5 + 0.5 * HR.band("bass", T) + 0.5 * HR.hit("kick", T, 0.2);
            pk.forEach((p, i) => {
              const [x, y] = pos[i], q = p.q;
              if (p.fill) {
                ctx.save(); ctx.shadowColor = "rgba(232, 93, 38, 0.7)"; ctx.shadowBlur = 10 + 14 * glow;
                sq(x, y, S * p.sc, "#E85D26"); ctx.restore();
              } else {
                const lv = t >= WAKE + (q.col / 52) * 0.3 ? q.lv : 0;
                sq(x, y, S, LV[lv], lv ? null : "#282826");
                if (p.ring) { ctx.strokeStyle = "#E85D26"; ctx.lineWidth = 2; const r = S / 2 + 3 + 6 * (1 - p.ring); ctx.strokeRect(x - r, y - r, 2 * r, 2 * r); }
              }

            const [k1, s1] = textAt(keys1, t), [k2, s2] = textAt(keys2, t);
            c1.textContent = s1; c2.textContent = s2;
            cur1.style.opacity = t < ENTER1 && blink(t, k1) ? 1 : 0;
            cur2.style.opacity = t >= ROW2 && t < ENTER2 && blink(t, Math.max(k2, ROW2)) ? 1 : 0;
            n.textContent = t >= THREE ? "3" : "1";
            const good = t >= THREE;
            cap1.style.display = good ? "none" : ""; cap2.style.display = good ? "" : "none";
            // the accent points at the current hero: cherry → three → rebased → tree
            const hot = t < THREE ? "cherry" : t < REB ? "three" : t < TREE ? "rebased" : "tree";
            for (const [k, el] of Object.entries(words)) {
              const on = k === hot; el.classList.toggle("f19-fire", on); el.classList.toggle("hr-glowbox", on);
            }
            HR.glow(words[hot], T, 0.3, 0.45);
            drawGrid(t, T);
            HR.draw(tl);
            stage.apply(T);
          }
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["19-cherry"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
