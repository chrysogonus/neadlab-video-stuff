    <!-- Frame 11 — rewrote (chorus 1, L16, 56.291–60.780). Refinement round 1. The mirror of 10: the log at the left,
         the line at the right. `git rebase -i --root --force-rebase` has run; the log is rewritten as she sings it.
         The cut is a whipL out of 10 (0.1 s on this side: "i" starts 0.109 s in). The log is a lit terminal panel
         (10's history panel, a fire edge) with poster-size hashes. Real git order: the new commits are made oldest
         first, so the wave climbs the column, one SHA per kick from "rewrote" (56.5): the front (a fire glow, a scan
         line, the cursor) travels up ~30 cqw, each new hash scrambles in fire and pops, `Rebasing (n/6)` counting
         (a drop is not counted); the camera tilts up and pushes with it. On "no" (59.06) the wave reaches
         `3f2a1c9 you and me`: it lights and swells to hash size while the camera snaps back and the line reflows;
         on "you" (59.28) it is struck; on the 59.523 downbeat it drops out of the log and falls off the frame
         (motion-blurred), the rows under it closing the gap while the top row becomes e81b0d4 (the new tip 10 pushed).
         `Successfully rebased…` lands on the 59.974 kick and the panel's edge lights. The out is a 0.25 s whipR
         into 12. -->
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Barlow"; src: url("assets/fonts/barlow-800.woff2") format("woff2"); font-weight: 800; }
        @font-face { font-family: "Barlow"; src: url("assets/fonts/barlow-900.woff2") format("woff2"); font-weight: 900; }
        @font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/ibm-plex-mono-400.woff2") format("woff2"); font-weight: 400; }
        @font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/ibm-plex-mono-500.woff2") format("woff2"); font-weight: 500; }
        @font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/ibm-plex-mono-600.woff2") format("woff2"); font-weight: 600; }
        #root {
          position: absolute; inset: 0; overflow: hidden; container-type: size;
          --ink: #0A0A0A; --ink-alt: #1A1A18; --fire: #E85D26; --cream: #F0ECE5;
          --cream-muted: #888880; --cream-hint: #505048; --border: #282826;
          background: var(--ink); color: var(--cream);
        }
        #f11-cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
        #f11-strip { position: absolute; left: 5.5cqw; right: 5.5cqw; top: 3.4cqw; display: flex; justify-content: space-between;
          font: 500 0.78cqw/1.5 "IBM Plex Mono", monospace; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cream-muted);
          padding-bottom: 0.6cqw; border-bottom: 1px solid var(--border); }
        #f11-strip b { color: var(--fire); font-weight: 600; }
        /* the log, rewritten: a lit terminal panel (10's history panel), poster-size hashes */
        #f11-log { position: absolute; left: 3.9cqw; top: 6.8cqw; width: 42.6cqw; padding: 1.3cqw 1.6cqw; background: #121211;
          border: 1px solid var(--border); border-top-color: #3A3A36; }
        #f11-edge { position: absolute; left: -1px; top: -1px; bottom: -1px; width: 0.3cqw; background: var(--fire); }
        #f11-cmd { font: 500 1.15cqw/1.4 "IBM Plex Mono", monospace; color: var(--cream-muted); white-space: pre; }
        #f11-cmd b { color: var(--cream); font-weight: 500; }
        #f11-head { margin-top: 1cqw; font: 500 0.78cqw/1.5 "IBM Plex Mono", monospace; letter-spacing: 0.14em; text-transform: uppercase;
          color: var(--cream-muted); padding-bottom: 0.6cqw; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        #f11-head b { color: var(--cream); font-weight: 600; }
        #f11-rows { position: relative; margin-top: 0.6cqw; height: 35cqw; }
        /* the wave's light: a fire glow and a scan line at the row being rewritten (placed in render()) */
        #f11-glow { position: absolute; left: 9.8cqw; top: 0; width: 66cqw; height: 34cqw; margin: -17cqw 0 0 -26cqw; pointer-events: none;
          background: radial-gradient(closest-side, rgba(232, 93, 38, 0.17) 0%, rgba(232, 93, 38, 0.1) 38%, rgba(232, 93, 38, 0.045) 70%, rgba(232, 93, 38, 0) 100%); }
        #f11-scan { position: absolute; left: -1.6cqw; right: -1.6cqw; top: 0; height: 2px; background: var(--fire); }
        .f11-row { position: relative; height: 5cqw; padding-left: 2.6cqw; white-space: nowrap; color: var(--cream-muted); transform-origin: 0% 50%; }
        .f11-txt { position: relative; display: inline-block; line-height: 5cqw; }
        .f11-h { font: 500 3.4cqw/5cqw "IBM Plex Mono", monospace; letter-spacing: -0.01em; color: var(--cream-muted); }
        .f11-m { font: 400 1.9cqw/5cqw "IBM Plex Mono", monospace; margin-left: 1.6cqw; }
        .f11-row.f11-new .f11-h { color: var(--cream); font-weight: 600; }
        .f11-row .f11-h.f11-hot { color: var(--fire); font-weight: 600; }
        .f11-row.f11-mark, .f11-row.f11-mark .f11-h { color: var(--fire); font-weight: 600; }
        .f11-x { position: absolute; left: -0.5cqw; right: -0.5cqw; top: 2.36cqw; height: 0.42cqw; background: var(--fire); transform-origin: 0% 50%; transform: scaleX(0); }
        /* the dropped commit, falling: a fixed copy of the struck row (motion blur needs fixed content) */
        /* the dropped commit's message is set at hash size and starts scaled to the others' size; it swells on "no" */
        #f11-dropm { display: inline-block; font-size: 3.4cqw; transform-origin: 0% 75.5%; transform: scale(0.559); }
        #f11-fall { position: absolute; left: 0; top: 5cqw; width: 42.6cqw; opacity: 0; transform-origin: 20% 50%; }
        #f11-fall .f11-m { font-size: 3.4cqw; font-weight: 600; }
        #f11-fall .f11-x { transform: none; }
        #f11-cur { position: absolute; left: 0.5cqw; top: 1.35cqw; width: 1.15cqw; height: 2.45cqw; background: var(--fire); }
        #f11-status { margin-top: 0.8cqw; font: 400 1.35cqw/1.5 "IBM Plex Mono", monospace; color: var(--cream-muted); white-space: pre; height: 2cqw; }
        #f11-status.f11-done { color: var(--cream); }
        /* the line: right-aligned, poster scale, a glow behind the word being sung */
        #f11-hglow { position: absolute; left: 0; top: 0; width: 76cqw; height: 46cqw; margin: -23cqw 0 0 -38cqw; pointer-events: none;
          background: radial-gradient(closest-side, rgba(232, 93, 38, 0.13) 0%, rgba(232, 93, 38, 0.075) 40%, rgba(232, 93, 38, 0.03) 72%, rgba(232, 93, 38, 0) 100%); }
        .f11-lyric { position: absolute; right: 5.5cqw; text-align: right; color: var(--cream); white-space: nowrap; }
        .f11-lyric > div { white-space: nowrap; }
        #f11-past { top: 8.4cqw; font: 900 11cqw/0.9 "Barlow", sans-serif; letter-spacing: -0.045em; transform-origin: 100% 0%; }
        #f11-now { top: 31.6cqw; font: 900 10.2cqw/0.92 "Barlow", sans-serif; letter-spacing: -0.045em; }
        #f11-now .f11-small { font-weight: 800; font-size: 0.64em; letter-spacing: -0.035em; line-height: 1.12; }
        .f11-hero { color: var(--fire); }
      </style>
      <div id="root" data-composition-id="11-rewrote" data-width="1920" data-height="1080" data-duration="4.489">
        <div id="f11-cam">
          <div class="hr-layer" data-depth="0.15">
            <div id="f11-strip"><span>~/us &nbsp;·&nbsp; main</span><span>commits by you on origin &nbsp;<b>0</b></span></div>
          </div>

          <div class="hr-layer" data-depth="0.5">
            <div id="f11-log">
              <i id="f11-edge" data-layout-ignore></i>
              <div id="f11-cmd">~/us (main) $ <b>git rebase -i --root --force-rebase</b></div>
              <div id="f11-head"><span>git log --oneline</span><b>main</b></div>
              <div id="f11-rows">
                <i id="f11-glow" data-layout-ignore></i>
                <i id="f11-scan" data-layout-ignore></i>
                <div class="f11-row"><span class="f11-txt"><span class="f11-h">7e2b9a4</span><span class="f11-m">ready.</span></span></div>
                <div class="f11-row" id="f11-drop"><span class="f11-txt"><span class="f11-h">3f2a1c9</span><span class="f11-m" id="f11-dropm">you and me</span><i class="f11-x"></i></span></div>
                <div class="f11-row"><span class="f11-txt"><span class="f11-h">a7c21f0</span><span class="f11-m">we'll get to it</span></span></div>
                <div class="f11-row"><span class="f11-txt"><span class="f11-h">4c9d7a1</span><span class="f11-m">just a feature</span></span></div>
                <div class="f11-row"><span class="f11-txt"><span class="f11-h">91be33a</span><span class="f11-m">moved in</span></span></div>
                <div class="f11-row"><span class="f11-txt"><span class="f11-h">0b5f6e2</span><span class="f11-m">nothing on the side</span></span></div>
                <div class="f11-row"><span class="f11-txt"><span class="f11-h">5d0a8c4</span><span class="f11-m">initial commit</span></span></div>
                <div class="f11-row f11-mark" id="f11-fall" data-layout-ignore data-hf-motion-blur='{"fps": 60}'><span class="f11-txt"><span class="f11-h">3f2a1c9</span><span class="f11-m">you and me</span><i class="f11-x"></i></span></div>

          <div class="hr-layer" data-depth="0.9">
            <i id="f11-hglow" data-layout-ignore></i>
            <div class="f11-lyric" id="f11-past">
              <div><span class="f11-w">i</span> <span class="f11-w f11-hero hr-glow" id="f11-rewrote">rewrote</span></div>
              <div><span class="f11-w">the</span> <span class="f11-w f11-hero hr-glow" id="f11-pastw">past,</span></div>
            </div>
            <div class="f11-lyric" id="f11-now">
              <div class="f11-small"><span class="f11-w">there's</span> <span class="f11-w">no</span></div>
              <div><span class="f11-w f11-hero hr-glow" id="f11-you">you</span> <span class="f11-w">and</span> <span class="f11-w">me</span></div>
            </div>
          </div>
        </div>
      </div>
      <script src="assets/kit/env.js"></script>
      <script src="assets/kit/hr-kit.js"></script>
      <script src="assets/kit/wow-kit.js"></script>
      <script src="assets/kit/motion-blur.js"></script>
      <script>
        (() => {
          const DUR = 4.489, T0 = 56.291;
          const root = document.querySelector('[data-composition-id="11-rewrote"]');
          const $ = (id) => root.querySelector("#" + id);
          const PX = (root.clientWidth || 1920) / 100; // 1cqw
          const stage = HR.stage(root, { seed: 11 });
          const tl = gsap.timeline({ paused: true });
          const at = (T) => T - T0;
          const cam = $("f11-cam");

          // ---- the cuts: whipL in from 10 (0.1 s: "i" starts 0.109 s in), whipR out into 12 (from 60.53, after "me"'s first 0.39 s) ----
          WOW.transition(tl, cam, { in: "whipL", dur: 0.1, start: -0.05 });
          WOW.transition(tl, cam, { out: "whipR", dur: 0.25, total: DUR });

          // ---- the sung line (lyrics.json L16) ----
          const w = root.querySelectorAll(".f11-w");
          const REWROTE = at(56.5), PAST = at(58.48), NO = at(59.06), YOU = at(59.28);
          HR.lead(tl, w[0], at(56.4));
          HR.hero(tl, w[1], REWROTE, { spread: 30, over: 1.2, pre: 0.1, sharp: true });
          HR.lead(tl, w[2], at(57.66));
          HR.hero(tl, w[3], PAST, { spread: 30, over: 1.2, pre: 0.12, sharp: true });
          HR.lead(tl, w[4], at(58.8));
          HR.lead(tl, w[5], NO);
          HR.hero(tl, w[6], YOU, { spread: 26, over: 1.22, pre: 0.1, sharp: true });
          HR.lead(tl, w[7], at(59.94)); HR.lead(tl, w[8], at(60.14));
          // the accent points at what is being sung: each hero cools to cream when the next one lands
          const rewrote = $("f11-rewrote"), pastw = $("f11-pastw"), you = $("f11-you");
          tl.fromTo(rewrote, { color: "#E85D26" }, { color: "#F0ECE5", duration: 0.3, immediateRender: false }, PAST);
          tl.fromTo(pastw, { color: "#E85D26" }, { color: "#F0ECE5", duration: 0.3, immediateRender: false }, YOU);
          // on "no" the past steps back (still phone-legible at 0.52) and "there's no / you and me" rises to take the frame
          tl.fromTo($("f11-past"), { scale: 1, y: 0 }, { scale: 0.52, y: -0.4 * PX, duration: 0.3, ease: "power3.inOut", immediateRender: false }, NO - 0.08);
          tl.fromTo($("f11-now"), { y: 0 }, { y: -10.6 * PX, duration: 0.3, ease: "power3.inOut", immediateRender: false }, NO - 0.08);

          // ---- the rebase: new commits are made oldest first, so the wave climbs; one SHA per kick ----
          const rows = Array.from(root.querySelectorAll(".f11-row:not(#f11-fall)"));
          const NEW = ["e81b0d4", null, "6b1e9f3", "d27a0c5", "8f4c61b", "1a93e7d", "b05d2f8"];
          const DROP = at(59.523), SUCCESS = at(59.974), RH = 5 * PX;
          // [row, time] in rebase order (bottom row first); row 1 is the dropped commit
          const steps = [[6, REWROTE], [5, at(56.749)], [4, at(57.212)], [3, at(57.675)], [2, at(58.154)], [1, YOU], [0, DROP]];
          const SCR = 0.2; // a SHA scrambles for 0.2 s and resolves left to right
          rows.forEach((r) => { const h = r.querySelector(".f11-h"); h.dataset.old = h.textContent; });
          // the front of the wave (in rows): it starts on the oldest commit and climbs a row per kick; it reaches
          // `you and me` on "no"
          const FR = { y: 6 };
          [[5, at(56.749)], [4, at(57.212)], [3, at(57.675)], [2, at(58.154)], [1, NO]].forEach(([ri, ts]) => {
            tl.fromTo(FR, { y: ri + 1 }, { y: ri, duration: 0.2, ease: "power3.out", immediateRender: false }, ts - 0.03);
          });
          // the dropped row: lit and swelled to hash size on "no", struck on "you", gone on the downbeat — it falls out
          // of the log and off the frame while the rows under it close the gap
          const drop = $("f11-drop"), fall = $("f11-fall");
          tl.fromTo($("f11-dropm"), { scale: 0.559 }, { scale: 1, duration: 0.22, ease: "power3.out", immediateRender: false }, NO - 0.04);
          tl.fromTo(drop.querySelector(".f11-x"), { scaleX: 0 }, { scaleX: 1, duration: 0.12, ease: "power2.out" }, YOU);
          tl.set(drop, { opacity: 1 }, 0).set(drop, { opacity: 0 }, DROP);
          tl.set(fall, { opacity: 0 }, 0).set(fall, { opacity: 1 }, DROP).set(fall, { opacity: 0 }, DROP + 0.44);
          tl.fromTo(fall, { y: 0, rotation: 0 }, { y: 46 * PX, rotation: 8, duration: 0.44, ease: "power2.in", immediateRender: false }, DROP);
          // the list closes the gap: the rows under it move up a slot as the dropped one clears them; the front goes to HEAD
          tl.fromTo(rows.slice(2), { y: 0 }, { y: -RH, duration: 0.3, ease: "power3.inOut", immediateRender: false }, DROP + 0.1);
          tl.fromTo(FR, { y: 1 }, { y: 0, duration: 0.2, ease: "power3.out", immediateRender: false }, DROP - 0.03);

          // ---- the camera: the frame tilts up and pushes with the wave, snaps back on "no" with the reflow, then
          //      drifts toward the whip; punches on the heroes and the kicks, sized by the measured drums ----
          const c = stage.cam;
          tl.fromTo(c, { z: 1.0, x: 0, y: 0 }, { z: 1.06, x: 24, y: -90, duration: NO - 0.08, ease: "sine.inOut" }, 0);
          tl.fromTo(c, { z: 1.06, x: 24, y: -90 }, { z: 1.0, x: 0, y: 0, duration: 0.3, ease: "power3.inOut", immediateRender: false }, NO - 0.08);
          tl.fromTo(c, { z: 1.0, x: 0, y: 0 }, { z: 1.05, x: -46, y: -14, duration: DUR - (NO + 0.22), ease: "sine.in", immediateRender: false }, NO + 0.22);
          const kp = (s, base) => 1 + base * (0.6 + 0.6 * HR.band("drums", s));
          [[56.5, 0.03], [56.749, 0.012], [57.212, 0.012], [57.675, 0.018], [58.154, 0.012], [58.48, 0.03], [59.28, 0.035], [59.974, 0.02], [60.441, 0.014]]
            .forEach(([s, b]) => WOW.punch(tl, cam, at(s), { s: kp(s, b), dur: 0.4 }));
          WOW.shake(tl, cam, DROP + 0.01, { amp: 9, dur: 0.34, rot: 0.25, seed: 11 });
          tl.set({}, {}, DUR);

          // ---- per-frame state: SHAs, the wave's front, cursor, status, light, camera ----
          const cur = $("f11-cur"), status = $("f11-status"), glow = $("f11-glow"), scan = $("f11-scan"), edge = $("f11-edge");
          const hglow = $("f11-hglow");
          const HEXL = "0123456789abcdef";
          const blink = (t, since) => t - since < 0.35 || Math.floor((t - since) * 2) % 2 === 0;
          const popE = (d) => (d < 0 || d > 0.45 ? 0 : Math.pow(1 - d / 0.45, 3));
          function render() {
            const t = tl.time(), T = T0 + t;
            let step = -1;
            steps.forEach(([ri, ts], n) => {
              if (t >= ts) step = n;
              if (ri === 1) return; // dropped: never rewritten
              const row = rows[ri], h = row.querySelector(".f11-h"), nw = NEW[ri];
              const pop = 1 + 0.1 * popE(t - ts);
              row.style.scale = pop !== 1 ? pop.toFixed(4) : "";
              if (t < ts) { h.textContent = h.dataset.old; h.classList.remove("f11-hot"); row.classList.remove("f11-new"); return; }
              const p = (t - ts) / SCR, tick = Math.floor(t * 30);
              let s = "";
              for (let i = 0; i < 7; i++) s += p >= (i + 1) / 8 ? nw[i] : HEXL[(ri * 7 + tick * 5 + i * 3) % 16];
              h.textContent = s;
              h.classList.toggle("f11-hot", p < 1.6);
              row.classList.add("f11-new");
            });
            // the front: the glow and the scan line ride it; the cursor rides it while the rebase runs, then blinks on HEAD
            const fy = FR.y * RH;
            glow.style.top = (fy + RH / 2).toFixed(1) + "px";
            scan.style.transform = `translateY(${(fy + RH - 2).toFixed(1)}px)`;
            const bass = HR.band("bass", T), kick = HR.hit("kick", T, 0.22);
            const swell = t >= SUCCESS ? 0.45 * Math.exp(-(t - SUCCESS) / 0.5) : 0;
            glow.style.opacity = Math.min(1, 0.62 + 0.3 * bass + 0.28 * kick + swell).toFixed(3);
            scan.style.opacity = (step < 0 ? 0.35 : t >= SUCCESS ? 0.5 : 0.9).toFixed(2);
            if (step < 0) { cur.style.opacity = 0; }
            else {
              cur.style.transform = `translateY(${fy.toFixed(2)}px)`;
              cur.style.opacity = blink(t, steps[step][1]) ? 1 : 0;
            }
            status.textContent = t >= SUCCESS ? "Successfully rebased and updated refs/heads/main." : step >= 0 ? `Rebasing (${Math.min(step + 1, 6)}/6)` : "";
            status.classList.toggle("f11-done", t >= SUCCESS);
            drop.classList.toggle("f11-mark", t >= NO);
            // the panel's fire edge lights when the rebase succeeds
            edge.style.boxShadow = t >= SUCCESS ? `0 0 ${(18 + 26 * swell + 10 * bass).toFixed(1)}px rgba(232, 93, 38, 0.55)` : "";
            // the light behind the line: on "rewrote / past," then on "you and me", following the reflow
            const k = Math.max(0, Math.min(1, (t - (NO - 0.08)) / 0.3)), ke = k * k * (3 - 2 * k);
            hglow.style.transform = `translate(${((72 + (66 - 72) * ke) * PX).toFixed(1)}px, ${((18 + (33 - 18) * ke) * PX).toFixed(1)}px)`;
            hglow.style.opacity = (t < REWROTE - 0.1 ? 0 : Math.min(1, 0.6 + 0.35 * bass + 0.3 * kick)).toFixed(3);
            HR.glow(rewrote, T, 0.3, 0.45); HR.glow(pastw, T, 0.3, 0.45); HR.glow(you, T, 0.3, 0.45);
            if (t >= PAST) rewrote.style.setProperty("--hr-glow", "0"); // cooled: no glow once the accent has moved on
            if (t >= YOU) pastw.style.setProperty("--hr-glow", "0");
            stage.apply(T);
            WOW.draw(tl, T0);
          }
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["11-rewrote"] = tl;
        })();
      </script>
    </template>
