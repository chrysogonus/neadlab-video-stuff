            // the slams: parked at their approach pose while hidden, so the blur never smears a jump
            const sF = i === 0 ? { ...fromF(dF), scale: 1.3 * K } : fromF(dF), sP = fromP(dP, side), aF = Math.min(PRE, F), aP = PRE;
            const landP = { scale: 0.96, xPercent: 0, yPercent: 0, skewX: -side * 5 };
            if (i === 0) gsap.set(fw, sF), gsap.set(pw, sP);
            else tl.set(fw, sF, fWin[i - 1][1] + 0.001), tl.set(pw, sP, pWin[i - 1][1] + 0.001);
            tl.fromTo(fw, sF, { scale: 0.965, xPercent: 0, yPercent: 0, skewX: -4, duration: aF, ease: "power3.in", immediateRender: false }, F - aF);
            tl.fromTo(fw, { scale: 0.965, xPercent: 0, yPercent: 0, skewX: -4 }, { scale: 1, xPercent: 0, yPercent: 0, skewX: 0, duration: 0.1, ease: "power2.out", immediateRender: false }, F);
            tl.fromTo(pw, sP, { ...landP, duration: aP, ease: "power3.in", immediateRender: false }, P - aP);
            tl.fromTo(pw, { ...landP }, { scale: 1, xPercent: 0, yPercent: 0, skewX: 0, duration: 0.12, ease: "power2.out", immediateRender: false }, P);
            // the floor takes each stomp: it flares and settles (louder than 16)
            tl.fromTo(floor, { scaleY: (1.6 + 1.6 * dF) * K }, { scaleY: 1, duration: 0.34, ease: "power3.out", immediateRender: false }, F);
            tl.fromTo(floor, { scaleY: (1.8 + 1.8 * dP) * K }, { scaleY: 1, duration: 0.38, ease: "power3.out", immediateRender: false }, P);
            hits.push({ T: F, a: (0.018 + 0.04 * dF) * K, y: -7, settle: 0.36 }, { T: P, a: (0.024 + 0.05 * dP) * K, y: -10, settle: 0.42 });
            // (hey!): stamped, 0 ms, a short settle; it stays until the drums drop
            const tag = $("f29-tag" + n);
            show(tag, H, at(CUT));
            tl.fromTo(tag, { scale: 1.32 * K }, { scale: 1, duration: 0.12, ease: "power4.out", immediateRender: false }, H);
            // the tail: words build on their starts, the hero slams
            words.forEach((w, j) => {
              if (j === c.hero) HR.hero(tl, w, at(c.tail[j]), { spread: 16 * K, over: 1.2, pre: 0.06, sharp: true, skew: false });
              else HR.lead(tl, w, at(c.tail[j]));
            });
            heroT.push(at(c.tail[c.hero]));
            hits.push({ T: at(c.tail[c.hero]), a: (i === 2 ? 0.045 : 0.022) * K, y: i === 2 ? -11 : -5, settle: 0.4 });
          });
          const showWins = (el, wins) => {
            if (wins[0][0] <= 0) gsap.set(el, { opacity: 1 }); // on screen from the first frame (a set at 0 never fires)
            wins.forEach(([a, b]) => { if (a > 0) tl.set(el, { opacity: 1 }, a); tl.set(el, { opacity: 0 }, b); });
          };
          showWins(fEl, fWin); showWins(pEl, pWin);
          tl.set(floor, { scaleY: 1 }, 0);

          // the answers: `clean` underlined as the hero lands
          tl.fromTo(root.querySelector(".f29-u i"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power2.out", immediateRender: false }, at(138.23));

          // ================= the last line: the drums drop out, a cleared terminal; plant 4 pays off =================
          const cutT = at(CUT), HIST = at(HIST_T);
          show($("f29-l24"), cutT - 0.03);
          tl.set($("f29-termA"), { opacity: 1 }, 0).set($("f29-termA"), { opacity: 0 }, cutT - 0.03);
          tl.set($("f29-termB"), { opacity: 0 }, 0).set($("f29-termB"), { opacity: 1 }, cutT - 0.03);
          // the window grows up to hold the blame (a hard cut, with the terminal)
          tl.set($("f29-panel"), { y: 0 }, 0).set($("f29-panel"), { y: -7.2 * PX }, cutT - 0.03);
          const lw = $("f29-l24").querySelectorAll(".f29-w");
          lw.forEach((w, j) => {
            if (j === LAST.hero) HR.hero(tl, w, at(LAST.words[j]), { spread: 26 * K, over: 1.26, pre: 0.08, sharp: true, skew: false });
            else HR.lead(tl, w, at(LAST.words[j]));
          });
          // "history": the closing hit — the floor flares hardest, a fire shockwave out of the word
          tl.fromTo(floor, { scaleY: 3 * K }, { scaleY: 1, duration: 0.55, ease: "power3.out", immediateRender: false }, HIST);
          WOW.shock(tl, $("f29-fx"), { x: 42 * PX, y: 19.5 * PX, t: HIST, r: 900 * K, n: 2, w: 7, dur: 0.6, color: "fire" });
          // the gutter: every `me` pops as its line prints, in turn down the file
          root.querySelectorAll(".f29-who").forEach((w, i) => {
            tl.fromTo(w, { scale: 1.45 }, { scale: 1, duration: 0.24, ease: "back.out(2)", immediateRender: false }, HIST + i * ROW_GAP);
          });
          // on "now": 06's tally, reversed, beside the command (the blame stays whole: no new prompt scrolls it)
          const tally = $("f29-tally");
          show(tally, at(143.92));
          tl.fromTo(tally.firstElementChild, { scale: 1.2 }, { scale: 1, duration: 0.3, ease: "expo.out", immediateRender: false }, at(143.92));

          // ================= the camera =================
          // z/y: a punch on every stomp sized by the measured drums × K, a settle, a climb between; after the cut a push
          // to 1.09 through the last line with the hardest punch on "history". x: one truck per chant line, ±TRUCK
          const cam = stage.cam; let cz = 1, cy = 0, ct = 0;
          const camTo = (t, dur, z, y, ease) => {
            if (dur <= 0.001) return;
            tl.fromTo(cam, { z: cz, y: cy }, { z, y, duration: dur, ease, immediateRender: ct === 0 }, t);
            cz = z; cy = y; ct = t + dur;
          };
          hits.sort((p, q) => p.T - q.T);
          hits.forEach((h, k) => {
            const nextT = k + 1 < hits.length ? hits[k + 1].T : cutT;
            const base = 1 + 0.012 * Math.min(2, Math.floor(k / 3));
            camTo(ct, h.T - 0.05 - ct, base, 0, "sine.inOut");
            camTo(h.T - 0.05, 0.05, base + h.a, h.y, "power2.in");
            camTo(h.T, Math.min(h.settle, nextT - 0.05 - h.T), base, 0, "elastic.out(1, 0.5)");
          });
          camTo(ct, cutT - 0.001 - ct, cz + 0.004, 0, "none");
          tl.set(cam, { z: 1, y: 0 }, cutT); cz = 1; cy = 0; ct = cutT;
          camTo(cutT, HIST - 0.07 - cutT, 1.05, 6, "sine.inOut");
          camTo(HIST - 0.07, 0.07, 1.05 + 0.05 * K, 2, "power2.in");
          camTo(HIST, 0.45, 1.06, 14, "elastic.out(1, 0.5)");
          camTo(HIST + 0.45, DUR - HIST - 0.45, 1.09, 24, "power1.out");
          // x is drawn in render(): a sway that crosses the centre on every FORCE! (the slams land centred, uncropped)
          // and swings ±TRUCK out over each tail, alternating sides; after the cut it drifts toward the gutter
          const TRUCK = 150 * K, lineStarts = [at(CHANT[0].force), ...CHANT.slice(1).map((c) => at(c.force)), cutT];
          const swayX = (t) => {
            if (t >= cutT) return -48 * gsap.parseEase("sine.inOut")(Math.min(1, (t - cutT) / (DUR - cutT)));
            for (let i = 0; i < CHANT.length; i++) {
              const a = lineStarts[i], b = lineStarts[i + 1];
              if (t < b) return (i % 2 ? -1 : 1) * TRUCK * Math.sin(Math.PI * Math.max(0, (t - a) / (b - a)));
            }
            return 0;
          };

          // ================= the cuts =================
          const world = $("f29-world"), front = $("f29-front");
          WOW.transition(tl, world, { in: IN.kind, dur: IN.dur, total: DUR });
          WOW.transition(tl, world, { out: OUT.kind, dur: OUT.dur, total: DUR });
          tl.set({}, {}, DUR);

          // ================= per frame: terminals, crowd, lights, camera, cuts =================
          const scrollE = gsap.parseEase("power3.out");
          function drawTerm(term, t) {
            let f = 0, active = null;
            for (const r of term.rows) {
              const on = r.t <= t;
              r.el.style.opacity = on ? 1 : 0;
              if (!on) continue;
              f += r.t < 0 ? 1 : scrollE(Math.min(1, (t - r.t) / 0.09));
              if (r.cmdEl) {
                let n = 0; while (n < r.keys.length && r.keys[n] <= t) n++;
                if (n !== r.shown) {
                  const s = r.cmd.slice(0, n);
                  if (r.hl && n > r.hl[0]) r.cmdEl.innerHTML = s.slice(0, r.hl[0]) + `<span class="f29-hl">${s.slice(r.hl[0], r.hl[1])}</span>` + s.slice(r.hl[1]);
                  else r.cmdEl.textContent = s;
                  r.shown = n;
                }
                r.cur.style.opacity = 0;
                if (t < r.enterT) active = { r, last: n ? r.keys[n - 1] : r.t };
              }
            }
            if (active) {
              const idle = t - active.last;
              active.r.cur.style.opacity = idle < 0.3 || Math.floor((idle - 0.3) * 4) % 2 === 1 ? 1 : 0;
            }
            term.box.style.transform = `translateY(${(-Math.max(0, f - term.cap) * term.rowH).toFixed(1)}px)`;
          }
          const inWin = (wins, t) => wins.some(([a, b]) => t >= a && t < b);
          const sinceHero = (t) => { let s = 99; for (const h of [...heroT, HIST]) if (t >= h) s = Math.min(s, t - h); return s; };
          const glows = Array.from(root.querySelectorAll(".hr-glow"));
          const lightF = $("f29-lightF"), lightP = $("f29-lightP"), screen = $("f29-screen");
          function render() {
            const t = tl.time(), T = T0 + t;
            if (t < cutT) drawTerm(termA, t); else drawTerm(termB, t);
            const live = t < cutT;
            for (const c of crowd) {
              const on = live && t >= c.t;
              c.el.style.opacity = on ? c.a : 0;
              if (!on) continue;
              const rise = 1 - scrollE(Math.min(1, (t - c.t) / 0.16));
              const bob = (HR.hit("kick", T, 0.12) + HR.hit("snare", T, 0.12)) * 8 * c.ph;
              c.el.style.transform = `translateY(${(rise * 20 - bob).toFixed(1)}px)`;
            }
            // the light: cream behind FORCE!, fire behind PUSH!; between the stomps a low cream ambience and the fire
            // swelling behind each hero; all breathing with the bass and flaring on the kicks. "history" burns longest.
            const bass = HR.band("bass", T), kick = HR.hit("kick", T, 0.2), hs = sinceHero(t);
            const heroGlow = hs < 99 ? 0.38 + 0.5 * Math.exp(-hs / (t >= HIST ? 1.2 : 0.6)) : 0.28;
            let lf, lp;
            if (inWin(fWin, t)) { lf = 0.9; lp = 0.14; } else if (inWin(pWin, t)) { lf = 0.16; lp = 0.95; }
            else if (live) { lf = 0.45; lp = heroGlow; } else { lf = 0.34; lp = t < HIST ? 0.24 : heroGlow; }
            lightF.style.opacity = Math.min(1, lf + 0.2 * bass + 0.22 * kick).toFixed(3);
            lightP.style.opacity = Math.min(1, lp + 0.2 * bass + 0.22 * kick).toFixed(3);
            screen.style.opacity = (0.72 + 0.3 * bass).toFixed(3);
            for (const g of glows) HR.glow(g, T, 0.2, 0.32);
            cam.x = swayX(t);
            stage.apply(T);
            WOW.draw(tl, T0);
            // the front rides the pullOut's scale without its blur ("now" is read through the out)
            const u = Math.max(0, Math.min(1, (t - (DUR - OUT.dur)) / OUT.dur));
            front.style.scale = u > 0 ? (1 + 0.1 * u * u).toFixed(4) : "";
          }
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["29-chant2"] = tl;
        })();
      </script>
    </template>
  </body>
