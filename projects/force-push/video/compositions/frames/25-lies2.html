          // PUSH! is parked off the right edge and shoved in from its start − 0.04, landing on the kick and the downbeat

          WOW.rays(tl, fx, { x: PXC, y: PYC, t: PL, n: 26, r0: 160, r1: 1000, w: 3, dur: 0.5, seed: 25 });

          const PENY = ROWTOP.map((y, i) => y + ROWH[i] - 0.35 * PX - PENH); // bottom-anchored, so a scaleY keeps it on the row

          const rowStart = [strikes[0].t, strikes[1].t, strikes[2].t];

          const hook = $("f25-hook"), hglow = $("f25-hglow");
          // each wrapper: its centre in the line (cx, cy), its poster centre (X, Y) and poster scale k (FORCE/PUSH! at 90 % width)
          const GF = { cx: 0, cy: 0, X: PXC, Y: PYF, k: 2.5, w: 1 }, GP = { cx: 0, cy: 0, X: PXC, Y: PYC, k: 2.3, w: 1 };

          const speed = (g, f, t) => {
            const a = poseAt(g, f, t), b = poseAt(g, f, t - 1 / 60);
            return (Math.hypot(a.x - b.x, a.y - b.y) + (Math.abs(a.s - b.s) * g.w) / 2) * 60; // px per second

            return a;
          };

          // ---- per-frame state: reveals, erasure, edges, light, rewritten gutters, the lit lane, glow, camera ----
          const rows = Array.from(root.querySelectorAll(".f25-row")).map((el, i) => ({
            el, i, dot: el.querySelector(".f25-dot"), edge: el.querySelector(".f25-edge"), wash: el.querySelector(".f25-wash"),
            lie: el.querySelector(".f25-lie"), words: Array.from(el.querySelectorAll(".f25-w")),
            h: el.querySelector(".f25-h"), oldH: el.querySelector(".f25-h").textContent, au: el.querySelector(".f25-au"),
          }));
          const NEWH = ["9c0ffee", "5f2b8e1", "c81d3a4"], HEXL = "0123456789abcdef";
          const lane = $("f25-lane"), penglow = $("f25-penglow"), lglow = $("f25-lglow"), log = $("f25-log");
          const fireRGB = [232, 93, 38], hintRGB = [80, 80, 72];
          const mix = (a, b, k) => `rgb(${a.map((v, j) => Math.round(v + (b[j] - v) * k)).join(",")})`;
          const popE = gsap.parseEase("back.out(2.6)");
          let laid = false;
          function layout() {
            for (const r of rows) r.ws = r.words.map((w) => w.offsetLeft + w.offsetWidth);
            for (const [g, el] of [[GF, fw], [GP, pw]]) {
              g.w = el.offsetWidth || 1;
              g.cx = hook.offsetLeft + el.offsetLeft + el.offsetWidth / 2;
              g.cy = hook.offsetTop + el.offsetTop + el.offsetHeight / 2;
              g.k = (0.9 * W) / g.w;
            }
            laid = document.fonts.status === "loaded";
          }
          // the log dims under the poster and comes forward as PUSH! settles
          const logOp = (t) => {
            if (t < FL - 0.04) return 1;
            if (t < SET0) return 1 - 0.7 * Math.min(1, (t - (FL - 0.04)) / 0.08);
            return 0.3 + 0.7 * Math.min(1, (t - SET0) / SETD);
          };
          function render() {
            const t = tl.time(), T = T0 + t;
            if (!laid) layout();
            const lit = t >= LIES, bass = HR.band("bass", T), kick = HR.hit("kick", T, 0.2);
            // the hook: FORCE's poster until the knock, PUSH!'s poster until the settle
            place(fw, GF, pF, t);
            const ap = place(pw, GP, pP, t);
            // the hook's light: under FORCE's poster first, on PUSH! from its slam, scaled with it
            const onPush = t >= PUSH - 0.04;
            const gx = onPush ? GP.cx + ap.x : GF.X, gy = onPush ? GP.cy + ap.y : GF.Y, gs = onPush ? Math.sqrt(ap.s) : 1.4;
            hglow.style.transform = `translate(${gx.toFixed(1)}px, ${gy.toFixed(1)}px) scale(${gs.toFixed(3)})`;
            const hv = t < FORCE - 0.04 ? 0 : t < PL ? 0.45 + 0.3 * Math.min(1, (t - FORCE) / 0.3) : 0.85;
            hglow.style.opacity = Math.min(1, hv + 0.3 * bass + 0.25 * kick).toFixed(3);
            log.style.opacity = logOp(t).toFixed(3);

            const px = gsap.getProperty(pen, "x"), py = gsap.getProperty(pen, "y"), psc = gsap.getProperty(pen, "scaleY");
            for (const r of rows) {
              const started = t >= rowStart[r.i], done = t >= rowDone[r.i];
              // the pen's tip, in this row's text column (row 3 holds at "lies" between its two strikes)
              const x = !started ? -1e4 : done ? END : px;
              const xr = x - TXT;
              r.lie.style.clipPath = done ? "inset(0 0 0 100%)" : `inset(-30% -2% -30% ${Math.max(0, xr).toFixed(1)}px)`;
              for (let j = 0; j < r.words.length; j++) {
                const right = r.ws[j] - xr;
                r.words[j].style.clipPath = right <= 0 ? "none" : `inset(-40% ${right.toFixed(1)}px -40% -30%)`;
              }
              // the edge: from the commit dot along the row, fire while it strikes, cooling to a hairline, lit again on "lies"
              const ew = started ? Math.max(0, x - LANE) : 0;
              const k = lit ? 0 : Math.max(0, Math.min(1, (t - (rowDone[r.i] + 0.05)) / 0.4));
              r.edge.style.width = ew.toFixed(1) + "px";
              r.edge.style.background = mix(fireRGB, hintRGB, k);
              // the strike's light: a wash trailing the pen, fading after it; the overwritten log glows on "lies"
              r.wash.style.width = ew.toFixed(1) + "px";
              const fade = !started ? 0 : !done ? 1 : Math.exp(-(t - rowDone[r.i]) / 0.3);
              r.wash.style.opacity = Math.max(fade, lit ? 0.5 + 0.35 * bass : 0).toFixed(3);
              // the commit is rewritten: the hash scrambles to a new one, the author is stamped `me`, the dot fills
              if (!started) r.h.textContent = r.oldH;
              else {
                const p = (t - rowStart[r.i]) / 0.2, tick = Math.floor(t * 30); let s = "";
                for (let i = 0; i < 7; i++) s += p >= (i + 1) / 8 ? NEWH[r.i][i] : HEXL[(r.i * 7 + tick * 5 + i * 3) % 16];
                r.h.textContent = s;
              }
              const stamped = t >= rowStart[r.i] + 0.03;
              r.au.textContent = stamped ? "me" : "you";
              r.au.classList.toggle("f25-me", stamped);
              const sk = stamped ? popE(Math.min(1, (t - rowStart[r.i] - 0.03) / 0.25)) : 1;
              r.au.style.transform = stamped ? `scale(${(1.9 - 0.9 * sk).toFixed(3)})` : "";
              const pk = started ? popE(Math.min(1, (t - rowStart[r.i]) / 0.3)) : 1;
              r.dot.style.background = started ? (lit ? "#E85D26" : "#F0ECE5") : "#121211";
              r.dot.style.borderColor = started ? (lit ? "#E85D26" : "#F0ECE5") : "#505048";
              r.dot.style.transform = `scale(${pk.toFixed(3)})`;
            }
            // the pen: on while it strikes; parked at the end after "lies", blinking at 2 Hz
            const parked = t >= rowDone[2] + 0.3;
            pen.style.opacity = penOn(t) && (!parked || Math.floor((t - rowDone[2] - 0.3) * 4) % 2 === 1) ? 1 : 0;
            // the pen's light follows its tip, brightest while it moves
            const moving = strikes.some((s) => t >= s.t && t < s.t + s.dur);
            penglow.style.left = (px + 0.5 * PX).toFixed(1) + "px";
            penglow.style.top = (py + PENH - (PENH * psc) / 2).toFixed(1) + "px";
            penglow.style.transform = `scale(${psc.toFixed(3)})`;
            penglow.style.opacity = (penOn(t) ? (moving ? 1 : 0.45 + 0.25 * bass) : 0).toFixed(3);
            // the lane lights as the new main on "lies"
            lane.style.background = lit ? "#E85D26" : "#505048";
            lane.style.boxShadow = lit ? `0 0 ${(10 + 16 * kick).toFixed(1)}px rgba(232, 93, 38, 0.6)` : "none";
            // the log's light: low under the poster, full as the log comes forward, swelling on "lies"
            const swell = lit ? 0.5 * Math.exp(-(t - LIES) / 0.6) : 0;
            lglow.style.opacity = Math.min(1, (0.35 + 0.25 * (logOp(t) - 0.3) / 0.7) + 0.3 * bass + 0.2 * kick + swell).toFixed(3);
            HR.glow(push, T, 0.25, 0.4 * K); HR.glow(lies, T, 0.32, 0.5 * K);
            stage.apply(T);
            WOW.draw(tl, T0);
          }
          tl.eventCallback("onUpdate", render);
          render();
          if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { laid = false; render(); });
          window.__timelines["25-lies2"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
