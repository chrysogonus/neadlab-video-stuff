      <script>
        (() => {
          const DUR = 3.046, T0 = 121.534;
          const root = document.querySelector('[data-composition-id="25-lies2"]');
          const $ = (id) => root.querySelector("#" + id);
          const stage = HR.stage(root, { seed: 25 });
          const tl = gsap.timeline({ paused: true });
          const at = (T) => T - T0;
          const FORCE = at(121.594), PUSH = at(122.08), RIGHT = at(122.68), OVER = at(123.16), YOUR = at(123.529), LIES = at(123.72);
          // chorus 2 is louder: this span's mean drums over 12's (0.513 / 0.446)
          const K = 1.15;

          // ---- the hook: FORCE slams on the cut, PUSH! with the kick on the downbeat (122.118) ----
          HR.hero(tl, $("f25-force"), FORCE, { spread: 30 * K, over: 1.2, pre: 0.05, sharp: true });
          HR.hero(tl, $("f25-push"), PUSH, { spread: 36 * K, over: 1.27, pre: 0.14, sharp: true });

          // ---- the rows: a pen per row (p 0..1; the last row 0..2: "your", then "lies") ----
          const rows = Array.from(root.querySelectorAll(".f25-row")).map((el, i) => ({
            el, i, pen: { p: 0 },
            dot: el.querySelector(".f25-dot"), edge: el.querySelector(".f25-edge"), cur: el.querySelector(".f25-cur"),
            txt: el.querySelector(".f25-txt"), lie: el.querySelector(".f25-lie"), neu: el.querySelector(".f25-new"),
            words: Array.from(el.querySelectorAll(".f25-w")), h: el.querySelector(".f25-h"), oldH: el.querySelector(".f25-h").textContent, au: el.querySelector(".f25-au"),
          }));
          const NEWH = ["9c0ffee", "5f2b8e1", "c81d3a4"];
          // each row is overwritten on its word: the pen leaves 0.04 s early and is past the word within a few frames
          const starts = [RIGHT, OVER, YOUR];
          rows.forEach((r, i) => {
            r.t0 = starts[i] - 0.04;
            tl.fromTo(r.pen, { p: 0 }, { p: 1, duration: i === 2 ? 0.16 : 0.34, ease: "power3.out", immediateRender: false }, r.t0);
          });
          // "lies": the pen finishes the last lie as the hero lands
          tl.to(rows[2].pen, { p: 2, duration: 0.13, ease: "power2.out" }, LIES - 0.04);
          HR.hero(tl, $("f25-lies"), LIES, { spread: 18 * K, over: 1.29, pre: 0.08, sharp: true, skew: false });
          // the footer lands whole, with the hat under "lies"
          tl.set($("f25-foot"), { opacity: 1 }, at(123.725));

          // ---- the camera: a punch on FORCE, a bigger one on PUSH!, a lean down the log, a punch on "lies" ----
          tl.fromTo(stage.cam, { z: 1.0, y: 0 }, { z: 1 + 0.04 * K, y: -5 * K, duration: 0.05, ease: "power2.in" }, FORCE - 0.05);
          tl.to(stage.cam, { z: 1.0, y: 0, duration: 0.45, ease: "elastic.out(1, 0.55)" }, FORCE);
          tl.to(stage.cam, { z: 1 + 0.06 * K, y: -9 * K, duration: 0.07, ease: "power2.in" }, PUSH - 0.07);
          tl.to(stage.cam, { z: 1.012, y: 0, duration: 0.5, ease: "elastic.out(1, 0.5)" }, PUSH);
          tl.to(stage.cam, { z: 1.03, y: 14, duration: LIES - 0.06 - (PUSH + 0.5), ease: "sine.inOut" }, PUSH + 0.5);
          tl.to(stage.cam, { z: 1 + 0.065 * K, y: 22, duration: 0.06, ease: "power2.in" }, LIES - 0.06);
          tl.to(stage.cam, { z: 1.04, y: 18, x: 10, duration: DUR - LIES, ease: "power2.out" }, LIES);
          tl.set({}, {}, DUR);

          // ---- per-frame state: pens, erasure, cursors, edges, rewritten gutters, the lit lane, glow, camera ----
          const lane = $("f25-lane"), push = $("f25-push"), lies = $("f25-lies");
          const fireRGB = [232, 93, 38], hintRGB = [80, 80, 72];
          const mix = (a, b, k) => `rgb(${a.map((v, j) => Math.round(v + (b[j] - v) * k)).join(",")})`;
          const popE = gsap.parseEase("back.out(2.4)");
          // geometry, measured until the fonts are in, then fixed
          let laid = false;
          function layout() {
            const ready = document.fonts.status === "loaded";
            for (const r of rows) {
              r.txtX = r.txt.offsetLeft;
              r.end = Math.max(r.lie.offsetWidth, r.neu.offsetWidth) + 12;
              r.ws = r.words.map((w) => w.offsetLeft + w.offsetWidth);
            }
            rows[2].xs = lies.offsetLeft - 6;
            laid = ready;
          }
          function render() {
            const t = tl.time(), T = T0 + t;
            if (!laid) layout();
            const lit = t >= LIES;
            for (const r of rows) {
              const txtX = r.txtX, end = r.end;
              let x;
              if (r.i === 2) {
                const xs = r.xs;
                x = r.pen.p <= 1 ? r.pen.p * xs : xs + (r.pen.p - 1) * (end - xs);
              } else x = r.pen.p * end;
              const done = r.pen.p >= (r.i === 2 ? 2 : 1);
              // the lie is erased behind the pen, the sung word left in its place
              r.lie.style.clipPath = done ? "inset(0 0 0 100%)" : `inset(-30% -2% -30% ${x.toFixed(1)}px)`;
              for (let j = 0; j < r.words.length; j++) {
                const w = r.words[j], right = r.ws[j] - x;
                w.style.clipPath = right <= 0 ? "none" : `inset(-40% ${right.toFixed(1)}px -40% -30%)`;
              }
              // the cursor rides the pen tip while it writes, then goes
              const on = t >= r.t0 && (r.i === 2 ? t < LIES + 0.2 : t < r.t0 + 0.42);
              r.cur.style.opacity = on ? 1 : 0;
              r.cur.style.transform = `translateX(${x.toFixed(1)}px)`;
              // the edge: from the commit dot along the row, fire while it writes, cooling to a hairline, lit again on "lies"
              const k = lit ? 0 : Math.max(0, Math.min(1, (t - (r.t0 + 0.34)) / 0.4));
              r.edge.style.width = t >= r.t0 ? `${(txtX + x).toFixed(1)}px` : "0px";
              r.edge.style.background = mix(fireRGB, hintRGB, k);
              // the commit is rewritten: a new hash, author me, a filled dot that pops in
              const rw = t >= r.t0;
              r.h.textContent = rw ? NEWH[r.i] : r.oldH;
              r.au.textContent = rw ? "me" : "you";
              r.au.classList.toggle("f25-me", rw);
              const pk = rw ? popE(Math.min(1, (t - r.t0) / 0.3)) : 1;
              r.dot.style.background = rw ? (lit ? "#E85D26" : "#F0ECE5") : "#0A0A0A";
              r.dot.style.borderColor = rw ? (lit ? "#E85D26" : "#F0ECE5") : "#505048";
              r.dot.style.transform = `scale(${pk.toFixed(3)})`;
            }
            lane.style.background = lit ? "#E85D26" : "#505048";
            HR.glow(push, T, 0.22, 0.35); HR.glow(lies, T, 0.14, 0.24);
            stage.apply(T);
          }
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["25-lies2"] = tl;
        })();
