      <script src="assets/kit/hr-kit.js"></script>
      <script>
        (() => {
          const DUR = 6.75, T0 = 107.37, PX = 19.2; // 1cqw at 1920 wide
          const root = document.querySelector('[data-composition-id="22-revert"]');
          const $ = (id) => root.querySelector("#" + id);
          const stage = HR.stage(root, { seed: 22 });
          const tl = gsap.timeline({ paused: true });
          const at = (T) => T - T0;
          const show = (el, s) => tl.set(el, { opacity: 0 }, 0).set(el, { opacity: 1 }, at(s));

          // ---- row 1: "no more patches, no more one more try"; git removes a patch on every eighth, each struck ----
          const a = root.querySelectorAll(".f22-a");
          HR.lead(tl, a[0], at(107.4)); HR.lead(tl, a[1], at(107.62));
          HR.hero(tl, a[2], at(107.865), { spread: 24, over: 1.2, pre: 0.14, sharp: true });
          [108.129, 108.2, 108.354, 108.54, 108.72].forEach((s, i) => HR.lead(tl, a[3 + i], at(s)));
          root.querySelectorAll(".f22-rm").forEach((r, i) => {
            const s = [107.873, 108.1, 108.328, 108.555, 108.781, 109.01][i];
            show(r, s);
            tl.fromTo(r.querySelector(".f22-x"), { scaleX: 0 }, { scaleX: 1, duration: 0.1, ease: "power2.out" }, at(s) + 0.06);
            tl.fromTo(r, { color: "#F0ECE5" }, { color: "#888880", duration: 0.2, immediateRender: false }, at(s) + 0.1);
          });

          // ---- row 2: "no more reading your logs"; only the three cherry-picked days are left, and none at night ----
          const b = root.querySelectorAll(".f22-b");
          [109.18, 109.46, 109.7, 109.965].forEach((s, i) => HR.lead(tl, b[i], at(s)));
          HR.hero(tl, b[4], at(110.16), { spread: 30, over: 1.24, pre: 0.14, sharp: true });
          root.querySelectorAll(".f22-log").forEach((l, i) => show(l, [109.242, 109.47, 109.697][i]));
          tl.fromTo(root.querySelectorAll(".f22-time"), { color: "#888880" }, { color: "#E85D26", duration: 0.12, stagger: 0.05, immediateRender: false }, at(110.16));

          // ---- row 3: "and now you want a revert? baby, that's cute"; the PR assembles on the kicks ----
          const c = root.querySelectorAll(".f22-c");
          [110.48, 110.62, 110.86, 111.06, 111.24].forEach((s, i) => HR.lead(tl, c[i], at(s)));
          HR.hero(tl, c[5], at(111.32), { spread: 28, over: 1.24, pre: 0.14, sharp: true });
          HR.lead(tl, c[6], at(111.98)); HR.lead(tl, c[7], at(112.22));
          HR.hero(tl, c[8], at(112.42), { spread: 10, over: 1.3, pre: 0.1, sharp: true });
          [[".f22-pr0", 110.48], [".f22-pr1", 110.625], [".f22-pr2", 111.564], [".f22-pr3", 111.999]].forEach(([sel, s]) =>
            root.querySelectorAll(sel).forEach((el) => show(el, s)));
          tl.set($("f22-pr"), { opacity: 0 }, 0).set($("f22-pr"), { opacity: 1 }, at(110.48));
          tl.fromTo($("f22-ul"), { scaleX: 0 }, { scaleX: 1, duration: 0.14, ease: "power2.out" }, at(111.32));
          const N0 = at(112.46), N1 = at(112.82); // the marker writes (cute.) after the word

          // ---- row 4: "watch what i do"; the drums drop out, the command types through the line ----
          const R4 = at(112.88);
          const h5 = $("f22-h5");
          tl.set(h5, { opacity: 0 }, 0).set(h5, { opacity: 1 }, R4);
          tl.fromTo(h5, { scale: 1.14, transformOrigin: "100% 80%" }, { scale: 1, duration: 0.34, ease: "expo.out", immediateRender: false }, R4);
          const d = root.querySelectorAll(".f22-d");
          [113.34, 113.632, 113.82].forEach((s, i) => HR.lead(tl, d[i], at(s)));
          const CMD = "git push --force origin main", K0 = at(112.93), K1 = at(113.97);
          const keys = [[0, ""]];
          for (let i = 0; i < CMD.length; i++) keys.push([K0 + ((K1 - K0) * i) / CMD.length, CMD.slice(0, i + 1)]);
          tl.set({}, {}, DUR);

          // ---- the climb: a row per line (expo), a step per kick within a row, a slow rise under it all; row 4 jumps ----
          const ROW = 46 * PX, TICK = 0.7 * PX, STEP = 0.3;
          const STARTS = [0, at(109.15), at(110.45), R4];
          const KICKS = HR.onsetsIn("kick", T0, 112.6).map(at);
          const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
          const ticks = (k, t) => {
            let s = 0;
            for (const q of KICKS) if (q > STARTS[k] + 0.12 && q <= t && (k === 3 || q < STARTS[k + 1])) s += ease((t - q) / 0.22);
            return s * TICK;
          };
          const rowY = (k, t) => -(k * ROW + ticks(k, t));
          function pageY(t) {
            let k = 0; for (let i = 0; i < STARTS.length; i++) if (t >= STARTS[i]) k = i;
            const y = rowY(k, t);
            if (k === 0 || k === 3) return y;
            const from = rowY(k - 1, STARTS[k]);
            return from + (y - from) * ease((t - STARTS[k]) / STEP);
          }

          // ---- per-frame state: page, typing, cursor, marker, glow, camera ----
          const PUNCH = [[107.865, 7], [110.16, 8], [111.32, 10], [112.42, 4]].map(([s, k]) => [at(s), k]);
          const page = $("f22-page"), climb = $("f22-climb"), cmd = $("f22-cmd"), cur = $("f22-cursor"), note = $("f22-note");
          const heroes = ["f22-h1", "f22-h2", "f22-h3", "f22-h4", "f22-h5"].map($);
          function render() {
            const t = tl.time(), T = T0 + t;
            page.style.transform = `translateY(${pageY(t).toFixed(2)}px)`;
            climb.style.transform = `translateY(${(-4 * PX * t / DUR).toFixed(2)}px)`;
            let s = keys[0]; for (const st of keys) if (st[0] <= t) s = st;
            cmd.textContent = s[1];
            cur.style.opacity = t - s[0] < 0.3 || Math.floor((t - s[0]) * 2) % 2 === 0 ? 1 : 0;
            const p = Math.max(0, Math.min(1, (t - N0) / (N1 - N0)));
            note.style.opacity = p > 0 ? 1 : 0;
            note.style.clipPath = `inset(-30% ${((1 - p) * 104).toFixed(2)}% -30% -6%)`;
            for (const h of heroes) HR.glow(h, T, 0.3, 0.5);
            // the camera leans in as the rows climb, punches on the heroes, then leans slowly into the typed command
            let z, y = 0;
            if (t < R4) z = 1 + 0.05 * Math.sin((Math.PI / 2) * (t / R4));
            else z = 1.02 + 0.045 * Math.sin((Math.PI / 2) * Math.min(1, (t - R4) / (DUR - R4)));
            for (const [tp, k] of PUNCH) {
              const dd = t - tp;
              if (dd > -0.06 && dd < 0) y -= k * (1 + dd / 0.06);
              else if (dd >= 0 && dd < 0.8) y -= k * Math.exp(-dd / 0.12) * Math.cos(dd * 14);
            }
            stage.cam.z = z; stage.cam.y = y;
            stage.apply(T);
          }
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["22-revert"] = tl;
        })();
      </script>
