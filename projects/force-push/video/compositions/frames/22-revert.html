          const TYPED = keys[keys.length - 1][0];

          // ---- the climb: the page steps up on every strike (row 1) and every kick (rows 2, 3), and each Enter scrolls a
          //      whole screen (harder each time); row 4 jumps ----
          let py0 = 0;
          const to = (t, y, dur, ease) => { tl.fromTo(page, { y: py0 * PX }, { y: y * PX, duration: dur, ease, immediateRender: false }, t); py0 = y; };
          [107.873, 108.1, 108.328, 108.555, 108.781, 109.01].forEach((s, i) => to(at(s), -1.7 * (i + 1), 0.2, "expo.out"));
          to(R2, -50, 0.34, "expo.out");
          [109.697, 110.16].forEach((s, i) => to(at(s), -50 - 0.75 * (i + 1), 0.22, "expo.out"));
          to(R3, -100, 0.28, "expo.out");
          [111.086, 111.564, 111.999, 112.458].forEach((s, i) => to(at(s), -100 - (i + 1), 0.22, "expo.out"));
          tl.set(page, { y: -3 * ROW }, R4);

          // ---- the camera: the lean grows row by row (1.055 → 1.16, recoiling on each Enter; row 3 snaps in on "revert?"), row 2 leans left into
          //      the time column; row 4 pushes in through the silence, accelerating, to 1.3 on the Enter ----
          tl.fromTo(C, { z: 1.0, x: 0 }, { z: 1.055, x: 30, duration: R2, ease: "sine.inOut" }, 0);
          tl.fromTo(C, { z: 1.055, x: 30 }, { z: 1.0, x: 0, duration: 0.34, ease: "expo.out", immediateRender: false }, R2);
          tl.fromTo(C, { z: 1.0, x: 0 }, { z: 1.16, x: -150, duration: R3 - R2 - 0.34, ease: "power1.in", immediateRender: false }, R2 + 0.34);
          tl.fromTo(C, { z: 1.16, x: -150 }, { z: 1.0, x: 0, duration: 0.3, ease: "expo.out", immediateRender: false }, R3);
          const RV = at(111.32); // "revert?": the camera snaps in on the word, then keeps leaning
          tl.fromTo(C, { z: 1.0, x: 0 }, { z: 1.01, x: 0, duration: RV - R3 - 0.3, ease: "sine.inOut", immediateRender: false }, R3 + 0.3);
          tl.fromTo(C, { z: 1.01, x: 0 }, { z: 1.035, x: 0, duration: 0.24, ease: "expo.out", immediateRender: false }, RV);
          tl.fromTo(C, { z: 1.035, x: 0 }, { z: 1.04, x: 0, duration: R4 - RV - 0.24, ease: "none", immediateRender: false }, RV + 0.24);
          tl.set(C, { z: 1.0, x: 0 }, R4);
          tl.fromTo(C, { z: 1.0, x: 0 }, { z: 1.28, x: 24, duration: DUR - R4, ease: "power3.in", immediateRender: false }, R4);
          [[107.865, 7], [110.16, 10], [111.32, 13], [112.42, 8]].forEach(([s, k]) => {
            tl.fromTo(C, { y: 0 }, { y: -k, duration: 0.06, ease: "power2.in", immediateRender: false }, at(s) - 0.06);
            tl.fromTo(C, { y: -k }, { y: 0, duration: 0.45, ease: "elastic.out(1, 0.5)", immediateRender: false }, at(s) + 0.01);
          });
          // every kick punches, sized by its drums and growing with the climb (08 peaked at 1.05; these reach ~1.07)
          const KICKS = HR.onsetsIn("kick", T0, 112.6);
          KICKS.forEach((s) => {
            const p = at(s) / R4, dr = Math.min(1, HR.band("drums", s + 0.02) / 0.8);
            WOW.punch(tl, cam, at(s), { s: 1 + (0.025 + 0.05 * p) * (0.6 + 0.4 * dr), dur: 0.36 });
          });
          WOW.shake(tl, cam, R2, { amp: 9, dur: 0.3, seed: 22 });
          WOW.shake(tl, cam, R3, { amp: 13, dur: 0.34, seed: 23 });
          WOW.shake(tl, cam, at(111.32), { amp: 11, dur: 0.34, seed: 24 });
          WOW.shake(tl, cam, R4 + 0.15, { amp: 7, dur: 0.26, rot: 0.3, seed: 25 }); // "watch" lands
          WOW.pulse(tl, cam, { kind: "kick", amt: 0.01 });
          tl.set({}, {}, DUR);

          // ---- per-frame state: the glows, the cursor and its light, the marker, the hero glow, the camera ----
          const heroes = ["f22-h1", "f22-h2", "f22-h3", "f22-h4"].map($);
          const glows = root.querySelectorAll(".f22-glow"), cglow = $("f22-cglow");
          const GL = [[71, 37], [24, 29], [29, 16], [50, 24]]; // each row's glow centre (cqw, row coordinates)
          const cmd = $("f22-cmd"), cur = $("f22-cursor"), note = $("f22-note");
          function render() {
            const t = tl.time(), T = T0 + t;
            const py = gsap.getProperty(page, "y") / PX, pos = -py / 50; // page offset in cqw, the row on screen (0..3)
            const level = 0.6 + 0.4 * Math.min(1, t / R4); // the climb
            const breathe = 0.8 + 0.6 * HR.band("bass", T) + 0.35 * HR.hit("snare", T, 0.25) + 0.35 * HR.hit("kick", T, 0.25) + 0.15 * HR.band("high", T);
            glows.forEach((g, k) => {
              const w = Math.max(0, 1 - Math.abs(pos - k) * 1.4);
              g.style.transform = `translate(${(GL[k][0] * PX).toFixed(1)}px, ${((6.4 + 50 * k + GL[k][1] + py) * PX).toFixed(1)}px)`;
              g.style.opacity = (k === 3 ? 0.75 * w : Math.min(1, level * breathe) * w).toFixed(3);
            });
            // row 4: the command types; the cursor stays solid while typing, then holds as its light swells to the Enter
            let s = keys[0]; for (const st of keys) if (st[0] <= t) s = st;
            cmd.textContent = s[1];
            const blinkOn = t < TYPED + 0.3 || Math.floor((t - TYPED) * 2) % 2 === 0 || t > DUR - 0.25;
            cur.style.opacity = blinkOn ? 1 : 0;
            const hold = Math.max(0, Math.min(1, (t - R4) / (DUR - R4))), swell = hold * hold;
            // (computed, not measured: Plex Mono advances 0.6em; the prompt is 2.9cqw at (5.5cqw, 35.45cqw); 14 prompt chars)
            cglow.style.left = (PX * (5.5 + 2.9 * (0.6 * (14 + s[1].length) + 0.12 + 0.31))).toFixed(1) + "px";
            cglow.style.top = (PX * (6.4 + 150 + 35.45 + 2.9 * 0.42 + py)).toFixed(1) + "px";
            cglow.style.opacity = t < R4 ? "0" : ((0.55 + 0.45 * swell) * (blinkOn ? 1 : 0.35)).toFixed(3);
            cglow.style.scale = (1 + 0.8 * swell).toFixed(3);
            wg.style.setProperty("--hr-glow", t < R4 + 0.15 ? "0" : (0.4 + 0.5 * HR.band("vocal", T)).toFixed(3));
            // the marker
            const p = Math.max(0, Math.min(1, (t - N0) / (N1 - N0)));
            note.style.opacity = p > 0 ? 1 : 0;
            note.style.clipPath = `inset(-30% ${((1 - p) * 104).toFixed(2)}% -30% -6%)`;
            for (const h of heroes) HR.glow(h, T, 0.3, 0.5);
            // the silent bar: no drift, no pulse once the drums are gone
            stage.apply(t < R4 ? T : T0 + R4 + 0.25 * (t - R4));
            // the kick punches scale about the row's lyric side, so the edge-hugging words stay in frame: right (row 1),
            // left (row 2), centre (row 3: words at both edges; row 4)
            const k = Math.min(3, Math.round(pos));
            cam.style.transformOrigin = ["86% 60%", "14% 60%", "50% 45%", "50% 50%"][k];
            WOW.draw(tl, T0);
          }
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["22-revert"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
