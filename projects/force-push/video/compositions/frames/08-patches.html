         Enter (50.032 kick, harder): row 3. On "detached" (50.5) the word "head's" comes loose from its line (a motion-blurred

      <script>
        (() => {
          const DUR = 5.357, T0 = 46.55, PX = 19.2; // 1cqw at 1920 wide
          const root = document.querySelector('[data-composition-id="08-patches"]');
          const $ = (id) => root.querySelector("#" + id);
          const stage = HR.stage(root, { seed: 8 });
          const tl = gsap.timeline({ paused: true });
          const at = (T) => T - T0;
          const cam = $("f08-cam"), page = $("f08-page");
          const R2 = at(48.432), R3 = at(50.032), ROW = 50 * PX; // the two Enters, on the kicks

          // ---- the cut in: 07's glideUp carries on (the page arrives from 80 px below, on #f08-in) as a plain glide: no
          //      blur because "No" starts 30 ms in, no cover scale because the ground is flat ink (the exposed edge is the
          //      same ink); the history, the prompt and the patch list are on screen from the first frame ----
          tl.fromTo($("f08-in"), { y: 80 }, { y: 0, duration: 0.42, ease: "power2.out" }, 0);

          // ---- row 1: "no more patches, no more one more try"; a patch struck on each clap ----
          const a = root.querySelectorAll(".f08-a");
          HR.lead(tl, a[0], at(46.58)); HR.lead(tl, a[1], at(46.8));
          HR.hero(tl, a[2], at(47.02), { spread: 24, over: 1.18, pre: 0.14, sharp: true });
          [47.327, 47.357, 47.542, 47.7, 47.92].forEach((s, i) => HR.lead(tl, a[3 + i], at(s)));
          const files = root.querySelectorAll(".f08-file");
          [47.033, 47.327, 47.542, 47.92].forEach((s, i) => {
            tl.fromTo(files[i].querySelector(".f08-x"), { scaleX: 0 }, { scaleX: 1, duration: 0.1, ease: "power3.out" }, at(s));
            tl.fromTo(files[i], { color: "#F0ECE5" }, { color: "#888880", duration: 0.2, immediateRender: false }, at(s) + 0.06);
          });

          // ---- the climb: a truck down row 1 (one big move for the phrase), then an Enter on each kick scrolls a whole
          //      screen; each row trucks on as it is sung ----
          tl.fromTo(page, { y: 0 }, { y: -10 * PX, duration: R2 - 0.05, ease: "sine.inOut" }, 0.05);
          tl.fromTo(page, { y: -10 * PX }, { y: -ROW, duration: 0.36, ease: "expo.out", immediateRender: false }, R2);
          tl.fromTo(page, { y: -ROW }, { y: -ROW - 4 * PX, duration: R3 - R2 - 0.36, ease: "sine.inOut", immediateRender: false }, R2 + 0.36);
          tl.fromTo(page, { y: -ROW - 4 * PX }, { y: -2 * ROW, duration: 0.3, ease: "expo.out", immediateRender: false }, R3);
          tl.fromTo(page, { y: -2 * ROW }, { y: -2 * ROW - 3 * PX, duration: DUR - R3 - 0.3, ease: "sine.inOut", immediateRender: false }, R3 + 0.3);

          // ---- row 2: "no more reading your logs at night"; the log arrives on the beats, every time 03:12 ----
          const b = root.querySelectorAll(".f08-b");
          [48.44, 48.64, 48.88, 49.14].forEach((s, i) => HR.lead(tl, b[i], at(s)));
          HR.hero(tl, b[4], at(49.34), { spread: 26, over: 1.2, pre: 0.14, sharp: true });
          HR.lead(tl, b[5], at(49.66)); HR.lead(tl, b[6], at(49.82));
          tl.set($("f08-p2"), { opacity: 0 }, 0).set($("f08-p2"), { opacity: 1 }, R2); // the command arrives with its Enter
          const logs = root.querySelectorAll(".f08-log");
          [48.44, 48.897, 49.358, 49.607].forEach((s, i) => tl.set(logs[i], { opacity: 0 }, 0).set(logs[i], { opacity: 1 }, at(s)));
          tl.fromTo(root.querySelectorAll(".f08-time"), { color: "#888880" }, { color: "#E85D26", duration: 0.12, stagger: 0.04, immediateRender: false }, at(49.82));

          // ---- row 3: "head's been detached for way too long"; on "detached" head's comes loose and drifts off ----
          const c = root.querySelectorAll(".f08-c");
          HR.lead(tl, c[0], at(50.1)); HR.lead(tl, c[1], at(50.28));
          HR.hero(tl, c[2], at(50.5), { spread: 28, over: 1.22, pre: 0.14, sharp: true });
          [50.869, 51.18, 51.42, 51.66].forEach((s, i) => HR.lead(tl, c[3 + i], at(s)));
          // the sung word hands over to its loose copy (fixed content, so it can carry the motion blur): it pops out
          // sideways on the slam (blurred), then drifts up and away, a third of the frame by the cut
          const D = at(50.5), flt = $("f08-float");
          tl.set(flt, { opacity: 0 }, 0).set(flt, { opacity: 1 }, D);
          tl.set($("f08-hw"), { opacity: 1 }, 0).set($("f08-hw"), { opacity: 0 }, D);
          tl.set($("f08-ghost"), { opacity: 0 }, 0).set($("f08-ghost"), { opacity: 1 }, D);
          tl.fromTo(flt, { x: 0, y: 0, rotation: 0 }, { x: -15 * PX, y: -1.6 * PX, rotation: -6, duration: 0.16, ease: "expo.out", immediateRender: false }, D);
          tl.fromTo(flt, { x: -15 * PX, y: -1.6 * PX, rotation: -6 }, { x: -34 * PX, y: -3.4 * PX, rotation: -11, duration: DUR - D - 0.16, ease: "sine.inOut", immediateRender: false }, D + 0.16);
          tl.set($("f08-o1"), { opacity: 0 }, 0).set($("f08-o1"), { opacity: 1 }, at(50.314));
          tl.set($("f08-o2"), { opacity: 0 }, 0).set($("f08-o2"), { opacity: 1 }, at(50.581));

          // ---- the camera: the lean grows row by row as the synths rise (1.05 → 1.13 → 1.14, recoiling on each Enter),
          //      row 2 leans left into the time column, row 3 right onto "detached"; a punch on each hero ----
          const C = stage.cam;
          tl.fromTo(C, { z: 1.0, x: 0 }, { z: 1.05, x: 0, duration: R2, ease: "sine.inOut" }, 0);
          tl.fromTo(C, { z: 1.05, x: 0 }, { z: 1.0, x: 0, duration: 0.36, ease: "expo.out", immediateRender: false }, R2);
          tl.fromTo(C, { z: 1.0, x: 0 }, { z: 1.13, x: -150, duration: R3 - R2 - 0.36, ease: "power1.in", immediateRender: false }, R2 + 0.36);
          tl.fromTo(C, { z: 1.13, x: -150 }, { z: 1.02, x: 30, duration: 0.3, ease: "expo.out", immediateRender: false }, R3);
          tl.fromTo(C, { z: 1.02, x: 30 }, { z: 1.14, x: 110, duration: DUR - R3 - 0.3, ease: "power1.in", immediateRender: false }, R3 + 0.3);
          [[47.02, 6], [49.34, 8], [50.5, 11]].forEach(([s, k]) => {
            tl.fromTo(C, { y: 0 }, { y: -k, duration: 0.06, ease: "power2.in", immediateRender: false }, at(s) - 0.06);
            tl.fromTo(C, { y: -k }, { y: 0, duration: 0.5, ease: "elastic.out(1, 0.5)", immediateRender: false }, at(s) + 0.01);
          });
          // the hits, sized up through the frame: the downbeat just after the cut, the clap, "logs", "night", the second Enter, the two heavy kicks
          [[46.607, 1.015], [47.033, 1.02], [49.34, 1.025], [49.82, 1.03], [50.032, 1.035], [50.314, 1.045], [50.581, 1.05]].forEach(([s, k]) => WOW.punch(tl, cam, at(s), { s: k, dur: 0.4 }));
          WOW.shake(tl, cam, R3, { amp: 9, dur: 0.32, seed: 8 });
          WOW.shake(tl, cam, D, { amp: 11, dur: 0.36, seed: 18 });
          WOW.pulse(tl, cam, { kind: "kick", amt: 0.008 });
          WOW.transition(tl, cam, { out: "pushIn", dur: 0.46, total: DUR });
          tl.set({}, {}, DUR);

          // ---- per-frame state: the glows, the hero glow, the camera ----
          const heroes = [$("f08-h1"), $("f08-h2"), $("f08-h3")];
          const glows = root.querySelectorAll(".f08-glow");
          const GL = [[72, 32], [26, 27], [66, 22]]; // each row's glow centre (cqw, row coordinates): patches, the log + logs, detached
          function render() {
            const t = tl.time(), T = T0 + t;
            const py = gsap.getProperty(page, "y") / PX, pos = -py / 50; // page offset in cqw, the row on screen (0..2)
            const level = 0.58 + 0.42 * Math.min(1, t / (DUR - 0.5)); // the synths rise
            const breathe = 0.8 + 0.6 * HR.band("bass", T) + 0.35 * HR.hit("snare", T, 0.25) + 0.3 * HR.hit("kick", T, 0.25) + 0.15 * HR.band("high", T);
            glows.forEach((g, k) => {
              const w = Math.max(0, 1 - Math.abs(pos - k) * 1.4);
              g.style.transform = `translate(${(GL[k][0] * PX).toFixed(1)}px, ${((6.4 + 50 * k + GL[k][1] + py) * PX).toFixed(1)}px)`;
              g.style.opacity = (Math.min(1, level * breathe) * w).toFixed(3);
            });
            for (const h of heroes) HR.glow(h, T, 0.3, 0.5);
            stage.apply(T);
            WOW.draw(tl, T0);
            // both ends of this frame carry a sung word in its first 0.25 s ("No" 30 ms in, "long" 0.25 s before the
            // cut): the switches keep their move and drop their blur
            cam.style.filter = "";
          }
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["08-patches"] = tl;
        })();
      </script>
