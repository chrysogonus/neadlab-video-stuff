          const cur = $("f24-cur"), status = $("f24-status"), glow = $("f24-glow"), scan = $("f24-scan"), edge = $("f24-edge");
          const hglow = $("f24-hglow");
          const HEXL = "0123456789abcdef";
          const blink = (t, since) => t - since < 0.35 || Math.floor((t - since) * 2) % 2 === 0;
          const popE = (d) => (d < 0 || d > 0.45 ? 0 : Math.pow(1 - d / 0.45, 3));
          function render() {
            const t = tl.time(), T = T0 + t;
            let step = -1;
            steps.forEach(([ri, ts], n) => {
              if (t >= ts) step = n;
              if (ri === 1) return; // dropped: never rewritten
              const row = rows[ri], h = row.querySelector(".f24-h"), nw = NEW[ri];
              const pop = 1 + 0.12 * popE(t - ts);
              row.style.scale = pop !== 1 ? pop.toFixed(4) : "";
              if (t < ts) { h.textContent = h.dataset.old; h.classList.remove("f24-hot"); row.classList.remove("f24-new"); return; }
              const p = (t - ts) / SCR, tick = Math.floor(t * 30);
              let s = "";
              for (let i = 0; i < 7; i++) s += p >= (i + 1) / 8 ? nw[i] : HEXL[(ri * 7 + tick * 5 + i * 3) % 16];
              h.textContent = s;
              h.classList.toggle("f24-hot", p < 1.6);
              row.classList.add("f24-new");
            });
            // the front: the glow and the scan line ride it; the cursor rides it while the rebase runs, then blinks on HEAD
            const fy = FR.y * RH;
            glow.style.top = (fy + RH / 2).toFixed(1) + "px";
            scan.style.transform = `translateY(${(fy + RH - 2).toFixed(1)}px)`;
            const bass = HR.band("bass", T), kick = HR.hit("kick", T, 0.22);
            const swell = t >= SUCCESS ? 0.45 * Math.exp(-(t - SUCCESS) / 0.5) : 0;
            glow.style.opacity = Math.min(1, 0.66 + 0.3 * bass + 0.3 * kick + swell).toFixed(3);
            scan.style.opacity = (step < 0 ? 0.35 : t >= SUCCESS ? 0.5 : 0.9).toFixed(2);
            if (step < 0) { cur.style.opacity = 0; }
            else {
              cur.style.transform = `translateY(${fy.toFixed(2)}px)`;
              cur.style.opacity = blink(t, steps[step][1]) ? 1 : 0;
            }
            status.textContent = t >= SUCCESS ? "Successfully rebased and updated refs/heads/main." : step >= 0 ? `Rebasing (${Math.min(step + 1, 6)}/6)` : "";
            status.classList.toggle("f24-done", t >= SUCCESS);
            // the panel's fire edge lights when the rebase succeeds
            edge.style.boxShadow = t >= SUCCESS ? `0 0 ${(18 + 26 * swell + 10 * bass).toFixed(1)}px rgba(232, 93, 38, 0.55)` : "";
            // the light under the thrown row: up on "no", a flare on "you", gone after it falls
            let bg = 0;
            if (t >= NO - 0.02 && t < DROP + 0.5) {
              const up = Math.min(1, (t - (NO - 0.02)) / 0.2), flare = t >= YOU ? 0.5 * Math.exp(-(t - YOU) / 0.35) : 0;
              const out = t > DROP ? Math.max(0, 1 - (t - DROP) / 0.5) : 1;
              bg = Math.min(1, (0.6 + 0.3 * bass + flare) * up * out);
            }
            bglow.style.opacity = bg.toFixed(3);
            // a plain blur by speed on the thrown row (the proof showed it crossing the log sharp): the lift is a
            // power3.out over 0.2 s, the fall a power2.in over 0.42 s; speed in px per 1/60 s
            const ul = (t - (NO - 0.02)) / 0.2, uf = (t - DROP) / 0.42;
            const vl = ul >= 0 && ul < 1 ? (3 * (1 - ul) * (1 - ul) * Math.hypot(DY, 0.95 * BX) / 0.2) / 60 : 0;
            const vf = uf >= 0 && uf < 1 ? (2 * uf * 24 * PX / 0.42) / 60 : 0;
            lift.style.filter = vl > 4 ? `blur(${Math.min(14, vl * 0.12).toFixed(1)}px)` : "";
            fall.style.filter = vf > 4 ? `blur(${Math.min(10, vf * 0.2).toFixed(1)}px)` : "";
            // the light behind the line: on "rewrote / past," then on "you and me", following the reflow
            const k = Math.max(0, Math.min(1, (t - (NO - 0.08)) / 0.3)), ke = k * k * (3 - 2 * k);
            hglow.style.transform = `translate(${((72 + (66 - 72) * ke) * PX).toFixed(1)}px, ${((18 + (32 - 18) * ke) * PX).toFixed(1)}px)`;
            hglow.style.opacity = (t < REWROTE - 0.1 ? 0.35 : Math.min(1, 0.62 + 0.35 * bass + 0.3 * kick)).toFixed(3);
            HR.glow(rewrote, T, 0.3, 0.45); HR.glow(pastw, T, 0.3, 0.45); HR.glow(you, T, 0.35, 0.5);
            if (t >= PAST) rewrote.style.setProperty("--hr-glow", "0"); // cooled: no glow once the accent has moved on
            if (t >= YOU) pastw.style.setProperty("--hr-glow", "0");
            stage.apply(T);
            WOW.draw(tl, T0);
          }
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["24-rewrote2"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
