         history is a place, as in 05: `main` a rail running into the dark, `you`'s lanes (1,095 commits, their dots in

    <template>
      <style>
        @font-face { font-family: "Barlow"; src: url("assets/fonts/barlow-800.woff2") format("woff2"); font-weight: 800; }
        @font-face { font-family: "Barlow"; src: url("assets/fonts/barlow-900.woff2") format("woff2"); font-weight: 900; }

      <div id="root" data-composition-id="10-force" data-width="1920" data-height="1080" data-duration="2.911">
        <div id="f10-cam">
          <canvas id="f10-gl" width="1920" height="1080" data-layout-ignore></canvas>
          <div id="f10-shade" data-layout-ignore></div>
          <canvas id="f10-type" width="1920" height="1080" data-layout-ignore></canvas>
          <div id="f10-strip"><span>~/us &nbsp;·&nbsp; main</span><span>commits by you on origin &nbsp;<span id="f10-old">1,095<i></i></span><span id="f10-new">0</span></span></div>
          <div id="f10-out" data-layout-allow-overlap><span id="f10-o1">To me@home:us.git</span><br /><span id="f10-o2"><span class="f10-plus">+</span> <b>3f2a1c9...e81b0d4</b> main -&gt; main (forced update)</span></div>
          <div id="f10-hook">
            <div class="f10-hw" id="f10-fw" data-layout-allow-overlap><span id="f10-force" data-hf-motion-blur='{"fps": 60}'>FORCE</span></div>

      <script src="assets/kit/env.js"></script>
      <script src="assets/kit/hr-kit.js"></script>
      <script src="assets/kit/wow-kit.js"></script>
      <script src="assets/kit/motion-blur.js"></script>
      <script type="module">
        import * as THREE from "./assets/vendor/three.module.js";
        import * as K from "./assets/kit/lines.js";

        const DUR = 2.911, T0 = 53.38, W = 1920, PX = W / 100; // 1cqw
        const root = document.querySelector('[data-composition-id="10-force"]');
        const $ = (id) => root.querySelector("#" + id);
        const at = (T) => T - T0;
        // the words (lyrics.json L15) and the drums (HR_ENV): PUSH! is the downbeat's kick (53.981 / 54.005); the poster
        // settles from the snare before "baby," (54.438)
        const FORCE = at(53.44), PUSH = at(53.96), BABY = at(54.66), YOURE = at(55.28), H = at(55.62);
        const SET = at(54.418), SET_D = 0.24;
        await document.fonts.load('900 100px "Barlow"');
        await document.fonts.load('800 100px "Barlow"');
        await document.fonts.load('500 100px "IBM Plex Mono"');
        const tl = gsap.timeline({ paused: true });

        // ---- the cuts: in is the Enter (a hard cut); out is a whipL into 11 over the last 0.25 s ----
        const cam = $("f10-cam");
        WOW.transition(tl, cam, { in: "cut", out: "whipL", dur: 0.25, total: DUR });

        // ---- the Enter: git answers at once, the forced update a beat later ----
        tl.set($("f10-o2"), { opacity: 0 }, 0).set($("f10-o2"), { opacity: 1 }, 0.22);

        // ---- the hook: two slams on their own spans (static text, so the motion blur smears the approach) ----
        const force = $("f10-force"), push = $("f10-push");
        tl.fromTo(force, { scale: 1.6, yPercent: -8, skewX: -10 }, { scale: 0.96, yPercent: 0, skewX: -6, duration: FORCE, ease: "power3.in" }, 0);
        tl.fromTo(force, { scale: 0.96, skewX: -6 }, { scale: 1, skewX: 0, duration: 0.09, ease: "power2.out", immediateRender: false }, FORCE);
        tl.set(push, { opacity: 0 }, 0).set(push, { opacity: 1 }, PUSH - 0.05);
        tl.fromTo(push, { scale: 2.2, yPercent: 34, skewX: -10 }, { scale: 0.96, yPercent: 0, skewX: -6, duration: 0.05, ease: "power3.in", immediateRender: false }, PUSH - 0.05);
        tl.fromTo(push, { scale: 0.96, skewX: -6 }, { scale: 1, skewX: 0, duration: 0.09, ease: "power2.out", immediateRender: false }, PUSH);
        WOW.shake(tl, cam, PUSH + 0.01, { amp: 7, dur: 0.3, rot: 0.25, seed: 10 });

        // ---- PUSH! shoves FORCE into one line (S.q), then the line settles into the lockup (S.p); render() reads both ----
        const S = { p: 0, q: 0 };
        tl.fromTo(S, { q: 0 }, { q: 1, duration: 0.12, ease: "power3.out", immediateRender: false }, PUSH - 0.06);
        tl.fromTo(S, { p: 0 }, { p: 1, duration: SET_D, ease: "power3.inOut", immediateRender: false }, SET);

        // ---- the counter: 1,095 is struck on "history", 0 lands ----
        tl.fromTo($("f10-old").querySelector("i"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power2.out" }, H);
        tl.fromTo($("f10-old"), { opacity: 1 }, { opacity: 0.55, duration: 0.2, immediateRender: false }, H + 0.12);
        tl.set($("f10-new"), { opacity: 0 }, 0).set($("f10-new"), { opacity: 1 }, H + 0.16);
        tl.set({}, {}, DUR);

        // ---- the hook's geometry (measured after the fonts): FORCE alone ~72 % of the frame; on PUSH! the two words as
        //      one line over ~90 % of the frame, the world below it; the lockup is a smaller line under git's answer.
        //      git's answer sits under the hook until the lockup, then above it ----
        const fw = $("f10-fw"), pw = $("f10-pw"), out = $("f10-out");
        const FS = 19.5 * PX, LH = 0.87 * FS;
        const cv = document.createElement("canvas").getContext("2d");
        cv.font = `900 ${FS}px Barlow`;
        const m = cv.measureText("FORCE");
        const fa = m.fontBoundingBoxAscent || 1.0 * FS, fd = m.fontBoundingBoxDescent || 0.2 * FS, cap = m.actualBoundingBoxAscent || 0.7 * FS;
        const base = (LH - (fa + fd)) / 2 + fa, A = base - cap, B = base; // cap top and baseline inside a line box
        const wF = force.offsetWidth, wP = push.offsetWidth, wMax = Math.max(wF, wP);
        const GAP = 0.2 * FS;
        const K1 = (0.72 * W) / wF, ALONE = [(W - K1 * wF) / 2, 8.4 * PX - K1 * A, K1];
        const KL = (0.9 * W) / (wF + GAP + wP), XL = (W - KL * (wF + GAP + wP)) / 2, YL = 7.4 * PX - KL * A;
        const LINE = { f: [XL, YL, KL], p: [XL + KL * (wF + GAP), YL, KL] };
        const k2 = 8.2 / 19.5, capTop = 12.6 * PX;
        const LOCK = { f: [5.2 * PX, capTop - k2 * A, k2], p: [5.2 * PX + k2 * (wF + GAP), capTop - k2 * A, k2] };
        const KO = 1.25, OL = out.offsetLeft, OT = out.offsetTop;
        const under = ([x, y, k]) => [x + 0.012 * k * FS - OL, y + k * B + 0.11 * k * FS - OT, KO]; // git's answer under FORCE

        // ---- the world: the history on a floor (y = 0), main along -z at x = 0 ----
        const renderer = K.renderer(THREE, $("f10-gl"));
        const lines = K.createLines(THREE, 90000);
        const shutter = K.createShutter(THREE, renderer);
        const camera = new THREE.PerspectiveCamera(40, 16 / 9, 0.1, 800);
        const BONE = K.BONE, FIRE = K.ACCENT, HOT = [1, 0.86, 0.72], HINT = [0x50 / 255, 0x50 / 255, 0x48 / 255], MUTED = [0x88 / 255, 0x88 / 255, 0x80 / 255];
        const rnd = HR.rng(1010);
        const ZNEAR = 44, ZFAR = -420;
        // `you`'s lanes: runs beside main, each forking off its inner neighbour and merging back, commits as dots
        const lanes = [];
        for (const s of [-1, 1]) for (let k = 1; k <= 7; k++) {
          const x = s * (k * 2.5 + (rnd() - 0.5) * 0.5);
          let z = ZNEAR - rnd() * 16;
          while (z > ZFAR) {
            const len = 14 + rnd() * 50, z1 = Math.max(ZFAR, z - len);
            const run = { s, x, xi: x - s * 2.5, z0: z, z1, h: rnd(), dots: [] };
            for (let zz = z - 2 - rnd() * 3; zz > z1 + 1; zz -= 5 + rnd() * 4) run.dots.push(zz);
            // its pieces: [points, z of the tear, width, centre]
            const pc = (a, b, zc, w) => [[a, b], zc, w, a.clone().add(b).multiplyScalar(0.5)];
            run.pieces = [pc(new THREE.Vector3(run.xi, 0, z + 3.5), new THREE.Vector3(x, 0, z), z + 1.7, 1.4)]; // the fork
            for (let zz = z; zz > z1; zz -= 3) run.pieces.push(pc(new THREE.Vector3(x, 0, zz), new THREE.Vector3(x, 0, Math.max(z1, zz - 3)), zz - 1.5, 1.6));
            if (z1 > ZFAR + 1) run.pieces.push(pc(new THREE.Vector3(x, 0, z1), new THREE.Vector3(run.xi, 0, z1 - 3.5), z1 - 1.7, 1.4)); // the merge
            lanes.push(run);
            z = z1 - 5 - rnd() * 14;
          }
        }
        const mainDots = []; for (let z = 30; z > ZFAR; z -= 8) mainDots.push(z);
        const LOGZ = [-20, -29, -44]; // the rows of the log, on main past the title
        const LOGROWS = ["e81b0d4 me  ready.", "91be33a me  moved in", "5d0a8c4 me  initial commit"];

        // the front: from just ahead of the camera on PUSH! down main into the dark
        const FZ0 = 18, FD = 440, FT = 1.05, FP = 1.3; // a launch: quick off the line, faster into the distance
        const frontZ = (t) => (t < PUSH ? FZ0 + 1 : FZ0 - FD * Math.pow(K.clamp((t - PUSH) / FT), FP));
        const tearT = (z, x) => { // when the front passes z (plus a lag outward from main)
          const r = K.clamp((FZ0 - z) / FD), u = Math.pow(r, 1 / FP);
          return PUSH + FT * u + Math.abs(x) * 0.012;
        };

        // ---- the camera (local t): high over the field, a punch on FORCE, a drop onto main with the front on PUSH!,
        //      a truck along the cleaned main toward the title, a punch on "history" ----
        const KEYS = [
          [0, [0, 8.4, 38], [0, 0, -40]],
          [FORCE, [0, 8.2, 37], [0, 0, -40], K.ease.linear],
          [FORCE + 0.36, [0, 4.8, 23], [0, 0.4, -40], K.ease.outExpo],
          [PUSH - 0.01, [0.1, 4.6, 21.4], [0.1, 0.4, -40], K.ease.linear],
          [PUSH + 0.47, [0, 3.4, 8], [0, 0.5, -40], K.ease.outExpo],
          [at(54.9), [-0.8, 2.75, 1.6], [-1, 1.25, -40], K.ease.inOutCubic],
          [H - 0.02, [-1, 2.85, -2.4], [-1, 1.25, -40], K.ease.linear],
          [H + 0.3, [-1, 2.85, -3.6], [-1, 1.2, -40], K.ease.outExpo],
          [DUR, [-1.15, 2.85, -4.0], [-1.2, 1.2, -40], K.ease.linear],
        ];
        const lerp3 = (a, b, f) => [0, 1, 2].map((i) => a[i] + (b[i] - a[i]) * f);
        function aim(t) {
          let i = 1; while (i < KEYS.length - 1 && KEYS[i][0] <= t) i++;
          const a = KEYS[i - 1], b = KEYS[i], f = b[3](K.clamp((t - a[0]) / (b[0] - a[0])));
          const p = lerp3(a[1], b[1], f), l = lerp3(a[2], b[2], f), T = T0 + t;
          // handheld drift, a nudge on the kicks
          p[0] += K.noise1(T * 0.7, 1) * 0.12; p[1] += K.noise1(T * 0.6, 2) * 0.08 + 0.08 * HR.hit("kick", T, 0.12);
          camera.position.set(...p); camera.lookAt(...l);
          camera.rotateZ(K.noise1(T * 0.4, 3) * 0.01 - 0.05 * K.pulse(t, PUSH, 0.25) + 0.035 * K.prog(t, SET, H, K.ease.inOutCubic) - 0.02 * K.prog(t, H, DUR, K.ease.outCubic));
          camera.fov = 40 / (1 + 0.1 * K.pulse(t, FORCE, 0.15) + 0.12 * K.pulse(t, PUSH, 0.18) + 0.035 * K.pulse(t, BABY, 0.15) + 0.035 * K.pulse(t, YOURE, 0.15) + 0.07 * K.pulse(t, H, 0.2));
          camera.updateProjectionMatrix(); camera.updateMatrixWorld();
        }

        // ---- drawing (pure functions of t) ----
        const V = (x, y, z) => new THREE.Vector3(x, y, z);
        const fogged = (p, near = 10, k = 0.0105) => Math.exp(-Math.max(0, camera.position.distanceTo(p) - near) * k);
        const mid = new THREE.Vector3();
        function seg(a, b, w, rgb, alpha) {
          mid.addVectors(a, b).multiplyScalar(0.5);
          const f = fogged(mid);
          if (f * alpha > 0.01) lines.seg(a, b, w, rgb, alpha * f);
        }
        function ringPts(c, r, n) {
          const pts = [];
          for (let i = 0; i <= n; i++) { const a = (i / n) * Math.PI * 2; pts.push(V(c.x + Math.cos(a) * r, c.y + Math.sin(a) * r, c.z)); }
          return pts;
        }
        // a torn piece: lifted, thrown outward, turned about its own centre, burning then going dark
        const q = new THREE.Quaternion(), axis = new THREE.Vector3();
        function torn(pts, c, run, age) {
          const e = K.ease.outCubic(K.clamp(age / 0.9));
          const h = run.h, lift = (0.8 + 1.8 * h) * e + 0.5 * age, outw = run.s * ((2 + 4 * h) * e + 1.5 * age);
          axis.set(run.s * (0.4 + h), 1, 0.6 - h).normalize();
          q.setFromAxisAngle(axis, run.s * ((1.2 + 1.6 * h) * e + 0.5 * age));
          return pts.map((p) => p.clone().sub(c).applyQuaternion(q).add(V(c.x + outw, c.y + lift, c.z)));
        }
        // a torn piece's light: white-hot at the tear, fire while it burns, then a dim ash that fades
        const mix3 = (a, b, f) => [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
        function burn(age) {
          if (age < 0.08) return [HOT, 1];
          const f = K.smoothstep(0.3, 0.8, age);
          return [mix3(FIRE, MUTED, f), (1 - f) + f * 0.4 * Math.exp(-(age - 0.55) / 0.7)];
        }
        // the kicks after PUSH! send the pushed commits down main: a hot packet running away from the camera
        const KICKS = K.beatsIn(54.4, 56.0).map(at);
        function scene(t, target) {
          aim(t);
          const T = T0 + t, bass = HR.band("bass", T), F = frontZ(t);
          lines.clear();
          // the floor: a faint grid, the repo's ground
          for (let k = -6; k <= 6; k++) {
            if (k === 0) continue;
            for (let z = ZNEAR; z > ZFAR; z -= 6) seg(V(k * 8, 0, z), V(k * 8, 0, z - 6), 1.2, MUTED, 0.3);
          }
          for (let z = 40; z > -300; z -= 12) for (let x = -48; x < 48; x += 6) seg(V(x, 0, z), V(x + 6, 0, z), 1.2, MUTED, 0.22);
          // `you`'s lanes: whole until the front passes, then torn off piece by piece
          for (const run of lanes) {
            for (const [pts, zc, w, c] of run.pieces) {
              const age = t - tearT(zc, run.x);
              if (age < 0) { seg(pts[0], pts[1], w, MUTED, 0.6); continue; }
              if (fogged(c) < 0.03) continue;
              // what the push leaves on the floor: a dashed ghost of the lane (unreachable, still in the reflog)
              const gd = pts[0].clone().lerp(pts[1], 0.35);
              seg(pts[0], gd, 1.2, MUTED, 0.38 * K.clamp((age - 0.15) / 0.4));
              const [col, al] = burn(age);
              if (al < 0.03) continue;
              const tp = torn(pts, c, run, age);
              seg(tp[0], tp[1], age < 0.35 ? 3.2 : 1.6, col, al);
            }
            for (const z of run.dots) {
              const c = V(run.x, 0, z), age = t - tearT(z, run.x);
              if (fogged(c) < 0.03) continue;
              let pts = ringPts(c, 0.2, 6), al = 0.85;
              let col = FIRE;
              if (age >= 0) { [col, al] = burn(age); if (al < 0.03) continue; pts = torn(pts, c, run, age); }
              for (let i = 1; i < pts.length; i++) seg(pts[i - 1], pts[i], 1.7, col, al);
            }
          }
          // main: bone ahead of the front, fire behind it (the pushed history), a white-hot head on the front
          for (let z = ZNEAR; z > ZFAR; z -= 3) {
            const z1 = z - 3, pushed = z1 >= F;
            if (pushed) {
              seg(V(0, 0, z), V(0, 0, z1), 4.2, FIRE, 1);
              const heat = Math.exp(-(z1 - F) / 26);
              if (heat > 0.05) seg(V(0, 0, z), V(0, 0, z1), 1.8, HOT, 0.75 * heat);
            } else seg(V(0, 0, z), V(0, 0, z1), 3, BONE, 0.85);
          }
          for (const z of mainDots) {
            const pts = ringPts(V(0, 0, z), 0.26 * (1 + 0.7 * HR.hit("kick", T, 0.16) * (z >= F ? 1 : 0)), 12), hot = z >= F;
            for (let i = 1; i < pts.length; i++) seg(pts[i - 1], pts[i], 2.2, hot ? FIRE : BONE, 0.9 + 0.1 * bass);
          }
          if (t >= PUSH && t < PUSH + FT + 0.1) {
            // the front: a white-hot head on main and a spike of fire standing on it
            seg(V(0, 0, F + 4), V(0, 0, F), 14, FIRE, 1);
            seg(V(0, 0, F + 3), V(0, 0, F), 6, HOT, 1);
            seg(V(0, 0, F), V(0, 3.2, F), 5, FIRE, 1);
            seg(V(0, 0, F), V(0, 2.2, F), 2, HOT, 1);
            // sparks shed by the front: short streaks, thrown out and falling
            for (let i = 0; i < 90; i++) {
              const te = PUSH + (i / 90) * 0.8, a = t - te;
              if (a < 0 || a > 0.5) continue;
              const h1 = K.hash(i, 1), h2 = K.hash(i, 2), h3 = K.hash(i, 3), sx = h1 < 0.5 ? -1 : 1;
              const v = V(sx * (2 + 7 * h2), 2 + 5 * h3, -6 - 10 * h1), p0 = V(0, 0.1, frontZ(te));
              const p = p0.clone().addScaledVector(v, a).add(V(0, -4.9 * a * a, 0));
              if (p.y < 0) continue;
              seg(p, p.clone().addScaledVector(v, -0.035), 2.2, FIRE, (1 - a / 0.5) ** 2);
            }
          }
          for (const tk of KICKS) {
            const a = t - tk;
            if (a < 0 || a > 0.7) continue;
            const z0 = camera.position.z - 9 - 200 * K.ease.outCubic(a / 0.7);
            seg(V(0, 0.02, z0), V(0, 0.02, z0 - 7), 8, HOT, 1 - a / 0.7);
            seg(V(0, 0.02, z0), V(0, 1.2, z0), 3, FIRE, 1 - a / 0.7);
          }
          // the log's page: a hairline over the title, its rows' dots lit on "history"
          const LS = 0.62 * K.prog(t, H, H + 0.25, K.ease.outCubic);
          if (t >= BABY) seg(V(TX0, TOPY + 0.3, TZ), V(TX0 + 8.4 * K.prog(t, BABY, BABY + 0.3, K.ease.outCubic), TOPY + 0.3, TZ), 1.2, MUTED, 0.9);
          if (LS > 0) for (const z of LOGZ) seg(V(0.35, 0.02, z), V(0.35 + LS, 0.02, z), 1.4, MUTED, 0.9);
          lines.draw(renderer, camera, target);
        }

        // ---- the type in the space (Canvas2D): the line stands across the floor left of main, the title of the log;
        //      git's tags on the lanes; the log's rows along main ----
        const TZ = -16, TX0 = -7.5, Y2 = 0.1, S2 = 1.42, S1 = 0.84, Y1 = Y2 + S2 + 0.34, TOPY = Y1 + S1 + 0.2;
        const ctx = $("f10-type").getContext("2d");
        const DPR = window.devicePixelRatio || 1;
        $("f10-type").width = 1920 * DPR; $("f10-type").height = 1080 * DPR;
        const adv = (w, size, font) => { ctx.font = font; return [...w].reduce((s, ch) => s + (ctx.measureText(ch).width / 100) * size * 1.4, 0); };
        const LEAD = '800 100px "Barlow"', HERO = '900 100px "Barlow"', MONO = '500 100px "IBM Plex Mono"';
        const WORDS = [["baby,", 54.66, S1, Y1, LEAD], ["you're", 55.28, S1, Y1, LEAD], ["history", 55.62, S2, Y2, HERO]];
        let u1 = 0;
        const placed = WORDS.map(([w, T, size, y, font], i) => {
          const row2 = i === 2, u0 = row2 ? -0.06 : u1;
          if (!row2) u1 += adv(w + " ", size, font);
          return { w, t: at(T), size, y, font, u0, hero: row2 };
        });
        const project = K.projector(THREE, camera);
        const tags = lanes.filter((r) => r.z0 < 30 && r.z0 > -70 && Math.abs(r.x) < 14).slice(0, 9);
        function type(t) {
          ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
          ctx.clearRect(0, 0, 1920, 1080);
          aim(t);
          // `you` on its lanes until they are torn
          for (const r of tags) {
            const z = r.z0 - 1.2, age = t - tearT(z, r.x), al = age < 0 ? 1 : Math.exp(-age / 0.12);
            const f = fogged(V(r.x, 0, z), 10, 0.02);
            if (al * f < 0.05) continue;
            K.textOnPath(ctx, project, (s) => ({ x: r.x + 0.3 + s, y: 0.12 + (age > 0 ? 3 * age : 0), z }), "you", 0.42, { font: MONO, fill: "232, 93, 38", alpha: al * f });
          }
          // the log's page title: the command over it, then the sung line on its words' times
          if (t >= BABY) K.textOnPath(ctx, project, (s) => ({ x: TX0 + s, y: TOPY + 0.4, z: TZ }), "git log --oneline origin/main", 0.2, { font: MONO, fill: "136, 136, 128" });
          for (const p of placed) {
            if (t < p.t) continue;
            const g = [...p.w].length;
            K.textOnPath(ctx, project, (s) => ({ x: TX0 + s, y: p.y, z: TZ }), p.w, p.size, {
              start: p.u0, font: p.font, hot: () => p.hero,
              lit: (i) => K.clamp((t - p.t - (i / g) * (p.hero ? 0.12 : 0.06)) / 0.05),
            });
          }
          // the rows of the log along main, `me` only, lit on "history"
          LOGZ.forEach((z, i) => {
            const a = K.prog(t, H + 0.06 + i * 0.07, H + 0.2 + i * 0.07);
            if (a <= 0) return;
            K.textOnPath(ctx, project, (s) => ({ x: 0.45 + s, y: 0.14, z }), LOGROWS[i], 0.3, { font: MONO, fill: "240, 236, 229", alpha: a });
          });
        }

        // ---- per-frame state ----
        const pose = (A, B, p) => [A[0] + (B[0] - A[0]) * p, A[1] + (B[1] - A[1]) * p, A[2] + (B[2] - A[2]) * p];
        const tf = ([x, y, k]) => `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) scale(${k.toFixed(4)})`;
        function render() {
          const t = tl.time();
          renderer.setRenderTarget(null); renderer.clear();
          const fast = (t > FORCE - 0.03 && t < FORCE + 0.3) || (t > PUSH - 0.03 && t < PUSH + 0.45) || (t > H - 0.03 && t < H + 0.25);
          if (fast) shutter((ts, target) => scene(ts, target), t, { samples: 8, angle: 270 });
          else scene(t, null);
          type(t);
          const p = S.p, qq = S.q, mv = Math.max(Math.sin(Math.PI * p), Math.sin(Math.PI * qq));
          const fp = p > 0 ? pose(LINE.f, LOCK.f, p) : pose(ALONE, LINE.f, qq);
          fw.style.transform = tf(fp);
          pw.style.transform = tf(pose(LINE.p, LOCK.p, p));
          const o = pose(under(p > 0 ? LINE.f : fp), [0, 0, 1], p);
          out.style.transform = tf(o);
          const bl = mv > 0.05 ? `blur(${(4 * mv).toFixed(2)}px)` : "";
          fw.style.filter = bl; pw.style.filter = p > 0 ? bl : ""; out.style.filter = mv > 0.05 ? `blur(${(2 * mv).toFixed(2)}px)` : "";
          WOW.draw(tl, T0);
        }
        tl.eventCallback("onUpdate", render);
        render();
        window.__timelines["10-force"] = tl;
      </script>
    </template>
  </body>
</html>
