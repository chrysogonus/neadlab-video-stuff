          const LIFT = 12, GAP = 0.3, WIDE = 89 * 19.2, BOTTOM = 52.2 * 19.2; // glyph lift, word gap (em); 04's name width and line
          const tan = (s) => { const a = hid.getPointAtLength(Math.max(0, s - 2)), b = hid.getPointAtLength(Math.min(L, s + 2)); return Math.atan2(b.y - a.y, b.x - a.x); };
          let laid = false, pen = [], dots = [];
          function layout() {

            pen = [[at(28.7), 0], [BRANCH + 0.06, br._s1], [at(29.5), you._s0], [at(29.88), tried._s0], [at(30.36), to._s0],

            dots = [(br._s1 + you._s0) / 2, (tried._s1 + to._s0) / 2, (to._s1 + hide._s0) / 2, L].map((s) => {

              const p = hid.getPointAtLength(s);

          const meDots = $("f05-medots");
          for (const x of [330, 660, 1000, 1340, 1660, 1840]) {

          }
          const youG = $("f05-youdots"), youC = [0, 1, 2, 3].map(() => {
            const c = document.createElementNS(NS, "circle"); c.setAttribute("fill", "#0A0A0A"); c.setAttribute("stroke-width", "6");

          const cmd = $("f05-cmd"), cur1 = $("f05-cur1"), cur2 = $("f05-cur2"), tag = $("f05-tag");

            // the lanes: the pen draws the hidden one; on "hide" it lights end to end

            lit.style.strokeDashoffset = (L - li).toFixed(2);
            lit.style.opacity = li > 0.5 ? 1 : 0;

            // light: on the scene's object, breathing with the bass, a surge on "hide"
            const [gx, gy] = glowAt(t);

            const surge = on ? 0.45 * Math.exp(-(t - SW0) / 0.5) : 0;
            glow.style.opacity = Math.min(1, 0.68 + 0.6 * bass + 0.25 * HR.hit("kick", T, 0.2) + surge).toFixed(3);
            HR.glow(w2[0], T, 0.3, 0.45); HR.glow(w2[4], T, 0.3, 0.45);
            nameGl.forEach((el) => HR.glow(el, T, 0.35 + (on ? 1.2 * Math.exp(-(t - SW0) / 0.4) : 0), 0.45));
            // the switches: the drop moves the world and the strip; the glideUp moves everything, blurring all but the lyric
            WOW.draw(tl, T0);
            const inP = t < IN, outP = t > DUR - OUT;
            clip.style.clipPath = inP ? "none" : "inset(6.2cqw 0 0 0)";
            for (const el of [drop, hud]) { el.style.translate = inP ? px.style.translate : ""; el.style.filter = inP || outP ? px.style.filter : ""; }
            // the name's own fall: a speed blur that clears as it lands
            const fb = t < FALL ? 16 * Math.pow(1 - t / FALL, 2) : 0;
            namew.style.filter = outP ? px.style.filter : fb > 0.3 ? `blur(${fb.toFixed(1)}px)` : "";
            tx.style.translate = outP ? px.style.translate : "";
            tx.style.scale = outP ? px.style.scale : "";
          }
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["05-branch"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
