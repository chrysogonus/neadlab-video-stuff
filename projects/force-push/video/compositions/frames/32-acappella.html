         the hook of 10 again, sung softly, set small and lowercase in the soft voice (Instrument Serif Italic), on black.
         Refinement round 1: the build into the drop.
         The cut is a match on 31's terminal: its last frame exactly (the unsent `~/us (main) $ git push --force` at
         5.5/28.2cqw, unscaled, "so no lease, / no warning," above and "here I go" below, the fire glow behind "go").
         Round 2: no dip to a bare prompt. The drum fill's last hits keep the terminal lit and moving: on the 160.986 kick
         the terminal scrolls (the lines above rise away, "here I go" rides up into their place, still lit, and the prompt
         reflows to the foot, small, where it waits unsent), the camera pushes in on the fill; on
         "force" "here I go" scrolls off the top as the soft line writes in under it.
         L51: on "force" the cursor leaves the prompt and becomes the caret that writes the line, one soft cream light
         under it; a slow continuous push-in starts with the first word; on "history." a fire underline points.
         L52: on "i" the terminal scrolls a line (line 1 up, dimmed) and the second line builds word by word in line 1's
         place; the push gathers; "you" fades as it is sung.
         The last bar (167.343 → the Enter): the cursor is back on the prompt and retypes the command to
         `git push --force origin main`, one key per eighth, then one per sixteenth; every key shoves the sung words away

          const stage = HR.stage(root, { seed: 32, drift: 1.1, pulse: 0.6 });
          const tl = gsap.timeline({ paused: true });
          const at = (T) => T - T0;
          const cam = $("f32-cam"), C = stage.cam;
          const FORCE = at(161.912), HIST = at(164.047), LINE2 = at(165.40);
          // the tracked grid continues through the a cappella: 166.186 and 168.036 are downbeats

          // the last bar: ` origin main`, one key per eighth from the "and" before "there's" (167.343), then per sixteenth
          // from beat 2 (168.497); the last key 169.191, the Enter (the cut) 169.270

          for (let i = 0; i < 5; i++) KEYS.push(at(168.036 - 3 * E8 + i * E8));
          for (let i = 0; i < 7; i++) KEYS.push(at(168.036 + BEAT + i * E16));
          const TYPE = " origin main", BAR = KEYS[0];

          // the zoom's fixed point: where the cursor ends (prompt at 5.5cqw / 44cqw, 2.6cqw Plex Mono, 0.6em advance, 42 chars)
          const FS = 2.6, OX = 5.5 + FS * (0.6 * 42 + 0.12 + 0.31), OY = 44 + FS * 0.5;
          root.style.setProperty("--f32-ox", (OX * PX).toFixed(1) + "px");
          root.style.setProperty("--f32-oy", (OY * PX).toFixed(1) + "px");
          WOW.transition(tl, cam, { in: "cut", out: "cut", dur: 0, total: DUR }); // 31 → 32 a match cut, 32 → 33 the Enter

          // ---- the handover: 31's terminal exactly as 31 leaves it (unscaled); the fill's last hits keep it moving ----
          const term = $("f32-term"), prompt = $("f32-prompt");
          const K1 = at(160.986);
          // the camera keeps pushing in on the fill from rest (31 lands at rest on the cut), then eases back under the line
          tl.fromTo(term, { scale: 1.0 }, { scale: 1.09, duration: FORCE - 0.1, ease: "power2.in" }, 0);
          tl.fromTo(term, { scale: 1.09 }, { scale: 1.0, duration: 0.6, ease: "power3.out", immediateRender: false }, FORCE - 0.1);
          // the terminal scrolls on the kick: the lines above rise away (moved off-frame, never faded), "here I go" and
          // its glow ride up into their place, still lit
          // (all on the kick and fast out of the gate, so no two lines ever cross; the prompt reflows to the foot on the
          // same kick, a 0 ms hit, small, where it waits unsent)
          tl.fromTo([$("f32-t1"), $("f32-t2")], { y: 0 }, { y: -560, duration: 0.4, ease: "expo.out" }, K1);
          // "here I go" and its glow ride up (render: y3, blurred by its own speed; its glowing "go" is no motion-blur
          // clone); on "force" it scrolls off the top as the soft line writes in below it
          const t3 = $("f32-t3"), UP = -(36 - 9.6) * PX, eX = gsap.parseEase("expo.out"), eI = gsap.parseEase("power3.in");
          const y3 = (t) => t < K1 ? 0 : t < FORCE - 0.08 ? UP * eX(Math.min(1, (t - K1) / 0.45))
            : UP - 640 * eI(Math.min(1, (t - FORCE + 0.08) / 0.3));
          ["f32-t1", "f32-t2"].forEach((id) => tl.set($(id), { visibility: "visible" }, 0).set($(id), { visibility: "hidden" }, K1 + 0.3));
          // the prompt reflows on the kick: a two-frame redraw while "here I go" passes its old line
          tl.set(prompt, { visibility: "visible" }, 0).set(prompt, { visibility: "hidden" }, K1).set(prompt, { visibility: "visible" }, K1 + 0.05);
          // the prompt follows it down to the foot, small (2.6cqw), unsent
          tl.set(prompt, { y: 0, scale: 1 }, 0).set(prompt, { y: (44 - 28.2) * PX, scale: FS / 4.2 }, K1);
          tl.fromTo(prompt, { color: "#F0ECE5" }, { color: "#888880", duration: 0.5, ease: "power2.out", immediateRender: false }, FORCE - 0.2);
          tl.fromTo(prompt, { color: "#888880" }, { color: "#F0ECE5", duration: 0.2, ease: "power2.out", immediateRender: false }, BAR);
          // the fill's last hits punch the camera, dying away
          HR.onsetsIn("kick", T0 + 0.05, 161.6).forEach((s, i) => WOW.punch(tl, cam, at(s), { s: 1.03 - 0.006 * i, dur: 0.32 }));

          // the a cappella keeps its pulse (soft snares, the downbeats): each one a breath, never a jolt
          const BREATHS = [...HR.onsetsIn("snare", 161.6, 167.3), ...HR.onsetsIn("kick", 161.6, 167.3).filter((s) => HR.hit("kick", s + 0.001, 0.05) > 0.2), 162.548, 164.35, 166.186]
            .sort((p, q) => p - q).filter((t, i, a) => i === 0 || t - a[i - 1] > 0.12);
          BREATHS.forEach((s) => WOW.punch(tl, cam, at(s), { s: 1.02, dur: 0.5 }));
          // ---- the words: each glyph inks in softly from its word's start (readable within 0.25 s) ----

              tl.fromTo(gs, { opacity: 0, yPercent: hero ? 34 : 24, scale: hero ? 1.1 : 1, filter: hero ? "blur(8px)" : "blur(7px)" },

              gs.forEach((g, i) => L.gs.push({ g, t: t - 0.04 + i * each }));

          // the terminal scrolls a line: line 1 goes up and dims, line 2 builds in its place
          tl.fromTo($("f32-l1"), { y: 0, color: "#F0ECE5" }, { y: -8.4 * PX, color: "#888880", duration: 0.34, ease: "power2.inOut", immediateRender: false }, LINE2 - 0.36);

          // ---- the shove: every key pushes the sung words away from the cursor (up and left), harder each key ----
          const linesEl = $("f32-lines");
          let sx = 0, sy = 0;

            const f = 0.5 + 1.5 * (i / (KEYS.length - 1));

            tl.fromTo(linesEl, { x: sx, y: sy }, { x: nx, y: ny, duration: Math.min(0.1, E16 * 0.85), ease: "expo.out", immediateRender: false }, k);

          });

          const push = { z: 0 }, step = { z: 0 }, rush = { z: 0 }, truck = { x: 0 };
          tl.fromTo(push, { z: 0 }, { z: 0.07, duration: LINE2 - FORCE, ease: "sine.inOut" }, FORCE - 0.04);

          tl.fromTo(truck, { x: -70 }, { x: 30, duration: BAR - LINE2, ease: "sine.inOut", immediateRender: false }, LINE2);
          tl.fromTo(truck, { x: 30 }, { x: 0, duration: DUR - BAR, ease: "power2.in", immediateRender: false }, BAR);
          tl.fromTo(rush, { z: 0 }, { z: 0.5, duration: DUR - BAR, ease: "power3.in", immediateRender: false }, BAR);

          const ul = $("f32-ul"), histG = Array.from($("f32-hist").querySelectorAll(".hr-g"));
          const block = $("f32-block"), bglow = $("f32-bglow"), cmd = $("f32-cmd"), wash = $("f32-wash"), go = $("f32-go"), tglow = $("f32-tglow");
          // a glyph's left inside its line box (the glowing hero's filter makes it its glyphs' offset parent)
          const relLeft = (g, inner) => { let x = 0, e = g; while (e && e !== inner) { x += e.offsetLeft; e = e.offsetParent; } return x; };
          function caret(L, t, T) {
            let last = null;
            for (const it of L.gs) if (it.t <= t) last = it;

            const live = t >= L.from - 0.04 && t < L.to && last;
            const fadeOut = L === lines[1] && t >= L.to ? Math.max(0, 1 - (t - L.to) / 0.3) : 0;
            if (!live && !fadeOut) { L.caret.style.opacity = 0; L.light.style.opacity = 0; return; }
            if (last) {
              const x = relLeft(last.g, L.inner) + last.g.offsetWidth + last.g.offsetHeight * 0.05;
              L.caret.style.left = x.toFixed(1) + "px";
              L.light.style.left = x.toFixed(1) + "px";
            }
            if (!live) { L.caret.style.opacity = 0; L.light.style.opacity = (0.8 * fadeOut).toFixed(3); return; }
            const idle = t - last.t;
            const a = idle < 0.3 ? 1 : 0.3 + 0.7 * (0.5 + 0.5 * Math.cos(2 * Math.PI * (idle - 0.3) / (2 * BEAT)));
            L.caret.style.opacity = a.toFixed(3);
            // the soft light under the cursor breathes with the voice (there is no bass here)
            L.light.style.opacity = Math.min(1, 0.5 + 0.4 * HR.band("vocal", T) + (idle < 0.3 ? 0.15 : 0) + 0.25 * br).toFixed(3);
          }

            const t = tl.time(), T = T0 + t;
            // the prompt's block: flickers with the fill's hits, leaves on "force" (the caret takes over), back for the bar
            let on;

            else if (t < BAR) on = 0;
            else on = 1;
            block.style.background = on ? `rgba(232, 93, 38, ${on})` : "transparent";
            // the typing
            let n = 0; for (const k of KEYS) if (k <= t) n++;
            cmd.textContent = "git push --force" + TYPE.slice(0, n);
            // the cursor's fire light: swells through the bar, a flick on every key
            const u = Math.max(0, Math.min(1, (t - BAR) / (DUR - BAR)));
            let flick = 0; for (const k of KEYS) if (k <= t) flick = Math.exp(-(t - k) / 0.08);
            bglow.style.opacity = t < BAR ? "0" : Math.min(1, 0.4 + 0.6 * u * u + 0.2 * flick).toFixed(3);
            bglow.style.scale = (1 + 1.3 * u * u).toFixed(3);
            caret(lines[0], t, T); caret(lines[1], t, T);
            // the underline under "history." (measured from its glyphs, so it follows the font)
            const hg = histG[0], hl = histG[histG.length - 1];
            const in1 = lines[0].inner, x0 = relLeft(hg, in1);
            ul.style.left = x0.toFixed(1) + "px";
            ul.style.width = (relLeft(hl, in1) + hl.offsetWidth - x0).toFixed(1) + "px";
            // the line's own soft light, cream, from the first word
            let brw = 0; for (const b of BREATHS) if (b - T0 <= t) brw = Math.exp(-(t - (b - T0)) / 0.3);
            wash.style.opacity = t < FORCE - 0.5 ? "0" : Math.min(1, Math.min(1, (t - FORCE + 0.5) / 0.6) * (0.75 + 0.25 * HR.band("vocal", T) + 0.3 * brw) * (1 - 0.5 * u));
            $("f32-hist").style.setProperty("--hr-glow", (0.25 + 0.2 * HR.band("vocal", T)).toFixed(3));
            // "go" and its fire light, as 31 leaves them, breathing with the fill until "force"
            const dr = HR.band("drums", T), hit = Math.max(HR.hit("kick", T, 0.12), HR.hit("snare", T, 0.12));
            // the 160.731 downbeat (the match cut) flares "go" and its light from the cut's second frame on
            const db = t > 0 ? Math.exp(-t / 0.3) : 0;
            go.style.setProperty("--hr-glow", (0.35 + 0.35 * dr + 0.4 * hit + 0.6 * db).toFixed(3));
            tglow.style.opacity = (0.07 + 0.05 * dr + 0.05 * hit + 0.12 * db).toFixed(3);
            const yy = y3(t), vy = Math.abs(yy - y3(Math.max(0, t - 1 / 60)));
            const show = t < FORCE + 0.24 ? "visible" : "hidden";
            t3.style.transform = tglow.style.transform = yy ? `translateY(${yy.toFixed(1)}px)` : "";
            t3.style.visibility = tglow.style.visibility = show;
            t3.style.filter = vy > 12 ? `blur(${Math.min(8, (vy - 12) / 10).toFixed(1)}px)` : "";
            // the stage's micro-drift and kick pulse are cancelled at the cut and fade in over the first second, so the
            // first frame is 31's last exactly (the same expressions as HR.stage, seed 32, drift 1.1, pulse 0.6)
            const w = Math.max(0, 1 - t / 0.9), wq = w * w * (3 - 2 * w);
            const dx = (Math.sin(T * 0.41 + 32) * 7 + Math.sin(T * 0.13 + 64) * 5) * 1.1;
            const dy = (Math.sin(T * 0.33 + 96) * 5 + Math.sin(T * 0.09 + 32) * 4) * 1.1;
            const dr0 = Math.sin(T * 0.21 + 32) * 0.18 * 1.1, kp = HR.hit("kick", T, 0.14) * 0.014 * 0.6;
            C.z = 1 + push.z + step.z + rush.z - kp * wq;
            C.x = truck.x + (OX - 50) * PX * rush.z - dx * wq;
            C.y = (OY - 28.125) * PX * rush.z - dy * wq;
            C.rot = -dr0 * wq;
            stage.apply(T);
            WOW.draw(tl, T0);
          }
          tl.eventCallback("onUpdate", render);
          render();
          if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
          window.__timelines["32-acappella"] = tl;
        })();
      </script>
    </template>
