            const dF = drumsPeak(c.force), dP = drumsPeak(c.push);
            // the slams: parked at their approach pose while hidden, so the blur never smears a jump
            const sF = i === 0 ? { ...fromF(dF), scale: 1.3 * Math.min(K, 1.15) } : fromF(dF), sP = fromP(dP), aF = Math.min(PRE, F), aP = PRE;
            const landF = { scale: 0.965, xPercent: 0, yPercent: 0, skewX: -4 };
            const landP = { scaleX: 1.08 + 0.04 * dP, scaleY: 0.84 - 0.04 * dP, xPercent: 0, yPercent: 2, skewX: 0 };
            if (i === 0) gsap.set(fw, sF), gsap.set(pw, sP);
            else tl.set(fw, sF, fWin[i - 1][1] + 0.001), tl.set(pw, sP, pWin[i - 1][1] + 0.001);
            tl.fromTo(fw, sF, { ...landF, duration: aF, ease: "power3.in", immediateRender: false }, F - aF);
            tl.fromTo(fw, { ...landF }, { scale: 1, xPercent: 0, yPercent: 0, skewX: 0, duration: 0.1, ease: "power2.out", immediateRender: false }, F);
            tl.fromTo(pw, sP, { ...landP, duration: aP, ease: "power3.in", immediateRender: false }, P - aP);
            tl.fromTo(pw, { ...landP }, { scaleX: 1, scaleY: 1, xPercent: 0, yPercent: 0, skewX: 0, duration: 0.34, ease: "elastic.out(1, 0.45)", immediateRender: false }, P);
            // the floor takes each stomp: it flares and settles; PUSH! lands on it, so the world drops under it
            tl.fromTo(floor, { scaleY: (1.6 + 1.6 * dF) * K }, { scaleY: 1, duration: 0.34, ease: "power3.out", immediateRender: false }, F);
            tl.fromTo(floor, { scaleY: (1.8 + 1.6 * dP) * K }, { scaleY: 1, duration: 0.42, ease: "power3.out", immediateRender: false }, P);
            jolts.push({ t: F, amp: 6 * K }, { t: P, amp: (14 + 12 * dP) * K });
            hits.push({ T: F, a: (0.018 + 0.036 * dF) * K, y: -6, settle: 0.36 }, { T: P, a: (0.02 + 0.04 * dP) * K, y: -16 * K, settle: 0.42 });
            // (hey!): stamped, 0 ms, a short settle; it stays until the drums drop
            const tag = $("f35-tag" + n);
            show(tag, H, CUTS);
            tl.fromTo(tag, { scale: Math.min(1.6, 1.32 * K) }, { scale: 1, duration: 0.12, ease: "power4.out", immediateRender: false }, H);
            // the tail: words build on their starts, the hero slams
            words.forEach((w, j) => {
              if (j === c.hero) HR.hero(tl, w, at(c.tail[j]), { spread: 16 * K, over: 1 + 0.2 * K, pre: 0.06, sharp: true, skew: false });
              else HR.lead(tl, w, at(c.tail[j]));
            });
            heroT.push(at(c.tail[c.hero]));
            hits.push({ T: at(c.tail[c.hero]), a: (i === 2 ? 0.09 : 0.022) * K, y: i === 2 ? -22 : -5, settle: 0.3 });
          });
          const showWins = (el, wins) => {
            if (wins[0][0] <= 0) gsap.set(el, { opacity: 1 }); // on screen from the first frame (a set at 0 never fires)
            wins.forEach(([a, b]) => { if (a > 0) tl.set(el, { opacity: 1 }, a); tl.set(el, { opacity: 0 }, b); });
          };
          showWins(fEl, fWin); showWins(pEl, pWin);
          tl.set(floor, { scaleY: 1 }, 0);

          // the answer: `clean` underlined as the hero lands
          tl.fromTo(root.querySelector(".f35-u i"), { scaleX: 0 }, { scaleX: 1, duration: 0.16, ease: "power2.out", immediateRender: false }, at(185.95));

          // ================= "crowd": the crowd takes the frame; the terminal is knocked out of it =================
          const crowdT = at(CROWD_T), cutT = CUTV, HIST = at(HIST_T), NOW = at(NOW_T);
          const panel = $("f35-panel"), tA = $("f35-termA"), tB = $("f35-termB");
          tl.set([panel, tA], { y: 0 }, 0);
          tl.fromTo([panel, tA], { y: 0 }, { y: 24 * PX, duration: 0.26, ease: "power3.in", immediateRender: false }, crowdT + 0.02);
          jolts.push({ t: crowdT, amp: 16 * K });
          WOW.shock(tl, $("f35-fx"), { x: 50 * PX, y: 24 * PX, t: crowdT, r: 1000 * K, n: 2, w: 6, dur: 0.5, color: "cream" });

          // ================= the last line: the drums drop out, a cleared terminal; the log, all `me` =================
          show($("f35-l60"), CUTS);
          tl.set(tA, { opacity: 1 }, 0).set(tA, { opacity: 0 }, CUTS);
          tl.set(tB, { opacity: 0 }, 0).set(tB, { opacity: 1 }, CUTS);
          // the window comes back up to hold the log (a hard cut, with the terminal)
          tl.set(panel, { y: -11 * PX }, CUTS);
          const lw = $("f35-l60").querySelectorAll(".f35-w");
          lw.forEach((w, j) => {
            if (j === LAST.hero) HR.hero(tl, w, at(LAST.words[j]), { spread: 28 * K, over: 1.3, pre: 0.08, sharp: true, skew: false });
            else HR.lead(tl, w, at(LAST.words[j]));
          });
          // "history": the closing hit — the floor flares hardest, a fire shockwave out of the word, the world drops
          tl.fromTo(floor, { scaleY: 3 * K }, { scaleY: 1, duration: 0.6, ease: "power3.out", immediateRender: false }, HIST);
          WOW.shock(tl, $("f35-fx"), { x: 40 * PX, y: 17.5 * PX, t: HIST, r: 1000 * K, n: 2, w: 7, dur: 0.6, color: "fire" });
          jolts.push({ t: HIST, amp: 18 * K });
          // every `me` pops as its row prints, in turn down the column
          root.querySelectorAll(".f35-who").forEach((w, i) => {
            tl.fromTo(w, { scale: 1.6 }, { scale: 1, duration: 0.28, ease: "back.out(2.2)", immediateRender: false }, HIST + i * ROW_GAP + 0.02);
          });
          // the downbeat under "you're" (190.056, the drums' last breath): a knock, and the floor takes it
          jolts.push({ t: at(190.056), amp: 7 });
          tl.fromTo(floor, { scaleY: 2.6 }, { scaleY: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, at(190.056));
          // "now": the next prompt, a small knock — the last hit before the cut
          jolts.push({ t: NOW, amp: 6 });
          tl.fromTo(floor, { scaleY: 1.8 }, { scaleY: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, NOW);

          // ================= the camera =================
          // z/y: a punch on every stomp sized by the measured drums × K, a settle, a climb between; after the cut a push
          // through the last line with the hardest punch on "history"
          const cam = stage.cam; let cz = 1, cy = 0, ct = 0;
          const camTo = (t, dur, z, y, ease) => {
            if (dur <= 0.001) return;
            tl.fromTo(cam, { z: cz, y: cy }, { z, y, duration: dur, ease, immediateRender: ct === 0 }, t);
            cz = z; cy = y; ct = t + dur;
          };
          hits.sort((p, q) => p.T - q.T);
          hits.forEach((h, k) => {
            const nextT = k + 1 < hits.length ? hits[k + 1].T : cutT;
            const base = 1 + 0.01 * Math.min(2, Math.floor(k / 3));
            camTo(ct, h.T - 0.05 - ct, base, 0, "sine.inOut");
            camTo(h.T - 0.05, 0.05, base + h.a, h.y, "power2.in");
            camTo(h.T, Math.min(h.settle, nextT - 0.05 - h.T), base, 0, "elastic.out(1, 0.5)");
          });
          camTo(ct, cutT - 0.001 - ct, cz + 0.004, 0, "none");
          // round 2: the cut lands tight on the last line and the prompt (the log not printed yet) and creeps in; on
          // "history" the camera pulls all the way back as the log prints, so the column of `me`s is the reveal
          // (zoom about y ≈ 12cqw: cam.y = (z − 1) · (12cqw − the frame's centre), the same point on every layer)
          tl.set(cam, { z: 1.2, y: -62 }, cutT); cz = 1.2; cy = -62; ct = cutT;
          // the drums' last breath (the 190.056 downbeat) steps the camera in, then it creeps on to "history"
          const LASTD = at(190.056);
          camTo(cutT, LASTD - cutT, 1.2, -62, "none");
          camTo(LASTD, 0.16, 1.235, -73, "expo.out");
          camTo(LASTD + 0.16, HIST - 0.07 - LASTD - 0.16, 1.245, -76, "sine.inOut");
          camTo(HIST - 0.07, 0.07, 1.26, -80, "power2.in");
          camTo(HIST, 0.5, 1.0, 0, "expo.out");
          camTo(HIST + 0.5, DUR - HIST - 0.5, 1.02, 4, "power1.out");
          // the roll (drawn in render()): a dutch swing per chant line, alternating sides, level on every FORCE!
          const lineStarts = [...CHANT.map((c) => at(c.force)), cutT];
          const roll = (t) => {
            for (let i = 0; i < CHANT.length; i++) {
              const a = lineStarts[i], b = lineStarts[i + 1];
              if (t < b) return (i % 2 ? -1 : 1) * Math.sin(Math.PI * Math.max(0, (t - a) / (b - a)));
            }
            return 0;
          };

          // ================= the cuts =================
          const world = $("f35-world");
          WOW.transition(tl, world, { in: IN.kind, dur: IN.dur, total: DUR });
          tl.set({}, {}, DUR);

          // ================= per frame: terminals, crowd, lights, dolly, camera =================
          const scrollE = gsap.parseEase("power3.out"), dollyE = gsap.parseEase("sine.inOut");
          function drawTerm(term, t) {
            let f = 0, active = null;
            for (const r of term.rows) {
              const on = r.t <= t;
              r.el.style.opacity = on ? 1 : 0;
              if (!on) continue;
              f += r.h * (r.t < 0 ? 1 : scrollE(Math.min(1, (t - r.t) / 0.09)));
              if (r.cmdEl) {
                let n = 0; while (n < r.keys.length && r.keys[n] <= t) n++;
                if (n !== r.shown) {
                  const s = r.cmd.slice(0, n);
                  if (r.hl && n > r.hl[0]) r.cmdEl.innerHTML = s.slice(0, r.hl[0]) + `<span class="f35-hl">${s.slice(r.hl[0], r.hl[1])}</span>` + s.slice(r.hl[1]);
                  else r.cmdEl.textContent = s;
                  r.shown = n;
                }
                r.cur.style.opacity = 0;
                if (t < r.enterT) active = { r, last: n ? r.keys[n - 1] : r.t };
              }
            }
            if (active) {
              const idle = t - active.last;
              active.r.cur.style.opacity = idle < 0.3 || Math.floor((idle - 0.3) * 4) % 2 === 1 ? 1 : 0;
            }
            term.box.style.transform = `translateY(${(-Math.max(0, f - term.height)).toFixed(1)}px)`;
          }
          const inWin = (wins, t) => wins.some(([a, b]) => t >= a && t < b);
          const sinceHero = (t) => { let s = 99; for (const h of [...heroT, HIST]) if (t >= h) s = Math.min(s, t - h); return s; };
          const glows = Array.from(root.querySelectorAll(".hr-glow"));
          const lightF = $("f35-lightF"), lightP = $("f35-lightP"), screen = $("f35-screen"), logGlow = $("f35-logGlow"), dolly = $("f35-dolly");
          const cutAway = [$("f35-tag1"), $("f35-tag2"), $("f35-tag3"), $("f35-t3")];
          function render() {
            const t = tl.time(), T = T0 + t;
            if (t < CUTR) drawTerm(termA, t); else drawTerm(termB, t);
            const live = t < CUTR;
            const kick = HR.hit("kick", T, 0.2), bass = HR.band("bass", T);
            const clap = HR.hit("kick", T, 0.12) + HR.hit("snare", T, 0.12) + 0.6 * HR.hit("hat", T, 0.1);
            for (const c of crowd) {
              const on = t < CUTR && t >= c.t;
              c.el.style.opacity = on ? c.a : 0;
              if (!on) continue;
              const rise = 1 - scrollE(Math.min(1, (t - c.t) / 0.16));
              const run = c.dir * (c.v * (t - c.t) + (t > crowdT ? 2.2 * c.v * (t - crowdT) : 0));
              c.el.style.transform = `translate(${run.toFixed(1)}px, ${(rise * c.from - clap * 8 * c.ph).toFixed(1)}px)`;
            }
            // the light: cream behind FORCE!, fire behind PUSH!; between the stomps a low cream ambience and the fire
            // swelling behind each hero; all breathing with the bass and flaring on the kicks. "history" burns longest.
            const hs = sinceHero(t);
            const heroGlow = hs < 99 ? 0.4 + 0.52 * Math.exp(-hs / (t >= HIST ? 1.2 : 0.6)) : 0.3;
            let lf, lp;
            if (inWin(fWin, t)) { lf = 0.95; lp = 0.16; } else if (inWin(pWin, t)) { lf = 0.18; lp = 1; }
            else if (live) { lf = t >= crowdT ? 0.7 : 0.48; lp = heroGlow; } else { lf = 0.34; lp = t < HIST ? 0.24 : heroGlow; }
            lightF.style.opacity = Math.min(1, lf + 0.2 * bass + 0.22 * kick).toFixed(3);
            lightP.style.opacity = Math.min(1, lp + 0.2 * bass + 0.22 * kick).toFixed(3);
            screen.style.opacity = (0.72 + 0.3 * bass).toFixed(3);
            logGlow.style.opacity = t >= HIST ? Math.min(1, 0.55 + 0.45 * Math.exp(-(t - HIST) / 0.5) + 0.2 * bass).toFixed(3) : 0;
            for (const g of glows) HR.glow(g, T, 0.2, 0.32);
            // the dolly: a push into the terminal through the chant, a punch on "crowd"; every stomp knocks the world down
            let dz = 1, dy = 0;
            if (live) {
              dz = 1 + 0.1 * K * dollyE(Math.min(1, t / crowdT));
              if (t >= crowdT) dz += 0.22 * K * scrollE(Math.min(1, (t - crowdT) / 0.18)); // the crowd rushes the lens
            }
            for (const j of jolts) { const d = t - j.t; if (d >= 0 && d < 0.5) dy += j.amp * Math.exp(-d / 0.09) * Math.cos(d * 30); }
            dolly.style.transform = `translate3d(0, ${dy.toFixed(1)}px, 0) scale(${dz.toFixed(4)})`;
            // the cut is one instant for everything: the chant's tags and tail leave with the crowd and the terminal
            if (t >= CUTR) for (const el of cutAway) el.style.opacity = 0;
            const r = live ? roll(t) : 0;
            cam.rot = 4.5 * r; cam.x = -110 * r; // round 2: the film's biggest dutch swings, one per chant line
            stage.apply(T);
            WOW.draw(tl, T0);
          }
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["35-chant3"] = tl;
        })();
      </script>
    </template>
  </body>
