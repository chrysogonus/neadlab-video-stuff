            const live = t < cutT;
            // the whole crowd keeps climbing while it grows: a higher climb than 16's
            const climb = live && t > CROWD0 ? Math.min(1, (t - CROWD0) / (cutT - CROWD0)) * 1.6 * PX : 0;
            for (const c of crowd) {
              const on = live && t >= c.t;
              c.el.style.opacity = on ? c.a : 0;
              if (!on) continue;
              const rise = 1 - scrollE(Math.min(1, (t - c.t) / 0.16));
              const bob = (HR.hit("kick", T, 0.12) + HR.hit("snare", T, 0.12) + 0.6 * HR.hit("hat", T, 0.1)) * 8 * c.ph;
              c.el.style.transform = `translateY(${(rise * 22 - bob - climb).toFixed(1)}px)`;
            }
            for (const g of glows) HR.glow(g, T, 0.2, 0.32);
            stage.apply(T);
          }
          tl.eventCallback("onUpdate", render);
          render();
          window.__timelines["35-chant3"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
